は 「分{わ}ける」です。","explain_en":"分けます means to separate into groups. Japanese rubbish rules require you to separate burnable and non-burnable waste.","explain_si":"分けます යනු කොටස් වශයෙන් වෙන් කිරීමයි. ජපානයේ කසළ නීතිවලට අනුව දැවෙන කසළ සහ නොදැවෙන කසළ වෙන් කළ යුතුයි.","why_wrong":["集めます means to gather things together — the opposite of separating them.","捨てます means to throw away, but the sentence is about sorting before throwing away.","入れます means to put something in, and does not express dividing into two types."],"words":[{"ja":"分{わ}けます","en":"to separate, to sort","si":"වෙන් කරනවා"},{"ja":"燃{も}えるゴミ","en":"burnable rubbish","si":"දැවෙන කසළ"}],"why_wrong_si":["集めます යනු දේවල් එකට එකතු කිරීමයි — වෙන් කිරීමේ ප්‍රතිවිරුද්ධ අර්ථයයි.","捨てます යනු ඉවත දැමීමයි; නමුත් මේ වාක්‍යය කියන්නේ ඉවත දැමීමට පෙර වර්ග කිරීම ගැනයි.","入れます යනු යමක් ඇතුළට දැමීමයි; වර්ග දෙකකට බෙදීම යන අර්ථය එයින් ප්‍රකාශ නොවේ."]},{"id":"MV-A2-017","level":"A2","section":"moji","type":"語彙の意味","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"仕事{しごと}を 休{やす}む ときは、朝{あさ} 8時{じ}までに 会社{かいしゃ}に ＿＿＿。","choices":["案内{あんない}します","説明{せつめい}します","相談{そうだん}します","連絡{れんらく}します"],"answer":4,"explain_ja":"電話{でんわ}や メールで 「休{やす}みます」と つたえる ことは 「連絡{れんらく}する」です。","explain_en":"連絡します means to contact or inform. Telling your company by 8 a.m. that you will be absent is 連絡.","explain_si":"連絡します යනු දැනුම් දීම හෝ සම්බන්ධ වීමයි. ඔබ නිවාඩු ගන්නා බව උදේ 8ට පෙර සමාගමට දැනුම් දීම 連絡 වේ.","why_wrong":["案内します means to guide or show someone around a place.","説明します means to explain how something works, which is not the point of a sick call.","相談します means to consult and ask for advice; here you are simply informing them."],"words":[{"ja":"連絡{れんらく}します","en":"to contact, to inform","si":"දැනුම් දෙනවා"},{"ja":"休{やす}みます","en":"to be absent, to take a day off","si":"නිවාඩු ගන්නවා"}],"why_wrong_si":["案内します යනු කෙනෙකුට තැනක් පෙන්වමින් මඟ පෙන්වීමයි.","説明します යනු යමක් ක්‍රියා කරන ආකාරය පැහැදිලි කිරීමයි; අසනීප බව දැනුම් දෙන ඇමතුමක අරමුණ එය නොවේ.","相談します යනු උපදෙස් විමසමින් සාකච්ඡා කිරීමයි; මෙහිදී ඔබ කරන්නේ හුදෙක් දැනුම් දීම පමණයි."]},{"id":"MV-A2-018","level":"A2","section":"moji","type":"語彙の意味","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"この コピーきは ＿＿＿して いますから、今日{きょう}は 使{つか}えません。","choices":["せいり","こしょう","しゅうり","かんり"],"answer":2,"explain_ja":"きかいが こわれる ことは 「故障{こしょう}する」です。だから 使{つか}えません。","explain_en":"故障 means a breakdown. A machine that is 故障している is out of order, which is why it cannot be used.","explain_si":"故障 යනු යන්ත්‍රයක් කැඩී යාමයි. 故障している යන්ත්‍රයක් ක්‍රියා නොකරයි — ඒ නිසයි එය භාවිත කළ නොහැක්කේ.","why_wrong":["せいり (整理) means tidying or organising, which would not stop you using the copier.","しゅうり (修理) means repairing it; the sentence explains the cause, not the fix.","かんり (管理) means managing or maintaining, which is a normal ongoing job, not a fault."],"words":[{"ja":"故障{こしょう}","en":"breakdown, out of order","si":"යන්ත්‍රය කැඩීම"},{"ja":"修理{しゅうり}","en":"repair","si":"අලුත්වැඩියාව"}],"why_wrong_si":["せいり (整理) යනු පිළිවෙළට තැබීම හෝ සකස් කිරීමයි; එමගින් ෆොටෝ කොපි යන්ත්‍රය භාවිත කිරීම නතර නොවේ.","しゅうり (修理) යනු එය අලුත්වැඩියා කිරීමයි; වාක්‍යය කියන්නේ හේතුව මිස විසඳුම නොවේ.","かんり (管理) යනු කළමනාකරණය හෝ නඩත්තුවයි; එය සාමාන්‍ය නිතිපතා කාර්යයක් මිස දෝෂයක් නොවේ."]},{"id":"MV-A2-019","level":"A2","section":"moji","type":"語彙の意味","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"この 箱{はこ}は 重{おも}いので、二人{ふたり}で となりの へやへ ＿＿＿ましょう。","choices":["並{なら}び","選{えら}び","運{はこ}び","集{あつ}め"],"answer":3,"explain_ja":"ものを ほかの ところへ もって いく ことは 「運{はこ}ぶ」です。","explain_en":"運びます means to carry something to another place, which matches となりの部屋へ.","explain_si":"運びます යනු යමක් වෙනත් තැනකට ගෙන යාමයි; එය となりの部屋へ යන්නට ගැළපේ.","why_wrong":["並びます means to line up or stand in a queue.","選びます means to choose one thing from several.","集めます means to gather things into one place, not to move a box to the next room."],"words":[{"ja":"運{はこ}びます","en":"to carry, to transport","si":"ගෙන යනවා"},{"ja":"箱{はこ}","en":"box","si":"පෙට්ටිය"}],"why_wrong_si":["並びます යනු පෝලිමේ පෙළ ගැසීමයි.","選びます යනු කිහිපයකින් එකක් තෝරා ගැනීමයි.","集めます යනු දේවල් එක තැනකට එකතු කිරීමයි; පෙට්ටියක් යාබද කාමරයට ගෙන යාම නොවේ."]},{"id":"MV-A2-020","level":"A2","section":"moji","type":"言いかえ","scene":"しごと","stem":"つぎの 文{ぶん}と だいたい 同{おな}じ 意味{いみ}の 文{ぶん}は どれですか。","context":null,"prompt":"この 仕事{しごと}は 私{わたし}には むりです。","choices":["この 仕事{しごと}は 私{わたし}には できません。","この 仕事{しごと}は 私{わたし}が します。","この 仕事{しごと}は 私{わたし}には かんたんです。","この 仕事{しごと}は 私{わたし}が 教{おし}えます。"],"answer":1,"explain_ja":"「むりです」は 「できません」と だいたい 同{おな}じ 意味{いみ}です。","explain_en":"むりです means 'it is impossible for me', so it is almost the same as できません ('I cannot do it').","explain_si":"むりです යනු 'මට එය කළ නොහැක / එය කළ නොහැකි දෙයක්' යන්නයි. එනිසා එහි අර්ථය できません ('මට බැහැ') සමඟ පාහේ එකයි.","why_wrong":["This says you will do the job, the opposite of むり.","かんたん means easy, which is the opposite of むり.","教えます means you will teach it to someone, a different statement altogether."],"words":[{"ja":"無理{むり}","en":"impossible, beyond one's ability","si":"බැහැ, කළ නොහැකි"}],"why_wrong_si":["මෙයින් කියවෙන්නේ ඔබ ඒ වැඩේ කරන බවයි — むり හි ප්‍රතිවිරුද්ධ අර්ථයයි.","かんたん යනු 'පහසුයි' යන්නයි; එයත් むり හි ප්‍රතිවිරුද්ධ අර්ථයයි.","教えます යනු ඔබ එය කෙනෙකුට උගන්වන බවයි — සම්පූර්ණයෙන්ම වෙනස් ප්‍රකාශයකි."]},{"id":"MV-A2-021","level":"A2","section":"moji","type":"言いかえ","scene":"こうつう","stem":"つぎの 文{ぶん}と だいたい 同{おな}じ 意味{いみ}の 文{ぶん}は どれですか。","context":null,"prompt":"ここに 車{くるま}を とめないで ください。","choices":["ここは 立入禁止{たちいりきんし}です。","ここは 駐車場{ちゅうしゃじょう}です。","ここは 工事中{こうじちゅう}です。","ここは 駐車禁止{ちゅうしゃきんし}です。"],"answer":4,"explain_ja":"車{くるま}を とめては いけない ところは 「駐車禁止{ちゅうしゃきんし}」です。","explain_en":"駐車 means parking and 禁止 means prohibited, so 駐車禁止 is exactly 'do not park here'.","explain_si":"駐車 යනු වාහන නැවැත්වීම, 禁止 යනු තහනම් යන්නයි. එනිසා 駐車禁止 කියන්නේ හරියටම 'මෙහි වාහන නවත්වන්න එපා' යන්නයි.","why_wrong":["立入禁止 forbids people from entering, not cars from parking.","駐車場 is a car park, where parking is allowed — the opposite meaning.","工事中 means construction is in progress; it does not by itself mean parking is banned."],"words":[{"ja":"駐車禁止{ちゅうしゃきんし}","en":"no parking","si":"වාහන නැවැත්වීම තහනම්"},{"ja":"止{と}めます","en":"to stop, to park","si":"නවත්වනවා"}],"why_wrong_si":["立入禁止 මිනිසුන් ඇතුළු වීම තහනම් කරයි; වාහන නැවැත්වීම නොවේ.","駐車場 යනු වාහන නැවැත්වීමේ ස්ථානයයි — එහි නැවැත්වීමට අවසර ඇත, එනිසා ප්‍රතිවිරුද්ධ අර්ථයයි.","工事中 යනු ඉදිකිරීම් සිදු වෙමින් පවතින බවයි; ඒ තනිවම වාහන නැවැත්වීම තහනම් යැයි අදහස් නොවේ."]},{"id":"MV-A2-022","level":"A2","section":"moji","type":"言いかえ","scene":"しごと","stem":"つぎの 文{ぶん}と だいたい 同{おな}じ 意味{いみ}の 文{ぶん}は どれですか。","context":null,"prompt":"田中{たなか}さんは ただ今{いま} 席{せき}を 外{はず}して います。","choices":["田中{たなか}さんは 会社{かいしゃ}を やめました。","田中{たなか}さんは 今{いま} 席{せき}に いません。","田中{たなか}さんは 今日{きょう} 休{やす}みです。","田中{たなか}さんは 今{いま} いそがしいです。"],"answer":2,"explain_ja":"「席{せき}を 外{はず}して います」は、今{いま} 自分{じぶん}の せきに いないと いう 意味{いみ}です。","explain_en":"席を外しています is the polite phrase used on the phone to say someone has stepped away from their desk right now.","explain_si":"席を外しています යනු දුරකථනයෙන් කතා කරන විට 'ඔහු/ඇය දැන් තම මේසයෙන් ඉවතට ගොස් සිටී' කීමට යොදන ආචාරශීලී වාක්‍ය ඛණ්ඩයයි.","why_wrong":["やめました means the person has quit the company, which is much stronger than stepping away.","今日休みです means a day off; 席を外す means the person is at work but away from the desk for a moment.","いそがしいです means busy, but the phrase says nothing about how much work the person has."],"words":[{"ja":"席{せき}を 外{はず}します","en":"to step away from one's desk","si":"අසුනෙන් ඉවත් වෙනවා"}],"why_wrong_si":["やめました යනු එම පුද්ගලයා සමාගමෙන් ඉවත් වී ඇති බවයි; එය මොහොතකට මේසයෙන් ඉවත් වීමට වඩා බෙහෙවින් තදබල අර්ථයකි.","今日休みです යනු අද නිවාඩු බවයි; 席を外す යනු පුද්ගලයා වැඩට ඇවිත් සිටින නමුත් මොහොතකට මේසයෙන් ඉවතට ගොස් සිටින බවයි.","いそがしいです යනු කාර්යබහුල බවයි; නමුත් මේ වාක්‍ය ඛණ්ඩය එම පුද්ගලයාට වැඩ කොපමණ තිබේද යන්න ගැන කිසිවක් නොකියයි."]},{"id":"MV-A2-023","level":"A2","section":"moji","type":"表示・標識の語","scene":"しごと","stem":"この 表示{ひょうじ}の 意味{いみ}は どれですか。","context":null,"prompt":"きかいの よこに 「危険{きけん} さわるな」と 書{か}いて あります。","choices":["あぶないので さわっては いけません。","きれいなので さわっては いけません。","だれでも 自由{じゆう}に 使{つか}えます。","もう 使{つか}い おわりました。"],"answer":1,"explain_ja":"「危険{きけん}」は あぶないと いう 意味{いみ}です。「さわるな」は 「さわっては いけません」の つよい 言{い}い方{かた}です。","explain_en":"危険 means 'danger'. さわるな is the strong command form of さわらないでください, so the sign warns you not to touch because it is dangerous.","explain_si":"危険 යනු 'අනතුරුදායක' යන්නයි. さわるな යනු さわらないでください හි තදින් අණ දෙන රූපයයි. එනිසා මේ පුවරුවෙන් කියන්නේ අනතුරුදායක නිසා අත නොතබන්න කියායි.","why_wrong":["危険 is about danger, not about the machine being clean or beautiful.","The sign forbids touching, so free use by anyone is the opposite meaning.","危険 says nothing about the work being finished."],"words":[{"ja":"危険{きけん}","en":"danger","si":"අනතුරුදායකයි"},{"ja":"触{さわ}るな","en":"Do not touch (strong command)","si":"අත නොතබන්න"}],"why_wrong_si":["危険 සම්බන්ධ වන්නේ අනතුරට මිස යන්ත්‍රය පිරිසිදු හෝ ලස්සන බවට නොවේ.","පුවරුව අත තැබීම තහනම් කරයි; එනිසා ඕනෑම කෙනෙකුට නිදහසේ භාවිත කළ හැකි යැයි කීම ප්‍රතිවිරුද්ධ අර්ථයයි.","危険 වැඩ අවසන් වී ඇති බව ගැන කිසිවක් නොකියයි."]},{"id":"MV-A2-024","level":"A2","section":"moji","type":"表示・標識の語","scene":"しごと","stem":"この 表示{ひょうじ}の 意味{いみ}は どれですか。","context":null,"prompt":"工場{こうじょう}の ドアに 「関係者以外{かんけいしゃいがい} 立入禁止{たちいりきんし}」と 書{か}いて あります。","choices":["だれでも 中{なか}に 入{はい}る ことが できます。","ここは 出口{でぐち}では ありません。","この 仕事{しごと}に 関係{かんけい}の ある 人{ひと}だけ 入{はい}れます。","中{なか}に 入{はい}る 前{まえ}に 手{て}を 洗{あら}います。"],"answer":3,"explain_ja":"「関係者{かんけいしゃ}」は その しごとの 人{ひと}です。「以外{いがい}」の 人{ひと}は 入{はい}っては いけません。","explain_en":"関係者 means people connected with that work; 以外 means 'other than'. So only staff involved in the work may enter.","explain_si":"関係者 යනු එම වැඩට සම්බන්ධ අයයි; 以外 යනු 'ඒ හැර අනෙක් අය' යන්නයි. එනිසා ඇතුළු විය හැක්කේ එම වැඩට සම්බන්ධ සේවකයන්ට පමණයි.","why_wrong":["The sign restricts entry, so it is not open to everyone.","The sign is about who may enter, not about whether the door is an exit.","Washing hands is a hygiene rule; this sign says nothing about it."],"words":[{"ja":"関係者{かんけいしゃ}","en":"person concerned, staff involved","si":"සම්බන්ධ පුද්ගලයා"},{"ja":"立入禁止{たちいりきんし}","en":"no entry","si":"ඇතුල් වීම තහනම්"}],"why_wrong_si":["පුවරුව ඇතුළු වීම සීමා කරයි; එනිසා එය සැමට විවෘත නොවේ.","පුවරුව කියන්නේ කාට ඇතුළු විය හැකිද යන්නයි; එම දොර පිටවීමක්ද යන්න ගැන නොවේ.","අත් සේදීම යනු සනීපාරක්ෂක නීතියකි; මේ පුවරුව ඒ ගැන කිසිවක් නොකියයි."]}],"kaiwa":[{"id":"KW-A1-001","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"あなたは 工場{こうじょう}で 先輩{せんぱい}に 道具{どうぐ}を かります。 / You want to borrow a tool from a senior worker at the factory.","prompt":"あなた：＿＿＿","choices":["この 道具{どうぐ}を かりて ください。","この 道具{どうぐ}を かして ください。","この 道具{どうぐ}を かしましょうか。","この 道具{どうぐ}を かえして ください。"],"answer":2,"explain_ja":"人{ひと}に 物{もの}を かりる ときは 「かして ください」と 言{い}います。","explain_en":"かします = to lend (I give it to you); かります = to borrow (I take it). Since you want the senior to hand the tool to you, you ask them to lend: 「かして ください」.","explain_si":"かします = ණයට දෙනවා (මම ඔබට දෙනවා); かります = ණයට ගන්නවා (මම ලබා ගන්නවා). මෙහිදී ඔබට අවශ්‍ය වන්නේ ජ්‍යෙෂ්ඨ සේවකයා උපකරණය ඔබට දෙන ලෙසයි. එනිසා 「かして ください」 කියා ඉල්ලන්න.","why_wrong":["「かりて ください」 tells the senior to borrow it — the direction is backwards.","「かしましょうか」 offers to lend YOUR tool to the other person.","「かえして ください」 means 'please give it back', but you have not borrowed it yet."],"words":[{"ja":"道具{どうぐ}","en":"tool","si":"උපකරණය"},{"ja":"貸{か}します","en":"to lend","si":"ණයට දෙනවා"},{"ja":"借{か}ります","en":"to borrow","si":"ණයට ගන්නවා"}],"why_wrong_si":["「かりて ください」 කිව්වොත් අර්ථය වන්නේ ජ්‍යෙෂ්ඨයාට 'ඔබ එය ණයට ගන්න' කියා කීමයි — දිශාව හරියටම උඩුයටිකුරුයි.","「かしましょうか」 යනු ඔබේ උපකරණය අනෙක් තැනැත්තාට ණයට දෙන්නද කියා ඉදිරිපත් වීමකි.","「かえして ください」 යනු 'ආපසු දෙන්න' යන්නයි; නමුත් ඔබ තවම එය ණයට අරගෙන නැහැ."]},{"id":"KW-A1-002","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"あさ 8時{じ}に 会社{かいしゃ}に つきました。上司{じょうし}が います。 / You arrive at the company at 8 a.m. and your boss is there.","prompt":"あなた：＿＿＿","choices":["こんばんは。","おやすみなさい。","おかえりなさい。","おはようございます。"],"answer":4,"explain_ja":"あさの あいさつは 「おはようございます」です。会社{かいしゃ}では 「ございます」を つけます。","explain_en":"The morning greeting is おはようございます. To a boss always use the full polite form, not the short おはよう.","explain_si":"උදෑසන ආචාරය වන්නේ おはようございます යන්නයි. ඉහළ නිලධාරියෙකුට (上司) කථා කරන විට කෙටි おはよう නොව, සම්පූර්ණ ආචාරශීලී ආකාරය සැමවිටම භාවිත කරන්න.","why_wrong":["こんばんは is used in the evening, not at 8 a.m.","おやすみなさい is said before going to bed.","おかえりなさい is said TO someone who has come home."],"words":[{"ja":"上司{じょうし}","en":"boss, superior","si":"ඉහළ නිලධාරියා"},{"ja":"会社{かいしゃ}","en":"company","si":"සමාගම"}],"why_wrong_si":["こんばんは භාවිත කරන්නේ සවස/රාත්‍රියේයි, උදේ 8ට නොවේ.","おやすみなさい කියන්නේ නිදාගන්නට යන්නට පෙරයි.","おかえりなさい කියන්නේ ගෙදර ආපසු පැමිණි කෙනෙකුට කියන ආචාරයයි."]},{"id":"KW-A1-003","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"仕事{しごと}が おわりました。ほかの 人{ひと}は まだ はたらいて います。あなたは 先{さき}に 帰{かえ}ります。 / Your work is finished but others are still working. You leave first.","prompt":"あなた：＿＿＿","choices":["お先{さき}に 失礼{しつれい}します。","いらっしゃいませ。","ただいま。","いってきます。"],"answer":1,"explain_ja":"ほかの 人{ひと}より 先{さき}に 帰{かえ}る ときは 「お先{さき}に 失礼{しつれい}します」と 言{い}います。","explain_en":"When you leave the workplace before your colleagues, say お先に失礼します ('excuse me for leaving first'). They will answer お疲れさまでした.","explain_si":"සගයන් තවම වැඩ කරමින් සිටියදී ඔබ පළමුව පිටව යන විට お先に失礼します ('පළමුව යන එකට සමාවෙන්න') කියන්න. ඔවුන් お疲れさまでした කියා පිළිතුරු දෙයි.","why_wrong":["いらっしゃいませ is what shop staff say to a customer entering.","ただいま is said when you come back home, not when you leave.","いってきます is said when leaving home, planning to return the same day."],"words":[{"ja":"お先{さき}に","en":"before you, first","si":"කලින්"},{"ja":"失礼{しつれい}します","en":"excuse me","si":"සමාවෙන්න"}],"why_wrong_si":["いらっしゃいませ යනු කඩයට පාරිභෝගිකයෙක් ඇතුළු වන විට සේවකයන් කියන දෙයයි.","ただいま කියන්නේ ගෙදර ආපසු පැමිණි විටයි, පිටව යන විට නොවේ.","いってきます කියන්නේ එදිනම ආපසු එන අදහසින් ගෙදරින් පිටව යන විටයි."]},{"id":"KW-A1-004","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"かいもの","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"あなたは コンビニで はたらいて います。お客{きゃく}さんが 店{みせ}に 入{はい}って きました。 / You work at a convenience store and a customer comes in.","prompt":"あなた：＿＿＿","choices":["おじゃまします。","いただきます。","いらっしゃいませ。","ごちそうさまでした。"],"answer":3,"explain_ja":"店{みせ}の 人{ひと}は お客{きゃく}さんに 「いらっしゃいませ」と 言{い}います。","explain_en":"いらっしゃいませ is the standard greeting shop staff give to a customer who enters. The customer does not reply to it.","explain_si":"いらっしゃいませ යනු කඩයට ඇතුළු වන පාරිභෝගිකයාට සේවකයන් කරන සම්මත ආචාරයයි. පාරිභෝගිකයා එයට පිළිතුරු දෙන්නේ නැහැ.","why_wrong":["おじゃまします is said when YOU enter someone else's home.","いただきます is said before you start eating.","ごちそうさまでした is said after you finish eating."],"words":[{"ja":"お客{きゃく}さん","en":"customer","si":"පාරිභෝගිකයා"},{"ja":"店{みせ}","en":"shop","si":"සාප්පුව"}],"why_wrong_si":["おじゃまします කියන්නේ ඔබ අන් අයගේ නිවසකට ඇතුළු වන විටයි.","いただきます කියන්නේ කෑම ගැනීම ආරම්භ කරන්නට පෙරයි.","ごちそうさまでした කියන්නේ කෑම අවසන් කළ පසුවයි."]},{"id":"KW-A1-005","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"工場{こうじょう}で 先輩{せんぱい}の 話{はなし}が よく 聞{き}こえませんでした。 / You could not hear what your senior said at the factory.","prompt":"あなた：＿＿＿","choices":["すみません、もう一度{いちど} お願{ねが}いします。","すみません、けっこうです。","すみません、そうですか。","すみません、いいです。"],"answer":1,"explain_ja":"聞{き}こえなかった ときは 「もう一度{いちど} お願{ねが}いします」と 言{い}います。わからない まま しごとを しては いけません。","explain_en":"もう一度お願いします asks the person to repeat. At a worksite, never pretend you heard — a misunderstood instruction can cause an accident.","explain_si":"නැවත වරක් කියන ලෙස ඉල්ලීමට もう一度お願いします කියන්න. වැඩපොළේදී ඇහුණේ නැති විට ඇහුණා යැයි කිසිවිටෙක මවා නොපාන්න — වැරදියට තේරුම් ගත් උපදෙසක් අනතුරකට හේතු විය හැකියි.","why_wrong":["「けっこうです」 politely refuses something; it does not ask for a repeat.","「そうですか」 shows that you understood, but here you did not hear.","「いいです」 means 'no thank you', so the senior will stop explaining."],"words":[{"ja":"もう一度{いちど}","en":"one more time","si":"තව එක් වරක්"},{"ja":"聞{き}こえます","en":"to be audible","si":"ඇසෙනවා"}],"why_wrong_si":["「けっこうです」 යනු යමක් ආචාරශීලීව ප්‍රතික්ෂේප කිරීමයි; නැවත කියන්න කියා ඉල්ලීමක් නොවේ.","「そうですか」 කිව්වොත් ඔබට තේරුණා යැයි පෙනේ; නමුත් මෙහිදී ඔබට ඇහුණේම නැහැ.","「いいです」 යනු 'එපා, ස්තූතියි' යන අර්ථයයි. එවිට ජ්‍යෙෂ්ඨයා පැහැදිලි කිරීම නවත්වයි."]},{"id":"KW-A1-006","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"びょういん","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"仕事中{しごとちゅう}に 気分{きぶん}が わるく なりました。先輩{せんぱい}に 言{い}います。 / You start to feel sick during work and speak to your senior.","prompt":"あなた：＿＿＿","choices":["元気{げんき}です。","おいしいです。","気分{きぶん}が わるいです。少{すこ}し 休{やす}んでも いいですか。","だいじょうぶですか。"],"answer":3,"explain_ja":"体{からだ}の ぐあいが わるい ときは、すぐに 「気分{きぶん}が わるいです」と 言{い}って ください。","explain_en":"気分が悪いです means 'I feel unwell'. Say it at once and ask 休んでもいいですか. Hiding illness at work is dangerous.","explain_si":"気分が悪いです යනු 'මට සනීප නැහැ' යන්නයි. එය වහාම කියා 休んでもいいですか කියා අසන්න. වැඩපොළේ අසනීප තත්ත්වයක් සැඟවීම අනතුරුදායකයි.","why_wrong":["元気です says you are fine — the opposite of your condition.","おいしいです is about the taste of food.","だいじょうぶですか asks about the OTHER person's condition, not yours."],"words":[{"ja":"気分{きぶん}が わるいです","en":"I feel sick","si":"අසනීපයි"},{"ja":"休{やす}みます","en":"to rest","si":"විවේක ගන්නවා"}],"why_wrong_si":["元気です කියන්නේ ඔබ සනීපෙන් සිටින බවයි — ඔබේ තත්ත්වයට හාත්පසින්ම විරුද්ධයි.","おいしいです යනු කෑමේ රසය ගැන කියන දෙයකි.","だいじょうぶですか යනු අනෙක් තැනැත්තාගේ තත්ත්වය ගැන අසන ප්‍රශ්නයකි, ඔබේ තත්ත්වය ගැන නොවේ."]},{"id":"KW-A1-007","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"びょういん","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"あなたは 頭{あたま}が いたいです。病院{びょういん}の 受付{うけつけ}で 言{い}います。 / You have a headache and speak at the hospital reception.","prompt":"あなた：＿＿＿","choices":["おだいじに。","お元気{げんき}ですか。","頭{あたま}を あらいます。","頭{あたま}が いたいです。"],"answer":4,"explain_ja":"体{からだ}の どこが いたいか 言{い}う ときは 「＿＿が いたいです」と 言{い}います。","explain_en":"Use 「(body part)が いたいです」 to say where it hurts: 頭が いたいです = 'I have a headache'.","explain_si":"රිදෙන තැන කීමට 「(ශරීර කොටස)が いたいです」 භාවිත කරන්න: 頭が いたいです = 'මගේ හිස රිදෙනවා'.","why_wrong":["おだいじに is what the staff say TO a sick person when they leave.","お元気ですか asks about the other person's health.","頭を あらいます means 'I wash my hair' — を marks an action on the head, not pain."],"words":[{"ja":"頭{あたま}","en":"head","si":"හිස"},{"ja":"受付{うけつけ}","en":"reception desk","si":"පිළිගැනීමේ කවුළුව"}],"why_wrong_si":["おだいじに යනු රෝගියෙක් පිටව යන විට සේවකයන් ඔහුට කියන දෙයයි.","お元気ですか යනු අනෙක් තැනැත්තාගේ සුවදුක් විමසීමයි.","頭を あらいます යනු 'මම හිසකෙස් සෝදනවා' — を මගින් හිසට කරන ක්‍රියාවක් පෙන්වයි, වේදනාවක් නොවේ."]},{"id":"KW-A1-008","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"すまい","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"寮{りょう}で ゴミを 出{だ}したいですが、日{ひ}が わかりません。管理人{かんりにん}さんに 聞{き}きます。 / You want to take out the rubbish at the dormitory but do not know which day.","prompt":"あなた：＿＿＿","choices":["ゴミは 何{なん}ですか。","ゴミの 日{ひ}は いつですか。","ゴミを 出{だ}しました。","ゴミは いくらですか。"],"answer":2,"explain_ja":"日{ひ}を 聞{き}く ときは 「いつですか」を 使{つか}います。","explain_en":"いつですか asks 'when?'. Rubbish days are fixed in Japan, so always check the day for each type of rubbish.","explain_si":"いつですか යනු 'කවදාද?' කියා ඇසීමයි. ජපානයේ කසළ දමන දින ස්ථිරව නියම කර ඇති නිසා, එක් එක් කසළ වර්ගය සඳහා දිනය සැමවිටම තහවුරු කර ගන්න.","why_wrong":["「ゴミは 何ですか」 asks what rubbish is, not which day.","「ゴミを 出しました」 reports that you already took it out.","いくらですか asks the price."],"words":[{"ja":"寮{りょう}","en":"dormitory","si":"නේවාසිකාගාරය"},{"ja":"ゴミの 日{ひ}","en":"rubbish collection day","si":"කුණු දමන දිනය"}],"why_wrong_si":["「ゴミは 何ですか」 මගින් අසන්නේ කසළ යනු කුමක්ද කියායි, දිනය ගැන නොවේ.","「ゴミを 出しました」 යනු ඔබ දැනටමත් කසළ දැමූ බව දැනුම් දීමකි.","いくらですか යනු මිල අසන ප්‍රශ්නයයි."]},{"id":"KW-A1-009","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"こうつう","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"駅{えき}で どの 電車{でんしゃ}に のるか わかりません。駅員{えきいん}さんに 聞{き}きます。 / At the station you do not know which train to take, so you ask a station worker.","prompt":"あなた：＿＿＿","choices":["この 電車{でんしゃ}は どうですか。","この 電車{でんしゃ}は 何時{なんじ}ですか。","すみません、大阪{おおさか}へ 行{い}く 電車{でんしゃ}は どれですか。","この 電車{でんしゃ}は いくらですか。"],"answer":3,"explain_ja":"たくさんの 中{なか}から えらぶ ときは 「どれですか」と 聞{き}きます。","explain_en":"どれ = 'which one' (out of three or more). 「〜へ 行く 電車は どれですか」 is the standard way to ask which train goes to your destination.","explain_si":"どれ = 'කුමන එකද' (තුනකට වැඩි ගණනකින් එකක්). 「〜へ 行く 電車は どれですか」 යනු ඔබ යන ස්ථානයට යන දුම්රිය කුමක්ද කියා ඇසීමේ සම්මත ක්‍රමයයි.","why_wrong":["「どうですか」 asks for an opinion or impression.","「何時ですか」 asks the time, not which train.","「いくらですか」 asks the fare, not which train."],"words":[{"ja":"駅員{えきいん}","en":"station staff","si":"දුම්රියපොළ සේවකයා"},{"ja":"電車{でんしゃ}","en":"train","si":"දුම්රිය"}],"why_wrong_si":["「どうですか」 මගින් අසන්නේ අදහසක් හෝ හැඟීමකි.","「何時ですか」 වේලාව අසයි, කුමන දුම්රියද කියා නොවේ.","「いくらですか」 ගාස්තුව අසයි, කුමන දුම්රියද කියා නොවේ."]},{"id":"KW-A1-010","level":"A1","section":"kaiwa","type":"場面に合う表現","scene":"たべもの","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"レストランで メニューを 見{み}ました。ちゅうもんを します。 / You have looked at the menu in a restaurant and want to order.","prompt":"あなた：＿＿＿","choices":["すみません、これを お願{ねが}いします。","すみません、ごちそうさまでした。","すみません、おつりです。","すみません、いらっしゃいませ。"],"answer":1,"explain_ja":"ちゅうもんの ときは 「これを お願{ねが}いします」または 「これを ください」と 言{い}います。","explain_en":"To order, point at the menu and say 「これを お願いします」 or 「これを ください」. Both are polite and used everywhere.","explain_si":"ඇණවුම් කිරීමට මෙනුවේ ඇති දේ පෙන්වා 「これを お願いします」 හෝ 「これを ください」 කියන්න. දෙකම ආචාරශීලී වන අතර සෑම තැනකම භාවිත වේ.","why_wrong":["ごちそうさまでした is said AFTER you finish eating.","おつり is the change; the staff say it when they hand money back.","いらっしゃいませ is what the staff say to you, not what a customer says."],"words":[{"ja":"注文{ちゅうもん}","en":"order","si":"ඇණවුම"},{"ja":"お願{ねが}いします","en":"please (I request)","si":"කරුණාකර"}],"why_wrong_si":["ごちそうさまでした කියන්නේ කෑම අවසන් කළ පසුවයි.","おつり යනු ඉතිරි මුදලයි; මුදල් ආපසු දෙන විට සේවකයා එය කියයි.","いらっしゃいませ යනු සේවකයන් ඔබට කියන දෙයයි, පාරිභෝගිකයෙක් කියන දෙයක් නොවේ."]},{"id":"KW-A1-011","level":"A1","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（先輩{せんぱい}）：この 荷物{にもつ}を 2階{かい}に はこんで ください。","prompt":"B：＿＿＿","choices":["いいえ、ちがいます。","はい、わかりました。","はい、どういたしまして。","いいえ、けっこうです。"],"answer":2,"explain_ja":"しごとの 指示{しじ}を うけた ときは 「はい、わかりました」と 答{こた}えます。","explain_en":"When you receive an instruction at work, answer はい、わかりました. It shows you understood and will do it.","explain_si":"වැඩපොළේදී උපදෙසක් ලැබෙන විට はい、わかりました කියා පිළිතුරු දෙන්න. එයින් ඔබට තේරුණු බවත් එය කරන බවත් පෙන්වයි.","why_wrong":["「ちがいます」 means 'that is wrong' and denies the instruction.","どういたしまして is the reply to 'thank you'.","けっこうです refuses an offer, so it sounds like you will not do the work."],"words":[{"ja":"荷物{にもつ}","en":"luggage, package","si":"බඩු"},{"ja":"運{はこ}びます","en":"to carry","si":"අරන් යනවා"}],"why_wrong_si":["「ちがいます」 යනු 'එය වැරදියි' යන අර්ථය දෙන අතර උපදෙස ප්‍රතික්ෂේප කරයි.","どういたしまして යනු 'ස්තූතියි' කීමට දෙන පිළිතුරයි.","けっこうです මගින් ඉදිරිපත් කිරීමක් ප්‍රතික්ෂේප කරයි; එනිසා ඔබ එම වැඩේ නොකරන බවක් ඇසේ."]},{"id":"KW-A1-012","level":"A1","section":"kaiwa","type":"会話の応答","scene":"ともだち","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A：かさを かして くれて、ありがとうございます。","prompt":"B：＿＿＿","choices":["すみません。","お願{ねが}いします。","失礼{しつれい}します。","どういたしまして。"],"answer":4,"explain_ja":"「ありがとうございます」と 言{い}われたら 「どういたしまして」と 答{こた}えます。","explain_en":"どういたしまして is the standard reply to thanks ('you're welcome'). いいえ、いいえ is also used in casual speech.","explain_si":"どういたしまして යනු ස්තූතියට දෙන සම්මත පිළිතුරයි ('කමක් නැහැ'). අවිධිමත් කථාවේදී いいえ、いいえ ද භාවිත වේ.","why_wrong":["すみません is an apology or a way to call someone.","お願いします is used when you make a request.","失礼します is said when entering or leaving a room."],"words":[{"ja":"傘{かさ}","en":"umbrella","si":"කුඩය"}],"why_wrong_si":["すみません යනු සමාව ඉල්ලීමක් හෝ කෙනෙකු අමතන ක්‍රමයකි.","お願いします භාවිත කරන්නේ ඉල්ලීමක් කරන විටයි.","失礼します කියන්නේ කාමරයකට ඇතුළු වන විට හෝ එයින් පිටව යන විටයි."]},{"id":"KW-A1-013","level":"A1","section":"kaiwa","type":"会話の応答","scene":"やくしょ","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（役所{やくしょ}の 人{ひと}）：お名前{なまえ}は 何{なん}ですか。","prompt":"B：＿＿＿","choices":["22さいです。","スリランカから 来{き}ました。","会社員{かいしゃいん}です。","カマルです。"],"answer":4,"explain_ja":"「お名前{なまえ}は 何{なん}ですか」は 名前{なまえ}を 聞{き}く しつもんです。","explain_en":"The question asks for your NAME, so answer with your name only. The other choices answer age, country and job.","explain_si":"ප්‍රශ්නයෙන් අසන්නේ ඔබේ නම නිසා, නම පමණක් කියා පිළිතුරු දෙන්න. අනෙක් තේරීම් වයස, රට සහ රැකියාව ගැන පිළිතුරුයි.","why_wrong":["22さいです answers 何さいですか (how old are you).","スリランカから 来ました answers どこから 来ましたか.","会社員です answers お仕事は 何ですか."],"words":[{"ja":"名前{なまえ}","en":"name","si":"නම"},{"ja":"役所{やくしょ}","en":"city office","si":"නගර සභා කාර්යාලය"}],"why_wrong_si":["22さいです යනු 何さいですか (වයස කීයද) යන්නට පිළිතුරයි.","スリランカから 来ました යනු どこから 来ましたか (කොහෙන්ද ආවේ) යන්නට පිළිතුරයි.","会社員です යනු お仕事は 何ですか (රැකියාව මොකක්ද) යන්නට පිළිතුරයි."]},{"id":"KW-A1-014","level":"A1","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A：あしたは 休{やす}みですか。（B は あした しごとです）","prompt":"B：＿＿＿","choices":["はい、休{やす}みました。","いいえ、しごとです。","はい、しごとです。","いいえ、休{やす}みです。"],"answer":2,"explain_ja":"あしたは しごとですから 「いいえ」と 答{こた}えて、「しごとです」と つづけます。","explain_en":"The question is 'Is tomorrow a day off?'. Since it is a work day, answer いいえ and then say しごとです. はい and いいえ must match the sentence that follows.","explain_si":"ප්‍රශ්නය වන්නේ 'හෙට නිවාඩුද?' යන්නයි. හෙට වැඩ දිනයක් නිසා いいえ කියා පසුව しごとです කියන්න. はい හෝ いいえ යන්න ඉන් පසු එන වාක්‍යයට ගැළපිය යුතුයි.","why_wrong":["休みました is past tense; the question is about tomorrow.","はい agrees that tomorrow is a day off, but then しごとです contradicts it.","いいえ denies it, but then 休みです contradicts the いいえ."],"words":[{"ja":"休{やす}み","en":"day off","si":"නිවාඩුව"},{"ja":"明日{あした}","en":"tomorrow","si":"හෙට"}],"why_wrong_si":["休みました අතීත කාලයයි; ප්‍රශ්නය හෙට ගැනයි.","はい කිව්වොත් හෙට නිවාඩු බවට එකඟ වේ, නමුත් ඉන් පසු එන しごとです එයට පටහැනියි.","いいえ මගින් ප්‍රතික්ෂේප කරයි, නමුත් ඉන් පසු එන 休みです එම いいえ ට පටහැනියි."]},{"id":"KW-A1-015","level":"A1","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A：すみません、トイレは どこですか。","prompt":"B：＿＿＿","choices":["3時{じ}です。","500円{えん}です。","あそこです。","田中{たなか}さんです。"],"answer":3,"explain_ja":"「どこですか」は 場所{ばしょ}を 聞{き}く しつもんです。答{こた}えは 「あそこです」などです。","explain_en":"どこですか asks for a place, so the answer must be a place word: ここ / そこ / あそこ / 2階 etc.","explain_si":"どこですか මගින් අසන්නේ ස්ථානයක් නිසා පිළිතුරද ස්ථානයක් විය යුතුයි: ここ / そこ / あそこ / 2階 ආදිය.","why_wrong":["3時です answers 何時ですか (what time).","500円です answers いくらですか (how much).","田中さんです answers だれですか (who)."],"words":[{"ja":"場所{ばしょ}","en":"place","si":"ස්ථානය"}],"why_wrong_si":["3時です යනු 何時ですか (වේලාව කීයද) යන්නට පිළිතුරයි.","500円です යනු いくらですか (කීයද) යන්නට පිළිතුරයි.","田中さんです යනු だれですか (කවුද) යන්නට පිළිතුරයි."]},{"id":"KW-A1-016","level":"A1","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（先輩{せんぱい}）：この 機械{きかい}に さわらないで ください。あぶないですよ。","prompt":"B：＿＿＿","choices":["はい、気{き}を つけます。","はい、さわります。","いいえ、さわって ください。","はい、あぶなくないです。"],"answer":1,"explain_ja":"あぶないと 言{い}われたら 「はい、気{き}を つけます」と 答{こた}えます。安全{あんぜん}の 注意{ちゅうい}は 必{かなら}ず 守{まも}ります。","explain_en":"「気を つけます」 = 'I will be careful'. A safety warning must be accepted, never argued with.","explain_si":"「気を つけます」 = 'මම පරිස්සම් වෙනවා'. ආරක්ෂාව පිළිබඳ අනතුරු ඇඟවීමක් පිළිගත යුතුයි; කිසිවිටෙක ඒ ගැන තර්ක නොකරන්න.","why_wrong":["「さわります」 says you will touch it anyway.","「さわって ください」 tells the senior to touch the dangerous machine.","「あぶなくないです」 argues that it is not dangerous, which is unsafe and rude."],"words":[{"ja":"機械{きかい}","en":"machine","si":"යන්ත්‍රය"},{"ja":"気{き}を つけます","en":"to be careful","si":"පරිස්සම් වෙනවා"},{"ja":"危{あぶ}ない","en":"dangerous","si":"අනතුරුදායකයි"}],"why_wrong_si":["「さわります」 කිව්වොත් ඔබ කොහොම වුණත් එයට අත ගසන බව කියවේ.","「さわって ください」 යනු අනතුරුදායක යන්ත්‍රයට අත ගසන ලෙස ජ්‍යෙෂ්ඨයාට කීමයි.","「あぶなくないです」 මගින් එය අනතුරුදායක නැහැ කියා තර්ක කරයි — එය අනාරක්ෂිත අතර අගෞරව සහගතයි."]},{"id":"KW-A1-017","level":"A1","section":"kaiwa","type":"会話の応答","scene":"ともだち","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A：お茶{ちゃ}、どうぞ。","prompt":"B：＿＿＿","choices":["ありがとうございます。いただきます。","どうぞ、どうぞ。","どういたしまして。","ごちそうさまでした。"],"answer":1,"explain_ja":"飲{の}み物{もの}を もらった ときは 「ありがとうございます。いただきます」と 言{い}います。","explain_en":"「どうぞ」 offers something. Accept with ありがとうございます, and say いただきます just before drinking or eating.","explain_si":"「どうぞ」 මගින් යමක් ඉදිරිපත් කරයි. ありがとうございます කියා පිළිගෙන, බොන්නට හෝ කන්නට මොහොතකට පෙර いただきます කියන්න.","why_wrong":["「どうぞ」 is what the person who offers says, not the receiver.","どういたしまして is the reply to thanks.","ごちそうさまでした is said after you have finished."],"words":[{"ja":"お茶{ちゃ}","en":"tea","si":"තේ"}],"why_wrong_si":["「どうぞ」 කියන්නේ ඉදිරිපත් කරන තැනැත්තාය, ලබා ගන්නා තැනැත්තා නොවේ.","どういたしまして යනු ස්තූතියට දෙන පිළිතුරයි.","ごちそうさまでした කියන්නේ අවසන් කළ පසුවයි."]},{"id":"KW-A1-018","level":"A1","section":"kaiwa","type":"会話の応答","scene":"ともだち","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A：日本語{にほんご}が じょうずですね。","prompt":"B：＿＿＿","choices":["はい、じょうずです。","そうですね。","いいえ、けっこうです。","いいえ、まだまだです。"],"answer":4,"explain_ja":"ほめられた ときは 「いいえ、まだまだです」と 答{こた}えると いいです。","explain_en":"In Japan a compliment is usually answered modestly. いいえ、まだまだです ('no, I still have a long way to go') is the safest reply. ありがとうございます is also acceptable.","explain_si":"ජපානයේ ප්‍රශංසාවකට සාමාන්‍යයෙන් නිහතමානීව පිළිතුරු දෙයි. いいえ、まだまだです ('නැහැ, මට තව බොහෝ දුරක් යන්න තියෙනවා') ආරක්ෂිතම පිළිතුරයි. ありがとうございます ද පිළිගත හැකියි.","why_wrong":["「はい、じょうずです」 praises yourself and sounds boastful.","「そうですね」 agrees with the praise about yourself — the same problem.","けっこうです is for refusing an offer, not for answering a compliment."],"words":[{"ja":"上手{じょうず}","en":"good at, skilful","si":"දක්ෂයි"}],"why_wrong_si":["「はい、じょうずです」 මගින් තමන්ටම ප්‍රශංසා කරන අතර උදම් ඇනීමක් සේ ඇසේ.","「そうですね」 තමන් ගැන කළ ප්‍රශංසාවට එකඟ වේ — එයද එම ගැටලුවමයි.","けっこうです යනු යමක් ප්‍රතික්ෂේප කිරීමට මිස ප්‍රශංසාවකට පිළිතුරු දීමට නොවේ."]},{"id":"KW-A1-019","level":"A1","section":"kaiwa","type":"依頼・許可・断り","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"作業中{さぎょうちゅう}に トイレへ 行{い}きたいです。先輩{せんぱい}に 言{い}います。 / You need to go to the toilet during work and speak to your senior.","prompt":"あなた：＿＿＿","choices":["トイレへ 行{い}って ください。","すみません、トイレへ 行{い}っても いいですか。","トイレへ 行{い}きましょうか。","トイレへ 行{い}きませんか。"],"answer":2,"explain_ja":"許可{きょか}を もらう ときは 「〜ても いいですか」を 使{つか}います。","explain_en":"「〜ても いいですか」 asks permission for your own action. Always tell your senior before leaving your workplace.","explain_si":"「〜ても いいですか」 මගින් ඔබේම ක්‍රියාවකට අවසර ඉල්ලයි. ඔබේ වැඩ ස්ථානයෙන් ඉවත් වන්නට පෙර සැමවිටම ජ්‍යෙෂ්ඨයාට දැනුම් දෙන්න.","why_wrong":["「行って ください」 orders your senior to go.","「行きましょうか」 suggests going together or offers to go for them.","「行きませんか」 invites your senior to go with you."],"words":[{"ja":"作業中{さぎょうちゅう}","en":"during work","si":"වැඩ අතරතුර"},{"ja":"許可{きょか}","en":"permission","si":"අවසරය"}],"why_wrong_si":["「行って ください」 යනු ජ්‍යෙෂ්ඨයාට 'ඔබ යන්න' කියා අණ කිරීමයි.","「行きましょうか」 මගින් එකට යාමට යෝජනා කරයි, නැතහොත් ඔවුන් වෙනුවෙන් යාමට ඉදිරිපත් වේ.","「行きませんか」 මගින් ජ්‍යෙෂ්ඨයාට ඔබ සමඟ එන ලෙස ආරාධනා කරයි."]},{"id":"KW-A1-020","level":"A1","section":"kaiwa","type":"依頼・許可・断り","scene":"すまい","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"寮{りょう}の 部屋{へや}が さむいです。友{とも}だちに まどを しめて ほしいです。 / Your dormitory room is cold and you want your friend to close the window.","prompt":"あなた：＿＿＿","choices":["まどを しめても いいですか。","まどを しめましょうか。","まどを しめて くれませんか。","まどを しめないで ください。"],"answer":3,"explain_ja":"人{ひと}に 何{なに}かを して ほしい ときは 「〜て くれませんか」と 言{い}います。","explain_en":"「〜て くれませんか」 asks the other person to do something for you. It is softer than 「〜て ください」.","explain_si":"「〜て くれませんか」 මගින් අනෙක් තැනැත්තාගෙන් ඔබ වෙනුවෙන් යමක් කරන ලෙස ඉල්ලයි. එය 「〜て ください」 ට වඩා මෘදුයි.","why_wrong":["「しめても いいですか」 asks permission for YOU to close it.","「しめましょうか」 offers that YOU will close it.","「しめないで ください」 tells them NOT to close it."],"words":[{"ja":"窓{まど}","en":"window","si":"ජනේලය"},{"ja":"閉{し}めます","en":"to close","si":"වහනවා"}],"why_wrong_si":["「しめても いいですか」 මගින් ඉල්ලන්නේ ඔබට එය වැසීමට අවසරයයි.","「しめましょうか」 යනු ඔබම එය වසන බවට ඉදිරිපත් වීමකි.","「しめないで ください」 මගින් එය නොවසන ලෙස කියයි."]},{"id":"KW-A1-021","level":"A1","section":"kaiwa","type":"依頼・許可・断り","scene":"ともだち","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"先輩{せんぱい}に 「今日{きょう}、ごはんを 食{た}べに 行{い}きませんか」と さそわれました。今日{きょう}は 行{い}けません。 / A senior invites you to dinner but you cannot go today.","prompt":"あなた：＿＿＿","choices":["いいえ、行{い}きません。","だめです。","すみません、今日{きょう}は ちょっと…。","行{い}きたくないです。"],"answer":3,"explain_ja":"さそいを ことわる ときは 「すみません、今日{きょう}は ちょっと…」と やわらかく 言{い}います。","explain_en":"Japanese refusals are indirect. 「すみません、ちょっと…」 is understood as a polite 'no' and protects the relationship.","explain_si":"ජපන් ප්‍රතික්ෂේප කිරීම වක්‍රයි. 「すみません、ちょっと…」 යන්න ආචාරශීලී 'නැහැ' එකක් ලෙස තේරුම් ගැනෙන අතර සම්බන්ධතාවයද රැක ගනී.","why_wrong":["「いいえ、行きません」 is a flat refusal with no apology.","「だめです」 sounds like you are scolding your senior.","「行きたくないです」 says you do not want to go, which is very rude."],"words":[{"ja":"誘{さそ}います","en":"to invite","si":"ආරාධනා කරනවා"},{"ja":"断{ことわ}ります","en":"to refuse","si":"ප්‍රතික්ෂේප කරනවා"}],"why_wrong_si":["「いいえ、行きません」 සමාව ඉල්ලීමකින් තොර සෘජු ප්‍රතික්ෂේපයකි.","「だめです」 ජ්‍යෙෂ්ඨයාට තරවටු කරනවා වගේ ඇසේ.","「行きたくないです」 මගින් යන්න කැමති නැහැ කියයි — එය ඉතා අගෞරව සහගතයි."]},{"id":"KW-A1-022","level":"A1","section":"kaiwa","type":"敬語と丁寧さ","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"上司{じょうし}に しごとを たのまれました。返事{へんじ}を します。 / Your boss asks you to do a job and you reply.","prompt":"あなた：＿＿＿","choices":["うん、わかった。","はい、わかりました。","うん、いいよ。","はい、わかる。"],"answer":2,"explain_ja":"上司{じょうし}には ていねいな 形{かたち}「はい、わかりました」を 使{つか}います。","explain_en":"To a superior always use the polite ます/です form: はい、わかりました. Plain forms are only for friends and family.","explain_si":"ඉහළ නිලධාරියෙකුට සැමවිටම ආචාරශීලී ます/です ආකාරය භාවිත කරන්න: はい、わかりました. සරල (plain) ආකාර භාවිත කරන්නේ යාළුවන්ට සහ පවුලේ අයට පමණයි.","why_wrong":["「うん、わかった」 is casual speech used with friends.","「いいよ」 is also casual and sounds like you are giving permission to your boss.","「わかる」 is the plain form; it does not match the polite はい and is not polite enough."],"words":[{"ja":"返事{へんじ}","en":"reply","si":"පිළිතුර"},{"ja":"頼{たの}みます","en":"to ask, to request","si":"ඉල්ලනවා"}],"why_wrong_si":["「うん、わかった」 යනු යාළුවන් සමඟ භාවිත කරන අවිධිමත් කථාවයි.","「いいよ」 ද අවිධිමත් වන අතර, ඔබ ඔබේ ඉහළ නිලධාරියාට අවසර දෙනවා වගේ ඇසේ.","「わかる」 සරල ආකාරයයි; එය ආචාරශීලී はい සමඟ නොගැළපෙන අතර ප්‍රමාණවත් තරම් ආචාරශීලීද නැහැ."]},{"id":"KW-A1-023","level":"A1","section":"kaiwa","type":"電話と報告","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"電車{でんしゃ}が おくれて、しごとに まにあいません。会社{かいしゃ}に 電話{でんわ}を します。 / The train is delayed and you will be late for work, so you phone the company.","prompt":"あなた：＿＿＿","choices":["すみません、今日{きょう}は 休{やす}みます。","すみません、早{はや}く 行{い}きます。","すみません、もう 着{つ}きました。","すみません、電車{でんしゃ}が おくれて います。30分{ぷん}ぐらい おくれます。"],"answer":4,"explain_ja":"おくれる ときは 「りゆう」と 「どのくらい おくれるか」を 早{はや}く 電話{でんわ}で 言{い}います。","explain_en":"A late-arrival call must include the reason (電車が おくれて います) and how late you will be (30分ぐらい). Call as early as you can.","explain_si":"ප්‍රමාද වන බව දන්වන දුරකථන ඇමතුමක හේතුව (電車が おくれて います) සහ කොපමණ ප්‍රමාද වේද (30分ぐらい) යන දෙකම තිබිය යුතුයි. හැකි තරම් ඉක්මනින් අමතන්න.","why_wrong":["「休みます」 says you will not come at all, which is not true.","「早く 行きます」 does not tell the company that you will be late.","「もう 着きました」 says you have already arrived, which is false."],"words":[{"ja":"遅{おく}れます","en":"to be late","si":"ප්‍රමාද වෙනවා"},{"ja":"連絡{れんらく}します","en":"to contact, to inform","si":"දැනුම් දෙනවා"}],"why_wrong_si":["「休みます」 කිව්වොත් ඔබ කොහෙත්ම එන්නේ නැති බව කියවේ — එය සත්‍ය නොවේ.","「早く 行きます」 මගින් ඔබ ප්‍රමාද වන බව සමාගමට නොකියයි.","「もう 着きました」 මගින් ඔබ දැනටමත් පැමිණ ඇති බව කියයි — එය බොරුවකි."]},{"id":"KW-A1-024","level":"A1","section":"kaiwa","type":"電話と報告","scene":"びょういん","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"ねつが 38度{ど} あります。今日{きょう}は 休{やす}みたいです。会社{かいしゃ}に 電話{でんわ}を します。 / You have a 38-degree fever and want to take the day off, so you phone the company.","prompt":"あなた：＿＿＿","choices":["ねつが 38度{ど} あるので、今日{きょう}は 休{やす}ませて ください。","ねつが 38度{ど} あるので、今日{きょう}は 休{やす}んで ください。","ねつが 38度{ど} あるので、今日{きょう}は 行{い}きます。","ねつが 38度{ど} ありますか。"],"answer":1,"explain_ja":"自分{じぶん}が 休{やす}みたい ときは 「休{やす}ませて ください」と お願{ねが}いします。","explain_en":"「休ませて ください」 asks permission for YOU to take a rest/day off. Always give the reason (ねつが あるので) first.","explain_si":"「休ませて ください」 මගින් ඔබට නිවාඩු ගැනීමට අවසර ඉල්ලයි. හේතුව (ねつが あるので) සැමවිටම මුලින්ම කියන්න.","why_wrong":["「休んで ください」 tells the person on the phone to take a day off.","「行きます」 says you will come to work, which is the opposite of your intention.","「ありますか」 asks the other person whether THEY have a fever."],"words":[{"ja":"熱{ねつ}","en":"fever","si":"උණ"},{"ja":"休{やす}ませて ください","en":"please let me take a rest/day off","si":"නිවාඩුවක් දෙන්න"}],"why_wrong_si":["「休んで ください」 යනු දුරකථනයේ අනෙක් පසින් සිටින තැනැත්තාට නිවාඩු ගන්න කීමයි.","「行きます」 මගින් ඔබ වැඩට එන බව කියයි — එය ඔබේ අදහසට හාත්පසින්ම විරුද්ධයි.","「ありますか」 මගින් අනෙක් තැනැත්තාට උණ තිබේද කියා අසයි."]},{"id":"KW-A2-001","level":"A2","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"介護{かいご}の しごとです。利用者{りようしゃ}さんを 車{くるま}いすで 動{うご}かす 前{まえ}に 声{こえ}を かけます。 / At a care home, you speak to a resident before moving their wheelchair.","prompt":"あなた：＿＿＿","choices":["早{はや}く して ください。","動{うご}かないで ください。","これから 車{くるま}いすを かたづけます。","これから 車{くるま}いすを 動{うご}かします。だいじょうぶですか。"],"answer":4,"explain_ja":"介護{かいご}では、何{なに}を するか 先{さき}に 言{い}ってから 体{からだ}に さわります。「だいじょうぶですか」と かくにんも します。","explain_en":"In care work you must always explain what you are about to do and check the person is ready. This prevents fear, falls and injury.","explain_si":"සත්කාර සේවයේදී (介護) ඔබ කරන්නට යන දේ සැමවිටම කලින් පැහැදිලි කර, එම තැනැත්තා සූදානම්ද කියා තහවුරු කර ගත යුතුයි. එයින් බිය, ඇදවැටීම් සහ තුවාල වළක්වා ගත හැකියි.","why_wrong":["「早く して ください」 rushes the resident and is both rude and unsafe.","「動かないで ください」 does not explain what you are going to do.","「かたづけます」 means you will put the wheelchair away, which is not what you are doing."],"words":[{"ja":"利用者{りようしゃ}","en":"care recipient, resident","si":"සේවාලාභියා"},{"ja":"車{くるま}いす","en":"wheelchair","si":"රෝද පුටුව"},{"ja":"声{こえ}を かけます","en":"to speak to someone","si":"කතා කරනවා"}],"why_wrong_si":["「早く して ください」 මගින් සේවා ලාභියාට ඉක්මන් කරයි — එය අගෞරව සහගත අතර අනාරක්ෂිතයි.","「動かないで ください」 මගින් ඔබ කරන්නට යන දේ පැහැදිලි කරන්නේ නැහැ.","「かたづけます」 යනු රෝද පුටුව ඉවත් කර තබන බවයි — ඔබ කරන්නේ එය නොවේ."]},{"id":"KW-A2-002","level":"A2","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"ビルの そうじ中{ちゅう}です。ゆかが ぬれて います。人{ひと}が 通{とお}ります。 / You are cleaning a building. The floor is wet and someone is about to walk past.","prompt":"あなた：＿＿＿","choices":["ゆかが ぬれて います。足元{あしもと}に 気{き}を つけて ください。","ゆかを ふいて ください。","ここで 待{ま}って いて ください。","そうじを して います。すみません。"],"answer":1,"explain_ja":"あぶない ときは、りゆうと 注意{ちゅうい}を 両方{りょうほう} 言{い}います。「足元{あしもと}に 気{き}を つけて ください」は そうじの 仕事{しごと}で よく 使{つか}います。","explain_en":"A safety call-out needs both the danger (the floor is wet) and the instruction (watch your step). 足元に 気を つけて ください is standard in building cleaning.","explain_si":"ආරක්ෂාව පිළිබඳ ඇඟවීමකට අනතුර (බිම තෙතයි) සහ උපදෙස (පය තබන තැන ගැන පරිස්සම් වන්න) යන දෙකම අවශ්‍යයි. ගොඩනැගිලි පිරිසිදු කිරීමේදී 足元に 気を つけて ください සම්මතයි.","why_wrong":["「ゆかを ふいて ください」 tells the passer-by to wipe the floor.","「待って いて ください」 makes them wait but never tells them about the danger.","「そうじを して います。すみません」 only apologises; it gives no warning about slipping."],"words":[{"ja":"足元{あしもと}","en":"one's feet, footing","si":"පාද / පය තබන තැන"},{"ja":"濡{ぬ}れて います","en":"is wet","si":"තෙමී තිබෙනවා"}],"why_wrong_si":["「ゆかを ふいて ください」 යනු පසුකර යන තැනැත්තාට බිම පිසදාන්න කීමයි.","「待って いて ください」 මගින් ඔවුන් රඳවා තබයි, නමුත් අනතුර ගැන කිසිවක් නොකියයි.","「そうじを して います。すみません」 සමාව ඉල්ලනවා පමණයි; ලිස්සා යාමේ අවදානම ගැන අනතුරු අඟවන්නේ නැහැ."]},{"id":"KW-A2-003","level":"A2","section":"kaiwa","type":"場面に合う表現","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"建設現場{けんせつげんば}です。同僚{どうりょう}が ヘルメットを かぶって いません。 / At a construction site, your colleague is not wearing a helmet.","prompt":"あなた：＿＿＿","choices":["ヘルメットは どこですか。","ヘルメットを ぬぎましょう。","あぶないですよ。ヘルメットを かぶって ください。","ヘルメットを かぶっても いいですか。"],"answer":3,"explain_ja":"安全{あんぜん}の ために、はっきりと 「〜て ください」で つたえます。「あぶないですよ」を 先{さき}に 言{い}うと わかりやすいです。","explain_en":"For safety, state the danger and then give a clear instruction with 〜て ください. Do not soften a safety warning too much.","explain_si":"ආරක්ෂාව සඳහා පළමුව අනතුර කියා, පසුව 〜て ください මගින් පැහැදිලි උපදෙසක් දෙන්න. ආරක්ෂාව පිළිබඳ අනතුරු ඇඟවීමක් වැඩියෙන් මෘදු නොකරන්න.","why_wrong":["「どこですか」 only asks where the helmet is; it does not tell them to put it on.","「ぬぎましょう」 means 'let's take it off' — the opposite of what is needed.","「かぶっても いいですか」 asks permission for yourself, which is not the problem here."],"words":[{"ja":"建設現場{けんせつげんば}","en":"construction site","si":"ඉදිකිරීම් ස්ථානය"},{"ja":"同僚{どうりょう}","en":"colleague","si":"සේවා සගයා"},{"ja":"被{かぶ}ります","en":"to wear (on the head)","si":"හිසින් දමා ගන්නවා"}],"why_wrong_si":["「どこですか」 මගින් හිස්වැසුම කොහෙද කියා අසනවා පමණයි; එය පළඳින්න කියන්නේ නැහැ.","「ぬぎましょう」 යනු 'ගලවමු' යන්නයි — අවශ්‍ය දෙයට හාත්පසින්ම විරුද්ධයි.","「かぶっても いいですか」 මගින් ඔබටම අවසර ඉල්ලයි; මෙහි ගැටලුව එය නොවේ."]},{"id":"KW-A2-004","level":"A2","section":"kaiwa","type":"場面に合う表現","scene":"こうつう","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"トラックの 運転手{うんてんしゅ}です。荷物{にもつ}を おろしたいですが、車{くるま}を どこに 止{と}めれば いいか わかりません。店{みせ}の 人{ひと}に 聞{き}きます。 / You are a truck driver and do not know where to park to unload.","prompt":"あなた：＿＿＿","choices":["車{くるま}を 止{と}めて ください。","すみません、どこに 車{くるま}を 止{と}めれば いいですか。","車{くるま}を 止{と}めては いけません。","車{くるま}を 止{と}めましょうか。"],"answer":2,"explain_ja":"やり方{かた}や 場所{ばしょ}を 聞{き}く ときは 「〜ば いいですか」を 使{つか}います。","explain_en":"「どこに 〜ば いいですか」 asks for instructions: 'where should I ...?'. It is very useful for drivers and delivery work.","explain_si":"「どこに 〜ば いいですか」 මගින් උපදෙස් ඉල්ලයි: 'මම කොහෙද ... කළ යුත්තේ?'. රියදුරන්ට සහ බෙදාහැරීමේ වැඩවලට එය ඉතා ප්‍රයෝජනවත්.","why_wrong":["「止めて ください」 tells the shop worker to park a car.","「止めては いけません」 tells them parking is forbidden.","「止めましょうか」 offers to park for them, not to ask where you should park."],"words":[{"ja":"運転手{うんてんしゅ}","en":"driver","si":"රියදුරු"},{"ja":"止{と}めます","en":"to park, to stop","si":"නවත්වනවා"}],"why_wrong_si":["「止めて ください」 යනු කඩේ සේවකයාට වාහනයක් නවත්වන්න කීමයි.","「止めては いけません」 මගින් ඔවුන්ට වාහන නැවැත්වීම තහනම් බව කියයි.","「止めましょうか」 මගින් ඔවුන් වෙනුවෙන් වාහනය නවත්වන්නට ඉදිරිපත් වේ; ඔබ කොහෙද නවත්වන්නේ කියා අසන්නේ නැහැ."]},{"id":"KW-A2-005","level":"A2","section":"kaiwa","type":"場面に合う表現","scene":"たべもの","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"レストランで 料理{りょうり}を 出{だ}すのが おそく なりました。お客{きゃく}さんに あやまります。 / The food is late and you apologise to the customer.","prompt":"あなた：＿＿＿","choices":["おそくて すみませんね。","お待{ま}たせして 申{もう}し訳{わけ}ありません。","ちょっと 待{ま}って ください。","もう 少{すこ}しですよ。"],"answer":2,"explain_ja":"お客{きゃく}さんに あやまる ときは 「申{もう}し訳{わけ}ありません」を 使{つか}います。「すみません」より ていねいです。","explain_en":"申し訳ありません is the formal apology used with customers. お待たせして 申し訳ありません = 'I am very sorry to have kept you waiting'.","explain_si":"申し訳ありません යනු පාරිභෝගිකයන් සමඟ භාවිත කරන විධිමත් සමාව ඉල්ලීමයි. お待たせして 申し訳ありません = 'ඔබව බලා සිටින්නට හැරීම ගැන බෙහෙවින් කනගාටුයි'.","why_wrong":["「すみませんね」 with ね sounds light and casual for a customer apology.","「ちょっと 待って ください」 tells the customer to wait again, with no apology.","「もう 少しですよ」 gives information but does not apologise."],"words":[{"ja":"申{もう}し訳{わけ}ありません","en":"I am very sorry (formal)","si":"බොහොම කණගාටුයි"},{"ja":"お待{ま}たせしました","en":"sorry to have kept you waiting","si":"බලා සිටීමට සලස්වා කණගාටුයි"}],"why_wrong_si":["「すみませんね」 — ね එකතු වීමෙන් පාරිභෝගිකයෙකුට කරන සමාව ඉල්ලීමකට සැහැල්ලු හා අවිධිමත් ලෙස ඇසේ.","「ちょっと 待って ください」 මගින් නැවතත් පාරිභෝගිකයාට රැඳී සිටින්න කියයි, සමාවක් ඉල්ලන්නේ නැහැ.","「もう 少しですよ」 තොරතුරු දෙනවා පමණයි; සමාව ඉල්ලන්නේ නැහැ."]},{"id":"KW-A2-006","level":"A2","section":"kaiwa","type":"場面に合う表現","scene":"やくしょ","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"役所{やくしょ}に 来{き}ました。住所{じゅうしょ}が 変{か}わったので 手続{てつづ}きを したいですが、まどぐちが わかりません。 / You are at the city office to report a change of address but do not know which counter to go to.","prompt":"あなた：＿＿＿","choices":["住所{じゅうしょ}を 教{おし}えて ください。","ここは 何{なん}の まどぐちですか。","すみません、住所{じゅうしょ}が 変{か}わったのですが、どの まどぐちですか。","住所{じゅうしょ}が 変{か}わりましたか。"],"answer":3,"explain_ja":"役所{やくしょ}では、まず 「何{なに}を したいか」を 言{い}ってから 聞{き}くと、すぐに 案内{あんない}して もらえます。","explain_en":"State your purpose first (住所が 変わったのですが), then ask your question. The 〜のですが opening is the natural way to start a request at a public office.","explain_si":"පළමුව ඔබේ අවශ්‍යතාව කියන්න (住所が 変わったのですが), පසුව ප්‍රශ්නය අසන්න. රාජ්‍ය කාර්යාලයක ඉල්ලීමක් ආරම්භ කිරීමට 〜のですが ස්වාභාවික ක්‍රමයයි.","why_wrong":["「住所を 教えて ください」 asks the clerk to tell you your own address.","「ここは 何の まどぐちですか」 does not say what you need, so the clerk cannot guide you.","「住所が 変わりましたか」 asks whether the CLERK's address has changed."],"words":[{"ja":"住所{じゅうしょ}","en":"address","si":"ලිපිනය"},{"ja":"手続{てつづ}き","en":"procedure, paperwork","si":"ක්‍රියා පටිපාටිය"},{"ja":"窓口{まどぐち}","en":"service counter","si":"සේවා කවුළුව"}],"why_wrong_si":["「住所を 教えて ください」 යනු ඔබේම ලිපිනය කියන්න කියා නිලධාරියාගෙන් ඉල්ලීමයි.","「ここは 何の まどぐちですか」 මගින් ඔබට අවශ්‍ය දේ නොකියන නිසා නිලධාරියාට ඔබට මඟ පෙන්විය නොහැකියි.","「住所が 変わりましたか」 මගින් අසන්නේ නිලධාරියාගේ ලිපිනය වෙනස් වුණාද කියායි."]},{"id":"KW-A2-007","level":"A2","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（上司{じょうし}）：この 書類{しょるい}、今日中{きょうじゅう}に できますか。（B は 今日中{きょうじゅう}は むずかしいです）","prompt":"B：＿＿＿","choices":["すみません、今日中{きょうじゅう}は むずかしいです。あしたの 午前中{ごぜんちゅう}なら できます。","いいえ、できません。","できるか どうか わかりません。","はい、できます。たぶん。"],"answer":1,"explain_ja":"できない ときは、「むずかしいです」と 言{い}ってから、いつなら できるかを 言{い}います。","explain_en":"At work, a refusal should include an alternative. むずかしいです is a softer 'I can't', and 「あしたなら できます」 lets your boss plan.","explain_si":"වැඩපොළේදී ප්‍රතික්ෂේප කිරීමකට විකල්පයක්ද ඇතුළත් විය යුතුයි. むずかしいです යනු මෘදු 'බැහැ' එකක් වන අතර, 「あしたなら できます」 මගින් ඉහළ නිලධාරියාට සැලසුම් කිරීමට ඉඩ ලැබේ.","why_wrong":["A bare 「できません」 gives no alternative and sounds blunt at work.","「わかりません」 leaves your boss with no information to plan with.","「はい、できます。たぶん」 says yes but adds たぶん, so the boss cannot rely on it."],"words":[{"ja":"書類{しょるい}","en":"documents","si":"ලේඛන"},{"ja":"今日中{きょうじゅう}に","en":"by the end of today","si":"අද දවස ඇතුළත"}],"why_wrong_si":["හුදෙක් 「できません」 පමණක් කීමෙන් විකල්පයක් නොදෙන අතර වැඩපොළේ රළු ලෙස ඇසේ.","「わかりません」 කිව්වොත් ඉහළ නිලධාරියාට සැලසුම් කිරීමට කිසිම තොරතුරක් නැහැ.","「はい、できます。たぶん」 මගින් 'ඔව්' කියා たぶん (සමහරවිට) එකතු කරයි; එනිසා නිලධාරියාට ඒ මත විශ්වාසය තැබිය නොහැකියි."]},{"id":"KW-A2-008","level":"A2","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（上司{じょうし}）：先週{せんしゅう}の しごと、ありがとう。とても 助{たす}かりました。","prompt":"B：＿＿＿","choices":["どういたしまして、どうも。","そうですか。","はい、がんばりました。","いえいえ、とんでもないです。"],"answer":4,"explain_ja":"上司{じょうし}に お礼{れい}を 言{い}われた ときは 「いえいえ、とんでもないです」と こたえると ていねいです。","explain_en":"とんでもないです ('not at all') is the modest reply when a superior thanks you. It is politer than どういたしまして in a workplace.","explain_si":"とんでもないです ('කිසිසේත්ම නැහැ') යනු ඉහළ නිලධාරියෙක් ඔබට ස්තූති කරන විට දෙන නිහතමානී පිළිතුරයි. වැඩපොළක් තුළ එය どういたしまして ට වඩා ආචාරශීලීයි.","why_wrong":["「どういたしまして、どうも」 is fine between friends but sounds flat to a superior.","「そうですか」 is a neutral 'is that so?' and ignores the thanks.","「がんばりました」 praises your own effort to your boss and sounds boastful."],"words":[{"ja":"助{たす}かりました","en":"you really helped me","si":"ලොකු උදව්වක් වුණා"},{"ja":"先週{せんしゅう}","en":"last week","si":"පසුගිය සතිය"}],"why_wrong_si":["「どういたしまして、どうも」 යාළුවන් අතර හොඳයි, නමුත් ඉහළ නිලධාරියෙකුට එය පැතලි ලෙස ඇසේ.","「そうですか」 යනු 'එහෙමද?' යන උදාසීන පිළිතුරක් වන අතර ස්තූතිය නොසලකා හරියි.","「がんばりました」 මගින් ඔබේම වෙහෙස ගැන ඉහළ නිලධාරියාට ප්‍රශංසා කරයි — උදම් ඇනීමක් සේ ඇසේ."]},{"id":"KW-A2-009","level":"A2","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（店長{てんちょう}）：あしたの シフト、8時{じ}から 9時{じ}からに 変{か}わりました。","prompt":"B：＿＿＿","choices":["わかりました。9時{じ}からですね。ありがとうございます。","わかりました。8時{じ}からですね。","そうですか。行{い}きません。","いいですよ。"],"answer":1,"explain_ja":"だいじな ことを 聞{き}いたら、「9時{じ}からですね」と くりかえして かくにんします。","explain_en":"Always repeat the new time back to confirm. Repeating the wrong time, or not repeating at all, is how shift mistakes happen.","explain_si":"අලුත් වේලාව සැමවිටම නැවත කියා තහවුරු කර ගන්න. වැරදි වේලාවක් නැවත කීම, නැතහොත් කිසිසේත් නැවත නොකීම, ෂිෆ්ට් වැරදීම් සිදු වන ආකාරයයි.","why_wrong":["Repeating 8時 shows the change was not understood — the new time is 9時.","「行きません」 refuses to come, which is not an answer to a shift change.","「いいですよ」 sounds like you are granting permission to your manager."],"words":[{"ja":"シフト","en":"work shift","si":"වැඩ මුරය"},{"ja":"確認{かくにん}します","en":"to confirm, to check","si":"තහවුරු කරගන්නවා"}],"why_wrong_si":["8時 නැවත කීමෙන් පෙනෙන්නේ වෙනස තේරුම් ගෙන නැති බවයි — අලුත් වේලාව 9時 යි.","「行きません」 මගින් එන්නේ නැහැ කියා ප්‍රතික්ෂේප කරයි; එය ෂිෆ්ට් වෙනසකට පිළිතුරක් නොවේ.","「いいですよ」 ඔබ ඔබේ කළමනාකරුට අවසර දෙනවා වගේ ඇසේ."]},{"id":"KW-A2-010","level":"A2","section":"kaiwa","type":"会話の応答","scene":"びょういん","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（病院{びょういん}の 受付{うけつけ}）：保険証{ほけんしょう}を お持{も}ちですか。（B は 持{も}って います）","prompt":"B：＿＿＿","choices":["はい、持{も}って ください。","いいえ、持{も}ちません。","はい、持{も}ちましょう。","はい、これです。どうぞ。"],"answer":4,"explain_ja":"「お持{も}ちですか」は 「今{いま} 持{も}って いますか」と いう いみです。持{も}って いる ときは 出{だ}して 「どうぞ」と 言{い}います。","explain_en":"お持ちですか is polite for 'do you have it with you?'. If you do, hand it over and say はい、これです。どうぞ.","explain_si":"お持ちですか යනු 'ඔබ ළඟ තිබෙනවාද?' යන්නෙහි ආචාරශීලී ආකාරයයි. තිබේ නම් එය දිගු කර はい、これです。どうぞ කියන්න.","why_wrong":["「持って ください」 tells the receptionist to hold something.","「持ちません」 says you do not have it, but you do.","「持ちましょう」 means 'let's carry it', which does not answer the question."],"words":[{"ja":"保険証{ほけんしょう}","en":"health insurance card","si":"සෞඛ්‍ය රක්ෂණ කාඩ්පත"},{"ja":"お持{も}ちですか","en":"do you have it with you? (polite)","si":"ඔබ ළඟ තිබෙනවාද?"}],"why_wrong_si":["「持って ください」 යනු පිළිගැනීමේ නිලධාරියාට යමක් අල්ලාගෙන සිටින්න කීමයි.","「持ちません」 මගින් ඔබ ළඟ එය නැති බව කියයි, නමුත් ඇත්තටම එය තිබෙනවා.","「持ちましょう」 යනු 'අරගෙන යමු' යන්නයි — එය ප්‍රශ්නයට පිළිතුරක් නොවේ."]},{"id":"KW-A2-011","level":"A2","section":"kaiwa","type":"会話の応答","scene":"びょういん","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（医者{いしゃ}）：どう しましたか。","prompt":"B：＿＿＿","choices":["だいじょうぶです。","3日前{みっかまえ}から おなかが いたいです。","病院{びょういん}に 来{き}ました。","おだいじに。"],"answer":2,"explain_ja":"「どう しましたか」は 「どこが わるいですか」と いう いみです。「いつから」「どこが」を 言{い}います。","explain_en":"どうしましたか is the doctor asking about your symptoms. Answer with WHEN it started and WHERE it hurts: 3日前から おなかが いたいです.","explain_si":"どうしましたか යනු වෛද්‍යවරයා ඔබේ රෝග ලක්ෂණ විමසීමයි. එය පටන් ගත්තේ කවදාද, රිදෙන්නේ කොහෙද යන දෙකම කියා පිළිතුරු දෙන්න: 3日前から おなかが いたいです.","why_wrong":["「だいじょうぶです」 says you have no problem, so the doctor cannot help you.","「病院に 来ました」 states the obvious and gives no symptom.","「おだいじに」 is what the doctor says to you at the end of the visit."],"words":[{"ja":"医者{いしゃ}","en":"doctor","si":"වෛද්‍යවරයා"},{"ja":"お腹{なか}","en":"stomach","si":"බඩ"},{"ja":"3日前{みっかまえ}から","en":"since three days ago","si":"දින තුනකට පෙර සිට"}],"why_wrong_si":["「だいじょうぶです」 මගින් ඔබට කිසි කරදරයක් නැති බව කියයි; එවිට වෛද්‍යවරයාට ඔබට උදව් කළ නොහැකියි.","「病院に 来ました」 මගින් පැහැදිලිවම පෙනෙන දෙයක් කියයි; රෝග ලක්ෂණයක් නොදෙයි.","「おだいじに」 යනු පරීක්ෂාව අවසානයේ වෛද්‍යවරයා ඔබට කියන දෙයයි."]},{"id":"KW-A2-012","level":"A2","section":"kaiwa","type":"会話の応答","scene":"しごと","stem":"つぎの 会話{かいわ}で、B は 何{なん}と 言{い}いますか。","context":"A（先輩{せんぱい}）：この 作業{さぎょう}の やり方{かた}、わかりますか。（B は よく わかりません）","prompt":"B：＿＿＿","choices":["はい、だいたい わかります。","わかりません。","すみません、ここが よく わからないので、もう一度{いちど} 教{おし}えて いただけませんか。","はい、だいじょうぶです。"],"answer":3,"explain_ja":"わからない ときは、どこが わからないかを 言{い}って、「教{おし}えて いただけませんか」と お願{ねが}いします。","explain_en":"Say exactly what you do not understand and ask politely with 教えて いただけませんか. Never pretend to understand a work procedure.","explain_si":"ඔබට තේරෙන්නේ නැත්තේ හරියටම කුමක්ද කියා කියා, 教えて いただけませんか මගින් ආචාරශීලීව ඉල්ලන්න. වැඩ ක්‍රියාපටිපාටියක් තේරෙනවා යැයි කිසිවිටෙක මවා නොපාන්න.","why_wrong":["「だいたい わかります」 hides that you do not understand and can cause a mistake or an accident.","A bare 「わかりません」 is true but blunt, and it does not ask for help.","「だいじょうぶです」 when you do not understand is dangerous at a worksite."],"words":[{"ja":"作業{さぎょう}","en":"work task, operation","si":"කාර්යය"},{"ja":"やり方{かた}","en":"how to do it","si":"කරන ක්‍රමය"}],"why_wrong_si":["「だいたい わかります」 මගින් නොතේරෙන බව සඟවයි; එය වැරදීමකට හෝ අනතුරකට හේතු විය හැකියි.","හුදෙක් 「わかりません」 පමණක් කීම සත්‍යයි, නමුත් රළුයි; උදව් ඉල්ලීමක්ද එහි නැහැ.","නොතේරෙන විට 「だいじょうぶです」 කීම වැඩපොළක අනතුරුදායකයි."]},{"id":"KW-A2-013","level":"A2","section":"kaiwa","type":"依頼・許可・断り","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"来月{らいげつ}の 5日{いつか}に 休{やす}みたいです。上司{じょうし}に お願{ねが}いします。 / You want to take the 5th of next month off and ask your boss.","prompt":"あなた：＿＿＿","choices":["5日{いつか}に 休{やす}みます。","5日{いつか}に 休{やす}んで ください。","来月{らいげつ}の 5日{いつか}、お休{やす}みを いただきたいのですが、よろしいでしょうか。","5日{いつか}は 休{やす}みですか。"],"answer":3,"explain_ja":"上司{じょうし}に 休{やす}みを お願{ねが}いする ときは 「〜たいのですが、よろしいでしょうか」を 使{つか}います。","explain_en":"「〜たいのですが、よろしいでしょうか」 states your wish and then asks permission. It is the standard polite way to request leave.","explain_si":"「〜たいのですが、よろしいでしょうか」 මගින් ඔබේ අවශ්‍යතාව කියා පසුව අවසර අසයි. නිවාඩු ඉල්ලීමේ සම්මත ආචාරශීලී ක්‍රමය එයයි.","why_wrong":["「休みます」 announces your decision instead of asking permission.","「休んで ください」 tells your boss to take the day off.","「5日は 休みですか」 asks whether the company is closed, not for your leave."],"words":[{"ja":"来月{らいげつ}","en":"next month","si":"ලබන මාසය"},{"ja":"お休{やす}みを いただきます","en":"to take leave (humble)","si":"නිවාඩුවක් ලබා ගන්නවා"}],"why_wrong_si":["「休みます」 මගින් අවසර ඉල්ලනවා වෙනුවට ඔබේ තීරණය දැනුම් දෙයි.","「休んで ください」 යනු ඉහළ නිලධාරියාට නිවාඩු ගන්න කීමයි.","「5日は 休みですか」 මගින් අසන්නේ එදින සමාගම වසා තිබේද කියායි, ඔබේ නිවාඩුව ගැන නොවේ."]},{"id":"KW-A2-014","level":"A2","section":"kaiwa","type":"依頼・許可・断り","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"書{か}いた 書類{しょるい}を 先輩{せんぱい}に 見{み}て ほしいです。 / You want your senior to check a document you wrote.","prompt":"あなた：＿＿＿","choices":["この 書類{しょるい}を 見{み}なさい。","すみません、この 書類{しょるい}を 見{み}て いただけませんか。","この 書類{しょるい}を 見{み}ましょうか。","この 書類{しょるい}を 見{み}ても いいですか。"],"answer":2,"explain_ja":"先輩{せんぱい}や 上司{じょうし}に お願{ねが}いする ときは 「〜て いただけませんか」が いちばん ていねいです。","explain_en":"「〜て いただけませんか」 is the polite request form used to seniors and superiors. 〜て くれませんか is a step less formal.","explain_si":"「〜て いただけませんか」 යනු ජ්‍යෙෂ්ඨයන්ට සහ ඉහළ නිලධාරීන්ට භාවිත කරන ආචාරශීලී ඉල්ලීම් ආකාරයයි. 〜て くれませんか ඊට වඩා පියවරක් අඩු විධිමත් බවක් දරයි.","why_wrong":["「〜なさい」 is an order used by a teacher or parent to a child.","「見ましょうか」 offers that YOU will look at it for them.","「見ても いいですか」 asks permission for YOU to look at the document."],"words":[{"ja":"書類{しょるい}","en":"document","si":"ලේඛනය"},{"ja":"〜て いただけませんか","en":"could you please ... ? (polite)","si":"කරුණාකර ... කරන්න පුළුවන්ද?"}],"why_wrong_si":["「〜なさい」 යනු ගුරුවරයෙක් හෝ දෙමව්පියෙක් දරුවෙකුට දෙන අණකි.","「見ましょうか」 යනු ඔබ ඔවුන් වෙනුවෙන් එය බලන්නට ඉදිරිපත් වීමකි.","「見ても いいですか」 මගින් ඉල්ලන්නේ ඔබට එම ලේඛනය බැලීමට අවසරයයි."]},{"id":"KW-A2-015","level":"A2","section":"kaiwa","type":"依頼・許可・断り","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"事務所{じむしょ}が あついです。エアコンを つけたいので 上司{じょうし}に 聞{き}きます。 / The office is hot and you want to ask your boss if you may turn on the air conditioner.","prompt":"あなた：＿＿＿","choices":["エアコンを つけて ください。","エアコンを つけましょう。","エアコンを つけては いけませんか。","すみません、エアコンを つけても よろしいでしょうか。"],"answer":4,"explain_ja":"上司{じょうし}に 許可{きょか}を もらう ときは 「〜ても よろしいでしょうか」と 言{い}います。「〜ても いいですか」より ていねいです。","explain_en":"「〜ても よろしいでしょうか」 is the most polite way to ask permission, used with bosses and customers.","explain_si":"「〜ても よろしいでしょうか」 යනු අවසර ඉල්ලීමේ වඩාත්ම ආචාරශීලී ක්‍රමයයි; එය ඉහළ නිලධාරීන් සහ පාරිභෝගිකයන් සමඟ භාවිත වේ.","why_wrong":["「つけて ください」 tells your boss to switch it on.","「つけましょう」 decides for everybody without asking.","「つけては いけませんか」 is an unnatural, negative way to ask permission."],"words":[{"ja":"事務所{じむしょ}","en":"office","si":"කාර්යාලය"},{"ja":"〜ても よろしいでしょうか","en":"may I ... ? (very polite)","si":"මට ... කරන්න පුළුවන්ද?"}],"why_wrong_si":["「つけて ください」 යනු ඉහළ නිලධාරියාට එය දමන්න කියා අණ කිරීමයි.","「つけましょう」 මගින් කිසිවෙකුගෙන් නොඅසා සැම වෙනුවෙන් තීරණය කරයි.","「つけては いけませんか」 යනු අවසර ඉල්ලීමට අස්වාභාවික, නිශේධනාත්මක ක්‍රමයකි."]},{"id":"KW-A2-016","level":"A2","section":"kaiwa","type":"依頼・許可・断り","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"上司{じょうし}に 「今日{きょう} 残業{ざんぎょう}できますか」と 聞{き}かれました。今日{きょう}は 病院{びょういん}の 予約{よやく}が あります。 / Your boss asks if you can work overtime today, but you have a hospital appointment.","prompt":"あなた：＿＿＿","choices":["すみません、今日{きょう}は 病院{びょういん}の 予約{よやく}が あるので、できません。あしたなら できます。","いやです。","残業{ざんぎょう}は したくないです。","いいえ、だめです。"],"answer":1,"explain_ja":"ことわる ときは、「すみません」＋「りゆう」＋「できません」の 順{じゅん}で 言{い}うと ていねいです。","explain_en":"A good refusal at work has three parts: apology, reason, and refusal — plus an alternative if you can offer one.","explain_si":"වැඩපොළක හොඳ ප්‍රතික්ෂේපයක කොටස් තුනක් තිබේ: සමාව ඉල්ලීම, හේතුව, සහ ප්‍රතික්ෂේපය — හැකි නම් විකල්පයක්ද ඊට එකතු කරන්න.","why_wrong":["「いやです」 means 'I don't want to' and is very rude to a boss.","「したくないです」 also states dislike, with no reason.","「だめです」 sounds like you are refusing your boss permission."],"words":[{"ja":"残業{ざんぎょう}","en":"overtime work","si":"අතිකාල වැඩ"},{"ja":"予約{よやく}","en":"appointment, reservation","si":"වෙන් කිරීම"}],"why_wrong_si":["「いやです」 යනු 'මට ඕන නැහැ' යන්නයි — ඉහළ නිලධාරියෙකුට එය ඉතා අගෞරව සහගතයි.","「したくないです」 ද හේතුවක් නොදී අකමැත්ත පමණක් කියයි.","「だめです」 ඔබ ඔබේ ඉහළ නිලධාරියාට අවසර දීම ප්‍රතික්ෂේප කරනවා වගේ ඇසේ."]},{"id":"KW-A2-017","level":"A2","section":"kaiwa","type":"依頼・許可・断り","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"荷物{にもつ}が 重{おも}くて 一人{ひとり}では 持{も}てません。同僚{どうりょう}に たのみます。 / The load is too heavy to carry alone, so you ask a colleague.","prompt":"あなた：＿＿＿","choices":["荷物{にもつ}を 持{も}ちましょうか。","荷物{にもつ}を 持{も}っても いいですか。","荷物{にもつ}を 持{も}たないで ください。","すみません、ちょっと 手伝{てつだ}って もらえませんか。"],"answer":4,"explain_ja":"手伝{てつだ}って ほしい ときは 「手伝{てつだ}って もらえませんか」と 言{い}います。むりを すると けがを します。","explain_en":"「手伝って もらえませんか」 asks a colleague for help. Never lift something too heavy alone — ask for help instead.","explain_si":"「手伝って もらえませんか」 මගින් සගයෙකුගෙන් උදව් ඉල්ලයි. වැඩිපුර බර දෙයක් තනිව කිසිවිටෙක නොඔසවන්න — ඒ වෙනුවට උදව් ඉල්ලන්න.","why_wrong":["「持ちましょうか」 offers to carry it FOR the colleague.","「持っても いいですか」 asks permission for you to carry it.","「持たないで ください」 tells the colleague not to carry it."],"words":[{"ja":"手伝{てつだ}います","en":"to help","si":"උදව් කරනවා"},{"ja":"重{おも}い","en":"heavy","si":"බරයි"}],"why_wrong_si":["「持ちましょうか」 යනු සගයා වෙනුවෙන් එය අරගෙන යන්නට ඉදිරිපත් වීමකි.","「持っても いいですか」 මගින් ඉල්ලන්නේ ඔබට එය අරගෙන යාමට අවසරයයි.","「持たないで ください」 මගින් සගයාට එය අරගෙන නොයන ලෙස කියයි."]},{"id":"KW-A2-018","level":"A2","section":"kaiwa","type":"敬語と丁寧さ","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"上司{じょうし}に 「これから 事務所{じむしょ}へ 行{い}く」ことを 伝{つた}えます。 / You tell your boss that you are going to the office now.","prompt":"あなた：＿＿＿","choices":["これから 事務所{じむしょ}へ いらっしゃいます。","これから 事務所{じむしょ}へ 行{い}くよ。","これから 事務所{じむしょ}へ 参{まい}ります。","これから 事務所{じむしょ}へ おいでに なります。"],"answer":3,"explain_ja":"自分{じぶん}の 動{うご}きには 「参{まい}ります」を 使{つか}います。相手{あいて}の 動{うご}きには 「いらっしゃいます」を 使{つか}います。","explain_en":"参ります is the humble form of 行きます, used for YOUR own action. いらっしゃいます and おいでになります are honorific forms for the other person's action.","explain_si":"参ります යනු 行きます හි නිහතමානී ආකාරයයි (謙譲語); එය භාවිත කරන්නේ ඔබේම ක්‍රියාව සඳහායි. いらっしゃいます සහ おいでになります යනු අනෙක් තැනැත්තාගේ ක්‍රියාවට යොදන ගෞරව ආකාරයි (尊敬語).","why_wrong":["いらっしゃいます is honorific language for someone else's action, not your own.","「行くよ」 is plain, casual speech and not acceptable to a boss.","おいでに なります is also honorific language for the other person."],"words":[{"ja":"参{まい}ります","en":"to go/come (humble)","si":"යනවා (නිහතමානී)"},{"ja":"いらっしゃいます","en":"to go/come/be (honorific)","si":"යනවා (ගෞරවනීය)"}],"why_wrong_si":["いらっしゃいます යනු අන් අයගේ ක්‍රියාවට යොදන ගෞරව භාෂාවයි, ඔබේම ක්‍රියාවට නොවේ.","「行くよ」 සරල, අවිධිමත් කථාවයි; ඉහළ නිලධාරියෙකුට එය සුදුසු නැහැ.","おいでに なります ද අනෙක් තැනැත්තා සඳහා යොදන ගෞරව භාෂාවයි."]},{"id":"KW-A2-019","level":"A2","section":"kaiwa","type":"敬語と丁寧さ","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"上司{じょうし}に 話{はなし}が あります。上司{じょうし}は 今{いま} パソコンを 使{つか}って います。 / You need to talk to your boss, who is busy at the computer.","prompt":"あなた：＿＿＿","choices":["お忙{いそが}しい ところ すみません。今{いま}、少{すこ}し よろしいでしょうか。","ねえ、ちょっと いい？","話{はなし}が あります。来{き}て ください。","今{いま}、ひまですか。"],"answer":1,"explain_ja":"いそがしい 人{ひと}に 話{はなし}しかける ときは 「お忙{いそが}しい ところ すみません」から 始{はじ}めます。","explain_en":"お忙しいところ すみません ('sorry to disturb you when you are busy') plus 今、少し よろしいでしょうか is the standard polite opening at work.","explain_si":"お忙しいところ すみません ('ඔබ කාර්යබහුල වෙලාවක බාධා කිරීම ගැන සමාවෙන්න') සමඟ 今、少し よろしいでしょうか යෙදීම වැඩපොළේ සම්මත ආචාරශීලී ආරම්භයයි.","why_wrong":["「ねえ、ちょっと いい？」 is casual speech used with friends.","「来て ください」 orders your boss to come to you.","「ひまですか」 ('are you free/idle?') sounds rude to a superior."],"words":[{"ja":"忙{いそが}しい","en":"busy","si":"කාර්යබහුලයි"},{"ja":"よろしいでしょうか","en":"would it be all right? (polite)","si":"කමක් නැද්ද?"}],"why_wrong_si":["「ねえ、ちょっと いい？」 යනු යාළුවන් සමඟ භාවිත කරන අවිධිමත් කථාවයි.","「来て ください」 යනු ඉහළ නිලධාරියාට ඔබ ළඟට එන්න කියා අණ කිරීමයි.","「ひまですか」 ('ඔබ නිකම්ද?') ඉහළ නිලධාරියෙකුට රළු ලෙස ඇසේ."]},{"id":"KW-A2-020","level":"A2","section":"kaiwa","type":"敬語と丁寧さ","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"上司{じょうし}に お茶{ちゃ}を 出{だ}します。飲{の}むか どうか 聞{き}きます。 / You are serving tea to your boss and want to ask if they would like some.","prompt":"あなた：＿＿＿","choices":["お茶{ちゃ}を 飲{の}みたいですか。","お茶{ちゃ}は いかがですか。","お茶{ちゃ}を 飲{の}め。","お茶{ちゃ}を いただきますか。"],"answer":2,"explain_ja":"目上{めうえ}の 人{ひと}に すすめる ときは 「いかがですか」を 使{つか}います。","explain_en":"いかがですか is the polite form of どうですか and the natural way to offer something to a superior or customer.","explain_si":"いかがですか යනු どうですか හි ආචාරශීලී ආකාරයයි; ඉහළ නිලධාරියෙකුට හෝ පාරිභෝගිකයෙකුට යමක් ඉදිරිපත් කිරීමේ ස්වාභාවික ක්‍රමය එයයි.","why_wrong":["「〜たいですか」 asks a superior directly about their desires and sounds impolite.","「飲め」 is a command form and is very rude.","いただきます is humble language for YOUR own action, so it cannot describe your boss drinking."],"words":[{"ja":"いかがですか","en":"how about it? would you like some? (polite)","si":"කොහොමද? ගන්නවාද?"},{"ja":"目上{めうえ}の 人{ひと}","en":"a person of higher position","si":"ඉහළ තනතුරේ අය"}],"why_wrong_si":["「〜たいですか」 මගින් ඉහළ නිලධාරියෙකුගෙන් ඔහුගේ කැමැත්ත සෘජුව අසන අතර එය අශිෂ්ට ලෙස ඇසේ.","「飲め」 අණ කිරීමේ ආකාරයයි; එය ඉතා අගෞරව සහගතයි.","いただきます යනු ඔබේම ක්‍රියාවට යොදන නිහතමානී භාෂාවයි; එනිසා ඉහළ නිලධාරියා බොන එක විස්තර කිරීමට එය භාවිත කළ නොහැකියි."]},{"id":"KW-A2-021","level":"A2","section":"kaiwa","type":"敬語と丁寧さ","scene":"ともだち","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"同{おな}じ 寮{りょう}の 友{とも}だちに 「手伝{てつだ}って ほしい」と たのみます。 / You ask a friend in the same dormitory to help you.","prompt":"あなた：＿＿＿","choices":["手伝{てつだ}って いただけないでしょうか。","ちょっと 手伝{てつだ}って くれない？","手伝{てつだ}いなさい。","お手伝{てつだ}い くださいませ。"],"answer":2,"explain_ja":"友{とも}だちには ふつうの 形{かたち}「手伝{てつだ}って くれない？」で いいです。相手{あいて}に よって 言{い}い方{かた}を かえます。","explain_en":"With a close friend the plain form 手伝って くれない？ is natural. Over-formal language to a friend sounds cold or sarcastic.","explain_si":"සමීප යාළුවෙක් සමඟ සරල ආකාරයේ 手伝って くれない？ ස්වාභාවිකයි. යාළුවෙකුට අධික විධිමත් භාෂාව සීතල ලෙස හෝ උපහාසාත්මක ලෙස ඇසේ.","why_wrong":["「いただけないでしょうか」 is very formal and is for a superior or a customer.","「〜なさい」 is an order used to a child.","「〜くださいませ」 is very formal service language used by shop staff."],"words":[{"ja":"寮{りょう}","en":"dormitory","si":"නේවාසිකාගාරය"},{"ja":"手伝{てつだ}って くれない？","en":"can you help me? (casual)","si":"උදව් කරන්න පුළුවන්ද? (සාමාන්‍ය)"}],"why_wrong_si":["「いただけないでしょうか」 ඉතා විධිමත් වන අතර එය ඉහළ නිලධාරියෙකුට හෝ පාරිභෝගිකයෙකුට යොදන එකකි.","「〜なさい」 යනු දරුවෙකුට දෙන අණකි.","「〜くださいませ」 යනු කඩ සේවකයන් භාවිත කරන ඉතා විධිමත් සේවා භාෂාවයි."]},{"id":"KW-A2-022","level":"A2","section":"kaiwa","type":"敬語と丁寧さ","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"会社{かいしゃ}の 受付{うけつけ}です。来{き}た お客{きゃく}さんの 名前{なまえ}を 聞{き}きます。 / You are at the company reception and need to ask a visitor's name.","prompt":"あなた：＿＿＿","choices":["失礼{しつれい}ですが、お名前{なまえ}を うかがっても よろしいでしょうか。","名前{なまえ}は 何{なん}ですか。","だれですか。","あなたの 名前{なまえ}を 言{い}って ください。"],"answer":1,"explain_ja":"お客{きゃく}さんに 聞{き}く ときは 「失礼{しつれい}ですが」を つけて、ていねいに 聞{き}きます。","explain_en":"失礼ですが softens a personal question, and うかがう is the humble form of 聞く. Together they are the standard reception phrase.","explain_si":"失礼ですが මගින් පෞද්ගලික ප්‍රශ්නයක් මෘදු කරයි, සහ うかがう යනු 聞く හි නිහතමානී ආකාරයයි. මේ දෙක එකට පිළිගැනීමේ කවුන්ටරයේ සම්මත වාක්‍ය ඛණ්ඩයයි.","why_wrong":["「名前は 何ですか」 is polite enough for a form but too plain for a visitor.","「だれですか」 ('who are you?') is blunt and rude.","「言って ください」 orders the visitor to state their name."],"words":[{"ja":"失礼{しつれい}ですが","en":"excuse me, but ...","si":"සමාවෙන්න, නමුත් ..."},{"ja":"伺{うかが}います","en":"to ask / to visit (humble)","si":"අහනවා (නිහතමානී)"}],"why_wrong_si":["「名前は 何ですか」 ලේඛනයක් පිරවීමට තරම් ආචාරශීලීයි, නමුත් පැමිණි අමුත්තෙකුට ඉතා සරලයි.","「だれですか」 ('ඔබ කවුද?') රළු හා අගෞරව සහගතයි.","「言って ください」 යනු අමුත්තාට තමන්ගේ නම කියන්න කියා අණ කිරීමයි."]},{"id":"KW-A2-023","level":"A2","section":"kaiwa","type":"電話と報告","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"取引先{とりひきさき}に 電話{でんわ}を かけました。相手{あいて}が 出{で}ました。はじめに 何{なん}と 言{い}いますか。 / You phone a business partner and they pick up. What do you say first?","prompt":"あなた：＿＿＿","choices":["もしもし、だれですか。","もしもし、田中{たなか}さんを お願{ねが}い。","お世話{せわ}に なって おります。カマルと 申{もう}します。田中{たなか}さんは いらっしゃいますか。","もしもし、田中{たなか}さん、いますか。"],"answer":3,"explain_ja":"仕事{しごと}の 電話{でんわ}では、まず あいさつを して、自分{じぶん}の 名前{なまえ}を 言{い}ってから、話{はな}したい 人{ひと}を 言{い}います。","explain_en":"A business call has a fixed order: greeting (お世話に なって おります), your own name (〜と 申します), then who you want (〜は いらっしゃいますか).","explain_si":"ව්‍යාපාරික දුරකථන ඇමතුමකට ස්ථිර පිළිවෙළක් තිබේ: ආචාරය (お世話に なって おります), ඉන්පසු ඔබේ නම (〜と 申します), පසුව ඔබට කථා කරන්නට අවශ්‍ය තැනැත්තා (〜は いらっしゃいますか).","why_wrong":["Asking 「だれですか」 first is rude — you should give your own name first.","「お願い」 is casual and you never say your own name.","「いますか」 is not polite enough for a business call, and again you do not give your name."],"words":[{"ja":"お世話{せわ}に なって おります","en":"thank you for your continued support (business greeting)","si":"සුපුරුදු සහයට ස්තූතියි"},{"ja":"〜と 申{もう}します","en":"my name is ... (humble)","si":"මගේ නම ..."},{"ja":"いらっしゃいますか","en":"is he/she there? (honorific)","si":"සිටිනවාද?"}],"why_wrong_si":["මුලින්ම 「だれですか」 කියා ඇසීම රළුයි — පළමුව ඔබේ නම කිව යුතුයි.","「お願い」 අවිධිමත් වන අතර ඔබ ඔබේ නම කිසිසේත් නොකියයි.","「いますか」 ව්‍යාපාරික ඇමතුමකට ප්‍රමාණවත් තරම් ආචාරශීලී නැහැ; නැවතත් ඔබ ඔබේ නම නොකියයි."]},{"id":"KW-A2-024","level":"A2","section":"kaiwa","type":"電話と報告","scene":"しごと","stem":"こんな とき、何{なん}と 言{い}いますか。","context":"作業中{さぎょうちゅう}に 3番{ばん}の 機械{きかい}が 止{と}まりました。すぐに 先輩{せんぱい}に 報告{ほうこく}します。 / Machine No. 3 has stopped during work and you report it to your senior at once.","prompt":"あなた：＿＿＿","choices":["機械{きかい}が こわれたかも しれません。あとで 見{み}て ください。","機械{きかい}は だいじょうぶです。","すみません、もう 直{なお}して おきました。","すみません、3番{ばん}の 機械{きかい}が 止{と}まりました。すぐに 見{み}て いただけませんか。"],"answer":4,"explain_ja":"トラブルの 報告{ほうこく}は 「どこが」「どう なったか」を すぐに 言{い}います。自分{じぶん}で 直{なお}しては いけません。","explain_en":"Report trouble immediately with WHICH machine and WHAT happened, then ask someone to come. Never fix machinery yourself without permission.","explain_si":"කුමන යන්ත්‍රයද, කුමක් සිදු වුණාද යන දෙක සමඟ අකරතැබ්බය වහාම වාර්තා කර, කෙනෙක් එවන ලෙස ඉල්ලන්න. අවසරයකින් තොරව යන්ත්‍ර ඔබම කිසිවිටෙක අලුත්වැඩියා නොකරන්න.","why_wrong":["「あとで 見て ください」 delays a report that must be made immediately.","「だいじょうぶです」 hides the trouble from your senior.","Repairing the machine yourself and reporting afterwards is dangerous and against workplace rules."],"words":[{"ja":"報告{ほうこく}します","en":"to report","si":"වාර්තා කරනවා"},{"ja":"止{と}まりました","en":"stopped","si":"නැවතුණා"},{"ja":"直{なお}します","en":"to fix, to repair","si":"අලුත්වැඩියා කරනවා"}],"why_wrong_si":["「あとで 見て ください」 මගින් වහාම කළ යුතු වාර්තාවක් ප්‍රමාද කරයි.","「だいじょうぶです」 මගින් අකරතැබ්බය ජ්‍යෙෂ්ඨයාගෙන් සඟවයි.","යන්ත්‍රය ඔබම අලුත්වැඩියා කර පසුව වාර්තා කිරීම අනතුරුදායක අතර වැඩපොළේ නීතිවලටද පටහැනියි."]}],"choukai":[{"id":"CK-A1-001","level":"A1","section":"choukai","type":"課題理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"工場{こうじょう}で、女{おんな}の 人{ひと}と 男{おとこ}の 人{ひと}が 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["ぼうし","手袋{てぶくろ}","かさ","くつ"],"answer":2,"explain_ja":"女{おんな}の 人{ひと}は 「ぼうしは いりません。手袋{てぶくろ}を 持{も}って きて ください」と 言{い}いました。だから 手袋{てぶくろ}です。","explain_en":"The woman first rules out the cap (ぼうしは いりません) and then gives the actual instruction: 手袋を 持って きて ください. The item that follows 持って きて ください is the answer.","explain_si":"ගැහැණු තැනැත්තිය මුලින්ම 「ぼうしは いりません」 කියා තොප්පිය අයින් කරනවා. ඊට පස්සේ ඇත්ත උපදෙස දෙනවා: 「手袋を 持って きて ください」. 「持って きて ください」 කියන කොටසට කලින් එන දෙයයි පිළිතුර — ඒ නිසා 手袋 (අත්වැසුම්) නිවැරදියි.","why_wrong":["ぼうし is mentioned but with いりません (not needed) — a classic trap where the first noun you hear is the wrong one.","かさ is never mentioned; the pair are going to a warehouse, not outside.","くつ is not mentioned at all in the conversation."],"words":[{"ja":"手袋{てぶくろ}","en":"gloves","si":"අත්වැසුම්"},{"ja":"倉庫{そうこ}","en":"warehouse","si":"ගබඩාව"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"山田{やまだ}さん、これから 倉庫{そうこ}に 行{い}きます。"},{"speaker":"M1","text":"はい。何{なに}を 持{も}って いきますか。"},{"speaker":"F1","text":"ぼうしは いりません。手袋{てぶくろ}を 持{も}って きて ください。"},{"speaker":"M1","text":"わかりました。"}],"question_ja":"男{おとこ}の 人{ひと}は 何{なに}を 持{も}って いきますか。","speed":"ゆっくり","note":"F1は先輩らしく落ち着いた声で、「ぼうしは いりません」の否定をはっきり言う。"},"why_wrong_si":["ぼうし ශබ්ද පටයේ ඇහෙනවා තමයි, නමුත් 「いりません」 (අවශ්‍ය නැහැ) කියලයි එන්නේ. මුලින්ම ඇහෙන නාම පදය නිවැරදි යැයි සිතීම මෙතැන තියෙන සාමාන්‍ය උගුලයි.","かさ ගැන කිසිම තැනක කියැවෙන්නේ නැහැ. දෙදෙනා යන්නේ 倉庫 (ගබඩාවට) මිස පිටතට නොවේ.","くつ සංවාදයේ කිසිසේත්ම සඳහන් වන්නේ නැහැ."],"track":"JFT1_P3_Q01"},{"id":"CK-A1-002","level":"A1","section":"choukai","type":"課題理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"ビルの 中{なか}で、そうじの 仕事{しごと}の 話{はなし}を して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["3階{かい}の 廊下{ろうか}","1階{かい}の トイレ","1階{かい}の 廊下{ろうか}","2階{かい}の トイレ"],"answer":4,"explain_ja":"男{おとこ}の 人{ひと}は 「今日{きょう}は 2階{かい}の トイレを そうじして ください」と 言{い}いました。廊下{ろうか}は 午後{ごご}です。","explain_en":"The instruction for now is 2階の トイレ. The 3階の 廊下 is mentioned only as something to do 午後 (in the afternoon), so it is not the current task.","explain_si":"දැන් කළ යුතු වැඩේ ලෙස කියන්නේ 「今日は 2階の トイレを 掃除して ください」 කියලයි. 3階の 廊下 ගැනත් කතා වුණත්, ඊට 「それは 午後です」 කියා පිළිතුරු දෙන නිසා එය දැන් කරන වැඩක් නොවේ.","why_wrong":["3階の 廊下 is scheduled for the afternoon (午後です), not now.","1階 is never mentioned — the floor number heard is 2階.","The 廊下 mentioned in the audio is on 3階, and it is an afternoon job, not a 1階 job now."],"words":[{"ja":"掃除{そうじ}","en":"cleaning","si":"පිරිසිදු කිරීම"},{"ja":"廊下{ろうか}","en":"corridor,
