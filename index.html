おいて くれる?」は お願{ねが}いです。「はい、すぐ やります」と 答{こた}えます。","explain_en":"コピーして おいて くれる? is a request, so the natural reply is to accept and say you will do it right away.","explain_si":"「この 書類、コピーして おいて くれる?」 කියන්නේ ඉල්ලීමක්. ඒ නිසා ස්වාභාවික පිළිතුර වන්නේ එය භාරගෙන 「はい、すぐ やります」 කියා දැන්ම කරන බව කීමයි.","why_wrong":["コピーして くれました describes a past action by someone else, not your own acceptance.","コピーが ほしいです says you want a copy, but you were asked to make one.","コピーして ください tells the senior to do it, reversing the direction of the request."],"words":[{"ja":"書類{しょるい}","en":"documents, papers","si":"ලියකියවිලි"},{"ja":"すぐ","en":"right away, immediately","si":"වහාම"}],"audio":{"instruction_ja":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","lines":[{"speaker":"F1","text":"この 書類{しょるい}、コピーして おいて くれる?"}],"question_ja":"何{なん}と 答{こた}えますか。","speed":"ふつう","note":"F1は気さくな先輩。文末を軽く上げて依頼の調子にする。"},"why_wrong_si":["「コピーして くれました」 කියන්නේ වෙන කෙනෙක් අතීතයේ කළ දෙයක් ගැනයි; ඔබ ඉල්ලීම භාරගැනීමක් නොවේ.","「コピーが ほしいです」 කියන්නේ ඔබට පිටපතක් ඕන කියන එකයි; නමුත් ඔබෙන් ඉල්ලා තියෙන්නේ පිටපතක් හදන්නයි.","「コピーして ください」 කියලා ජ්‍යෙෂ්ඨයාට ඒක කරන්න කියනවා — ඉල්ලීමේ දිශාව මාරු වෙනවා."],"track":"JFT1_P3_Q34"},{"id":"CK-A2-017","level":"A2","section":"choukai","type":"即時応答","scene":"しごと","stem":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","context":"店{みせ}で、店長{てんちょう}が あしたの シフトの ことを 聞{き}きます。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["6時{じ}に 帰{かえ}りました。","6時{じ}まで 待{ま}ちましょう。","いいえ、6時{じ}に 来{き}ました。","はい、大丈夫{だいじょうぶ}です。"],"answer":4,"explain_ja":"「来{こ}られますか」は できるか どうかを 聞{き}く ことばです。できる ときは 「はい、大丈夫{だいじょうぶ}です」と 答{こた}えます。","explain_en":"来られますか is the potential form asking whether you are able to come. The reply must be about ability, not about the past.","explain_si":"「6時に 来られますか」 කියන 来られます කියන්නේ 可能形 එකයි — 'එන්න පුළුවන්ද?' කියා හැකියාව අහන ආකෘතියයි. ඒ නිසා පිළිතුර හැකියාව ගැන විය යුතුයි, අතීතය ගැන නොවේ: 「はい、大丈夫です」.","why_wrong":["帰りました is past tense about going home, not about coming tomorrow.","待ちましょう suggests waiting together, which does not answer the question.","来ました is past tense, but the question is about tomorrow."],"words":[{"ja":"来{こ}られる","en":"to be able to come","si":"එන්න පුළුවන්"},{"ja":"大丈夫{だいじょうぶ}","en":"all right, no problem","si":"කමක් නැහැ"}],"audio":{"instruction_ja":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","lines":[{"speaker":"M1","text":"あしたの シフトですが、6時{じ}に 来{こ}られますか。"}],"question_ja":"何{なん}と 答{こた}えますか。","speed":"ふつう","note":"M1は店長。「6時に」の数字をはっきり、文末は質問の調子で上げる。"},"why_wrong_si":["「帰りました」 කියන්නේ ගෙදර ගිය එක ගැන අතීත කාලයෙන්; හෙට එන එක ගැන නොවේ.","「待ちましょう」 කියලා එකට රැඳී සිටිමු කියනවා; ප්‍රශ්නයට එය පිළිතුරක් නොවේ.","「来ました」 අතීත කාලයයි; නමුත් ප්‍රශ්නය තියෙන්නේ あした ගැනයි."],"track":"JFT1_P3_Q35"},{"id":"CK-A2-018","level":"A2","section":"choukai","type":"即時応答","scene":"びょういん","stem":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","context":"病院{びょういん}で、看護師{かんごし}が 薬{くすり}の 説明{せつめい}を します。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["いいえ、食事{しょくじ}は まだです。","はい、食事{しょくじ}を 作{つく}ります。","はい、わかりました。","いいえ、薬{くすり}は ありません。"],"answer":3,"explain_ja":"せつめいを 聞{き}いた ときは 「はい、わかりました」と 答{こた}えます。しつもんでは ないので、「いいえ」は 使{つか}いません。","explain_en":"飲んで くださいね is an instruction, not a yes/no question, so the correct response is simply to accept it: はい、わかりました.","explain_si":"「食事の あとに 飲んで くださいね」 කියන්නේ උපදෙසක් මිස はい/いいえ ප්‍රශ්නයක් නොවේ. ඒ නිසා නිවැරදි ප්‍රතිචාරය එය පිළිගැනීම පමණයි: 「はい、わかりました」.","why_wrong":["いいえ、食事は まだです answers a question about whether you have eaten, which was not asked.","食事を 作ります talks about cooking, which is unrelated to taking the medicine.","薬は ありません denies having the medicine, but the nurse is handing it over now."],"words":[{"ja":"食事{しょくじ}","en":"meal","si":"ආහාරය"},{"ja":"看護師{かんごし}","en":"nurse","si":"හෙදිය"}],"audio":{"instruction_ja":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","lines":[{"speaker":"F1","text":"お薬{くすり}は 食事{しょくじ}の あとに 飲{の}んで くださいね。"}],"question_ja":"何{なん}と 答{こた}えますか。","speed":"ふつう","note":"F1は看護師。やさしく念を押すように、文末の「ね」をやわらかく。"},"why_wrong_si":["「いいえ、食事は まだです」 කියන්නේ 'කෑවාද?' කියන ප්‍රශ්නයකට දෙන පිළිතුරක්; නමුත් ඒ ප්‍රශ්නය අහලා නැහැ.","「食事を 作ります」 කියලා කෑම හදන එක ගැන කතා කරනවා; බෙහෙත බීම සමඟ ඊට සම්බන්ධයක් නැහැ.","「薬は ありません」 කියලා බෙහෙත් නැහැ කියනවා; නමුත් හෙදිය දැන් එය දෙමින් සිටිනවා."],"track":"JFT1_P3_Q36"}],"dokkai":[{"id":"DK-A1-001","level":"A1","section":"dokkai","type":"お知らせを読む","scene":"すまい","stem":"つぎの お知{し}らせを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"りょうの みなさんへ\n\n【ゴミの 出{だ}し方{かた}】\n\nもえるゴミ　　月{げつ}よう日{び}・木{もく}よう日{び}\nもえないゴミ　水{すい}よう日{び}\n\n朝{あさ} 8時{じ}までに ゴミ置{お}き場{ば}に 出{だ}して ください。\n\nりょう 管理人{かんりにん}","prompt":"もえるゴミは いつ 出{だ}しますか。","choices":["月{げつ}よう日{び}と 木{もく}よう日{び}","水{すい}よう日{び}","月{げつ}よう日{び}だけ","毎日{まいにち}"],"answer":1,"explain_ja":"お知{し}らせに 「もえるゴミ　月{げつ}よう日{び}・木{もく}よう日{び}」と 書{か}いて あります。","explain_en":"The notice lists burnable trash (もえるゴミ) on two days: Monday and Thursday. The dot 「・」 between the days means 'and'.","explain_si":"දැන්වීමේ 「もえるゴミ　月よう日・木よう日」 යනුවෙන් සඳහන් වේ. එනම් もえるゴミ දින දෙකක් — 月よう日 සහ 木よう日 — පිටතට දැමිය යුතුය. දින දෙක අතර ඇති 「・」 තිත \"සහ\" යන අරුත දෙන නිසා, නිවැරදි පිළිතුරට දින දෙකම ඇතුළත් විය යුතුය.","why_wrong":["水曜日 (Wednesday) is the day for もえないゴミ (non-burnable trash), not burnable trash.","The notice gives two days joined by 「・」, so Monday alone is incomplete.","Only three collection days appear in total, so trash cannot be put out every day."],"words":[{"ja":"ゴミ","en":"trash, garbage","si":"කසළ"},{"ja":"出{だ}す","en":"to put out, take out","si":"පිටතට දමනවා"},{"ja":"管理人{かんりにん}","en":"building manager, caretaker","si":"නේවාසිකාගාර භාරකරු"}],"why_wrong_si":["水よう日 යනු 「もえないゴミ　水よう日」 ලෙස දක්වා ඇති, නොදැවෙන කසළ සඳහා වූ දිනයයි. එය もえるゴミ සඳහා නොවේ.","දැන්වීමේ 「・」 මගින් සම්බන්ධ කර ඇති දින දෙකක් දී ඇති නිසා, 月よう日 පමණක් තෝරා ගැනීම අසම්පූර්ණයි — 木よう日 ද අවශ්‍යයි.","දැන්වීමේ මුළුමනින්ම දක්වා ඇත්තේ කසළ රැගෙන යන දින තුනක් පමණි. එබැවින් 毎日 කසළ පිටතට දැමිය නොහැක."]},{"id":"DK-A1-002","level":"A1","section":"dokkai","type":"お知らせを読む","scene":"がっこう","stem":"つぎの お知{し}らせを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【としょかんから の お知{し}らせ】\n\n毎週{まいしゅう} 月{げつ}よう日{び}は 休{やす}みです。\n火{か}よう日{び}から 日{にち}よう日{び}までは\n午前{ごぜん} 9時{じ}から 午後{ごご} 5時{じ}まで 開{あ}いて います。\n\n本{ほん}は 2週間{しゅうかん} 借{か}りる ことが できます。","prompt":"としょかんが 休{やす}みの 日{ひ}は いつですか。","choices":["日{にち}よう日{び}","土{ど}よう日{び}","月{げつ}よう日{び}","火{か}よう日{び}"],"answer":3,"explain_ja":"「毎週{まいしゅう} 月{げつ}よう日{び}は 休{やす}みです」と 書{か}いて あります。","explain_en":"The notice says 毎週月曜日は休みです — 'It is closed every Monday.' 休み here means closed, not 'a holiday for you'.","explain_si":"දැන්වීමේ පළමු පේළියේම 「毎週 月よう日は 休みです」 යනුවෙන් ලියා ඇත. මෙහි 休み යන්නෙන් අදහස් වන්නේ \"ඔබට නිවාඩුවක්\" නොව, පුස්තකාලය වසා ඇති බවයි. එබැවින් වසා දමන දිනය 月よう日 වේ.","why_wrong":["Sunday is inside the range 火曜日〜日曜日, so the library is open then.","Saturday is also inside 火曜日〜日曜日, so it is an open day.","Tuesday is the first day of the open range, so it is not the closed day."],"words":[{"ja":"休{やす}み","en":"closed day, day off","si":"නිවාඩු දිනය"},{"ja":"開{あ}く","en":"to be open","si":"විවෘත වෙනවා"},{"ja":"借{か}りる","en":"to borrow","si":"ණයට ගන්නවා"}],"why_wrong_si":["日よう日 යනු 「火よう日から 日よう日まで」 යන විවෘත කාල පරාසය තුළට වැටෙන දිනයකි. එදින පෙ.ව. 9 සිට ප.ව. 5 දක්වා පුස්තකාලය විවෘතයි.","土よう日 ද 火よう日〜日よう日 පරාසය තුළ ඇත; එබැවින් එදිනත් පුස්තකාලය විවෘත දිනයකි.","火よう日 යනු විවෘත කාල පරාසය ආරම්භ වන පළමු දිනයයි. එබැවින් එය වසා දමන දිනය නොවේ."]},{"id":"DK-A1-003","level":"A1","section":"dokkai","type":"お知らせを読む","scene":"すまい","stem":"つぎの お知{し}らせを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【工事{こうじ}の お知{し}らせ】\n\n8月{がつ} 20日{はつか}（水{すい}）\nエレベーターの 工事{こうじ}を します。\n\nこの 日{ひ}は エレベーターを 使{つか}う ことが できません。\n階段{かいだん}を 使{つか}って ください。\n\nすみません。よろしく お願{ねが}いします。","prompt":"8月{がつ} 20日{はつか}に 上{うえ}の かいへ 行{い}く とき、どう しますか。","choices":["エレベーターを 使{つか}います","階段{かいだん}を 使{つか}います","外{そと}に 出{で}ません","会社{かいしゃ}を 休{やす}みます"],"answer":2,"explain_ja":"その 日{ひ}は エレベーターが 使{つか}えません。「階段{かいだん}を 使{つか}って ください」と 書{か}いて あります。","explain_en":"Because the elevator is under construction that day, the notice tells residents to use the stairs (階段).","explain_si":"දැන්වීමේ 「この 日は エレベーターを 使う ことが できません。階段を 使って ください」 යනුවෙන් ලියා ඇත. එනම් 8月20日 දින エレベーター හි 工事 නිසා එය භාවිත කළ නොහැක; ඉහළ මහලට යාමට 階段 (පඩිපෙළ) භාවිත කළ යුතුය.","why_wrong":["The elevator is exactly what cannot be used on 8/20 — 使うことができません.","The notice never tells people to stay inside; only the elevator is affected.","Nothing in the notice is about taking a day off from work."],"words":[{"ja":"工事{こうじ}","en":"construction work","si":"ඉදිකිරීම් වැඩ"},{"ja":"階段{かいだん}","en":"stairs","si":"පඩිපෙළ"}],"why_wrong_si":["使う ことが できません යනුවෙන් පැහැදිලිවම තහනම් කර ඇත්තේ エレベーター භාවිතයයි. එදින හරියටම භාවිත කළ නොහැක්කේ එයයි.","පිටතට නොයා සිටින්නැයි දැන්වීමේ කිසිවක් සඳහන් නොවේ; බලපෑමට ලක් වන්නේ エレベーター පමණි.","වැඩට නොගොස් 会社 නිවාඩු ගන්නා ලෙස දැන්වීමේ කිසිදු තැනක සඳහන් නොවේ."]},{"id":"DK-A1-004","level":"A1","section":"dokkai","type":"表を読む","scene":"しごと","stem":"つぎの シフト表{ひょう}を 見{み}て、質問{しつもん}に 答{こた}えて ください。","context":"TABLE\n曜日{ようび}|時間{じかん}|担当{たんとう}\n月{げつ}|9:00-17:00|グエンさん\n火{か}|13:00-21:00|サマンさん\n水{すい}|9:00-17:00|サマンさん\n木{もく}|13:00-21:00|グエンさん","prompt":"サマンさんが 9時{じ}から 働{はたら}く 日{ひ}は いつですか。","choices":["月{げつ}よう日{び}","火{か}よう日{び}","水{すい}よう日{び}","木{もく}よう日{び}"],"answer":3,"explain_ja":"水{すい}よう日{び}の ところに 「9:00-17:00　サマンさん」と 書{か}いて あります。","explain_en":"Read across the Wednesday row: the time is 9:00-17:00 and the person in charge is Saman. You must match BOTH the name and the time.","explain_si":"වගුවේ වම් පස 曜日 තීරුවෙන් දිනය සොයාගෙන, එම පේළිය දිගේ දකුණට 時間 සහ 担当 බලන්න. 水 පේළියේ 時間 = 9:00-17:00 සහ 担当 = サマンさん වේ. නම සහ වේලාව යන දෙකම එකවර ගැළපිය යුතු නිසා, පිළිතුර 水よう日 වේ.","why_wrong":["Monday starts at 9:00 but the person in charge is Nguyen, not Saman.","Saman works on Tuesday, but that shift starts at 13:00, not 9:00.","Thursday is Nguyen's shift and it starts at 13:00."],"words":[{"ja":"担当{たんとう}","en":"person in charge","si":"වගකීම දරන පුද්ගලයා"},{"ja":"働{はたら}く","en":"to work","si":"වැඩ කරනවා"}],"why_wrong_si":["月 පේළියේ වේලාව 9:00 වුවත්, 担当 තීරුවේ ඇත්තේ グエンさん මිස サマンさん නොවේ.","火 පේළියේ 担当 サマンさん වුවත්, එම මුරයේ වේලාව 13:00-21:00 වන නිසා ඔහු 9時 සිට වැඩ නොකරයි.","木 පේළියේ 担当 グエンさん වන අතර වේලාව ද 13:00 සිටය. කරුණු දෙකෙන්ම මෙය නොගැළපේ."]},{"id":"DK-A1-005","level":"A1","section":"dokkai","type":"表を読む","scene":"こうつう","stem":"つぎの バスの 時間{じかん}を 見{み}て、質問{しつもん}に 答{こた}えて ください。","context":"TABLE\nバスてい|時間{じかん}\nりょう前{まえ}|7:10\n駅{えき}前{まえ}|7:25\n工場{こうじょう}前{まえ}|7:40","prompt":"りょう前{まえ}から 工場{こうじょう}前{まえ}まで、何分{なんぷん} かかりますか。","choices":["15分{ふん}","20分{ぷん}","25分{ふん}","30分{ぷん}"],"answer":4,"explain_ja":"7時{じ}10分{ぷん}に 出{で}て、7時{じ}40分{ぷん}に 着{つ}きます。だから 30分{ぷん}です。","explain_en":"The bus leaves りょう前 at 7:10 and reaches 工場前 at 7:40, so the trip takes 30 minutes. Subtract the first time from the last time.","explain_si":"වගුවේ りょう前 = 7:10 සහ 工場前 = 7:40 ලෙස දක්වා ඇත. අවසාන වේලාවෙන් ආරම්භක වේලාව අඩු කරන්න: 7:40 − 7:10 = විනාඩි 30. එබැවින් ගමනට විනාඩි 30ක් ගතවේ.","why_wrong":["15 minutes is only りょう前 → 駅前 (7:10 to 7:25), not the whole trip.","20 minutes does not match any pair of times in the table.","25 minutes is a misreading of the 7:25 figure, which is a clock time, not a length of time."],"words":[{"ja":"工場{こうじょう}","en":"factory","si":"කර්මාන්ත ශාලාව"},{"ja":"かかる","en":"to take (time)","si":"කාලය ගත වෙනවා"}],"why_wrong_si":["විනාඩි 15 යනු りょう前 (7:10) සිට 駅前 (7:25) දක්වා පමණක් වන කාලයයි; මුළු ගමන නොවේ.","වගුවේ ඇති කිසිදු වේලා යුගලයකින් විනාඩි 20ක් ලැබෙන්නේ නැත.","25 යන්න පැමිණෙන්නේ 7:25 යන ඔරලෝසු වේලාව වැරදියට කියවීමෙනි. එය කාල ප්‍රමාණයක් නොව, 駅前 වෙත ළඟා වන වේලාවයි."]},{"id":"DK-A1-006","level":"A1","section":"dokkai","type":"メモ・伝言を読む","scene":"しごと","stem":"つぎの メモを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"田中{たなか}さんへ\n\n1時{じ}に 電話{でんわ}が ありました。\nあしたの 会議{かいぎ}は 10時{じ}からです。\n9時{じ}では ありません。\n気{き}を つけて ください。\n\nリン","prompt":"あしたの 会議{かいぎ}は 何時{なんじ}からですか。","choices":["9時{じ}","10時{じ}","11時{じ}","1時{じ}"],"answer":2,"explain_ja":"「あしたの 会議{かいぎ}は 10時{じ}からです」と 書{か}いて あります。","explain_en":"The memo states the meeting starts at 10:00 and adds 9時ではありません to correct an earlier plan.","explain_si":"මෙමෝවේ 「あしたの 会議は 10時からです。9時では ありません」 යනුවෙන් ලියා ඇත. පෙර සැලසුමේ තිබූ වේලාව නිවැරදි කරමින්, රැස්වීම 10時 සිට බව පැහැදිලිව කියා ඇත.","why_wrong":["9:00 is the old time; the memo says 9時ではありません (it is NOT 9).","11:00 does not appear anywhere in the memo.","1:00 is the time the phone call came in, not the meeting time."],"words":[{"ja":"会議{かいぎ}","en":"meeting","si":"රැස්වීම"},{"ja":"気{き}を つける","en":"to be careful","si":"පරිස්සම් වෙනවා"}],"why_wrong_si":["9時 යනු පැරණි වේලාවයි. මෙමෝවේම 「9時では ありません」 යැයි එය ප්‍රතික්ෂේප කර ඇත.","11時 යන වේලාව මෙමෝවේ කිසිම තැනක සඳහන් නොවේ.","1時 යනු 「1時に 電話が ありました」 ලෙස, දුරකථන ඇමතුම ලැබුණු වේලාවයි; රැස්වීමේ වේලාව නොවේ."]},{"id":"DK-A1-007","level":"A1","section":"dokkai","type":"メモ・伝言を読む","scene":"かいもの","stem":"つぎの メッセージを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"〈グループ　りょう 202〉\n\nサマン：今{いま}から スーパーに 行{い}きます。何{なに}か 買{か}いますか。\nカマル：たまごを おねがいします。\nサマン：わかりました。牛乳{ぎゅうにゅう}も 買{か}いますか。\nカマル：牛乳{ぎゅうにゅう}は へやに あります。だいじょうぶです。","prompt":"サマンさんは カマルさんの ために 何{なに}を 買{か}いますか。","choices":["たまご","牛乳{ぎゅうにゅう}","たまごと 牛乳{ぎゅうにゅう}","何{なに}も 買{か}いません"],"answer":1,"explain_ja":"カマルさんは 「たまごを おねがいします」と 言{い}いました。牛乳{ぎゅうにゅう}は へやに あります。","explain_en":"Kamal asks only for eggs. When milk is offered he says 部屋にあります・だいじょうぶです, which is a polite refusal.","explain_si":"カマル ඉල්ලා සිටින්නේ 「たまごを おねがいします」 කියා පමණි. 牛乳 ගැන ඇසූ විට ඔහු 「牛乳は へやに あります。だいじょうぶです」 යැයි කියයි — මෙහි だいじょうぶです යනු ආචාරශීලී ලෙස \"එපා\" කීමකි. එබැවින් サマン මිලදී ගන්නේ たまご පමණි.","why_wrong":["Milk is refused — だいじょうぶです here means 'no thank you', not 'yes'.","Only one item was requested, so both together is too many.","Kamal did request something, so 'nothing' is wrong."],"words":[{"ja":"牛乳{ぎゅうにゅう}","en":"milk","si":"කිරි"},{"ja":"買{か}う","en":"to buy","si":"මිලදී ගන්නවා"}],"why_wrong_si":["牛乳 ප්‍රතික්ෂේප කර ඇත. මෙම සන්දර්භයේ だいじょうぶです යනු \"එපා, ස්තූතියි\" යන්නයි; \"ඔව්\" නොවේ.","ඉල්ලා ඇත්තේ එක් දෙයක් පමණි. එබැවින් たまご සහ 牛乳 යන දෙකම යැයි කීම වැඩිය.","カマル たまご ඉල්ලා ඇති නිසා, \"කිසිවක් මිලදී නොගනී\" යන්න වැරදිය."]},{"id":"DK-A1-008","level":"A1","section":"dokkai","type":"メモ・伝言を読む","scene":"すまい","stem":"つぎの メモを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"カマルさんへ\n\nつくえの 上{うえ}に かぎを 置{お}きました。\n出{で}かける とき、まどを しめて ください。\nよる おそく 帰{かえ}る ときは 電話{でんわ}を ください。\n\n山田{やまだ}","prompt":"かぎは どこに ありますか。","choices":["ドアの 前{まえ}","かばんの 中{なか}","いすの 下{した}","つくえの 上{うえ}"],"answer":4,"explain_ja":"「つくえの 上{うえ}に かぎを 置{お}きました」と 書{か}いて あります。","explain_en":"つくえの上に置きました means 'I put it on the desk'. 上 = on top of.","explain_si":"මෙමෝවේ 「つくえの 上に かぎを 置きました」 යනුවෙන් ලියා ඇත. 上 යනු \"උඩ\" යන්නයි; එබැවින් යතුර තිබෙන්නේ つくえ (මේසය) උඩය.","why_wrong":["The door is only mentioned in connection with going out, not the key's place.","A bag is never mentioned in the memo.","いすの下 (under the chair) does not appear in the memo at all."],"words":[{"ja":"かぎ","en":"key","si":"යතුර"},{"ja":"置{お}く","en":"to put, place","si":"තබනවා"}],"why_wrong_si":["පිටතට යාම සම්බන්ධයෙන් කියැවෙන්නේ 「出かける とき、まどを しめて ください」 කියා පමණි. යතුර ドアの 前 ඇති බවක් සඳහන් නොවේ.","かばん යන වචනය මෙමෝවේ කිසිම තැනක නැත.","いすの 下 (පුටුව යට) යන්නද මෙමෝවේ කිසිසේත් සඳහන් වී නැත."]},{"id":"DK-A1-009","level":"A1","section":"dokkai","type":"ラベル・使い方を読む","scene":"たべもの","stem":"つぎの ラベルを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【牛乳{ぎゅうにゅう}　1000ml】\n\nしょうみきげん：8月{がつ} 22日{にち}\n\n開{あ}けたら 早{はや}く 飲{の}んで ください。\nれいぞうこ（10度{ど}いか）に 入{い}れて ください。","prompt":"この 牛乳{ぎゅうにゅう}は どこに 置{お}きますか。","choices":["まどの そば","つくえの 上{うえ}","れいぞうこの 中{なか}","おふろの 前{まえ}"],"answer":3,"explain_ja":"「れいぞうこ（10度{ど}いか）に 入{い}れて ください」と 書{か}いて あります。","explain_en":"The label says to keep it in the refrigerator at 10 degrees or below (10度いか). いか = 'or less'.","explain_si":"ලේබලයේ 「れいぞうこ（10度いか）に 入れて ください」 යනුවෙන් ලියා ඇත. いか යනු \"ට අඩු\" යන්නයි; එනම් අංශක 10ට අඩු ශීතකරණය තුළ තැබිය යුතුය.","why_wrong":["Next to a window is warm and sunny — the opposite of 10度いか.","A desk is room temperature, so the milk would spoil before 8/22.","The bathroom area is not mentioned and is also not cold."],"words":[{"ja":"牛乳{ぎゅうにゅう}","en":"milk","si":"කිරි"},{"ja":"入{い}れる","en":"to put in","si":"ඇතුළට දමනවා"}],"why_wrong_si":["まどの そば උණුසුම් හා අව්ව වදින තැනකි; එය 10度いか යන කොන්දේසියට හාත්පසින්ම විරුද්ධය.","つくえの 上 කාමර උෂ්ණත්වයේ ඇති නිසා, しょうみきげん වන 8月22日 වන තෙක් කිරි නරක් නොවී තබා ගත නොහැක.","おふろの 前 ලේබලයේ සඳහන් නොවන අතර, එයද සිසිල් තැනක් නොවේ."]},{"id":"DK-A1-010","level":"A1","section":"dokkai","type":"ラベル・使い方を読む","scene":"びょういん","stem":"つぎの くすりの 説明{せつめい}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【かぜの くすり】\n\n1日{にち} 3回{かい}\n朝{あさ}・昼{ひる}・夜{よる}、ごはんの あとに 飲{の}んで ください。\n1回{かい} 2つ です。\n\n水{みず}と いっしょに 飲{の}んで ください。","prompt":"この くすりは 1日{にち}に 何回{なんかい} 飲{の}みますか。","choices":["3回{かい}","2回{かい}","1回{かい}","4回{かい}"],"answer":1,"explain_ja":"「1日{にち} 3回{かい}」「朝{あさ}・昼{ひる}・夜{よる}」と 書{か}いて あります。","explain_en":"1日3回 means three times a day, and the three times are listed: morning, noon and night.","explain_si":"ලේබලයේ 「1日 3回」 යනුවෙන් ලියා ඇති අතර, එම අවස්ථා තුන 「朝・昼・夜」 ලෙස වෙන වෙනම දක්වා ඇත. එබැවින් දිනකට 3回 බෙහෙත ගත යුතුය.","why_wrong":["2 is the number of tablets per dose (1回2つ), not the number of doses.","1回 refers to one single dose, not to the whole day.","4 times does not match 朝・昼・夜, which is only three occasions."],"words":[{"ja":"くすり","en":"medicine","si":"බෙහෙත"},{"ja":"1日{にち} 3回{かい}","en":"three times a day","si":"දිනකට තුන් වරක්"}],"why_wrong_si":["2 යනු 「1回 2つ」 — එක් වරකට ගන්නා පෙති ගණනයි; දිනකට ගන්නා වාර ගණන නොවේ.","1回 යනුවෙන් අදහස් වන්නේ එක් වතාවක් පමණි; එය මුළු දවසේ වාර ගණන නොවේ.","朝・昼・夜 යනු අවස්ථා තුනක් පමණි; එබැවින් 4回 යන්න ලේබලයට නොගැළපේ."]},{"id":"DK-A1-011","level":"A1","section":"dokkai","type":"説明文を読む","scene":"すまい","stem":"つぎの 文{ぶん}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【りょうの ルール】\n\n1. よる 10時{じ}から あさ 7時{じ}までは しずかに して ください。\n2. へやの 中{なか}で たばこを すわないで ください。\n3. ともだちを りょうに とめないで ください。","prompt":"りょうの へやで しては いけない ことは 何{なん}ですか。","choices":["ごはんを 食{た}べる こと","たばこを すう こと","そうじを する こと","テレビを 見{み}る こと"],"answer":2,"explain_ja":"「へやの 中{なか}で たばこを すわないで ください」と 書{か}いて あります。","explain_en":"〜ないでください is a prohibition. Rule 2 forbids smoking inside the room.","explain_si":"〜ないで ください යනු තහනමක් ප්‍රකාශ කරන ආකෘතියයි. නීති අංක 2හි 「へやの 中で たばこを すわないで ください」 යනුවෙන් ලියා ඇති නිසා, කාමරය තුළ දුම් පානය කිරීම තහනම්ය.","why_wrong":["Eating is never mentioned in the three rules.","Cleaning is not forbidden anywhere in the rules.","Watching TV is allowed; only the noise rule after 10 p.m. applies."],"words":[{"ja":"ルール","en":"rule","si":"නීතිය"},{"ja":"たばこを すう","en":"to smoke","si":"දුම් බොනවා"}],"why_wrong_si":["ごはんを 食べる こと ගැන නීති තුනේ කිසිම තැනක සඳහන් නොවේ.","そうじを する こと නීතිවල කිසිදු තැනක තහනම් කර නැත.","テレビを 見る こと අවසර ඇති දෙයකි; නීති අංක 1න් කියැවෙන්නේ රාත්‍රී 10時 සිට උදෑසන 7時 දක්වා නිශ්ශබ්දව සිටිය යුතු බව පමණි."]},{"id":"DK-A1-012","level":"A1","section":"dokkai","type":"メールを読む","scene":"しごと","stem":"つぎの メールを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"サマンさん\n\nメール ありがとう ございます。\n電車{でんしゃ}が おくれて いるんですね。\n\n今日{きょう}の しごとは 10時{じ}から 始{はじ}めて ください。\n会社{かいしゃ}に 着{つ}いたら、はじめに 事務所{じむしょ}に 来{き}て ください。\n\n山田{やまだ}","prompt":"サマンさんは 会社{かいしゃ}に 着{つ}いたら、はじめに どこへ 行{い}きますか。","choices":["工場{こうじょう}","食堂{しょくどう}","駅{えき}","事務所{じむしょ}"],"answer":4,"explain_ja":"「はじめに 事務所{じむしょ}に 来{き}て ください」と 書{か}いて あります。","explain_en":"はじめに means 'first of all'. Yamada asks Saman to come to the office (事務所) before anything else.","explain_si":"මේලයේ 「会社に 着いたら、はじめに 事務所に 来て ください」 යනුවෙන් ලියා ඇත. はじめに යනු \"මුලින්ම\" යන්නයි; එබැවින් サマン සමාගමට පැමිණි විගස පළමුව යා යුත්තේ 事務所 වෙතය.","why_wrong":["The factory floor is where work starts at 10:00, but not the first stop.","The cafeteria is not mentioned in the mail.","The station is where Saman is now, not where he goes after arriving."],"words":[{"ja":"事務所{じむしょ}","en":"office","si":"කාර්යාලය"},{"ja":"着{つ}く","en":"to arrive","si":"ළඟා වෙනවා"}],"why_wrong_si":["工場 යනු 10時から වැඩ ආරම්භ වන තැන වුවත්, පැමිණි විගස මුලින්ම යා යුතු තැන නොවේ.","食堂 මේලයේ කිසිම තැනක සඳහන් නොවේ.","駅 යනු 電車が おくれて いる නිසා දැන් サマン සිටින තැනයි; සමාගමට පැමිණි පසු යන තැන නොවේ."]},{"id":"DK-A2-001","level":"A2","section":"dokkai","type":"お知らせを読む","scene":"きんきゅう","stem":"つぎの お知{し}らせを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【避難訓練{ひなんくんれん}の お知{し}らせ】\n\n日時{にちじ}：9月{がつ} 5日{いつか}（金{きん}） 午後{ごご} 2時{じ}30分{ぷん}〜3時{じ}\n場所{ばしょ}：工場{こうじょう}の 前{まえ}の 駐車場{ちゅうしゃじょう}\n\nベルが 鳴{な}ったら、すぐに 仕事{しごと}を やめて、ヘルメットを かぶって 外{そと}に 出{で}て ください。\nエレベーターは 使{つか}わないで、階段{かいだん}を 使{つか}って ください。\nにもつは 持{も}たないで ください。\n\n安全{あんぜん}管理{かんり}チーム","prompt":"ベルが 鳴{な}ったら、はじめに 何{なに}を しますか。","choices":["エレベーターに 乗{の}って 下{した}へ 行{い}く","仕事{しごと}を やめて ヘルメットを かぶる","駐車場{ちゅうしゃじょう}で 車{くるま}を 動{うご}かす","安全{あんぜん}管理{かんり}チームに 電話{でんわ}する"],"answer":2,"explain_ja":"「ベルが 鳴{な}ったら、すぐに 仕事{しごと}を やめて、ヘルメットを かぶって 外{そと}に 出{で}て ください」と 書{か}いて あります。","explain_en":"The sequence in the notice is: stop work → put on a helmet → go outside. So the first action is stopping work and putting the helmet on.","explain_si":"දැන්වීමේ 「ベルが 鳴ったら、すぐに 仕事を やめて、ヘルメットを かぶって 外に 出て ください」 යනුවෙන් අනුපිළිවෙළ දක්වා ඇත: වැඩ නැවැත්වීම → ヘルメット පැළඳීම → පිටතට යාම. එබැවින් මුලින්ම කළ යුත්තේ වැඩ නවතා හිස්වැසුම පැළඳීමයි.","why_wrong":["The notice explicitly says エレベーターは使わないで — do not use the elevator; use the stairs.","The parking lot is only the gathering place; nothing says to move cars.","The safety team wrote the notice; no phone call is requested during the drill."],"words":[{"ja":"避難訓練{ひなんくんれん}","en":"evacuation drill","si":"ආපදා පුහුණුව"},{"ja":"鳴{な}る","en":"to ring, sound","si":"නාද වෙනවා"},{"ja":"駐車場{ちゅうしゃじょう}","en":"parking lot","si":"වාහන නැවැත්වීමේ ස්ථානය"}],"why_wrong_si":["දැන්වීමේ පැහැදිලිවම 「エレベーターは 使わないで、階段を 使って ください」 යැයි ලියා ඇත. ලිෆ්ට් එක වෙනුවට පඩිපෙළ භාවිත කළ යුතුය.","駐車場 යනු එක්රැස් වන 場所 පමණි; එහි වාහන ගෙන යන ලෙස කිසිවක් සඳහන් නොවේ.","安全管理チーム යනු දැන්වීම නිකුත් කළ අය වන අතර, පුහුණුව අතරතුර ඔවුන්ට දුරකථනයෙන් කතා කරන ලෙස ඉල්ලා නැත."]},{"id":"DK-A2-002","level":"A2","section":"dokkai","type":"お知らせを読む","scene":"すまい","stem":"つぎの お知{し}らせを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【断水{だんすい}の お知{し}らせ】\n\n水道{すいどう}の 工事{こうじ}の ため、下{した}の 時間{じかん}は 水{みず}が 出{で}ません。\n\n日{ひ}　　：8月{がつ} 28日{にち}（木{もく}）\n時間{じかん}：午前{ごぜん} 9時{じ}〜午後{ごご} 1時{じ}\n\nこの 日{ひ}の 朝{あさ}、ペットボトルなどに 水{みず}を ためて おいて ください。\nおふろは 午後{ごご} 2時{じ}から 使{つか}えます。\n\nりょう 管理人{かんりにん}","prompt":"この お知{し}らせから わかる ことは 何{なん}ですか。","choices":["8月{がつ} 28日{にち}は 一日中{いちにちじゅう} 水{みず}が 出{で}ない","水{みず}を ためては いけない","おふろは 午後{ごご} 1時{じ}から 使{つか}える","水{みず}が 出{で}ない 時間{じかん}は 4時間{じかん}である"],"answer":4,"explain_ja":"午前{ごぜん} 9時{じ}から 午後{ごご} 1時{じ}までですから、4時間{じかん} 水{みず}が 出{で}ません。","explain_en":"9:00 a.m. to 1:00 p.m. is a four-hour period, so the water is off for four hours.","explain_si":"දැන්වීමේ 「時間：午前 9時〜午後 1時」 යනුවෙන් ලියා ඇත. පෙ.ව. 9 සිට ප.ව. 1 (13時) දක්වා පැය 4කි. එබැවින් ජලය නොලැබෙන කාලය පැය 4ක් බව දැන්වීමෙන් තහවුරු වේ.","why_wrong":["The water is off only from 9:00 to 13:00, not for the whole day.","Storing water is exactly what the notice recommends (水をためておいてください).","The bath becomes usable at 2 p.m., not 1 p.m., even though the water returns at 1 p.m."],"words":[{"ja":"断水{だんすい}","en":"water outage","si":"ජල කප්පාදුව"},{"ja":"ためる","en":"to store up","si":"එකතු කර තබනවා"}],"why_wrong_si":["ජලය නවතින්නේ 9時〜13時 අතර පමණි; 一日中 නොවේ.","「水を ためて おいて ください」 යනුවෙන් දැන්වීමේම ඉල්ලා ඇත්තේ ජලය ගබඩා කර තබා ගන්නා ලෙසය; එය තහනමක් නොවේ.","「おふろは 午後 2時から 使えます」 යැයි ලියා ඇත. ජලය 午後 1時ට නැවත ආවත්, නාන කාමරය භාවිත කළ හැක්කේ ප.ව. 2 සිටය."]},{"id":"DK-A2-003","level":"A2","section":"dokkai","type":"お知らせを読む","scene":"やくしょ","stem":"つぎの お知{し}らせを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【市役所{しやくしょ}　外国人{がいこくじん}相談{そうだん}まどぐち】\n\n受付{うけつけ}時間{じかん}\n月{げつ}〜金{きん}　午前{ごぜん} 8時{じ}30分{ぷん}〜午後{ごご} 5時{じ}15分{ふん}\n　※ 12時{じ}〜1時{じ}は 昼{ひる}休{やす}みです。\n第{だい}2土{ど}よう日{び}　午前中{ごぜんちゅう}だけ 受付{うけつけ}を します。\n日{にち}よう日{び}・祝日{しゅくじつ}は 休{やす}みです。\n\n通訳{つうやく}が 必要{ひつよう}な 方{かた}は、前{まえ}の 日{ひ}までに 電話{でんわ}して ください。","prompt":"この まどぐちに ついて、正{ただ}しい ものは どれですか。","choices":["第{だい}2土{ど}よう日{び}の 午前中{ごぜんちゅう}は 相談{そうだん}できる","毎日{まいにち} 12時{じ}から 相談{そうだん}できる","日{にち}よう日{び}も 午後{ごご} 5時{じ}まで 開{あ}いて いる","通訳{つうやく}は その日{ひ}に 頼{たの}めば すぐ 来{く}る"],"answer":1,"explain_ja":"「第{だい}2土{ど}よう日{び}　午前中{ごぜんちゅう}だけ 受付{うけつけ}を します」と 書{か}いて あります。","explain_en":"The second Saturday of the month is open, but only in the morning (午前中だけ). 第2 means 'the 2nd (of the month)'.","explain_si":"දැන්වීමේ 「第2土よう日　午前中だけ 受付を します」 යනුවෙන් ලියා ඇත. 第2 යනු මාසයේ දෙවැනි යන්නයි; එබැවින් දෙවන 土よう日 දින 午前中 (පෙරවරුවේ) පමණක් උපදෙස් ලබා ගත හැක.","why_wrong":["12:00 to 1:00 is the lunch break (昼休み), so that is when service stops.","Sundays and public holidays are closed — 日曜日・祝日は休みです.","Interpreters must be booked by phone the day before (前の日までに), not on the same day."],"words":[{"ja":"受付{うけつけ}","en":"reception, service hours","si":"පිළිගැනීම"},{"ja":"通訳{つうやく}","en":"interpreter","si":"පරිවර්තක"},{"ja":"祝日{しゅくじつ}","en":"public holiday","si":"රජයේ නිවාඩු දිනය"}],"why_wrong_si":["「12時〜1時は 昼休みです」 ලෙස සඳහන් වන පරිදි එය දිවා විවේකයයි; එවේලේ සේවය නතර වේ.","「日よう日・祝日は 休みです」 යනුවෙන් පැහැදිලිව ලියා ඇත. එදිනවල කවුළුව වසා ඇත.","「通訳が 必要な 方は、前の 日までに 電話して ください」 යැයි ලියා ඇත. එබැවින් එදිනම ඉල්ලා පරිවර්තකයෙකු ලබා ගත නොහැක; කලින් දින දුරකථනයෙන් වෙන් කර ගත යුතුය."]},{"id":"DK-A2-004","level":"A2","section":"dokkai","type":"表を読む","scene":"しごと","stem":"つぎの シフト表{ひょう}を 見{み}て、質問{しつもん}に 答{こた}えて ください。","context":"TABLE\n日{ひ}|早番{はやばん} 7:00-15:00|遅番{おそばん} 14:00-22:00\n9/1（月{げつ}）|サマン|グエン\n9/2（火{か}）|グエン|カマル\n9/3（水{すい}）|カマル|サマン\n9/4（木{もく}）|サマン|グエン","prompt":"サマンさんが 夜{よる} 10時{じ}まで 働{はたら}く 日{ひ}は いつですか。","choices":["9月{がつ} 1日{ついたち}","9月{がつ} 2日{ふつか}","9月{がつ} 3日{みっか}","9月{がつ} 4日{よっか}"],"answer":3,"explain_ja":"夜{よる} 10時{じ}まで 働{はたら}くのは 遅番{おそばん}です。サマンさんの 遅番{おそばん}は 9月{がつ} 3日{みっか}です。","explain_en":"22:00 equals 10 p.m., which is the 遅番 (late shift) column. Saman's name appears in that column only on 9/3.","explain_si":"රාත්‍රී 10時 යනු 22:00 වන අතර, එය වගුවේ 「遅番 14:00-22:00」 තීරුවට අයත් වේ. එම තීරුව උඩ සිට පහළට කියවන විට サマン යන නම දිස් වන්නේ 9/3（水）පේළියේ පමණි. එබැවින් පිළිතුර 9月3日 වේ.","why_wrong":["On 9/1 Saman is on the 早番 shift, which finishes at 15:00.","On 9/2 Saman does not appear in either column.","On 9/4 Saman is again on 早番; Nguyen has the late shift."],"words":[{"ja":"早番{はやばん}","en":"early shift","si":"උදෑසන මුරය"},{"ja":"遅番{おそばん}","en":"late shift","si":"සවස් මුරය"}],"why_wrong_si":["9/1 පේළියේ サマン සිටින්නේ 早番 තීරුවේය; එම මුරය අවසන් වන්නේ 15:00ටය.","9/2 පේළියේ තීරු දෙකෙන් කිසිවකම サマン යන නම නැත — එහි ඇත්තේ グエン සහ カマル පමණි.","9/4 දිනද サマン සිටින්නේ 早番 තීරුවේය; එදින 遅番 බාරව සිටින්නේ グエン ය."]},{"id":"DK-A2-005","level":"A2","section":"dokkai","type":"表を読む","scene":"しごと","stem":"つぎの 予定表{よていひょう}を 見{み}て、質問{しつもん}に 答{こた}えて ください。","context":"TABLE\n時間{じかん}|内容{ないよう}|場所{ばしょ}\n9:00-9:30|あいさつ・説明{せつめい}|会議室{かいぎしつ}A\n9:30-11:00|安全{あんぜん}の ビデオ|会議室{かいぎしつ}A\n11:00-12:00|工場{こうじょう}の 見学{けんがく}|1階{かい}\n12:00-13:00|昼{ひる}ごはん|食堂{しょくどう}\n13:00-15:00|きかいの 使{つか}い方{かた}|2階{かい}","prompt":"工場{こうじょう}の 見学{けんがく}の あと、次{つぎ}に する ことは 何{なん}ですか。","choices":["安全{あんぜん}の ビデオを 見{み}る","きかいの 使{つか}い方{かた}を 習{なら}う","会議室{かいぎしつ}Aで 説明{せつめい}を 聞{き}く","食堂{しょくどう}で 昼{ひる}ごはんを 食{た}べる"],"answer":4,"explain_ja":"見学{けんがく}は 12時{じ}に 終{お}わります。その 次{つぎ}は 12時{じ}からの 昼{ひる}ごはんです。","explain_en":"The tour ends at 12:00 and the very next row on the schedule is lunch in the cafeteria from 12:00.","explain_si":"වගුවේ 「11:00-12:00　工場の 見学」 පේළියෙන් පසුව එන ඊළඟ පේළිය 「12:00-13:00　昼ごはん　食堂」 වේ. චාරිකාව 12:00ට අවසන් වී එම මොහොතේම දිවා ආහාරය ආරම්භ වන නිසා, ඊළඟට කරන්නේ 食堂 හි දිවා ආහාරය ගැනීමයි.","why_wrong":["The safety video is at 9:30-11:00, before the tour, not after.","Learning to use the machines is at 13:00, which comes after lunch, not immediately after the tour.","The explanation in meeting room A is the very first item of the day at 9:00."],"words":[{"ja":"見学{けんがく}","en":"observation tour, factory visit","si":"නිරීක්ෂණ චාරිකාව"},{"ja":"内容{ないよう}","en":"content, what is done","si":"අන්තර්ගතය"}],"why_wrong_si":["安全の ビデオ ඇත්තේ 9:30-11:00 පේළියේය — එනම් චාරිකාවට පෙරය, පසුව නොවේ.","きかいの 使い方 ඇත්තේ 13:00-15:00 හිය. එය දිවා ආහාරයෙන් පසුව මිස, චාරිකාවෙන් වහාම පසුව නොවේ.","会議室Aහි 説明 යනු 9:00-9:30, එනම් දවසේ මුල්ම වැඩසටහනයි."]},{"id":"DK-A2-006","level":"A2","section":"dokkai","type":"表を読む","scene":"こうつう","stem":"つぎの 電車{でんしゃ}の 時刻表{じこくひょう}を 見{み}て、質問{しつもん}に 答{こた}えて ください。","context":"TABLE\n電車{でんしゃ}|北駅{きたえき} 発{はつ}|中央駅{ちゅうおうえき} 着{ちゃく}|南駅{みなみえき} 着{ちゃく}\n普通{ふつう}|6:40|7:05|7:20\n快速{かいそく}|6:55|7:10|7:18\n普通{ふつう}|7:10|7:35|7:50","prompt":"南駅{みなみえき}に 7時{じ}25分{ふん}までに 着{つ}きたいです。北駅{きたえき}で 乗{の}る ことが できる 電車{でんしゃ}は いくつ ありますか。","choices":["2つ","1つ","3つ","ありません"],"answer":1,"explain_ja":"6時{じ}40分{ぷん}の 普通{ふつう}（7時{じ}20分{ぷん}着{ちゃく}）と 6時{じ}55分{ふん}の 快速{かいそく}（7時{じ}18分{ふん}着{ちゃく}）の 2つです。","explain_en":"Look only at the 南駅着 column. 7:20 and 7:18 are both before 7:25, so two trains work; the 7:50 arrival is too late.","explain_si":"මෙහිදී බැලිය යුත්තේ 「南駅 着」 තීරුව පමණි. එහි ඇති වේලාවන් තුන 7:20, 7:18 සහ 7:50 ය. 7時25分ට පෙර ළඟා වන්නේ 7:20 (普通) සහ 7:18 (快速) යන දුම්රිය දෙක පමණි; 7:50 ප්‍රමාද වැඩිය. එබැවින් පිළිතුර 2つ වේ.","why_wrong":["Counting only the 快速 misses the 6:40 普通, which also arrives in time at 7:20.","All three cannot work because the last train reaches 南駅 at 7:50, after the deadline.","At least one train does arrive before 7:25, so 'none' is wrong."],"words":[{"ja":"快速{かいそく}","en":"rapid train","si":"වේගවත් දුම්රිය"},{"ja":"時刻表{じこくひょう}","en":"timetable","si":"කාලසටහන"}],"why_wrong_si":["快速 පමණක් ගණන් කළහොත්, 南駅ට 7:20ට ළඟා වන 6:40 普通 දුම්රිය අතහැරෙයි. එබැවින් 1つ යනු අඩුවෙන් ගණන් කිරීමකි.","තුනම නොගැළපේ; අවසාන දුම්රිය 南駅ට ළඟා වන්නේ 7:50ට, එනම් නියමිත වේලාවෙන් පසුවය.","අවම වශයෙන් එක් දුම්රියක්වත් 7:25ට පෙර ළඟා වන නිසා, \"ありません\" යන්න වැරදිය."]},{"id":"DK-A2-007","level":"A2","section":"dokkai","type":"メモ・伝言を読む","scene":"しごと","stem":"つぎの でんごんメモを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【でんごんメモ】\n\nグエンさんへ\n\n10時{じ}20分{ぷん}に、はけん会社{がいしゃ}の 佐藤{さとう}さんから 電話{でんわ}が ありました。\n来月{らいげつ}の 契約{けいやく}の 書類{しょるい}に はんこが ないそうです。\n今日{きょう}の 5時{じ}までに 電話{でんわ}して ほしいと 言{い}って いました。\n電話{でんわ}番号{ばんごう}は 名刺{めいし}に 書{か}いて あります。\n\n受{う}けた 人{ひと}：カマル","prompt":"グエンさんは 何{なに}を しなければ なりませんか。","choices":["佐藤{さとう}さんの 会社{かいしゃ}へ 行{い}く","今日{きょう}の 5時{じ}までに 佐藤{さとう}さんに 電話{でんわ}する","カマルさんに 書類{しょるい}を わたす","来月{らいげつ} 新{あたら}しい 書類{しょるい}を 書{か}く"],"answer":2,"explain_ja":"「今日{きょう}の 5時{じ}までに 電話{でんわ}して ほしい」と 佐藤{さとう}さんが 言{い}って いました。","explain_en":"〜てほしいと言っていました reports Sato's request: call back by 5 o'clock today. That is Nguyen's required action.","explain_si":"මෙමෝවේ 「今日の 5時までに 電話して ほしいと 言って いました」 යනුවෙන් ලියා ඇත. 〜て ほしいと 言って いました යනු අනෙකාගේ ඉල්ලීම වාර්තා කරන ආකෘතියයි. එබැවින් グエン කළ යුත්තේ අද ප.ව. 5ට පෙර 佐藤さん වෙත දුරකථනයෙන් කතා කිරීමයි.","why_wrong":["The memo asks for a phone call, not a visit to Sato's company.","Kamal only took the message; no document is passed to him.","The seal (はんこ) is missing from the existing document; a new document is not requested."],"words":[{"ja":"契約{けいやく}","en":"contract","si":"ගිවිසුම"},{"ja":"書類{しょるい}","en":"documents, paperwork","si":"ලේඛන"},{"ja":"はんこ","en":"personal seal, stamp","si":"මුද්‍රාව"}],"why_wrong_si":["මෙමෝවෙන් ඉල්ලා ඇත්තේ 電話 කිරීමයි; 佐藤さんの 会社 වෙත යන ලෙස කියා නැත.","カマル යනු 「受けた 人」 — ඇමතුම බාරගත් තැනැත්තා පමණි. ඔහුට 書類 භාර දෙන ලෙස කිසිවක් සඳහන් නොවේ.","ගැටලුව නම් දැනට ඇති 書類 හි はんこ නොමැති වීමයි. අලුත් ලියවිල්ලක් ලියන ලෙස ඉල්ලා නැත."]},{"id":"DK-A2-008","level":"A2","section":"dokkai","type":"メモ・伝言を読む","scene":"ともだち","stem":"つぎの メッセージを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"〈トーク：カマル〉\n\nカマル：おつかれさま。今日{きょう}の 飲{の}み会{かい}、6時{じ}半{はん}に 駅{えき}の 東口{ひがしぐち}で いい？\nサマン：ごめん、今日{きょう}は 仕事{しごと}が 7時{じ}に 終{お}わる。\nカマル：じゃあ、先{さき}に 店{みせ}に 行{い}って いるね。「さくら」と いう 店{みせ}で、駅{えき}から 歩{ある}いて 5分{ふん}だよ。\nサマン：わかった。仕事{しごと}が 終{お}わったら 連絡{れんらく}する。","prompt":"サマンさんは この あと どう しますか。","choices":["6時{じ}半{はん}に 駅{えき}の 東口{ひがしぐち}へ 行{い}く","駅{えき}で カマルさんを 待{ま}つ","仕事{しごと}の あとで 店{みせ}へ 行{い}く","今日{きょう}は 飲{の}み会{かい}に 行{い}かない"],"answer":3,"explain_ja":"カマルさんは 先{さき}に 店{みせ}へ 行{い}きます。サマンさんは 仕事{しごと}が 終{お}わってから 店{みせ}へ 行{い}きます。","explain_en":"The meeting plan changes: Kamal will go ahead to the restaurant (先に店に行っている), so Saman joins him there after work.","explain_si":"සැලසුම වෙනස් වේ: サマン 「今日は 仕事が 7時に 終わる」 කී පසු カマル 「じゃあ、先に 店に 行って いるね」 යැයි කියයි. එබැවින් サマン වැඩ අවසන් වූ පසු කෙළින්ම 「さくら」 නම් 店 වෙත යයි.","why_wrong":["6:30 at the east exit was the first plan, which was cancelled because Saman finishes at 7:00.","Kamal will not be at the station; he goes straight to the restaurant.","Saman says わかった and promises to contact Kamal, so he is still joining."],"words":[{"ja":"飲{の}み会{かい}","en":"drinking party, get-together","si":"සාද රැස්වීම"},{"ja":"連絡{れんらく}する","en":"to get in touch","si":"සම්බන්ධ වෙනවා"}],"why_wrong_si":["6時半に 駅の 東口 යනු මුල් සැලසුමයි. සමන්ගේ වැඩ 7時ට අවසන් වන නිසා එය අත්හැරිණි.","カマル 駅 හි රැඳී නොසිටී; ඔහු කලින්ම කෙළින්ම 店 වෙත යයි.","サマン 「わかった。仕事が 終わったら 連絡する」 යැයි කියන නිසා, ඔහු 飲み会 එකට එක් වන බව පැහැදිලිය."]},{"id":"DK-A2-009","level":"A2","section":"dokkai","type":"ラベル・使い方を読む","scene":"しごと","stem":"つぎの 説明{せつめい}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【そうじ用{よう} せんざい】\n\n使{つか}い方{かた}\n1. 水{みず}で 20倍{ばい}に うすめて ください。\n2. ゴム手{て}ぶくろを して ください。\n3. まどを 開{あ}けて 使{つか}って ください。\n\n※ ほかの せんざいと まぜないで ください。あぶない ガスが 出{で}ます。\n※ 子{こ}どもの 手{て}の とどかない ところに 置{お}いて ください。","prompt":"この せんざいを 使{つか}う とき、しては いけない ことは 何{なん}ですか。","choices":["ほかの せんざいと まぜる","水{みず}で うすめる","ゴム手{て}ぶくろを する","まどを 開{あ}ける"],"answer":1,"explain_ja":"「ほかの せんざいと まぜないで ください。あぶない ガスが 出{で}ます」と 書{か}いて あります。","explain_en":"まぜないでください is a prohibition, and the reason is given: mixing produces dangerous gas.","explain_si":"ලේබලයේ 「ほかの せんざいと まぜないで ください。あぶない ガスが 出ます」 යනුවෙන් ලියා ඇත. 〜ないで ください යනු තහනමකි; හේතුවද දී ඇත — මිශ්‍ර කිරීමෙන් අනතුරුදායක වායුවක් නිකුත් වේ.","why_wrong":["Diluting with water 20 times is step 1 — it is required, not forbidden.","Wearing rubber gloves is step 2, a safety instruction to follow.","Opening the window is step 3, also something you must do."],"words":[{"ja":"うすめる","en":"to dilute","si":"තනුක කරනවා"},{"ja":"まぜる","en":"to mix","si":"මිශ්‍ර කරනවා"},{"ja":"手{て}ぶくろ","en":"gloves","si":"අත්වැසුම්"}],"why_wrong_si":["「水で 20倍に うすめて ください」 යනු 1වන පියවරයි — එය අනිවාර්යයෙන් කළ යුතු දෙයක් මිස තහනමක් නොවේ.","ゴム手ぶくろ පැළඳීම 2වන පියවර වන ආරක්ෂක උපදෙසකි; අනුගමනය කළ යුතුය.","まどを 開ける යනු 3වන පියවරයි; එයද කළ යුතු දෙයකි."]},{"id":"DK-A2-010","level":"A2","section":"dokkai","type":"ラベル・使い方を読む","scene":"びょういん","stem":"つぎの くすりの 説明{せつめい}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【頭痛{ずつう}の くすり】\n\n大人{おとな}（15歳{さい}以上{いじょう}）：1回{かい} 2じょう、1日{にち} 3回{かい}まで\n食事{しょくじ}の あとに 水{みず}か ぬるま湯{ゆ}で 飲{の}んで ください。\n次{つぎ}に 飲{の}む ときは、4時間{じかん}以上{いじょう} あけて ください。\n\n※ おさけと いっしょに 飲{の}まないで ください。\n※ 5日{いつか} 飲{の}んでも よく ならない ときは、医者{いしゃ}に 相談{そうだん}して ください。","prompt":"この くすりに ついて、正{ただ}しい ものは どれですか。","choices":["1日{にち}に 8じょう 飲{の}んでも いい","おさけと いっしょに 飲{の}んでも いい","2時間{じかん}に 1回{かい} 飲{の}んでも いい","1回{かい}に 飲{の}むのは 2じょうまでである"],"answer":4,"explain_ja":"「1回{かい} 2じょう」と 書{か}いて あります。1回{かい}に 3じょう 飲{の}んでは いけません。","explain_en":"1回2錠 sets the dose per time at two tablets. With a maximum of three doses a day, the daily limit is six tablets.","explain_si":"ලේබලයේ 「1回 2じょう、1日 3回まで」 යනුවෙන් ලියා ඇත. එනම් එක් වරකට ගත හැක්කේ පෙති 2ක් පමණි; දිනකට උපරිම වාර 3ක් වන නිසා දිනකට උපරිමය පෙති 6කි. එබැවින් \"වරකට ගන්නේ 2じょう දක්වා පමණි\" යන්න නිවැරදිය.","why_wrong":["2 tablets × 3 times a day is a maximum of 6 tablets, so 8 exceeds the limit.","The label says おさけといっしょに飲まないでください — never with alcohol.","Doses must be at least 4 hours apart (4時間以上あけて), so 2 hours is too soon."],"words":[{"ja":"頭痛{ずつう}","en":"headache","si":"හිසරදය"},{"ja":"以上{いじょう}","en":"or more, at least","si":"හෝ ඊට වැඩි"},{"ja":"食事{しょくじ}","en":"meal","si":"ආහාර වේල"}],"why_wrong_si":["වරකට 2 බැගින් වාර 3ක් = උපරිම පෙති 6කි. එබැවින් දිනකට 8じょう යනු සීමාව ඉක්මවීමකි.","ලේබලයේ 「おさけと いっしょに 飲まないで ください」 යැයි පැහැදිලිව තහනම් කර ඇත.","「4時間以上 あけて ください」 යැයි ලියා ඇති නිසා, පැය 2කින් නැවත ගැනීම ඉතා ඉක්මන්ය."]},{"id":"DK-A2-011","level":"A2","section":"dokkai","type":"説明文を読む","scene":"しごと","stem":"つぎの 説明{せつめい}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【給料{きゅうりょう}明細{めいさい}の 見{み}方{かた}】\n\n・基本給{きほんきゅう}…1か月{げつ} 働{はたら}いて もらう 基本{きほん}の お金{かね}です。\n・残業{ざんぎょう}手当{てあて}…決{き}められた 時間{じかん}より 多{おお}く 働{はたら}いた ぶんの お金{かね}です。\n・控除{こうじょ}…税金{ぜいきん}や 保険{ほけん}など、給料{きゅうりょう}から ひかれる お金{かね}です。\n・差引{さしひき}支給額{しきゅうがく}…実際{じっさい}に 銀行{ぎんこう}に ふりこまれる お金{かね}です。","prompt":"実際{じっさい}に 銀行{ぎんこう}に 入{はい}る お金{かね}は どれですか。","choices":["基本給{きほんきゅう}","残業{ざんぎょう}手当{てあて}","差引{さしひき}支給額{しきゅうがく}","控除{こうじょ}"],"answer":3,"explain_ja":"「差引{さしひき}支給額{しきゅうがく}…実際{じっさい}に 銀行{ぎんこう}に ふりこまれる お金{かね}です」と 書{か}いて あります。","explain_en":"差引支給額 is the take-home pay actually transferred to your bank account, after 控除 (deductions) are subtracted.","explain_si":"ලැයිස්තුවේ 「差引支給額…実際に 銀行に ふりこまれる お金です」 යනුවෙන් සෘජුවම ලියා ඇත. එනම් 控除 (අඩුකිරීම්) අඩු කළ පසු, සැබවින්ම බැංකු ගිණුමට බැර වන මුදල එයයි.","why_wrong":["基本給 is the base pay before overtime is added and before deductions are taken.","残業手当 is only the overtime portion, one part of the total.","控除 is the money taken OUT of your pay, so it never reaches your account."],"words":[{"ja":"給料{きゅうりょう}明細{めいさい}","en":"pay slip","si":"වැටුප් විස්තර පත්‍රය"},{"ja":"控除{こうじょ}","en":"deduction","si":"අඩු කිරීම්"},{"ja":"残業{ざんぎょう}","en":"overtime work","si":"අතිකාල වැඩ"}],"why_wrong_si":["基本給 යනු 残業手当 එකතු කිරීමට හා අඩුකිරීම් ගැනීමට පෙර ඇති මූලික මුදලයි.","残業手当 යනු අතිකාලයට අදාළ කොටස පමණි — මුළු මුදලේ එක් අංගයක් පමණි.","控除 යනු 税金 හා 保険 වැනි, වැටුපෙන් අඩු කරන මුදලයි. එය කිසිසේත් ගිණුමට බැර නොවේ."]},{"id":"DK-A2-012","level":"A2","section":"dokkai","type":"説明文を読む","scene":"しごと","stem":"つぎの 説明{せつめい}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【休{やす}みを とる ときの ルール】\n\n休{やす}みたい 日{ひ}の 1週間{しゅうかん}前{まえ}までに、休暇届{きゅうかとどけ}を リーダーに 出{だ}して ください。\n\n急{きゅう}な 病気{びょうき}の ときは、朝{あさ} 7時{じ}30分{ぷん}までに 会社{かいしゃ}に 電話{でんわ}して ください。メールや メッセージでは なく、必{かなら}ず 電話{でんわ}で お願{ねが}いします。\n病院{びょういん}へ 行{い}った ときは、あとで 病院{びょういん}の 紙{かみ}を 出{だ}して ください。","prompt":"急{きゅう}に 熱{ねつ}が 出{で}て、今日{きょう} 休{やす}みたいです。どう しますか。","choices":["1週間{しゅうかん}前{まえ}に 休暇届{きゅうかとどけ}を 出{だ}す","朝{あさ} 7時{じ}30分{ぷん}までに 会社{かいしゃ}に 電話{でんわ}する","リーダーに メッセージを 送{おく}る","会社{かいしゃ}に 行{い}ってから 説明{せつめい}する"],"answer":2,"explain_ja":"急{きゅう}な 病気{びょうき}の ときは、朝{あさ} 7時{じ}30分{ぷん}までに 電話{でんわ}を します。","explain_en":"The one-week rule is for planned leave. For a sudden illness (急な病気), you must phone the company by 7:30 a.m.","explain_si":"1週間前 නීතිය අදාළ වන්නේ කලින් සැලසුම් කළ නිවාඩු සඳහාය. නීතියේ 「急な 病気の ときは、朝 7時30分までに 会社に 電話して ください」 යැයි ලියා ඇත. එබැවින් හදිසියේ උණ ආ විට කළ යුත්තේ උදෑසන 7時30分ට පෙර සමාගමට දුරකථනයෙන් දැනුම් දීමයි.","why_wrong":["Submitting a leave form a week ahead is impossible for a sudden fever; that rule covers planned days off.","The rule says メールやメッセージではなく — a message is explicitly not acceptable.","You must contact the company before 7:30 a.m., not explain after going in."],"words":[{"ja":"休暇届{きゅうかとどけ}","en":"leave request form","si":"නිවාඩු අයදුම්පත"},{"ja":"急{きゅう}な","en":"sudden","si":"හදිසි"},{"ja":"必{かなら}ず","en":"without fail, always","si":"අනිවාර්යයෙන්"}],"why_wrong_si":["හදිසි උණකදී සතියකට පෙර 休暇届 ඉදිරිපත් කළ නොහැක; එම නීතිය අදාළ වන්නේ කලින් සැලසුම් කළ නිවාඩුවලටය.","නීතියේම 「メールや メッセージでは なく、必ず 電話で」 යැයි ලියා ඇත. පණිවුඩයක් යැවීම පිළිගත නොහැක.","උදෑසන 7時30分ට පෙර සමාගමට දැනුම් දිය යුතුය; වැඩට ගොස් පසුව පැහැදිලි කිරීම නීතියට අනුකූල නොවේ."]},{"id":"DK-A2-013","level":"A2","section":"dokkai","type":"説明文を読む","scene":"すまい","stem":"つぎの 規則{きそく}を 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【寮{りょう}の 規則{きそく}】\n\n1. 玄関{げんかん}の かぎは 夜{よる} 11時{じ}に 閉{し}まります。おそく なる ときは、前{まえ}の 日{ひ}までに 管理人{かんりにん}に 言{い}って ください。\n2. 自転車{じてんしゃ}は 決{き}められた 場所{ばしょ}に とめて ください。\n3. ゴミは 分{わ}けて、朝{あさ} 8時{じ}までに ゴミ置{お}き場{ば}に 出{だ}して ください。\n4. 部屋{へや}を 出{で}る ときは、エアコンと 電気{でんき}を 消{け}して ください。","prompt":"この 規則{きそく}に 合{あ}って いる ものは どれですか。","choices":["自転車{じてんしゃ}は 玄関{げんかん}の 前{まえ}に とめる","ゴミは 分{わ}けなくても いい","夜{よる} 11時{じ}を すぎる ときも 何{なに}も 言{い}わなくて いい","部屋{へや}を 出{で}る 前{まえ}に エアコンを 消{け}す"],"answer":4,"explain_ja":"「部屋{へや}を 出{で}る ときは、エアコンと 電気{でんき}を 消{け}して ください」と 書{か}いて あります。","explain_en":"Rule 4 requires turning off both the air conditioner and the lights when leaving the room, so choice 4 matches the rules.","explain_si":"නීති අංක 4හි 「部屋を 出る ときは、エアコンと 電気を 消して ください」 යැයි ලියා ඇත. එබැවින් කාමරයෙන් පිටවීමට පෙර エアコン නිවා දැමීම නීතියට හරියටම ගැළපේ.","why_wrong":["Rule 2 says bicycles go in the designated place, not in front of the entrance.","Rule 3 requires separating the trash (ゴミは分けて).","Rule 1 requires telling the caretaker in advance if you will be late."],"words":[{"ja":"規則{きそく}","en":"rules, regulations","si":"නීති රීති"},{"ja":"消{け}す","en":"to turn off","si":"නිවා දමනවා"},{"ja":"分{わ}ける","en":"to separate, sort","si":"වෙන් කරනවා"}],"why_wrong_si":["නීති අංක 2 අනුව 自転車 තැබිය යුත්තේ 「決められた 場所」 හිය; 玄関の 前 නොවේ.","නීති අංක 3හි 「ゴミは 分けて」 යැයි ඇති නිසා, කසළ වර්ග කර වෙන් කිරීම අනිවාර්යයි.","නීති අංක 1 අනුව රාත්‍රී 11時 පසු වන විට 「前の 日までに 管理人に 言って ください」 — කලින්ම දැනුම් දිය යුතුය."]},{"id":"DK-A2-014","level":"A2","section":"dokkai","type":"説明文を読む","scene":"しごと","stem":"つぎの 決{き}まりを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"【工場{こうじょう}に 入{はい}る ときの 決{き}まり】\n\n・作業服{さぎょうふく}と 安全靴{あんぜんぐつ}を 着{き}て ください。\n・工場{こうじょう}の 中{なか}では、いつも ヘルメットを かぶって ください。\n・食{た}べ物{もの}や 飲{の}み物{もの}を 持{も}って 入{はい}らないで ください。飲{の}み物{もの}は 休憩室{きゅうけいしつ}で 飲{の}んで ください。\n・スマートフォンは ロッカーに 入{い}れて ください。","prompt":"仕事{しごと}の とちゅうで 飲{の}み物{もの}が 飲{の}みたく なりました。どう しますか。","choices":["休憩室{きゅうけいしつ}へ 行{い}って 飲{の}む","ロッカーの 前{まえ}で 飲{の}む","ヘルメットを とって 工場{こうじょう}の 中{なか}で 飲{の}む","作業服{さぎょうふく}の ポケットに 入{い}れて おく"],"answer":1,"explain_ja":"「飲{の}み物{もの}は 休憩室{きゅうけいしつ}で 飲{の}んで ください」と 書{か}いて あります。","explain_en":"Drinks may not be brought onto the factory floor; the rules designate the break room (休憩室) as the place to drink.","explain_si":"නීතිවල 「食べ物や 飲み物を 持って 入らないで ください。飲み物は 休憩室で 飲んで ください」 යැයි ලියා ඇත. එබැවින් වැඩ අතරතුර බීමක් අවශ්‍ය වූ විට 休憩室 වෙත ගොස් එහිදී පානය කළ යුතුය.","why_wrong":["The lockers are for phones; the rules name the break room as the drinking place.","Removing the helmet breaks the rule いつもヘルメットをかぶってください.","Carrying a drink in your pocket still means bringing it into the factory, which is forbidden."],"words":[{"ja":"作業服{さぎょうふく}","en":"work clothes, uniform","si":"වැඩ ඇඳුම"},{"ja":"安全靴{あんぜんぐつ}","en":"safety shoes","si":"ආරක්ෂිත සපත්තු"},{"ja":"休憩室{きゅうけいしつ}","en":"break room","si":"විවේක කාමරය"}],"why_wrong_si":["ロッカー යනු スマートフォン තැබීමට ඇති තැනයි. නීතියෙන් බීම පානය කිරීම සඳහා නම් කර ඇත්තේ 休憩室 ය.","ヘルメット ඉවත් කිරීම 「いつも ヘルメットを かぶって ください」 යන නීතිය කැඩීමකි.","作業服の ポケット තුළ බීමක් තබා ගැනීමද, එය කර්මාන්තශාලාව තුළට රැගෙන ඒමකි — එය තහනම්ය."]},{"id":"DK-A2-015","level":"A2","section":"dokkai","type":"メールを読む","scene":"しごと","stem":"つぎの メールを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"件名{けんめい}：8月{がつ} 30日{にち}の 休{やす}みに ついて\n\n山田{やまだ}リーダー\n\nおつかれさまです。サマンです。\n8月{がつ} 30日{にち}（土{ど}）に、国{くに}から 家族{かぞく}が 来{き}ます。空港{くうこう}まで むかえに 行{い}きたいので、その 日{ひ} 休{やす}みを いただけないでしょうか。\n休暇届{きゅうかとどけ}は 今日{きょう}の 午後{ごご}、事務所{じむしょ}に 出{だ}します。\nその 日{ひ}の 私{わたし}の 仕事{しごと}は、グエンさんが 代{か}わって くれると 言{い}って います。\n\nよろしく お願{ねが}いします。\nサマン","prompt":"サマンさんが この メールで いちばん 言{い}いたい ことは 何{なん}ですか。","choices":["グエンさんの 仕事{しごと}を 代{か}わりたい","8月{がつ} 30日{にち}に 休{やす}みを とりたい","空港{くうこう}まで 車{くるま}で 送{おく}って ほしい","休暇届{きゅうかとどけ}の 書{か}き方{かた}を 教{おし}えて ほしい"],"answer":2,"explain_ja":"「その 日{ひ} 休{やす}みを いただけないでしょうか」が いちばん 言{い}いたい ことです。","explain_en":"〜をいただけないでしょうか is a polite request. The core message is asking for the day off on August 30.","explain_si":"මේලයේ 「その 日 休みを いただけないでしょうか」 යැයි ලියා ඇත. 〜を いただけないでしょうか යනු ඉතා ආචාරශීලී ඉල්ලීමකි. එබැවින් サマン මෙම මේලයෙන් ප්‍රධාන වශයෙන් කියන්නේ 8月30日 දින නිවාඩුවක් අවශ්‍ය බවයි.","why_wrong":["It is Nguyen who will cover for Saman, not the other way around.","Saman will go to the airport himself; he does not ask for a ride.","He already knows how to file the leave form — he says he will submit it this afternoon."],"words":[{"ja":"空港{くうこう}","en":"airport","si":"ගුවන් තොටුපළ"},{"ja":"むかえに 行{い}く","en":"to go and meet/pick up","si":"පිළිගැනීමට යනවා"},{"ja":"代{か}わる","en":"to substitute, cover for","si":"වෙනුවට කරනවා"}],"why_wrong_si":["වැඩ බාරගන්නේ グエンさん ය — 「グエンさんが 代わって くれる」. සමන් අනෙකාගේ වැඩ බාරගන්නේ නැත.","サマン 空港 වෙත යන්නේ තමාමය (むかえに 行きたい); කිසිවෙකුගෙන් රථයක් ඉල්ලා නැත.","休暇届 ලිවීම ඔහු දනී — 「今日の 午後、事務所に 出します」 යැයි කියා ඇත. එබැවින් ලිවීමේ ක්‍රමය උගන්වන ලෙස ඉල්ලා නැත."]},{"id":"DK-A2-016","level":"A2","section":"dokkai","type":"メールを読む","scene":"こうつう","stem":"つぎの メールを 読{よ}んで、質問{しつもん}に 答{こた}えて ください。","context":"件名{けんめい}：Re: おくれます\n\nカマルさん\n\n連絡{れんらく} ありがとう ございます。\n事故{じこ}で 電車{でんしゃ}が 止{と}まって いるんですね。あわてなくて 大丈夫{だいじょうぶ}です。\n\n今日{きょう}の 午前中{ごぜんちゅう}の そうじは、私{わたし}が 代{か}わりに やって おきます。\n会社{かいしゃ}に 着{つ}いたら、駅{えき}で もらう 「遅延{ちえん}証明書{しょうめいしょ}」を 事務所{じむしょ}に 出{だ}して ください。それが あれば、給料{きゅうりょう}は ひかれません。\n\n田中{たなか}","prompt":"カマルさんは 会社{かいしゃ}に 着{つ}いたら、何{なに}を しますか。","choices":["午前中{ごぜんちゅう}の そうじを する","田中{たなか}さんに 電話{でんわ}を する","遅延{ちえん}証明書{しょうめいしょ}を 事務所{じむしょ}に 出{だ}す","給料{きゅうりょう}の 計算{けいさん}を する"],"answer":3,"explain_ja":"「会社{かいしゃ}に 着{つ}いたら、遅延{ちえん}証明書{しょうめいしょ}を 事務所{じむしょ}に 出{だ}して ください」と 書{か}いて あります。","explain_en":"A 遅延証明書 is a delay certificate handed out at the station. Tanaka asks Kamal to submit it to the office so his pay is not reduced.","explain_si":"遅延証明書 යනු දුම්රිය ප්‍රමාදය සනාථ කරමින් 駅 එකෙන් ලබා දෙන සහතිකයයි. මේලයේ 「会社に 着いたら、「遅延証明書」を 事務所に 出して ください。それが あれば、給料は ひかれません」 යැයි ලියා ඇත. එබැවින් カマル සමාගමට පැමිණි පසු එය 事務所 වෙත භාර දිය යුතුය.","why_wrong":["Tanaka says he will do the morning cleaning himself (私が代わりにやっておきます).","Kamal has already contacted the company by mail; no phone call is requested.","Calculating salary is the office's job, not Kamal's."],"words":[{"ja":"遅延{ちえん}証明書{しょうめいしょ}","en":"train delay certificate","si":"ප්‍රමාද වීමේ සහතිකය"},{"ja":"事故{じこ}","en":"accident","si":"අනතුර"},{"ja":"代{か}わりに","en":"instead, in place of","si":"වෙනුවට"}],"why_wrong_si":["田中さん 「私が 代わりに やって おきます」 යැයි කියා ඇති නිසා, 午前中の そうじ ඔහු විසින්ම කරයි.","カマル දැනටමත් මේලයෙන් සමාගමට දැනුම් දී ඇත (連絡 ありがとう); දුරකථනයෙන් කතා කරන ලෙස ඉල්ලා නැත.","給料の 計算 යනු 事務所 හි කාර්යයයි; カマル කළ යුතු දෙයක් නොවේ."]}]},"mock":[{"id":"MT-01","level":"A1","section":"moji","type":"漢字{かんじ}の 読{よ}み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"あしたは <u>休{やす}み<\/u>です。工場{こうじょう}へ 行{い}きません。","choices":["やずみ","はすみ","やすみ","やすび"],"answer":3,"explain_ja":"「休{やす}み」は 「やすみ」と よみます。しごとが ない 日{ひ}の ことです。","explain_en":"休み is read yasumi and means a day off. The kun-reading of 休 is yasu, plus the okurigana み.","explain_si":"「休{やす}み」 කියවෙන්නේ 「やすみ」 කියලා. එහි තේරුම වැඩ නැති දවස, එනම් නිවාඩුව. 休 කියන කන්ජියේ කුන් කියවීම (訓読み) 「やす」 වන අතර, ඊට පසුව එන 「み」 කියන්නේ おくりがな. ඊළඟ වතාවේත් මේ ආකාරයේ ප්‍රශ්නයක් ආවොත් කන්ජිය තනිව නොව おくりがな සමඟ එකට බලා කියවීම තෝරන්න.","why_wrong":["やずみ voices the す; 休み has a clear unvoiced す.","はすみ misreads 休 as は — its kun-reading here is やす.","やすび mixes 休み up with 日 read び; the word ends in み."],"words":[{"ja":"休{やす}み","en":"day off, holiday","si":"නිවාඩුව"}],"why_wrong_si":["「やずみ」 — す නාද කර ず කර තිබෙනවා. 「休み」 හි එය පැහැදිලිවම නාද නොවන す ලෙසම කියවෙනවා.","「はすみ」 — 休 「は」 ලෙස වැරදියට කියවා තිබෙනවා. මෙතැනදී එහි කුන් කියවීම 「やす」.","「やすび」 — 「休み」 සහ 日 (「び」) පටලවා ගෙන තිබෙනවා. වචනය අවසන් වන්නේ 「み」 කියලා."]},{"id":"MT-02","level":"A1","section":"moji","type":"カタカナ","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"工場{こうじょう}に 入{はい}る ときは ＿＿＿を かぶって ください。","choices":["ヘルメット","ヘルメツト","ヘルメト","ヘルメッド"],"answer":1,"explain_ja":"あたまに かぶる ものは 「ヘルメット」です。小{ちい}さい 「ッ」を わすれないで ください。","explain_en":"The correct katakana spelling is ヘルメット (helmet), with a small ッ before ト.","explain_si":"නිවැරදි කටකානා අක්ෂර වින්‍යාසය 「ヘルメット」 (helmet). ト ට කලින් කුඩා 「ッ」 එනවා — එය නවතින ද්විත්ව ව්‍යාංජන ශබ්දය පෙන්වන අකුරයි. කටකානා අක්ෂර වින්‍යාස ප්‍රශ්නවලදී මුලින්ම කුඩා 「ッ」「ャ・ュ・ョ」 සහ දිග ස්වර 「ー」 තියෙනවාද කියා පරීක්ෂා කරන්න.","why_wrong":["ヘルメツト uses a full-size ツ; the double consonant needs the small ッ.","ヘルメト drops the small ッ completely, so the sound is too short.","ヘルメッド voices the last sound; the word ends in ト, not ド."],"words":[{"ja":"ヘルメット","en":"helmet","si":"ආරක්ෂිත හිස්වැසුම"},{"ja":"工場{こうじょう}","en":"factory","si":"කර්මාන්ත ශාලාව"}],"why_wrong_si":["「ヘルメツト」 — ලොකු 「ツ」 පාවිච්චි කර තිබෙනවා; ද්විත්ව ව්‍යාංජනයට අවශ්‍ය වන්නේ කුඩා 「ッ」.","「ヘルメト」 — කුඩා 「ッ」 මුළුමනින්ම නැති නිසා ශබ්දය කෙටි වැඩියි.","「ヘルメッド」 — අවසන් අකුර නාද කර 「ド」 කර තිබෙනවා; වචනය අවසන් වන්නේ 「ト」 වලින්."]},{"id":"MT-03","level":"A1","section":"moji","type":"漢字{かんじ}の 読{よ}み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"しごとは <u>八時{はちじ}<\/u>から です。","choices":["はっじ","やじ","はついじ","はちじ"],"answer":4,"explain_ja":"「八時{はちじ}」は 「はちじ」と よみます。時間{じかん}を 言{い}う ときの 八{はち}は 「はち」です。","explain_en":"八時 is read hachi-ji. For clock times, 八 keeps its full on-reading はち.","explain_si":"「八時」 කියවෙන්නේ 「はちじ」 කියලා. වේලාව කියන විට 八 එහි සම්පූර්ණ ඔන් කියවීම වන 「はち」 එලෙසම තබා ගන්නවා. 時 සමඟ එන අංක වල කියවීම් (一時 いちじ, 四時 よじ, 七時 しちじ, 九時 くじ) එකට කට පාඩම් කර ගැනීම වඩාත් සුදුසුයි.","why_wrong":["はっじ shortens 八 to はっ, which happens with some counters but not with 時.","やじ uses the kun-reading や of 八; clock times use the on-reading.","はついじ adds an extra い that does not exist in this word."],"words":[{"ja":"八時{はちじ}","en":"eight o'clock","si":"අට"}],"why_wrong_si":["「はっじ」 — 八 「はっ」 ලෙස කෙටි කර තිබෙනවා. එය සමහර ගණන් කිරීමේ ප්‍රත්‍යයන් සමඟ සිදු වුවත් 時 සමඟ සිදු වන්නේ නැහැ.","「やじ」 — 八 හි කුන් කියවීම වන 「や」 පාවිච්චි කර තිබෙනවා; වේලාවට ඕන ඔන් කියවීමයි.","「はついじ」 — මේ වචනයේ නැති අමතර 「い」 එකක් එකතු කර තිබෙනවා."]},{"id":"MT-04","level":"A1","section":"moji","type":"ことばの いみ","scene":"かいもの","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"コンビニで 水{みず}を 150円{ひゃくごじゅうえん}で ＿＿＿。","choices":["のみます","かいます","ききます","みます"],"answer":2,"explain_ja":"「150円{ひゃくごじゅうえん}で」は ねだんです。お金{かね}を はらって 手{て}に 入{い}れる ことは 「買{か}います」です。","explain_en":"150円で marks a price, so the verb must be 買います (to buy).","explain_si":"「150円で」 කියන්නෙන් මිලක් පෙන්වන නිසා, ඊට ගැළපෙන ක්‍රියා පදය 「買{か}います」 (මිලදී ගන්නවා) පමණයි. 「〜円で + ක්‍රියාව」 ආකාරය දුටු විට, මුදල් ගෙවීමට සම්බන්ධ ක්‍රියාවක්ද කියා මුලින්ම බලන්න.","why_wrong":["のみます (to drink) does not go with a price marked by で.","ききます means to listen or to ask; you cannot do that to water.","みます means to look at, which has nothing to do with paying money."],"words":[{"ja":"買{か}います","en":"to buy","si":"මිලදී ගන්නවා"}],"why_wrong_si":["「のみます」 (බොනවා) — 「で」 වලින් සලකුණු කළ මිලක් සමඟ එකට යන්නේ නැහැ.","「ききます」 කියන්නේ අහනවා / විමසනවා යන්නයි; වතුරට එහෙම කරන්න බැහැ.","「みます」 කියන්නේ බලනවා යන්නයි, මුදල් ගෙවීම සමඟ කිසි සම්බන්ධයක් නැහැ."]},{"id":"MT-05","level":"A1","section":"moji","type":"ことばの いみ","scene":"びょういん","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"きのうから ＿＿＿が いたいです。びょういんへ 行{い}きます。","choices":["あたま","くすり","びょうき","ねつ"],"answer":1,"explain_ja":"「〜が いたいです」の 前{まえ}には、からだの ところが 入{はい}ります。「頭{あたま}が いたいです」と 言{い}います。","explain_en":"「〜が いたいです」 needs a body part, so あたま (head) is the only possible word.","explain_si":"「〜が いたいです」 කියන ආකෘතියට ඉස්සරහින් ඕන වන්නේ ශරීර කොටසක නමක්. එම නිසා මෙතැනට ගැළපෙන්නේ 「あたま」 (හිස) පමණයි. 「いたい」 දුටු විට, විකල්ප අතරින් ශරීර කොටස් නම් පමණක් වෙන් කර ගන්න.","why_wrong":["くすり (medicine) is not a body part, so it cannot hurt.","びょうき is a condition and is said as 病気です, not 病気がいたいです.","ねつ goes with 熱があります (to have a fever), not with いたい."],"words":[{"ja":"頭{あたま}","en":"head","si":"හිස"},{"ja":"痛{いた}い","en":"painful, sore","si":"රිදෙනවා"}],"why_wrong_si":["「くすり」 (බෙහෙත) ශරීර කොටසක් නොවන නිසා රිදෙන්න බැහැ.","「びょうき」 කියන්නේ තත්ත්වයක්; එය 「病気です」 කියා කියනවා මිස 「病気がいたいです」 කියා කියන්නේ නැහැ.","「ねつ」 සමඟ යන්නේ 「熱があります」 (උණයි) මිස 「いたい」 නොවෙයි."]},{"id":"MT-06","level":"A2","section":"moji","type":"漢字{かんじ}の 読{よ}み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"この <u>作業{さぎょう}<\/u>は 二人{ふたり}で して ください。","choices":["さくぎょう","さぎょ","さぎょう","さくごう"],"answer":3,"explain_ja":"「作業{さぎょう}」は 「さぎょう」と よみます。しごとの ないようの ことです。","explain_en":"作業 is read sagyō. 作 is shortened to さ before 業, and 業 has a long vowel ぎょう.","explain_si":"「作業」 කියවෙන්නේ 「さぎょう」 කියලා. 業 ට ඉස්සරහින් එන විට 作 「さく」 නොව 「さ」 ලෙස කෙටි වෙනවා; 業 හි කියවීම දිග ස්වරය සහිත 「ぎょう」. සංයුක්ත කන්ජි වචනවලදී දිග ස්වරය (ー / う) තියෙනවාද කියා විශේෂයෙන් පරීක්ෂා කරන්න.","why_wrong":["さくぎょう keeps the full reading さく of 作; before 業 it becomes さ.","さぎょ drops the long vowel — 業 is ぎょう, not ぎょ.","さくごう misreads 業 as ごう and keeps さく as well."],"words":[{"ja":"作業{さぎょう}","en":"work, operation, task","si":"කාර්යය"}],"why_wrong_si":["「さくぎょう」 — 作 හි සම්පූර්ණ කියවීම 「さく」 එලෙසම තබා තිබෙනවා; 業 ට ඉස්සරහින් එය 「さ」 වෙනවා.","「さぎょ」 — දිග ස්වරය අත් හැරලා; 業 කියවෙන්නේ 「ぎょ」 නොව 「ぎょう」 කියලා.","「さくごう」 — 業 「ごう」 ලෙස වැරදියට කියවා, 「さく」 ත් එලෙසම තබා තිබෙනවා."]},{"id":"MT-07","level":"A2","section":"moji","type":"漢字{かんじ}の 書{か}き方{かた}","scene":"しごと","stem":"＿＿の ことばは かんじで どう かきますか。","context":null,"prompt":"きょうは <u>ざんぎょう<\/u>が 二時間{にじかん} あります。","choices":["参業","残業","残行","賛業"],"answer":2,"explain_ja":"「ざんぎょう」は 「残業{ざんぎょう}」と 書{か}きます。きめられた 時間{じかん}の あとの しごとです。","explain_en":"残業 (overtime) uses 残 'to remain' plus 業 'work'.","explain_si":"「ざんぎょう」 ලියන්නේ 「残業」 කියලා — 残 (ඉතිරි වෙනවා) + 業 (වැඩ). කන්ජි ලිවීමේ ප්‍රශ්නවලදී එකම ශබ්දය දෙන කන්ජි (参・賛・残) අතරින් තෝරන්නට වන නිසා, ශබ්දය පමණක් නොව අර්ථයත් ගැළපෙනවාද කියා බලන්න.","why_wrong":["参業 uses 参 (to take part), which is read さん but is the wrong kanji.","残行 has the correct 残 but 行 means 'to go', not 'work'.","賛業 uses 賛 (approval), a different kanji also read さん."],"words":[{"ja":"残業{ざんぎょう}","en":"overtime work","si":"අතිකාල වැඩ"}],"why_wrong_si":["「参業」 — 参 (සහභාගී වෙනවා) 「さん」 ලෙස කියවුණත් මෙතැනට වැරදි කන්ජියයි.","「残行」 — 残 නිවැරදියි, නමුත් 行 කියන්නේ 'යනවා' මිස 'වැඩ' නොවෙයි.","「賛業」 — 賛 (අනුමැතිය) ද 「さん」 ලෙස කියවෙන වෙනස් කන්ජියක්."]},{"id":"MT-08","level":"A2","section":"moji","type":"ことばの いみ","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"利用者{りようしゃ}さんが 乗{の}って います。車{くるま}いすを ゆっくり ＿＿＿ ください。","choices":["あけて","つけて","しめて","おして"],"answer":4,"explain_ja":"車{くるま}いすは 後{うし}ろから 「押{お}します」。ゆっくり 押{お}すと あんぜんです。","explain_en":"A wheelchair is moved by pushing it, so 押して is correct.","explain_si":"රෝද පුටුවක් ඉදිරියට ගෙන යන්නේ තල්ලු කිරීමෙන් නිසා නිවැරදි ක්‍රියාව 「押{お}して」. එහි 利用者さん වාඩි වී සිටින නිසා 「ゆっくり」 (හෙමින්) කියන වචනයත් ඉඟියක් — රැකවරණ (介護) ක්ෂේත්‍රයේ වචන එකට මතක තබා ගන්න.","why_wrong":["あけて (to open) is used for doors and windows, not a wheelchair.","つけて (to switch on) is used for lights and machines.","しめて (to close) is also for doors and windows."],"words":[{"ja":"車{くるま}いす","en":"wheelchair","si":"රෝද පුටුව"},{"ja":"押{お}す","en":"to push","si":"තල්ලු කරනවා"}],"why_wrong_si":["「あけて」 (අරිනවා) පාවිච්චි කරන්නේ දොර, ජනේල වලට මිස රෝද පුටුවකට නොවෙයි.","「つけて」 (දල්වනවා / ක්‍රියාත්මක කරනවා) පාවිච්චි වන්නේ ලයිට්, යන්ත්‍ර වලට.","「しめて」 (වහනවා) ද දොර සහ ජනේල සඳහායි."]},{"id":"MT-09","level":"A2","section":"moji","type":"ふくしの つかい方{かた}","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"この 機械{きかい}は ＿＿＿ さわらないで ください。あぶないです。","choices":["ぜったいに","ときどき","だいたい","そろそろ"],"answer":1,"explain_ja":"あぶない ことを つよく 止{と}める ときは 「絶対{ぜったい}に 〜ないで ください」と 言{い}います。","explain_en":"絶対に means 'absolutely / under no circumstances' and is the natural adverb for a strong safety prohibition.","explain_si":"「絶対{ぜったい}に」 කියන්නේ 'කිසිසේත්ම, කවර හේතුවකටවත්' යන්නයි. 「〜ないでください」 කියන දැඩි තහනමක් සමඟ ස්වාභාවිකවම යන ක්‍රියා විශේෂණය එයයි. ආරක්ෂාව ගැන දැඩි තහනමක් තිබෙන වාක්‍යයක 「絶対に」「必ず」 වැනි වචන එනවා යැයි සිතන්න.","why_wrong":["ときどき (sometimes) would allow touching part of the time, which is unsafe.","だいたい (roughly, mostly) cannot be used with a clear prohibition.","そろそろ means 'soon, it's about time' and does not express degree."],"words":[{"ja":"絶対{ぜったい}に","en":"absolutely, never (with negative)","si":"කිසිසේත්ම"},{"ja":"触{さわ}る","en":"to touch","si":"අල්ලනවා"}],"why_wrong_si":["「ときどき」 (සමහර වෙලාවට) කිව්වොත් සමහර වෙලාවට අත ගාන්න පුළුවන් වගේ අදහසක් එනවා — එය අනාරක්ෂිතයි.","「だいたい」 (බොහෝ දුරට) පැහැදිලි තහනමක් සමඟ පාවිච්චි කරන්න බැහැ.","「そろそろ」 කියන්නේ 'දැන් ටිකෙන් ටික, වෙලාව ළං වෙලා' යන්නයි; තරම හෝ ප්‍රමාණය පෙන්වන්නේ නැහැ."]},{"id":"MT-10","level":"A2H","section":"moji","type":"漢字{かんじ}の 読{よ}み","scene":"やくしょ","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"この 用紙{ようし}に 住所{じゅうしょ}と 名前{なまえ}を <u>記入{きにゅう}<\/u>して ください。","choices":["きにゅ","きじゅう","きにゅう","きいにゅう"],"answer":3,"explain_ja":"「記入{きにゅう}する」は 「きにゅうする」と よみます。紙{かみ}に 書{か}く ことです。","explain_en":"記入 is read kinyū and means to fill in a form. 入 is read にゅう here, with a long vowel.","explain_si":"「記入」 කියවෙන්නේ 「きにゅう」 කියලා. එහි තේරුම ෆෝරමයක අවශ්‍ය තොරතුරු පුරවනවා යන්නයි. මෙතැන 入 කියවෙන්නේ දිග ස්වරය සහිත 「にゅう」 කියලා. ලේඛන සම්බන්ධ වචන (記入・署名{しょめい}・提出{ていしゅつ}) එකට කට පාඩම් කර ගන්න.","why_wrong":["きにゅ drops the long vowel; 入 in this word is にゅう.","きじゅう reads 入 as じゅう, which is the reading of 十, not 入.","きいにゅう inserts an extra い after き."],"words":[{"ja":"記入{きにゅう}する","en":"to fill in (a form)","si":"පෝරමය පුරවනවා"},{"ja":"用紙{ようし}","en":"form, sheet","si":"පෝරමය"}],"why_wrong_si":["「きにゅ」 — දිග ස්වරය අත් හැරලා; මේ වචනයේ 入 කියවෙන්නේ 「にゅう」 කියලා.","「きじゅう」 — 入 「じゅう」 ලෙස කියවා තිබෙනවා, නමුත් එය 十 හි කියවීමයි.","「きいにゅう」 — 「き」 ට පසුව නැති අමතර 「い」 එකක් ඇතුළු කර තිබෙනවා."]},{"id":"MT-11","level":"A2H","section":"moji","type":"ことばの いみ","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"きゅうに 熱{ねつ}が 出{で}たので、きのうは 会社{かいしゃ}を ＿＿＿ しました。","choices":["欠席{けっせき}","欠勤{けっきん}","休憩{きゅうけい}","遅刻{ちこく}"],"answer":2,"explain_ja":"しごとの 日{ひ}に 会社{かいしゃ}を 休{やす}む ことを 「欠勤{けっきん}」と 言{い}います。","explain_en":"欠勤 is the word for being absent from WORK for a whole day; 欠席 is used for classes and meetings.","explain_si":"「欠勤{けっきん}」 කියන්නේ රැකියාවට මුළු දවසම නොපැමිණීමයි. පාඩම්, රැස්වීම් සඳහා 「欠席」 පාවිච්චි වන අතර, රැකියාව සඳහා 「欠勤」 පාවිච්චි වෙනවා. සමාන අර්ථ ඇති වචන අතරින් තෝරන විට, එය කොතැනට (රැකියාව ද, පන්තිය ද) අදාළ ද කියා පරීක්ෂා කරන්න.","why_wrong":["欠席 is used for lessons, meetings and ceremonies, not for a work day.","休憩 is a short rest during working hours, not a whole day off.","遅刻 means arriving late, but this person did not come at all."],"words":[{"ja":"欠勤{けっきん}する","en":"to be absent from work","si":"වැඩට නොපැමිණීම"},{"ja":"熱{ねつ}が 出{で}る","en":"to develop a fever","si":"උණ එනවා"}],"why_wrong_si":["「欠席」 පාවිච්චි වන්නේ පාඩම්, රැස්වීම්, උත්සව සඳහා මිස වැඩ දවසකට නොවෙයි.","「休憩」 කියන්නේ වැඩ කරන අතරතුර ගන්නා කෙටි විවේකයක් මිස මුළු දවසේ නිවාඩුවක් නොවෙයි.","「遅刻」 කියන්නේ ප්‍රමාද වී පැමිණීමයි, නමුත් මේ පුද්ගලයා ආවේම නැහැ."]},{"id":"MT-12","level":"A2H","section":"moji","type":"漢字{かんじ}の 書{か}き方{かた}","scene":"すまい","stem":"＿＿の ことばは かんじで どう かきますか。","context":null,"prompt":"ごみは <u>ぶんべつ<\/u>して 出{だ}して ください。","choices":["分列","分則","文別","分別"],"answer":4,"explain_ja":"ごみを 「もえる ごみ」「かん・びん」などに 分{わ}ける ことを 「分別{ぶんべつ}」と 書{か}きます。","explain_en":"分別 (bunbetsu) = to sort rubbish. 分 'to divide' + 別 'to separate'.","explain_si":"「ぶんべつ」 ලියන්නේ 「分別」 කියලා — 分 (බෙදනවා) + 別 (වෙන් කරනවා), එනම් කුණු වර්ග කිරීම. ජපානයේ ජීවත් වන විට නිතර හමු වන වචනයක් නිසා 「分別して出す」 කියන ආකෘතියම මතක තබා ගන්න.","why_wrong":["分列 uses 列 (a line or row), which is not read べつ.","分則 uses 則 (rule); it is read そく, not べつ.","文別 starts with 文 (sentence, writing) instead of 分 (to divide)."],"words":[{"ja":"分別{ぶんべつ}する","en":"to sort (rubbish)","si":"වර්ග කරනවා"}],"why_wrong_si":["「分列」 — 列 (පෙළ, පේළිය) කියවෙන්නේ 「べつ」 කියලා නොවෙයි.","「分則」 — 則 (නීතිය) කියවෙන්නේ 「そく」 මිස 「べつ」 නොවෙයි.","「文別」 — මුලින් 分 (බෙදනවා) වෙනුවට 文 (වාක්‍යය, ලිවීම) දමා තිබෙනවා."]},{"id":"MT-13","level":"A2H","section":"moji","type":"ことばの いみ","scene":"たべもの","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"お客{きゃく}さまが 帰{かえ}った あと、テーブルを ＿＿＿ ください。","choices":["片{かた}づけて","取{と}りかえて","組{く}み立{た}てて","持{も}ち帰{かえ}って"],"answer":1,"explain_ja":"テーブルの 上{うえ}の おさらや コップを かたづけて、きれいに する ことを 「片{かた}づける」と 言{い}います。","explain_en":"片づける means to clear away and tidy up, which is what you do to a table after customers leave.","explain_si":"「片{かた}づける」 කියන්නේ අස්පස් කර පිළිවෙළට තබනවා යන්නයි. පාරිභෝගිකයන් ගිය පසු මේසයට කරන්නේ එයයි. සේවා ස්ථානයේ ක්‍රියා පද තෝරන ප්‍රශ්නවලදී, ක්‍රියාව කරන්නේ කවුද (සේවකයාද, පාරිභෝගිකයාද) කියා පැහැදිලි කර ගන්න.","why_wrong":["取りかえて means to swap one item for another one, not to clear a table.","組み立てて means to assemble parts into something.","持ち帰って means to take food home, which is what a customer does."],"words":[{"ja":"片{かた}づける","en":"to clear away, tidy up","si":"පිළිවෙළට තබනවා"},{"ja":"お客{きゃく}さま","en":"customer (polite)","si":"පාරිභෝගිකයා"}],"why_wrong_si":["「取{と}りかえて」 කියන්නේ එක් දෙයක් වෙනුවට තව එකක් මාරු කරනවා යන්නයි, මේසය අස්පස් කිරීම නොවෙයි.","「組{く}み立{た}てて」 කියන්නේ කොටස් එකතු කර යමක් සම්පූර්ණ කරනවා යන්නයි.","「持{も}ち帰{かえ}って」 කියන්නේ කෑම ගෙදර අරන් යනවා යන්නයි — එය පාරිභෝගිකයා කරන දෙයක්."]},{"id":"MT-14","level":"A1","section":"kaiwa","type":"あいさつ","scene":"しごと","stem":"何{なん}と 言{い}いますか。いちばん いい ものを えらんで ください。","context":"朝{あさ}、工場{こうじょう}に 来{き}ました。先{さき}に 来{き}て いる 人{ひと}が います。","prompt":"＿＿＿","choices":["おやすみなさい。","おはようございます。","おつかれさまでした。","いってきます。"],"answer":2,"explain_ja":"朝{あさ}、しごとに 来{き}た ときの あいさつは 「おはようございます」です。","explain_en":"おはようございます is the standard morning greeting when you arrive at work.","explain_si":"උදේ වැඩට ආපු වෙලාවේ කියන සම්මත ආචාර වචනය 「おはようございます」. සිද්ධියක් දුන් විට, එය දවසේ කුමන වෙලාවක ද සහ කතා කරන්නේ කවුරුන්ට ද යන දෙක බලා ආචාර වචනය තෝරන්න.","why_wrong":["おやすみなさい is said at night, just before going to sleep.","おつかれさまでした is said when work finishes, not when it begins.","いってきます is said by the person who is leaving, not arriving."],"words":[{"ja":"工場{こうじょう}","en":"factory","si":"කර්මාන්ත ශාලාව"}],"why_wrong_si":["「おやすみなさい」 කියන්නේ රාත්‍රියේ, නිදාගන්නට යන්නට පෙරයි.","「おつかれさまでした」 කියන්නේ වැඩ අවසන් වූ විට මිස පටන් ගන්නා විට නොවෙයි.","「いってきます」 කියන්නේ පිටත් වී යන කෙනා මිස පැමිණෙන කෙනා නොවෙයි."]},{"id":"MT-15","level":"A1","section":"kaiwa","type":"たのむ 表現{ひょうげん}","scene":"しごと","stem":"何{なん}と 言{い}いますか。いちばん いい ものを えらんで ください。","context":"重{おも}い はこを 一人{ひとり}で 持{も}って います。同{おな}じ チームの 人{ひと}に 手伝{てつだ}って ほしいです。","prompt":"＿＿＿","choices":["手伝{てつだ}いましょうか。","手伝{てつだ}って あげます。","手伝{てつだ}っても いいですか。","手伝{てつだ}って もらえませんか。"],"answer":4,"explain_ja":"人{ひと}に 手伝{てつだ}って ほしい ときは 「手伝{てつだ}って もらえませんか」と 言{い}います。","explain_en":"〜てもらえませんか is the polite way to ASK someone to do something for you.","explain_si":"「〜て もらえませんか」 කියන්නේ තමන් වෙනුවෙන් යමක් කරන ලෙස ආචාරශීලීව ඉල්ලා සිටින ආකෘතියයි. මෙතැන බර පෙට්ටිය තියෙන්නේ තමන් අතේ නිසා උදව් ඉල්ලන පැත්තේ ඉන්නේ තමන්. උදව් 'ඉල්ලනවා' ද 'දෙනවා' ද කියා දිශාව මුලින්ම තීරණය කරන්න.","why_wrong":["手伝いましょうか offers YOUR help to the other person.","手伝ってあげます also means you will help them, and sounds condescending.","手伝ってもいいですか asks permission for you to help them."],"words":[{"ja":"手伝{てつだ}う","en":"to help","si":"උදව් කරනවා"},{"ja":"重{おも}い","en":"heavy","si":"බරයි"}],"why_wrong_si":["「手伝{てつだ}いましょうか」 කියන්නේ තමන්ගේ උදව්ව අනිත් කෙනාට ඉදිරිපත් කිරීමයි.","「手伝{てつだ}って あげます」 ද 'මම ඔයාට උදව් කරන්නම්' යන අදහසයි; ඊට අමතරව ටිකක් උඩඟු ලෙසත් ඇසෙනවා.","「手伝{てつだ}っても いいですか」 කියන්නේ තමන් උදව් කරන්නට අවසර ඉල්ලීමයි."]},{"id":"MT-16","level":"A1","section":"kaiwa","type":"店{みせ}での やりとり","scene":"かいもの","stem":"お客{きゃく}さんに 何{なん}と 言{い}いますか。","context":"コンビニで はたらいて います。お客{きゃく}さんが レジに 来{き}ました。","prompt":"＿＿＿","choices":["いらっしゃいませ。","ごちそうさまでした。","おかえりなさい。","はじめまして。"],"answer":1,"explain_ja":"店{みせ}で お客{きゃく}さんを むかえる ときは 「いらっしゃいませ」と 言{い}います。","explain_en":"いらっしゃいませ is the set phrase shop staff say to welcome a customer.","explain_si":"「いらっしゃいませ」 කියන්නේ සාප්පුවේ සේවකයන් පාරිභෝගිකයෙකු පිළිගන්නා විට කියන ස්ථිර වාක්‍ය ඛණ්ඩයයි. සිද්ධියේ 'මම සේවකයා, ආවේ පාරිභෝගිකයා' කියා පැහැදිලි වූ විට මේ පිළිතුර ස්ථිරයි.","why_wrong":["ごちそうさまでした is said after finishing a meal.","おかえりなさい welcomes a family member back home.","はじめまして is used only when meeting a person for the first time in an introduction."],"words":[{"ja":"店員{てんいん}","en":"shop staff","si":"සාප්පු සේවකයා"}],"why_wrong_si":["「ごちそうさまでした」 කියන්නේ කෑම අවසන් කළ පසුවයි.","「おかえりなさい」 කියන්නේ ගෙදර ආපසු එන පවුලේ කෙනෙකුට.","「はじめまして」 පාවිච්චි වන්නේ කෙනෙකු මුල් වරට හඳුනා ගන්නා විට පමණයි."]},{"id":"MT-17","level":"A1","section":"kaiwa","type":"会話{かいわ}の 完成{かんせい}","scene":"こうつう","stem":"＿＿＿に 入{はい}る ことばを えらんで ください。","context":"駅{えき}で 道{みち}を 聞{き}いて います。\n田中{たなか}：すみません、みなみ口{ぐち}は どこですか。\n駅員{えきいん}：＿＿＿","prompt":"＿＿＿","choices":["はい、そうです。","いいえ、けっこうです。","あの かいだんを おりて ください。","おねがいします。"],"answer":3,"explain_ja":"「どこですか」と 聞{き}かれたら、場所{ばしょ}や 行{い}き方{かた}を 答{こた}えます。","explain_en":"どこですか asks for a location, so the reply must give directions.","explain_si":"「どこですか」 කියලා අහන්නේ ස්ථානයක් නිසා, පිළිතුරෙන් යා යුතු මඟ කිව යුතුයි. එම නිසා 「あの かいだんを おりて ください」 නිවැරදියි. සංවාද සම්පූර්ණ කිරීමේ ප්‍රශ්නවලදී, ප්‍රශ්නය අහන වචනය (どこ・いつ・だれ) මොකක්ද කියා මුලින්ම සලකුණු කර ගන්න.","why_wrong":["はい、そうです only answers a yes/no question, not a どこ question.","いいえ、けっこうです politely refuses an offer of something.","おねがいします is what the person asking says, not the answer."],"words":[{"ja":"階段{かいだん}","en":"stairs","si":"පඩිපෙළ"},{"ja":"南口{みなみぐち}","en":"south exit","si":"දකුණු දොරටුව"}],"why_wrong_si":["「はい、そうです」 පිළිතුරු දෙන්නේ ඔව්/නැහැ ප්‍රශ්නයකට මිස 「どこ」 ප්‍රශ්නයකට නොවෙයි.","「いいえ、けっこうです」 කියන්නේ යමක් ඉදිරිපත් කළ විට ආචාරශීලීව එය ප්‍රතික්ෂේප කිරීමයි.","「おねがいします」 කියන්නේ අහන කෙනා මිස පිළිතුරු දෙන කෙනා නොවෙයි."]},{"id":"MT-18","level":"A2","section":"kaiwa","type":"きょかを もらう 表現{ひょうげん}","scene":"しごと","stem":"店長{てんちょう}に 何{なん}と 言{い}いますか。","context":"あした 病院{びょういん}へ 行{い}きたいので、しごとを 休{やす}みたいです。店長{てんちょう}に 話{はな}します。","prompt":"＿＿＿","choices":["あした 休{やす}みます。","あした 休{やす}ませて いただけませんか。","あした 休{やす}んで ください。","あした 休{やす}んだ ほうが いいですよ。"],"answer":2,"explain_ja":"上{うえ}の 人{ひと}に きょかを もらう ときは 「〜させて いただけませんか」を つかいます。","explain_en":"〜させていただけませんか is the polite form for asking a superior for permission.","explain_si":"「〜させて いただけませんか」 කියන්නේ ඉහළ නිලධාරියෙකුගෙන් අවසර ඉල්ලන විට පාවිච්චි කරන ඉතා ආචාරශීලී ආකෘතියයි. 店長 වැනි උසස් අයෙකුට කතා කරන සිද්ධියක් දුටු විට, තීරණය දැනුම් දෙනවා නොව අවසර ඉල්ලනවා යන ආකෘතිය තෝරන්න.","why_wrong":["あした休みます just announces the decision and is too direct to a manager.","休んでください tells the MANAGER to take the day off.","休んだほうがいいですよ is advice you give to another person."],"words":[{"ja":"店長{てんちょう}","en":"store manager","si":"සාප්පු කළමනාකරු"}],"why_wrong_si":["「あした 休{やす}みます」 කියන්නේ තමන්ගේ තීරණය දැනුම් දීමක් පමණයි; කළමනාකරුට එය ඉතා කෙළින් ඇසෙනවා.","「休{やす}んで ください」 කියන්නෙන් නිවාඩු ගන්නට කියන්නේ කළමනාකරුටයි.","「休{やす}んだ ほうが いいですよ」 කියන්නේ අනිත් කෙනෙකුට දෙන උපදෙසක්."]},{"id":"MT-19","level":"A2","section":"kaiwa","type":"場面{ばめん}に 合{あ}う 表現{ひょうげん}","scene":"しごと","stem":"何{なん}と 言{い}いますか。","context":"介護{かいご}しせつで はたらいて います。利用者{りようしゃ}さんが 「まどを 開{あ}けて ほしい」と 言{い}いました。でも 今日{きょう}は とても 寒{さむ}いです。","prompt":"＿＿＿","choices":["今日{きょう}は 寒{さむ}いので、少{すこ}しだけ 開{あ}けますね。","まどは 開{あ}けては いけません。","わたしは 開{あ}けたく ないです。","開{あ}けても いいですか。"],"answer":1,"explain_ja":"利用者{りようしゃ}さんの きもちも たいせつです。りゆうを 言{い}って、できる ことを します。","explain_en":"Giving the reason (it is cold) and offering a partial solution respects the resident's wish while keeping them safe.","explain_si":"හේතුව (අද ඉතා සීතලයි) කියා දී, ටිකක් විවෘත කරන බව යෝජනා කිරීමෙන් 利用者さん ගේ ඉල්ලීමට ගරු කරමින්ම ඔහුගේ/ඇයගේ සෞඛ්‍යයත් ආරක්ෂා වෙනවා. රැකවරණ ක්ෂේත්‍රයේ ප්‍රශ්නවලදී 'සම්පූර්ණයෙන් ප්‍රතික්ෂේප කිරීම' නොව 'හේතුව + විකල්ප යෝජනාව' ඇති පිළිතුර තෝරන්න.","why_wrong":["まどは開けてはいけません flatly forbids it and ignores the resident's request.","わたしは開けたくないです talks about your own feelings, not the resident's need.","開けてもいいですか asks the resident for permission, but the resident already asked you."],"words":[{"ja":"利用者{りようしゃ}さん","en":"resident, service user","si":"සේවා ලාභියා"},{"ja":"寒{さむ}い","en":"cold (weather)","si":"සීතලයි"}],"why_wrong_si":["「まどは 開{あ}けては いけません」 කියන්නෙන් කෙළින්ම තහනම් කරලා, 利用者さん ගේ ඉල්ලීම නොසලකා හරිනවා.","「わたしは 開{あ}けたく ないです」 කියන්නේ තමන්ගේ හැඟීම ගැන මිස 利用者さん ගේ අවශ්‍යතාව ගැන නොවෙයි.","「開{あ}けても いいですか」 කියලා 利用者さん ගෙන් අවසර අහනවා, නමුත් ඉල්ලීම කළේම ඔහු/ඇය නිසා එය අර්ථවත් නැහැ."]},{"id":"MT-20","level":"A2","section":"kaiwa","type":"電話{でんわ}の 表現{ひょうげん}","scene":"しごと","stem":"電話{でんわ}に 出{で}た 人{ひと}に 何{なん}と 言{い}いますか。","context":"会社{かいしゃ}に 電話{でんわ}を かけました。話{はな}したい 人{ひと}は 山田{やまだ}さんです。","prompt":"＿＿＿","choices":["山田{やまだ}さんですか。","山田{やまだ}さんを 出{だ}して ください。","山田{やまだ}さんは いますか。","山田{やまだ}さんは いらっしゃいますか。"],"answer":4,"explain_ja":"しごとの 電話{でんわ}では 「います」の ていねいな 言{い}い方{かた} 「いらっしゃいますか」を つかいます。","explain_en":"いらっしゃいますか is the honorific form of いますか and is standard on a business call.","explain_si":"「いらっしゃいますか」 කියන්නේ 「いますか」 හි ගෞරව (尊敬語) ආකෘතියයි; ව්‍යාපාරික දුරකථන ඇමතුමකදී සම්මත වන්නේ එයයි. දුරකථන ප්‍රශ්නවලදී වඩාත්ම ආචාරශීලී ආකෘතිය තෝරා ගැනීම ආරක්ෂිතයි.","why_wrong":["山田さんですか asks whether the person who answered is Yamada.","出してください is a command and sounds rude on the phone.","いますか is correct grammar but too casual for a business call."],"words":[{"ja":"いらっしゃいますか","en":"Is ... there? (honorific)","si":"සිටිනවාද? (ගෞරව)"}],"why_wrong_si":["「山田{やまだ}さんですか」 කියලා අහන්නේ දුරකථනය ගත් තැනැත්තා 山田 ද කියලයි.","「出{だ}して ください」 කියන්නේ අණ කිරීමක් වගේ; දුරකථනයේදී එය රළු ලෙස ඇසෙනවා.","「いますか」 ව්‍යාකරණමය වශයෙන් නිවැරදි වුවත් ව්‍යාපාරික ඇමතුමකට වඩා අවිධිමත් වැඩියි."]},{"id":"MT-21","level":"A2","section":"kaiwa","type":"あやまる 表現{ひょうげん}","scene":"しごと","stem":"上司{じょうし}に 何{なん}と 言{い}いますか。","context":"電車{でんしゃ}が おくれて、会社{かいしゃ}に 30分{さんじゅっぷん} おくれて つきました。","prompt":"＿＿＿","choices":["おくれても いいですか。","おくれて いますね。","おくれて 申{もう}し訳{わけ}ありません。","おくれて くれて ありがとうございます。"],"answer":3,"explain_ja":"おくれた ときは 「おくれて 申{もう}し訳{わけ}ありません」と あやまります。","explain_en":"申し訳ありません is the polite apology used with a superior after being late.","explain_si":"「申{もう}し訳{わけ}ありません」 කියන්නේ ප්‍රමාද වූ පසු ඉහළ අයෙකුට කියන ආචාරශීලී සමාව ඉල්ලීමයි. දැනටමත් සිදු වූ දෙයකට සමාව ඉල්ලන විට 「〜て 申し訳ありません」「〜て すみません」 ආකෘතිය පාවිච්චි කරන්න.","why_wrong":["おくれてもいいですか asks permission before being late, not after arriving.","おくれていますね points out that someone else is late.","〜てくれてありがとう thanks the other person for being late."],"words":[{"ja":"申{もう}し訳{わけ}ありません","en":"I am very sorry (polite)","si":"සමාවෙන්න (ගෞරව)"},{"ja":"遅{おく}れる","en":"to be late","si":"ප්‍රමාද වෙනවා"}],"why_wrong_si":["「おくれても いいですか」 කියලා අවසර අහන්නේ ප්‍රමාද වීමට පෙර මිස පැමිණි පසු නොවෙයි.","「おくれて いますね」 කියන්නෙන් වෙන කෙනෙකු ප්‍රමාදයි කියා පෙන්වා දෙනවා.","「〜て くれて ありがとうございます」 කියන්නෙන් ප්‍රමාද වීම ගැන අනිත් කෙනාට ස්තූති කරනවා — එය අර්ථ විරහිතයි."]},{"id":"MT-22","level":"A2H","section":"kaiwa","type":"報告{ほうこく}する 表現{ひょうげん}","scene":"しごと","stem":"リーダーに 何{なん}と 言{い}いますか。","context":"工場{こうじょう}で はたらいて います。機械{きかい}から いつもと ちがう 音{おと}が します。原因{げんいん}は わかりません。リーダーに 知{し}らせます。","prompt":"＿＿＿","choices":["すみません、機械{きかい}から 変{へん}な 音{おと}が するんですが、見{み}て いただけますか。","機械{きかい}が こわれました。もう 直{なお}して おきました。","機械{きかい}の 音{おと}は 好{す}きじゃ ありません。","機械{きかい}を 止{と}めても いいですよ。"],"answer":1,"explain_ja":"見{み}た ことを つたえて、たしかめて もらいます。「〜んですが、〜ていただけますか」が ていねいです。","explain_en":"You report exactly what you observed and politely ask the leader to check; you do not guess or act alone.","explain_si":"තමන් දුටු දේ එලෙසම වාර්තා කර, බලන ලෙස ආචාරශීලීව ඉල්ලා සිටීමයි නිවැරදි ක්‍රමය; හේතුව අනුමාන කර තනිවම ක්‍රියා කරන්නේ නැහැ. 報告 (වාර්තා කිරීම) ප්‍රශ්නවලදී 「〜んですが、〜て いただけますか」 කියන ආකෘතිය ඉතා ප්‍රයෝජනවත්.","why_wrong":["It says the machine is broken and already repaired, which is not true and is dangerous.","It gives a personal opinion instead of reporting a problem.","〜てもいいですよ gives the leader permission, which makes no sense here."],"words":[{"ja":"機械{きかい}","en":"machine","si":"යන්ත්‍රය"},{"ja":"報告{ほうこく}する","en":"to report","si":"වාර්තා කරනවා"}],"why_wrong_si":["'යන්ත්‍රය කැඩුණා, දැනටමත් හදලා දැම්මා' කියනවා — එය සත්‍ය නොවන අතර අනතුරුදායකයි.","ගැටලුව වාර්තා කරනවා වෙනුවට පෞද්ගලික අදහසක් කියනවා.","「〜ても いいですよ」 කියන්නෙන් අවසර දෙන්නේ නායකයාට; මෙතැනට එය කිසිසේත් ගැළපෙන්නේ නැහැ."]},{"id":"MT-23","level":"A2H","section":"kaiwa","type":"ていねいに ことわる 表現{ひょうげん}","scene":"ともだち","stem":"何{なん}と 言{い}いますか。","context":"同{おな}じ 寮{りょう}の 人{ひと}に 「今夜{こんや} いっしょに ごはんを 食{た}べませんか」と さそわれました。でも 今夜{こんや}は 夜勤{やきん}が あります。","prompt":"＿＿＿","choices":["行{い}きません。","行{い}きたいんですが、今夜{こんや}は 夜勤{やきん}なんです。すみません。","夜勤{やきん}だから むりです。","行{い}っても いいですか。"],"answer":2,"explain_ja":"ことわる ときは、まず 「行{い}きたい」と 気持{きも}ちを 言{い}って、りゆうを つたえます。","explain_en":"A polite refusal states your wish first, then gives the reason, then apologises.","explain_si":"ආචාරශීලීව ප්‍රතික්ෂේප කරන විට පිළිවෙළ මෙසේයි: මුලින්ම යන්න කැමැත්ත ඇති බව (行きたいんですが), පසුව හේතුව (夜勤なんです), අවසානයේ සමාව ඉල්ලීම (すみません). ආරාධනයක් ප්‍රතික්ෂේප කරන ප්‍රශ්නවලදී මේ තුනම ඇති පිළිතුර තෝරන්න.","why_wrong":["行きません is a bare refusal with no reason and sounds cold.","だからむりです is blunt and casual, and gives no apology.","行ってもいいですか asks permission instead of answering the invitation."],"words":[{"ja":"夜勤{やきん}","en":"night shift","si":"රාත්‍රී මුරය"},{"ja":"寮{りょう}","en":"dormitory","si":"නේවාසිකාගාරය"}],"why_wrong_si":["「行{い}きません」 කියන්නේ හේතුවක් නැති හිස් ප්‍රතික්ෂේප කිරීමක් නිසා සීතල ලෙස ඇසෙනවා.","「〜だから むりです」 කෙළින්ම හා අවිධිමත් ලෙස ඇසෙන අතර සමාව ඉල්ලීමකුත් නැහැ.","「行{い}っても いいですか」 කියලා අවසර අහනවා මිස ආරාධනයට පිළිතුරු දෙන්නේ නැහැ."]},{"id":"MT-24","level":"A2H","section":"kaiwa","type":"かくにんする 表現{ひょうげん}","scene":"しごと","stem":"リーダーに 何{なん}と 言{い}いますか。","context":"造船所{ぞうせんじょ}で リーダーに 「この パイプを 3本{さんぼん} 運{はこ}んで、そのあと そうじを して」と 言{い}われました。3本{さんぼん}か 4本{よんほん}か よく 聞{き}こえませんでした。","prompt":"＿＿＿","choices":["わかりました。","もう一度{いちど} 言{い}って。","3本{さんぼん}じゃ ないですよ。","すみません、パイプは 3本{さんぼん}で よろしいでしょうか。"],"answer":4,"explain_ja":"聞{き}こえなかった ときは、じぶんが 聞{き}いた ことを 言{い}って 「〜で よろしいでしょうか」と かくにんします。","explain_en":"Repeating what you heard and asking 〜でよろしいでしょうか is the safe, polite way to confirm an instruction.","explain_si":"තමන්ට ඇසුණු දේ නැවත කියා 「〜で よろしいでしょうか」 කියලා තහවුරු කර ගැනීම ආරක්ෂිත හා ආචාරශීලී ක්‍රමයයි. නිශ්චිත ගණන් හෝ වේලාවක් හරියට ඇසුණේ නැති සිද්ධියක් දුටු විට, සැමවිටම 'තහවුරු කර ගැනීමේ' පිළිතුර තෝරන්න.","why_wrong":["わかりました hides the fact that you did not hear the number.","もう一度言って is the plain form and too casual for a leader.","3本じゃないですよ denies the instruction instead of checking it."],"words":[{"ja":"確認{かくにん}する","en":"to confirm, check","si":"තහවුරු කරනවා"},{"ja":"運{はこ}ぶ","en":"to carry","si":"ගෙන යනවා"}],"why_wrong_si":["「わかりました」 කිව්වොත් ගණන ඇසුණේ නැති බව සඟවනවා.","「もう一度{いちど} 言{い}って」 සාමාන්‍ය (普通形) ආකෘතියයි; නායකයෙකුට එය වඩා අවිධිමත් වැඩියි.","「3本{さんぼん}じゃ ないですよ」 කියන්නෙන් තහවුරු කර ගැනීම වෙනුවට උපදෙසම ප්‍රතික්ෂේප කරනවා."]},{"id":"MT-25","level":"A2H","section":"kaiwa","type":"お客{きゃく}さまへの 対応{たいおう}","scene":"たべもの","stem":"お客{きゃく}さまに 何{なん}と 言{い}いますか。","context":"レストランで はたらいて います。お客{きゃく}さまが 「注文{ちゅうもん}した 料理{りょうり}が まだ 来{こ}ない」と 言{い}って います。","prompt":"＿＿＿","choices":["もう 少{すこ}し 待{ま}って。","わたしの しごとでは ありません。","たいへん 申{もう}し訳{わけ}ございません。すぐに おたしかめ いたします。","キッチンに 聞{き}いて ください。"],"answer":3,"explain_ja":"まず あやまって、じぶんが たしかめると つたえます。お客{きゃく}さまには ていねいな ことばを つかいます。","explain_en":"You apologise first, then say that YOU will check right away, using humble/polite forms with a customer.","explain_si":"මුලින්ම සමාව ඉල්ලා, පසුව 'මම දැන්ම බලා එන්නම්' කියා තමන් වගකීම භාර ගැනීමයි නිවැරදි ක්‍රමය. පාරිභෝගිකයන්ට කතා කරන විට 「おたしかめ いたします」 වැනි 謙譲語 (නිහතමානී) ආකෘති පාවිච්චි කරන්න.","why_wrong":["待って is the plain form and is rude to a customer.","It pushes the problem away instead of dealing with it.","Telling the customer to ask the kitchen makes the customer do the staff's job."],"words":[{"ja":"注文{ちゅうもん}","en":"order (in a restaurant)","si":"ඇණවුම"},{"ja":"確{たし}かめる","en":"to check, verify","si":"පරීක්ෂා කරනවා"}],"why_wrong_si":["「待{ま}って」 සාමාන්‍ය ආකෘතියයි; පාරිභෝගිකයෙකුට එය රළුයි.","ගැටලුව විසඳනවා වෙනුවට එය තමන්ගෙන් ඉවතට තල්ලු කරනවා.","කුස්සියෙන් අහන්න කීමෙන් සේවකයාගේ වැඩ පාරිභෝගිකයාට කරන්නට සලස්වනවා."]},{"id":"MT-26","level":"A1","section":"choukai","type":"みじかい 指示{しじ}を 聞{き}く","scene":"しごと","stem":"音声{おんせい}を 聞{き}いて、いちばん いい ものを 一{ひと}つ えらんで ください。","context":"工場{こうじょう}で リーダーが 新{あたら}しい 人{ひと}に 話{はな}して います。","prompt":"（音声を聞いて答える問題です）","audio":{"instruction_ja":"工場{こうじょう}で リーダーが 話{はな}して います。この 人{ひと}は はじめに 何{なに}を しますか。","lines":[{"speaker":"M1","text":"おはようございます。きょうは まず 手{て}を あらって ください。そのあと 服{ふく}を きがえて、2階{にかい}に 来{き}て ください。"}],"question_ja":"この 人{ひと}は はじめに 何{なに}を しますか。","speed":"ふつう","note":"リーダーは やさしく、ゆっくり はっきり 話{はな}す。"},"choices":["手{て}を あらう","服{ふく}を きがえる","2階{にかい}へ 行{い}く","そうじを する"],"answer":1,"explain_ja":"「まず」の あとに 言{い}った ことが はじめに する ことです。「まず 手{て}を あらって ください」と 言{い}いました。","explain_en":"まず marks the first action, and the leader says まず手を洗ってください.","explain_si":"「まず」 කියන වචනයෙන් පළමු ක්‍රියාව සලකුණු වෙනවා, නායකයා කියන්නේ 「まず 手を あらって ください」 කියලයි. එම නිසා පිළිතුර 「手を あらう」. පිළිවෙළ ගැන අහන ශ්‍රවණ ප්‍රශ්නවලදී 「まず」「そのあと」「その前に」 වැනි වචන අහන අතරතුරම සටහන් කර ගන්න.","why_wrong":["Changing clothes comes after washing hands (そのあと).","Going to the 2nd floor is the last step.","Cleaning is not mentioned in the instruction at all."],"words":[{"ja":"まず","en":"first of all","si":"මුලින්ම"},{"ja":" }」 කියන්නේ අවලංගු කිරීමයි. එම නිසා වැස්සොත් සාප්පු යාම නවතිනවා. පණිවුඩ ප්‍රශ්නවලදී 「〜の ときは」 කියන කොන්දේසි කොටස තමයි පිළිතුරට යතුර.","why_wrong":["Meeting at 11:00 is the plan only if it does NOT rain.","Meeting at the friend's house is not written anywhere.","The message says cancelled, not that the time will change."],"words":[{"ja":"中止{ちゅうし}","en":"cancellation","si":"අවලංගු කිරීම"},{"ja":"雨{あめ}","en":"rain","si":"වැස්ස"}],"why_wrong_si":["11時 ට ස්ථානයේදී හමු වීම වැස්ස නොවැටුණොත් පමණක් අදාළ සැලසුමයි.","යාළුවාගේ ගෙදර හමු වීම ගැන කිසිම තැනක ලියා නැහැ.","පණිවුඩයේ කියන්නේ අවලංගු කරනවා කියලයි, වේලාව වෙනස් කරනවා කියා නොවෙයි."]},{"id":"MT-42","level":"A1","section":"dokkai","type":"お知{し}らせを 読{よ}む","scene":"かいもの","stem":"お知{し}らせを 読{よ}んで、しつもんに 答{こた}えて ください。","context":"（スーパーの はりがみ）\nお知{し}らせ\n8月{はちがつ}15日{じゅうごにち}（土{ど}）は 休{やす}みます。\n16日{じゅうろくにち}（日{にち}）から いつもどおり\n午前{ごぜん}9時{くじ}に 開{あ}きます。","prompt":"8月{はちがつ}16日{じゅうろくにち}に この 店{みせ}は どう なりますか。","choices":["休{やす}みです","午前{ごぜん}9時{くじ}に 開{あ}きます","午後{ごご}9時{くじ}に 開{あ}きます","ずっと 休{やす}みです"],"answer":2,"explain_ja":"休{やす}むのは 15日{じゅうごにち}です。16日{じゅうろくにち}からは いつもどおり 午前{ごぜん}9時{くじ}に 開{あ}きます。","explain_en":"The shop is closed only on the 15th; from the 16th it opens as usual at 9 a.m.","explain_si":"සාප්පුව වහන්නේ 15 වන දා පමණයි; 16 වන දා සිට සුපුරුදු ලෙස 午前9時 ට විවෘත වෙනවා. දින සහිත දැන්වීම්වලදී 'වහන දිනය' සහ 'නැවත විවෘත වන දිනය' වෙන් කර සලකුණු කර ගන්න.","why_wrong":["The 15th is the closed day, not the 16th.","The sign says 午前 (a.m.), not 午後 (p.m.).","The shop reopens from the 16th, so it is not closed for a long time."],"words":[{"ja":"午前{ごぜん}","en":"a.m., morning","si":"පෙරවරු"},{"ja":"開{あ}く","en":"to open (shop)","si":"විවෘත වෙනවා"}],"why_wrong_si":["වහන දිනය 15 වන දා මිස 16 වන දා නොවෙයි.","දැන්වීමේ ලියා ඇත්තේ 「午前」 (පෙරවරු) මිස 「午後」 (පස්වරු) නොවෙයි.","16 වන දා සිට නැවත විවෘත වන නිසා දිගටම වහලා නැහැ."]},{"id":"MT-43","level":"A2","section":"dokkai","type":"お知{し}らせを 読{よ}む","scene":"すまい","stem":"けいじを 読{よ}んで、しつもんに 答{こた}えて ください。","context":"（寮{りょう}の けいじばん）\nごみの 出{だ}し方{かた}\n・もえる ごみ … 月{げつ}・木{もく}　朝{あさ}8時{はちじ}までに 出{だ}して ください。\n・かん、びん … 水{すい}　朝{あさ}8時{はちじ}までに 出{だ}して ください。\n・大{おお}きい ごみ … 出{だ}す 前{まえ}に かんりにんに 言{い}って ください。お金{かね}が かかります。","prompt":"こわれた いすを すてたい とき、はじめに 何{なに}を しますか。","choices":["月曜日{げつようび}の 朝{あさ}に 出{だ}す","水曜日{すいようび}の 朝{あさ}に 出{だ}す","先{さき}に お金{かね}を はらう","かんりにんに 話{はな}す"],"answer":4,"explain_ja":"いすは 「大{おお}きい ごみ」です。「出{だ}す 前{まえ}に かんりにんに 言{い}って ください」と 書{か}いて あります。","explain_en":"A broken chair is large rubbish, and the notice says you must tell the caretaker BEFORE putting it out.","explain_si":"කැඩුණු පුටුවක් 「大きい ごみ」 ට අයිතියි, දැන්වීමේ කියන්නේ පිටතට දමන්නට කලින් 管理人 (කළමනාකරු) ට කියන්න කියලයි. 「はじめに 何を しますか」 කියා ඇසූ විට, පිළිවෙළින් පළමු පියවර කුමක්ද කියා පමණක් සොයන්න.","why_wrong":["Monday is for burnable rubbish, and a chair is not burnable rubbish.","Wednesday is for cans and bottles.","You do pay money, but the FIRST step is to speak to the caretaker."],"words":[{"ja":"管理人{かんりにん}","en":"caretaker, building manager","si":"භාරකරු"},{"ja":"捨{す}てる","en":"to throw away","si":"ඉවත් කරනවා"}],"why_wrong_si":["සඳුදා දැවෙන කුණු සඳහායි, පුටුවක් දැවෙන කුණු නොවෙයි.","බදාදා කෑන් සහ බෝතල් සඳහායි.","මුදල් ගෙවීමට සිදු වුවත්, පළමු පියවර වන්නේ කළමනාකරු සමඟ කතා කිරීමයි."]},{"id":"MT-44","level":"A2","section":"dokkai","type":"ひょうを 読{よ}む","scene":"こうつう","stem":"電車{でんしゃ}の ひょうを 見{み}て、しつもんに 答{こた}えて ください。","context":"TABLE\n電車{でんしゃ}|みなみ駅{えき} 発{はつ}|工場前{こうじょうまえ}駅{えき} 着{ちゃく}\nふつう|6:40|7:10\nふつう|7:00|7:30\nかいそく|7:05|7:25\nふつう|7:20|7:50","prompt":"しごとは 8時{はちじ}に はじまります。工場前{こうじょうまえ}駅{えき}から 工場{こうじょう}まで あるいて 20分{にじゅっぷん} かかります。しごとに まにあう 電車{でんしゃ}の 中{なか}で、みなみ駅{えき}を いちばん おそく 出{で}る 電車{でんしゃ}は どれですか。","choices":["7:05の かいそく","7:00の ふつう","6:40の ふつう","7:20の ふつう"],"answer":1,"explain_ja":"工場前{こうじょうまえ}駅{えき}に 7時{しちじ}40分{よんじゅっぷん}までに 着{つ}けば まにあいます。その 中{なか}で いちばん おそく 出{で}るのは 7:05の かいそくです。","explain_en":"You must arrive by 7:40 to walk 20 minutes and start at 8:00. Of the trains that arrive in time, the 7:05 rapid leaves latest.","explain_si":"8:00 ට වැඩ
