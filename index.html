<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JFT-Basic">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="JFT-Basic (A1/A2) preparation for Sri Lankan learners — 210 questions with English and Sinhala explanations.">
<title>タカネ式 JFT-Basic 対策 | TAKANE-SHIKI JFT-Basic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;800&family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy2:#1d2f57; --gold:#C8A24A; --gold-d:#8a6a14;
  --bg:#F4F6FA; --card:#fff; --line:#DBE0EA; --ink:#1b1b1b; --mute:#59627a;
  --ok:#2f6b34; --ok-bg:#EDF5EE; --ng:#a53b2c; --ng-bg:#FCF1EF;
  --r:14px; --fs:16px; --navh:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.8;
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans Sinhala",
    system-ui,-apple-system,"Segoe UI",sans-serif;
}
body.rb-off ruby rt{visibility:hidden}
body.f-lg{--fs:18px} body.f-sm{--fs:14.5px}
ruby rt{font-size:.52em;font-weight:400;line-height:1;color:var(--mute)}
.si{display:block;font-family:"Noto Sans Sinhala",sans-serif;font-size:.88em;line-height:1.95;color:#3a4152;margin-top:3px}
.en{display:block;font-size:.9em;line-height:1.65;color:#20252e}
.ul{border-bottom:2px solid var(--navy);padding-bottom:1px}
button{font-family:inherit}

/* ==================================================== header */
header{
  position:sticky;top:0;z-index:60;background:var(--navy);color:#fff;
  padding:9px 12px;display:flex;align-items:center;gap:8px;min-height:52px;
}
header .logo{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:800;line-height:1.3}
header .logo b{display:block;font-size:14px;letter-spacing:.02em;color:#fff}
header .sp{margin-left:auto;display:flex;gap:6px}
.iconbtn{
  background:rgba(255,255,255,.13);border:0;color:#fff;border-radius:9px;
  min-width:44px;height:38px;padding:0 11px;font-size:13px;font-weight:700;cursor:pointer
}
.iconbtn.on{background:var(--gold);color:var(--navy)}
.iconbtn:active{opacity:.75}

/* ==================================================== nav
   せまい画面 → 下に固定（親指が届く位置）
   ひろい画面 → ヘッダーのすぐ下にタブとして出す（下端まで目線を落とさせない） */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fff;
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 12px rgba(20,33,61,.06)
}
nav button{
  flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--mute);
  cursor:pointer;line-height:1.35;font-weight:700;min-height:var(--navh);
  border-top:3px solid transparent
}
nav button i{display:block;font-size:20px;font-style:normal;margin-bottom:2px;opacity:.55}
nav button.on{color:var(--navy)}
nav button.on i{opacity:1}
body.runner nav{display:none}

main{max-width:820px;margin:0 auto;padding:16px 14px calc(var(--navh) + 24px)}
body.runner main{display:none}   /* 1問ずつ画面のときは通常ページを丸ごと隠す */

@media(min-width:720px){
  nav{
    position:sticky;top:52px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(20,33,61,.05);justify-content:center;gap:2px;
    padding:0 14px
  }
  nav button{
    flex:0 0 auto;min-height:0;padding:13px 20px 11px;font-size:13.5px;
    border-top:0;border-bottom:3px solid transparent
  }
  nav button i{display:inline;font-size:14px;margin:0 7px 0 0}
  nav button.on{border-bottom-color:var(--gold)}
  main{padding-bottom:40px}
  .rtop{top:52px}
  .actbar{position:sticky;border-radius:0 0 var(--r) var(--r)}
}
.view{display:none} .view.on{display:block}

/* ==================================================== generic */
h1.pt{font-size:21px;margin:2px 0 14px;color:var(--navy);font-weight:800;line-height:1.4}
h1.pt small{display:block;font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.14em;margin-bottom:3px}
h2.sec{font-size:16.5px;color:var(--navy);margin:26px 0 10px;padding-bottom:7px;border-bottom:2.5px solid var(--gold)}
h3.sub{font-size:14px;color:var(--navy);margin:20px 0 8px;border-left:4px solid var(--gold);padding-left:9px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:11px}
.callout{background:#FCF8EF;border:1px solid var(--gold);border-radius:var(--r);padding:13px 15px;margin:11px 0}
.callout .lab{font-weight:800;color:var(--navy);font-size:14px;margin-bottom:4px}
.dark{background:var(--navy);color:#fff;border-radius:var(--r);padding:14px 16px;margin:11px 0}
.dark .lab{color:var(--gold);font-weight:800;margin-bottom:5px}
.dark .en{color:#eef1f7}.dark .si{color:#c9d2e4}
table{width:100%;border-collapse:collapse;margin:9px 0;font-size:.9em}
th{background:var(--navy);color:#fff;text-align:left;padding:8px 9px;font-size:.85em;font-weight:700}
td{border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top}
tr.hi td{background:#FCF8EF}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
a{color:#25457f;word-break:break-all}
.btn{background:var(--gold);color:var(--navy);border:0;border-radius:12px;padding:15px 20px;
  font-size:15.5px;font-weight:800;cursor:pointer;width:100%;min-height:52px}
.btn.sec{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn:active{opacity:.85}
.btn+.btn{margin-top:9px}

/* ==================================================== home */
.hero{background:linear-gradient(160deg,var(--navy),var(--navy2) 62%,var(--navy));
  color:#fff;border-radius:16px;padding:16px 18px;margin-bottom:14px}
.hero .k{font-size:10px;letter-spacing:.24em;color:var(--gold);font-weight:800}
.hero h2{font-size:20px;margin:5px 0 3px;font-weight:800;line-height:1.4}
.hero p{margin:0;font-size:12.5px;color:#dfe4ef}

/* テストのしくみ */
.spec{background:#fff;border:1.5px solid var(--navy);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.spec .hd{background:var(--navy);color:#fff;padding:11px 15px;font-weight:800;font-size:14.5px;
  display:flex;align-items:center;gap:8px}
.spec .hd em{margin-left:auto;font-style:normal;color:var(--gold);font-size:12.5px;font-weight:700}
.spec .bd{padding:13px 15px}
.kpi{display:flex;gap:8px;margin-bottom:12px}
.kpi div{flex:1;text-align:center;background:#F4F6FA;border-radius:10px;padding:9px 4px}
.kpi b{display:block;font-size:20px;color:var(--navy);font-weight:800;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--mute);font-weight:700}
.slist{margin:0 0 10px;padding:0;list-style:none}
.slist li{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:14px}
.slist li:last-child{border-bottom:0}
.slist .no{flex:0 0 20px;height:20px;background:var(--gold);color:var(--navy);border-radius:5px;
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.slist .nm{flex:1;font-weight:700}
.slist .nm i{display:block;font-style:normal;font-size:11px;color:var(--mute);font-weight:400}
.slist .qq{color:var(--navy);font-weight:800;font-size:13px;white-space:nowrap}
.bands{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.band{display:flex;align-items:center;gap:9px;border-radius:9px;padding:8px 11px;font-size:13px;
  background:#F4F6FA}
.band.hi{background:#FCF8EF;border:1px solid var(--gold)}
.band b{flex:0 0 62px;font-weight:800;color:var(--navy)}
.band .sc{flex:0 0 66px;font-weight:700;font-variant-numeric:tabular-nums}
.band .ms{flex:1;font-size:11.5px;color:var(--mute);line-height:1.5}
.note{font-size:11.5px;color:var(--mute);line-height:1.7;margin-top:9px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:9px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  text-align:left;font-size:14px;cursor:pointer;color:var(--ink);min-height:86px}
.tile b{display:block;color:var(--navy);font-size:15px;margin-bottom:2px}
.tile span{font-size:11.5px;color:var(--mute)}
.tile .bar{height:6px;background:#EDF0F5;border-radius:3px;margin-top:9px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.wide{grid-template-columns:1fr}

/* ==================================================== runner */
.rtop{position:sticky;top:52px;z-index:55;background:#fff;border-bottom:1px solid var(--line)}
.rbar{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:52px}
.rbar .back{background:none;border:0;font-size:22px;color:var(--navy);cursor:pointer;
  width:40px;height:40px;line-height:1}
.rbar .ttl{flex:1;font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.3}
.rbar .ttl i{display:block;font-style:normal;font-size:11px;color:var(--mute);font-weight:600}
.rbar .cnt{font-size:13px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.rbar .gridbtn{background:#F0F3F8;border:0;border-radius:9px;width:42px;height:38px;
  font-size:15px;color:var(--navy);cursor:pointer}
.pbar{height:4px;background:#EDF0F5}
.pbar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.rclock{background:var(--navy);color:#fff;padding:7px 12px;display:flex;align-items:center;gap:10px;
  font-size:13px;font-weight:700}
.rclock .clk{font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
.rclock.low .clk{color:#ff9c8e}
.rclock .rest{margin-left:auto;color:#c9d2e4;font-size:12px}

.stage{padding:14px 14px 130px;max-width:820px;margin:0 auto}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 15px 17px}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.qt{font-size:12px;color:var(--mute);font-weight:700}
.lv{margin-left:auto;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:6px}
.lv.a1{background:#E8EEF8;color:#25457f}.lv.a2{background:#FCF8EF;color:var(--gold-d)}
.lv.a2h{background:var(--navy);color:var(--gold)}
.stem{font-size:.9em;color:var(--mute);margin-bottom:9px}
.mat{background:#FAFBFD;border:1px solid var(--line);border-radius:11px;padding:12px 13px;margin:9px 0;font-size:.96em}
.mat table{margin:0;font-size:.9em}.mat th{padding:6px 8px}.mat td{padding:6px 8px}
.prompt{margin:10px 0;font-size:1.06em;line-height:2}
.ch{list-style:none;margin:14px 0 0;padding:0}
.ch li{display:flex;gap:11px;align-items:center;border:1.5px solid var(--line);border-radius:12px;
  padding:14px 14px;margin-bottom:9px;cursor:pointer;background:#fff;min-height:56px;transition:.12s}
.ch li:active{transform:scale(.99)}
.ch li .n{flex:0 0 26px;height:26px;border:1.5px solid var(--navy);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--navy)}
.ch li.sel{border-color:var(--navy);background:#EEF2F9}
.ch li.sel .n{background:var(--navy);color:#fff}
.ch li.ok{border-color:#7fae84;background:var(--ok-bg)}
.ch li.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.ch li.ng{border-color:#d5a9a4;background:var(--ng-bg)}
.ch li.ng .n{background:var(--ng);border-color:var(--ng);color:#fff}
.ch.done li{cursor:default}

/* audio */
.audio{background:var(--navy);color:#fff;border-radius:13px;padding:13px 14px;margin:10px 0}
.audio .top{display:flex;align-items:center;gap:11px}
.audio .scene{flex:1;font-size:.94em;line-height:1.8}
.play{background:var(--gold);color:var(--navy);border:0;border-radius:50%;width:50px;height:50px;
  font-size:19px;cursor:pointer;flex:0 0 50px;font-weight:800}
.play:disabled{opacity:.4}
.audio .ctl{display:flex;align-items:center;gap:10px;margin-top:11px;font-size:12px;color:#c9d2e4}
.audio input[type=range]{flex:1;accent-color:var(--gold);height:26px}
.audio .st{font-size:11.5px;color:var(--gold);margin-top:7px;line-height:1.6}
.audio .trk{font-size:10.5px;color:#8fa0c2;margin-top:3px}
.scrtoggle{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:9px;
  padding:9px 13px;font-size:12.5px;cursor:pointer;margin-top:10px;width:100%;min-height:42px}
.scr{margin-top:10px;background:rgba(0,0,0,.24);border-radius:10px;padding:11px 12px;font-size:.93em;display:none}
.scr.on{display:block}
.scr .ln{margin-bottom:6px;display:flex;gap:9px}
.scr .sp{color:var(--gold);font-weight:800;font-size:.85em;flex:0 0 28px}
.scr .cur{background:rgba(200,162,74,.3);border-radius:5px}

/* explanation */
.exp{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{font-weight:800;font-size:16px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.verdict .tag{font-size:11px;background:#F0F3F8;color:var(--mute);border-radius:6px;padding:3px 8px;margin-left:auto}
.ansline{background:var(--ok-bg);border:1px solid #7fae84;border-radius:10px;padding:10px 12px;
  margin-bottom:11px;font-size:1.02em}
.ansline b{color:var(--ok);margin-right:6px}
.exp .ja{font-size:.98em;margin-bottom:11px;line-height:1.95}
.tabs{display:flex;gap:6px;margin-bottom:9px}
.tabs button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;
  font-size:12.5px;font-weight:700;color:var(--mute);cursor:pointer;min-height:40px}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tp{display:none}.tp.on{display:block}
.ww{background:var(--ng-bg);border-radius:11px;padding:11px 12px;margin:11px 0 0}
.ww .lab{font-size:11.5px;font-weight:800;color:var(--ng);margin-bottom:7px}
.ww .it{display:flex;gap:9px;margin-bottom:9px;font-size:.9em;line-height:1.7}
.ww .it:last-child{margin-bottom:0}
.ww .it b{color:var(--ng);flex:0 0 18px}
.words{border-top:1px dotted var(--line);padding-top:10px;margin-top:11px}
.words .wl{background:var(--navy);color:var(--gold);font-size:10.5px;padding:3px 8px;border-radius:5px;font-weight:800}
.words .w{display:block;font-size:.92em;margin-top:7px;line-height:1.7}
.words .w i{color:var(--mute);font-style:normal;margin-left:7px}
.words .w .s{font-family:"Noto Sans Sinhala";color:#3a4152;margin-left:7px;font-size:.92em}

/* bottom action bar */
.actbar{position:fixed;bottom:0;left:0;right:0;z-index:58;background:#fff;
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:9px;max-width:820px;margin:0 auto;box-shadow:0 -2px 14px rgba(20,33,61,.08)}
.actbar .btn{margin:0}
.actbar .half{flex:0 0 40%}

/* number grid sheet */
.sheet{position:fixed;inset:0;z-index:90;background:rgba(10,16,30,.55);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .box{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px 28px;
  max-height:84vh;overflow:auto;margin:0 auto;max-width:820px}
.sheet h3{margin:0 0 13px;color:var(--navy);font-size:16.5px}
.ngrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}
.ngrid button{border:1.5px solid var(--line);background:#fff;border-radius:9px;height:44px;
  font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.ngrid button.ok{background:var(--ok-bg);border-color:#7fae84;color:var(--ok)}
.ngrid button.ng{background:var(--ng-bg);border-color:#d5a9a4;color:var(--ng)}
.ngrid button.sel{background:#EEF2F9;border-color:var(--navy);color:var(--navy)}
.ngrid button.cur{outline:3px solid var(--gold);outline-offset:1px}
.srow{margin-bottom:15px}
.srow .lb{font-size:12.5px;color:var(--mute);font-weight:700;margin-bottom:7px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 4px;
  font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;min-height:46px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* result */
.result{background:#fff;border:2px solid var(--navy);border-radius:var(--r);padding:22px 18px;
  text-align:center;margin-bottom:13px}
.result .big{font-size:46px;font-weight:800;color:var(--navy);line-height:1.1}
.result .big small{font-size:17px;color:var(--mute)}
.result .lvl{display:inline-block;background:var(--gold);color:var(--navy);border-radius:10px;
  padding:7px 20px;font-weight:800;font-size:17px;margin-top:10px}
.result .msg{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.8}
.rev{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:10px}
.rev .rh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800;font-size:14px}
.rev .rh .num{background:var(--navy);color:#fff;border-radius:7px;min-width:28px;height:26px;
  display:flex;align-items:center;justify-content:center;font-size:13px}
.rev .rh .mk{margin-left:auto;font-size:12px;font-weight:700}
.rev .rh .mk.ok{color:var(--ok)}.rev .rh .mk.ng{color:var(--ng)}

/* vocab */
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;
  font-size:16px;font-family:inherit;margin-bottom:11px;background:#fff;min-height:50px}
.vrow{display:flex;gap:11px;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;margin-bottom:6px;font-size:.94em}
.vrow .ja{flex:0 0 38%;font-weight:700}
.vrow .rest i{color:var(--mute);font-style:normal;display:block}
.vrow .rest .s{font-family:"Noto Sans Sinhala";color:#3a4152;font-size:.92em;display:block}

/* guide sub-tabs */
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:14px;
  -webkit-overflow-scrolling:touch}
.subtabs button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:9px 15px;
  font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;white-space:nowrap;min-height:42px}
.subtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.step{display:flex;gap:11px;background:#fff;border:1px solid var(--line);
  border-left:4px solid var(--navy);border-radius:11px;padding:12px 13px;margin-bottom:2px}
.step .n{flex:0 0 26px;height:26px;background:var(--navy);color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
.arrow{text-align:center;color:var(--gold);font-size:12px;margin:2px 0}
.dd{display:grid;gap:10px;margin-top:12px}
@media(min-width:620px){.dd{grid-template-columns:1fr 1fr}}
.do{background:#F2F7F2;border:1px solid #9dbb9d;border-radius:var(--r);padding:13px 14px}
.dont{background:#FCF3F2;border:1px solid #d5a9a4;border-radius:var(--r);padding:13px 14px}
.dd .lab{font-weight:800;font-size:13.5px;margin-bottom:6px}

ියා (育成就労, 2027 අප්‍රේල් සිට): 2026 අගෝස්තු මාසයේ එකතු කළ A1 නිර්ණය මෙහිදී භාවිතා වේ.\nප්‍රතිඵලය කිසිදා කල් ඉකුත් නොවේ. එක් වරක් සමත් වූ පසු, එය ඔබේය."}]},{"id":"G2","title_en":"2. Levels and scores — what changed in August 2026","title_si":"2. මට්ටම් සහ ලකුණු — 2026 අගෝස්තුවේ වෙනස් වූ දේ","blocks":[{"type":"para","en":"Until July 2026 the test only told you one thing: did you reach A2 or not. From August 2026 it reports three levels. This matters: a score of 160 used to mean nothing on paper. Now it is a recorded A1 result.","si":"2026 ජූලි දක්වා විභාගය ඔබට කීවේ එක් දෙයක් පමණි: ඔබ A2 ට ළඟා වූවාද නැද්ද යන්නයි. 2026 අගෝස්තු සිට එය මට්ටම් තුනක් වාර්තා කරයි. මෙය වැදගත්: ලකුණු 160ක් කලින් කිසිවක් අදහස් නොකළේය. දැන් එය වාර්තාගත A1 ප්‍රතිඵලයකි."},{"type":"scoretable","rows":[{"band":"A2.2 (= A2)","score":"200 – 250","meaning_en":"Meets the Specified Skilled Worker Japanese requirement","meaning_si":"විශේෂිත නිපුණතා සේවක ජපන් භාෂා අවශ්‍යතාව සපුරයි","highlight":true},{"band":"A2.1","score":"175 – 199","meaning_en":"Close. Usually 2–3 months of focused study away from 200","meaning_si":"සමීපයි. සාමාන්‍යයෙන් 200 සිට මාස 2–3ක අවධානයෙන් යුත් අධ්‍යයනයක් ඉතිරියි","highlight":false},{"band":"A1","score":"145 – 174","meaning_en":"Basic Japanese confirmed. Used for the 育成就労 route","meaning_si":"මූලික ජපන් භාෂාව තහවුරු වී ඇත. 育成就労 මාර්ගය සඳහා භාවිතා වේ","highlight":true},{"band":"判定なし / No level","score":"under 145","meaning_en":"No level is given","meaning_si":"මට්ටමක් ලබා නොදේ","highlight":false}]},{"type":"callout","label_en":"How this book is built","label_si":"මෙම පොත ගොඩනගා ඇති ආකාරය","en":"Every practice question is marked A1 or A2. If your goal is 145, do the A1 questions until you get 90% right, then start A2. If your goal is 200, do both — the A1 questions are the foundation the A2 questions stand on.","si":"සෑම අභ්‍යාස ප්‍රශ්නයක්ම A1 හෝ A2 ලෙස සලකුණු කර ඇත. ඔබේ ඉලක්කය 145 නම්, 90%ක් නිවැරදි වන තුරු A1 ප්‍රශ්න කරන්න, පසුව A2 ආරම්භ කරන්න. ඔබේ ඉලක්කය 200 නම්, දෙකම කරන්න — A1 ප්‍රශ්න යනු A2 ප්‍රශ්න පිහිටා ඇති පදනමයි."}]},{"id":"G3","title_en":"3. The shape of the test","title_si":"3. විභාගයේ ස්වරූපය","blocks":[{"type":"structtable","rows":[{"no":"1","name_ja":"文字と語彙","name_en":"Characters & Vocabulary","q":"approx. 12","content_en":"Word meaning, word usage, kanji reading, kanji meaning","content_si":"වචනයේ අර්ථය, වචන භාවිතය, කන්ජි කියවීම"},{"no":"2","name_ja":"会話と表現","name_en":"Conversation & Expression","q":"approx. 12","content_en":"Grammar, expressions — what do you say in this situation","content_si":"ව්‍යාකරණ, ප්‍රකාශන — මෙම තත්ත්වයේදී ඔබ කුමක් කියනවාද"},{"no":"3","name_ja":"聴解","name_en":"Listening","q":"approx. 12","content_en":"Social exchanges, shops and public offices, instructions and announcements","content_si":"සමාජ සංවාද, සාප්පු සහ රාජ්‍ය කාර්යාල, උපදෙස් සහ නිවේදන"},{"no":"4","name_ja":"読解","name_en":"Reading","q":"approx. 12","content_en":"Understanding content, finding information in notices and tables","content_si":"අන්තර්ගතය තේරුම් ගැනීම, දැන්වීම් හා වගු තුළින් තොරතුරු සොයා ගැනීම"}],"footer_en":"Approximately 50 questions in 60 minutes. Total 250 points. There is NO time limit on each section — the 60 minutes covers everything, so you control the pacing.","footer_si":"විනාඩි 60ක් තුළ ප්‍රශ්න 50ක් පමණ. මුළු ලකුණු 250යි. එක් එක් කොටසට වෙන වෙනම කාල සීමාවක් නොමැත — විනාඩි 60 සියල්ල ආවරණය කරයි, එබැවින් වේගය ඔබ පාලනය කරයි."}]},{"id":"G4","title_en":"4. The five rules that catch people out","title_si":"4. මිනිසුන් අසමත් කරන නීති පහ","blocks":[{"type":"rules","items":[{"n":"1","en":"The listening audio plays up to TWO times. Do not panic on the first play. Use the first play to understand the situation, the second to confirm the detail.","si":"ශ්‍රවණ ශබ්දය දෙවරක් දක්වා වාදනය වේ. පළමු වාරයේදී කලබල නොවන්න. තත්ත්වය තේරුම් ගැනීමට පළමු වාරය භාවිතා කරන්න, විස්තර තහවුරු කිරීමට දෙවැන්න."},{"n":"2","en":"You can review and change answers INSIDE a section. But once you move to the next section, you can never go back. Check before you press forward.","si":"එක් කොටසක් තුළ පිළිතුරු නැවත බලා වෙනස් කළ හැක. නමුත් ඊළඟ කොටසට ගිය පසු, ඔබට කිසිදා ආපසු යා නොහැක. ඉදිරියට යාමට පෙර පරීක්ෂා කරන්න."},{"n":"3","en":"There is no penalty for a wrong answer. Never leave a question blank. If time is running out, choose something for every remaining question.","si":"වැරදි පිළිතුරකට දඬුවමක් නැත. කිසිදා ප්‍රශ්නයක් හිස්ව නොතබන්න. කාලය අවසන් වන්නේ නම්, ඉතිරි සෑම ප්‍රශ්නයකටම යමක් තෝරන්න."},{"n":"4","en":"If you score 199 or below you may retake — but you must wait 45 days from your test date. Plan your test dates backwards from the date the employer needs the certificate.","si":"ඔබ ලකුණු 199ක් හෝ ඊට අඩුවෙන් ලබා ගන්නේ නම් නැවත විභාගයට පෙනී සිටිය හැක — නමුත් ඔබේ විභාග දිනයේ සිට දින 45ක් රැඳී සිටිය යුතුය. සේවා යෝජකයාට සහතිකය අවශ්‍ය දිනයේ සිට පසුපසට ඔබේ විභාග දින සැලසුම් කරන්න."},{"n":"5","en":"Bring your Confirmation Letter and an original, unexpired photo ID whose name matches your registration exactly. A mismatched name means you cannot sit. Entry opens 45 minutes before; arrive 30 minutes early.","si":"ඔබේ තහවුරු කිරීමේ ලිපිය සහ ලියාපදිංචියට හරියටම ගැලපෙන නමක් සහිත, කල් ඉකුත් නොවූ මුල් ඡායාරූප හැඳුනුම්පත ගෙන එන්න. නම නොගැලපේ නම් ඔබට විභාගයට පෙනී සිටිය නොහැක. ඇතුළු වීම විනාඩි 45කට පෙර ආරම්භ වේ; විනාඩි 30කට කලින් පැමිණෙන්න."}]},{"type":"factbox","title_en":"Sri Lanka — the numbers","title_si":"ශ්‍රී ලංකාව — සංඛ්‍යා","items_en":["Test centre: Colombo. Test windows run roughly every two months (6 rounds per year).","Test fee: LKR 12,000.","In the June–July 2025 round, 1,349 people sat the test in Sri Lanka and 50.1% reached the standard score.","That means half the room fails. The half that passes is the half that practised the format, not just the language."],"items_si":["විභාග මධ්‍යස්ථානය: කොළඹ. විභාග කවුළු ආසන්න වශයෙන් සෑම මාස දෙකකට වරක් (වසරකට වට 6ක්).","විභාග ගාස්තුව: රු. 12,000.","2025 ජූනි–ජූලි වටයේදී, ශ්‍රී ලංකාවේ පුද්ගලයින් 1,349ක් විභාගයට පෙනී සිටි අතර 50.1%ක් සම්මත ලකුණට ළඟා විය.","එනම් කාමරයේ අඩක් අසමත් වේ. සමත් වන අඩ යනු භාෂාව පමණක් නොව ආකෘතියද පුහුණු වූ අඩයි."]}]},{"id":"G5","title_en":"5. How to study — the 8-week plan","title_si":"5. අධ්‍යයනය කරන ආකාරය — සති 8 සැලැස්ම","blocks":[{"type":"para","en":"Eight weeks is enough to move one level if you study every day. The plan below assumes 90 minutes on weekdays and 3 hours on one weekend day. Adjust the pace, but do not skip the order — listening improves last, so it must start first.","si":"ඔබ දිනපතා ඉගෙන ගන්නේ නම් මට්ටමක් ඉහළ යාමට සති අටක් ප්‍රමාණවත්ය. පහත සැලැස්ම සතියේ දිනවල විනාඩි 90ක් සහ සති අන්තයේ එක් දිනක පැය 3ක් උපකල්පනය කරයි. වේගය සකසන්න, නමුත් අනුපිළිවෙල මඟ නොහරින්න — ශ්‍රවණය අවසානයේ දියුණු වන බැවින්, එය මුලින්ම ආරම්භ විය යුතුය."},{"type":"weekplan","rows":[{"w":"Week 1–2","focus_en":"Foundation","task_en":"Irodori Starter/Elementary 1, units 1–6. Learn 20 words a day from the word lists at the back of this book. Listen to Part 3 audio once a day even if you understand nothing.","task_si":"Irodori Starter/Elementary 1, ඒකක 1–6. මෙම පොතේ පිටුපස වචන ලැයිස්තුවෙන් දිනකට වචන 20ක් ඉගෙන ගන්න. කිසිවක් නොතේරුණත් දිනකට වරක් Part 3 ශබ්දය අසන්න."},{"w":"Week 3–4","focus_en":"Characters & Vocabulary","task_en":"Part 2 Section 1 of this book, all 48 questions. Read every explanation, including the wrong answers. Write each kanji 5 times.","task_si":"මෙම පොතේ Part 2 කොටස 1, ප්‍රශ්න 48ම. වැරදි පිළිතුරු ඇතුළුව සෑම පැහැදිලි කිරීමක්ම කියවන්න. එක් එක් කන්ජි 5 වතාවක් ලියන්න."},{"w":"Week 4–5","focus_en":"Conversation","task_en":"Part 2 Section 2. Say every correct answer out loud 3 times. This section is about reflexes, not knowledge.","task_si":"Part 2 කොටස 2. සෑම නිවැරදි පිළිතුරක්ම හඬ නඟා 3 වතාවක් කියන්න. මෙම කොටස දැනුම නොව ප්‍රතීකයන් පිළිබඳයි."},{"w":"Week 5–6","focus_en":"Listening","task_en":"Part 2 Section 3. First listen without the script. Then read the script. Then shadow the audio — speak at the same time as the recording.","task_si":"Part 2 කොටස 3. පළමුව පිටපත නොමැතිව අසන්න. පසුව පිටපත කියවන්න. පසුව ශබ්දය අනුගමනය කරන්න — පටිගත කිරීම සමඟම කථා කරන්න."},{"w":"Week 6–7","focus_en":"Reading","task_en":"Part 2 Section 4. Time yourself: 90 seconds per question. Reading is where people run out of time on test day.","task_si":"Part 2 කොටස 4. කාලය ගණන් කරන්න: ප්‍රශ්නයකට තත්පර 90ක්. විභාග දිනයේ මිනිසුන්ට කාලය ඉවර වන්නේ කියවීමේදීය."},{"w":"Week 8","focus_en":"Mock test & repair","task_en":"Sit the mock test in Part 3 in one sitting, 60 minutes, no dictionary. Score it. Then go back and redo only the question types you got wrong.","task_si":"Part 3 හි ආදර්ශ විභාගය එක් වාරයකදී, විනාඩි 60ක්, ශබ්දකෝෂයක් නොමැතිව කරන්න. ලකුණු දෙන්න. පසුව ආපසු ගොස් ඔබට වැරදුණු ප්‍රශ්න වර්ග පමණක් නැවත කරන්න."}]},{"type":"callout","label_en":"The one habit that matters most","label_si":"වඩාත්ම වැදගත් එක් පුරුද්දක්","en":"Keep a 'mistake notebook'. Every question you get wrong, write three lines: the question, the correct answer, and WHY you chose the wrong one. Review it for 10 minutes before every study session. Students who do this move roughly twice as fast as students who only do new questions.","si":"'වැරදි සටහන් පොතක්' තබා ගන්න. ඔබට වැරදෙන සෑම ප්‍රශ්නයකටම පේළි තුනක් ලියන්න: ප්‍රශ්නය, නිවැරදි පිළිතුර, සහ ඔබ වැරදි එක තෝරා ගත්තේ ඇයි කියා. සෑම අධ්‍යයන සැසියකට පෙර විනාඩි 10ක් එය නැවත බලන්න. මෙය කරන සිසුන් නව ප්‍රශ්න පමණක් කරන සිසුන්ට වඩා දෙගුණයක් වේගයෙන් ඉදිරියට යයි."}]},{"id":"G6","title_en":"6. Free official materials you should be using","title_si":"6. ඔබ භාවිතා කළ යුතු නොමිලේ නිල ද්‍රව්‍ය","blocks":[{"type":"resources","items":[{"name":"いろどり 生活の日本語 (Irodori)","url":"https://www.irodori.jpf.go.jp/","en":"The official coursebook the test is based on. Free PDF, all levels, with audio. Starter → Elementary 1 covers A1; Elementary 2 covers A2. There is no Sinhala edition yet — use the English edition.","si":"විභාගය පදනම් වී ඇති නිල පාඨමාලා පොත. නොමිලේ PDF, සියලු මට්ටම්, ශබ්ද සමඟ. සිංහල සංස්කරණයක් තවම නැත — ඉංග්‍රීසි සංස්කරණය භාවිතා කරන්න."},{"name":"いろどり日本語オンラインコース","url":"https://www.irodori-online.jpf.go.jp/","en":"The same content as an interactive online course with video. Free.","si":"වීඩියෝ සමඟ අන්තර්ක්‍රියාකාරී මාර්ගගත පාඨමාලාවක් ලෙස එම අන්තර්ගතයමයි. නොමිලේ."},{"name":"JFにほんごeラーニング みなと (Minato)","url":"https://minato-jf.jp/","en":"The Japan Foundation's e-learning platform. Free courses with a teacher-supported option.","si":"Japan Foundation හි ඊ-ඉගෙනුම් වේදිකාව. ගුරු සහාය සහිත විකල්පයක් සමඟ නොමිලේ පාඨමාලා."},{"name":"Official sample questions","url":"https://www.jpf.go.jp/jft-basic/sample/q01.html","en":"The real screen layout of the CBT. Do these at least once so the interface is not new on test day.","si":"CBT හි සැබෑ තිර සැකැස්ම. විභාග දිනයේ අතුරුමුහුණත අලුත් නොවන ලෙස මේවා අවම වශයෙන් එක් වරක් කරන්න."},{"name":"Test schedule & booking (Prometric)","url":"https://www.prometric-jp.com/ssw/schedule/","en":"Test dates and reservations. Book early — Colombo seats fill.","si":"විභාග දින සහ වෙන් කිරීම්. කලින් වෙන් කරන්න — කොළඹ ආසන පිරී යයි."}]}]}],"strategies":[{"section":"moji","no":"1","name_ja":"文字と語彙","name_en":"Characters & Vocabulary","target_time_en":"8 minutes for 12 questions — about 40 seconds each","target_time_si":"ප්‍රශ්න 12කට විනාඩි 8ක් — එකකට තත්පර 40ක් පමණ","flow":[{"step":"1","en":"Read the underlined word FIRST, before the sentence.","si":"වාක්‍යයට පෙර, යටින් ඉරි ඇඳි වචනය මුලින්ම කියවන්න."},{"step":"2","en":"Decide the question type: reading? writing? meaning? Each type needs a different move.","si":"ප්‍රශ්න වර්ගය තීරණය කරන්න: කියවීමද? ලිවීමද? අර්ථයද?"},{"step":"3","en":"Say the word out loud in your head. Long vowels (おう/えい) and small つ decide most of these questions.","si":"වචනය ඔබේ හිසේ හඬ නඟා කියන්න. දිගු ස්වර සහ කුඩා つ මෙම ප්‍රශ්න බොහොමයක් තීරණය කරයි."},{"step":"4","en":"Cross out the two obviously wrong choices before choosing between the last two.","si":"අවසාන දෙක අතරින් තෝරා ගැනීමට පෙර පැහැදිලිවම වැරදි තේරීම් දෙක කපා දමන්න."},{"step":"5","en":"If you still do not know after 40 seconds, mark your best guess and move. Do not lose reading time here.","si":"තත්පර 40කට පසුවත් ඔබ නොදන්නේ නම්, හොඳම අනුමානය සලකුණු කර ඉදිරියට යන්න."}],"do_en":["Read the whole sentence — context tells you which of two similar words fits.","Watch for 音読み vs 訓読み: 人 is じん in 外国人 but ひと alone.","Learn workplace signage as pictures: 危険, 立入禁止, 非常口, 準備中."],"do_si":["මුළු වාක්‍යයම කියවන්න — සන්දර්භය ඔබට කියයි.","音読み සහ 訓読み අතර වෙනස බලන්න.","රැකියා ස්ථානයේ සලකුණු පින්තූර ලෙස ඉගෙන ගන්න."],"dont_en":["Do not translate into Sinhala or English. It costs 10 seconds per question and you do not have them.","Do not pick a choice just because you recognise it. Familiar ≠ correct.","Do not spend more than 60 seconds on any one question in this section."],"dont_si":["සිංහල හෝ ඉංග්‍රීසි භාෂාවට පරිවර්තනය නොකරන්න.","ඔබ හඳුනන නිසාම තේරීමක් නොගන්න.","මෙම කොටසේ එක් ප්‍රශ්නයකට තත්පර 60කට වඩා නොගන්න."]},{"section":"kaiwa","no":"2","name_ja":"会話と表現","name_en":"Conversation & Expression","target_time_en":"10 minutes for 12 questions — about 50 seconds each","target_time_si":"ප්‍රශ්න 12කට විනාඩි 10ක් — එකකට තත්පර 50ක් පමණ","flow":[{"step":"1","en":"Identify WHO is talking to WHOM. Boss to worker? Worker to boss? Friend to friend? This alone eliminates one or two choices.","si":"කවුරු කාට කථා කරනවාද යන්න හඳුනා ගන්න. මෙය පමණක් තේරීම් එකක් හෝ දෙකක් ඉවත් කරයි."},{"step":"2","en":"Identify the ACT: asking permission, making a request, apologising, refusing, reporting a problem.","si":"ක්‍රියාව හඳුනා ගන්න: අවසර ඉල්ලීම, ඉල්ලීමක් කිරීම, සමාව ඉල්ලීම, ප්‍රතික්ෂේප කිරීම, ගැටලුවක් වාර්තා කිරීම."},{"step":"3","en":"Check politeness level. To a superior: 〜ていただけませんか / 〜てもよろしいでしょうか. To a colleague: 〜てくれない? / 〜てもいい?","si":"ආචාරශීලී මට්ටම පරීක්ෂා කරන්න. ඉහළ නිලධාරියෙකුට වඩාත් ආචාරශීලී ආකෘති අවශ්‍යයි."},{"step":"4","en":"Read the choices as if you were saying them in that room. The wrong ones will sound strange — grammatically fine but socially wrong.","si":"ඔබ එම කාමරයේ ඒවා කියනවා සේ තේරීම් කියවන්න. වැරදි ඒවා අමුතු ලෙස ඇසෙනු ඇත."}],"do_en":["Memorise fixed phrases as whole blocks, not word by word: 「おつかれさまです」「しつれいします」「もういちど おねがいします」.","Remember the safety phrases. 「気分が悪いです」「危ないです」「わかりません」 protect your body and your job.","When in doubt, choose the more polite option — JFT-Basic scenarios are mostly workplace."],"do_si":["ස්ථාවර වාක්‍ය ඛණ්ඩ සම්පූර්ණ කොටස් ලෙස කටපාඩම් කරන්න.","ආරක්ෂිත වාක්‍ය ඛණ්ඩ මතක තබා ගන්න.","සැකයක් ඇති විට, වඩාත් ආචාරශීලී විකල්පය තෝරන්න."],"dont_en":["Do not choose casual forms (〜てね, 〜だよ) in a workplace scene.","Do not pick a grammatically perfect sentence that a subordinate would never say to a boss.","Do not overthink. Your first instinct in this section is right more often than your second."],"dont_si":["රැකියා ස්ථාන දර්ශනයක අවිධිමත් ආකෘති නොතෝරන්න.","යටත් නිලධාරියෙකු කිසිදා ලොක්කාට නොකියන වාක්‍යයක් නොතෝරන්න.","අධික ලෙස නොසිතන්න."]},{"section":"choukai","no":"3","name_ja":"聴解","name_en":"Listening","target_time_en":"20 minutes for 12 questions — the audio sets the pace","target_time_si":"ප්‍රශ්න 12කට විනාඩි 20ක් — ශබ්දය වේගය තීරණය කරයි","flow":[{"step":"1","en":"BEFORE the audio starts, read the question and the choices. You have a few seconds — use every one.","si":"ශබ්දය ආරම්භ වීමට පෙර, ප්‍රශ්නය සහ තේරීම් කියවන්න. ඔබට තත්පර කිහිපයක් තිබේ."},{"step":"2","en":"Decide what you are hunting for: a time? a number? a place? an action? Hold that one word in your mind.","si":"ඔබ සොයන්නේ කුමක්දැයි තීරණය කරන්න: වේලාවක්ද? අංකයක්ද? ස්ථානයක්ද? ක්‍රියාවක්ද?"},{"step":"3","en":"FIRST play: understand the situation. Do not try to catch every word. Write the numbers you hear on your scratch paper.","si":"පළමු වාදනය: තත්ත්වය තේරුම් ගන්න. සෑම වචනයක්ම අල්ලා ගැනීමට උත්සාහ නොකරන්න."},{"step":"4","en":"SECOND play: confirm the one detail the question asks for. This is what the second play is for.","si":"දෙවන වාදනය: ප්‍රශ්නය අසන එක් විස්තරය තහවුරු කරන්න."},{"step":"5","en":"Beware the change. Japanese conversations often say a plan, then change it: 「9時に…」「あ、やっぱり9時半に」. The answer is almost always the SECOND one.","si":"වෙනස ගැන පරෙස්සම් වන්න. ජපන් සංවාද බොහෝ විට සැලැස්මක් කියා පසුව එය වෙනස් කරයි. පිළිතුර සෑම විටම පාහේ දෙවැන්නයි."}],"do_en":["Practise numbers until they are automatic: 一時 vs 七時, 4日 vs 8日, 100円 vs 1000円.","Shadow the scripts in Part 4 out loud. Speaking the rhythm makes you hear the rhythm.","Listen to at least 10 minutes of Japanese every single day. Consistency beats intensity here."],"do_si":["අංක ස්වයංක්‍රීය වන තුරු පුහුණු වන්න.","Part 4 හි පිටපත් හඬ නඟා අනුගමනය කරන්න.","සෑම දිනකම අවම වශයෙන් විනාඩි 10ක් ජපන් භාෂාව අසන්න."],"dont_en":["Do not stop listening because you missed one word. Keep going — the answer may come later.","Do not choose a word just because you heard it. Distractors are built from words that appear in the audio.","Do not close your eyes to concentrate. Keep reading the choices while you listen."],"dont_si":["එක් වචනයක් අතපසු වූ නිසා ඇහුම්කන් දීම නවත්වන්න එපා.","ඔබට ඇසුණු නිසාම වචනයක් නොතෝරන්න.","අවධානය යොමු කිරීමට ඇස් වසා නොගන්න."]},{"section":"dokkai","no":"4","name_ja":"読解","name_en":"Reading","target_time_en":"18 minutes for 12 questions — about 90 seconds each","target_time_si":"ප්‍රශ්න 12කට විනාඩි 18ක් — එකකට තත්පර 90ක් පමණ","flow":[{"step":"1","en":"Read the QUESTION first, not the text. You are searching, not studying.","si":"පෙළ නොව, ප්‍රශ්නය මුලින්ම කියවන්න. ඔබ සොයමින් සිටී, අධ්‍යයනය නොකරයි."},{"step":"2","en":"Find the key word from the question inside the text. Put your finger on it (or your eyes on the screen position).","si":"පෙළ තුළ ප්‍රශ්නයේ මූල පදය සොයන්න."},{"step":"3","en":"Read only the two lines around it. Notices and tables hide the answer in one line, not in the whole document.","si":"එය වටා ඇති පේළි දෙක පමණක් කියවන්න. දැන්වීම් සහ වගු පිළිතුර එක් පේළියක සඟවයි."},{"step":"4","en":"For tables: find the ROW first (the day, the name, the item), then the COLUMN (the time, the price). Cross the two.","si":"වගු සඳහා: පළමුව පේළිය සොයන්න, පසුව තීරුව. දෙක හරස් කරන්න."},{"step":"5","en":"Check for exceptions: ただし, 〜以外, 〜のみ, ※. These small words are where the test hides the trap.","si":"ව්‍යතිරේක පරීක්ෂා කරන්න: ただし, 〜以外, 〜のみ, ※. මෙම කුඩා වචන තුළ විභාගය උගුල සඟවයි."}],"do_en":["Learn the notice vocabulary cold: お知らせ, 受付, 締切, 中止, 変更, 以上, 以内, 場合.","Practise reading dates and times in tables — most reading questions are really table questions.","If the text has a ※ or a bracketed note, read it. It usually contains the answer to the hardest question."],"do_si":["දැන්වීම් වචන මාලාව හොඳින් ඉගෙන ගන්න.","වගු තුළ දින සහ වේලාවන් කියවීම පුහුණු වන්න.","පෙළේ ※ ලකුණක් තිබේ නම්, එය කියවන්න."],"dont_en":["Do not read the text from the beginning to the end. You will run out of time.","Do not look up unknown kanji in your head. Skip it — you usually do not need it.","Do not leave reading for last on test day. Do sections in order, but keep 18 minutes in reserve."],"dont_si":["පෙළ මුල සිට අග දක්වා නොකියවන්න.","නොදන්නා කන්ජි ගැන කල්පනා නොකරන්න. එය මඟ හරින්න.","විභාග දිනයේ කියවීම අවසානයට නොතබන්න."]}]},"practice":{"moji":[{"id":"MV-A1-001","level":"A1","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"きょうは 会社{かいしゃ}を <u>休{やす}みます<\/u>。","choices":["すみます","のみます","やすみます","きゅうみます"],"answer":3,"explain_ja":"「休{やす}みます」は 「やすみます」と よみます。会社{かいしゃ}に 行{い}かない ことです。","explain_en":"休みます is read yasumimasu, 'to rest / to take a day off'. The kanji 休 has the kun-reading yasu- when it is followed by the okurigana み.","explain_si":"休みます කියවෙන්නේ 'yasumimasu' කියලායි. තේරුම 'විවේක ගැනීම / නිවාඩු ගැනීම'. 休 කන්ජි අකුරට පසුව おくりがな (okurigana) වන 「み」 එන විට, එය 「やす」 ලෙස කියවේ (訓読み — kun කියවීම).","why_wrong":["すみます is 住みます (to live somewhere); that word uses the kanji 住, not 休.","のみます is 飲みます (to drink); that word uses the kanji 飲, not 休.","きゅう is the on-reading of 休 (as in 休日 kyūjitsu), but it is never used together with the okurigana み."],"words":[{"ja":"休{やす}みます","en":"to rest, to take a day off","si":"නිවාඩු ගන්නවා"},{"ja":"会社{かいしゃ}","en":"company","si":"සමාගම"}],"why_wrong_si":["すみます යනු 住みます (කොහේ හෝ පදිංචිව සිටිනවා) කියන වචනයයි. එයට යොදන්නේ 住 කන්ජිය මිස 休 නොවේ.","のみます යනු 飲みます (බොනවා) කියන වචනයයි. එයට යොදන්නේ 飲 කන්ජිය මිස 休 නොවේ.","きゅう යනු 休 හි 音読み (on කියවීම) — 休日 (kyūjitsu) වැනි වචනවල එය එයි. නමුත් おくりがな 「み」 සමඟ එය කිසිදා යෙදෙන්නේ නැත."]},{"id":"MV-A1-002","level":"A1","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"まいあさ <u>六時{ろくじ}<\/u>に 会社{かいしゃ}へ 行{い}きます。","choices":["ろくじ","ろくとき","むじ","りくじ"],"answer":1,"explain_ja":"「六時{ろくじ}」は 「ろくじ」と よみます。時間{じかん}の 「時{じ}」は 「じ」です。","explain_en":"六時 is read rokuji. When 時 shows a clock time it is always read じ (ji), and 六 is ろく (roku).","explain_si":"六時 කියවෙන්නේ 'rokuji' කියලායි. 時 ඔරලෝසු වේලාව පෙන්වන විට සැමවිටම 「じ」 (ji) ලෙස කියවේ, සහ 六 යනු 「ろく」 (roku) වේ.","why_wrong":["ろくとき uses the kun-reading とき of 時; clock times always use じ.","むじ uses む, which appears in 六日 (むいか) only, not in 六時.","りく is the reading of 陸 (land); 六 is read ろく."],"words":[{"ja":"六時{ろくじ}","en":"six o'clock","si":"හය"},{"ja":"毎朝{まいあさ}","en":"every morning","si":"හැම උදෑසනකම"}],"why_wrong_si":["ろくとき හි 時 සඳහා 訓読み (kun කියවීම) වන 「とき」 යොදා ඇත; නමුත් ඔරලෝසු වේලාවට සැමවිටම 「じ」 යෙදේ.","むじ හි 「む」 යෙදෙන්නේ 六日 (むいか) කියන වචනයේ පමණයි, 六時 හි නොවේ.","りく යනු 陸 (ගොඩබිම) හි කියවීමයි; 六 කියවෙන්නේ 「ろく」 ලෙසයි."]},{"id":"MV-A1-003","level":"A1","section":"moji","type":"漢字の読み","scene":"すまい","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"ゴミは <u>外{そと}<\/u>に 出{だ}して ください。","choices":["うち","なか","ほか","そと"],"answer":4,"explain_ja":"「外{そと}」は 「そと」と よみます。たてものの 外{そと}の ことです。","explain_en":"外 is read そと (soto) here, meaning 'outside'. 外に出す means to put something outside the building.","explain_si":"මෙහි 外 කියවෙන්නේ 「そと」 (soto) ලෙසයි — තේරුම 'පිටත' යන්නයි. 外に出す යනු යමක් ගොඩනැගිල්ලෙන් පිටතට දැමීමයි.","why_wrong":["うち means 'inside / home' and is written 内 or 家, not 外.","なか means 'inside' and is written 中, not 外.","ほか means 'other' and is written 他; it is a different kanji and a different meaning."],"words":[{"ja":"外{そと}","en":"outside","si":"පිටත"},{"ja":"出{だ}します","en":"to put out, to take out","si":"පිටතට දානවා"}],"why_wrong_si":["うち යනු 'ඇතුළත / නිවස' යන්නයි; එය ලියන්නේ 内 හෝ 家 මිස 外 නොවේ.","なか යනු 'ඇතුළත' යන්නයි; එය ලියන්නේ 中 මිස 外 නොවේ.","ほか යනු 'වෙනත්' යන්නයි; එය ලියන්නේ 他 කන්ජියෙන් — අකුරත් තේරුමත් දෙකම වෙනස්."]},{"id":"MV-A1-004","level":"A1","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"この <u>水{みず}<\/u>は 飲{の}めません。","choices":["すい","みず","こおり","ゆ"],"answer":2,"explain_ja":"ひとつの ことばの ときは 「水{みず}」は 「みず」です。","explain_en":"When 水 stands alone as a noun it is read みず (mizu). すい is only used inside compounds such as 水道 (suidō).","explain_si":"水 නාම පදයක් ලෙස තනිව එන විට කියවෙන්නේ 「みず」 (mizu) ලෙසයි. 「すい」 යෙදෙන්නේ 水道 (suidō) වැනි සංයුක්ත වචන ඇතුළත පමණයි.","why_wrong":["すい is the on-reading, used only in compounds like 水道 (suidō, tap water), not on its own.","こおり means ice and is written 氷, a different kanji.","ゆ means hot water and is written 湯, a different kanji."],"words":[{"ja":"水{みず}","en":"water","si":"වතුර"},{"ja":"飲{の}めません","en":"cannot drink","si":"බොන්න බැහැ"}],"why_wrong_si":["すい යනු 音読み (on කියවීම); එය යෙදෙන්නේ 水道 (suidō — නල ජලය) වැනි සංයුක්ත වචනවල පමණයි, තනිව නොවේ.","こおり යනු අයිස්; එය ලියන්නේ 氷 කියන වෙනස් කන්ජියෙන්.","ゆ යනු උණු වතුර; එය ලියන්නේ 湯 කියන වෙනස් කන්ජියෙන්."]},{"id":"MV-A1-005","level":"A1","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"じむしょの <u>入口{いりぐち}<\/u>は こちらです。","choices":["いりぐち","にゅうぐち","いりくち","はいりぐち"],"answer":1,"explain_ja":"「入口{いりぐち}」は 「いりぐち」と よみます。たてものに 入{はい}る ところです。","explain_en":"入口 is read いりぐち (iriguchi). 入 takes the kun-reading いり and 口 becomes ぐち with rendaku (voicing).","explain_si":"入口 කියවෙන්නේ 「いりぐち」 (iriguchi) ලෙසයි. 入 සඳහා 訓読み (kun කියවීම) වන 「いり」 යෙදෙන අතර, 口 හඬ මාරුවකින් (rendaku) 「ぐち」 බවට පත් වේ.","why_wrong":["にゅう is the on-reading of 入; it is not mixed with the kun-reading ぐち in this sign word.","いりくち misses the rendaku: after いり, 口 becomes ぐち, not くち.","はいり comes from the verb 入ります; the sign word uses the shorter stem いり."],"words":[{"ja":"入口{いりぐち}","en":"entrance","si":"ඇතුල්වීමේ දොර"},{"ja":"事務所{じむしょ}","en":"office","si":"කාර්යාලය"}],"why_wrong_si":["にゅう යනු 入 හි 音読み (on කියවීම). මේ නාම පුවරු වචනයේ එය 訓読み වන 「ぐち」 සමඟ මිශ්‍ර නොකෙරේ.","いりくち හි හඬ මාරුව (rendaku) නැත. 「いり」 ට පසුව 口 「ぐち」 වේ, 「くち」 නොවේ.","はいり එන්නේ 入ります කියන ක්‍රියා පදයෙනි; නාම පුවරු වචනයට යොදන්නේ කෙටි 「いり」 රූපයයි."]},{"id":"MV-A1-006","level":"A1","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう よみますか。","context":null,"prompt":"一日{いちにち} <u>八時間{はちじかん}<\/u> はたらきます。","choices":["やじかん","はちときかん","はっじかん","はちじかん"],"answer":4,"explain_ja":"「八時間{はちじかん}」は 「はちじかん」と よみます。しごとの ながさを あらわします。","explain_en":"八時間 is read はちじかん (hachi-jikan), 'eight hours'. 八 is はち and 時間 is じかん.","explain_si":"八時間 කියවෙන්නේ 「はちじかん」 (hachi-jikan) ලෙසයි — තේරුම 'පැය අටක්'. 八 = はち, 時間 = じかん.","why_wrong":["や is used in 八つ (やっつ) only; with 時間 the reading is はち.","とき is the kun-reading of 時 used alone; in the word 時間 it must be じ.","はっ appears before some counters (八分 はっぷん), but before じかん the form stays はち."],"words":[{"ja":"八時間{はちじかん}","en":"eight hours","si":"පැය අටක්"},{"ja":"働{はたら}きます","en":"to work","si":"වැඩ කරනවා"}],"why_wrong_si":["「や」 යෙදෙන්නේ 八つ (やっつ) වැනි තැන්වල පමණයි; 時間 සමඟ එන කියවීම 「はち」 වේ.","「とき」 යනු 時 තනිව යෙදෙන විට එන 訓読み (kun කියවීම); 時間 කියන වචනය ඇතුළත එය 「じ」 විය යුතුයි.","「はっ」 සමහර ගණන් කිරීමේ පදවලට පෙර එයි (八分 はっぷん වැනි), නමුත් 「じかん」 ට පෙර රූපය 「はち」 ලෙසම පවතී."]},{"id":"MV-A1-007","level":"A1","section":"moji","type":"ひらがな→漢字","scene":"こうつう","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"まいにち <u>くるま<\/u>で 会社{かいしゃ}へ 行{い}きます。","choices":["事","車","重","東"],"answer":2,"explain_ja":"「くるま」は 「車{くるま}」と 書{か}きます。まん中{なか}に たての ぼうが あります。","explain_en":"くるま (car) is written 車. Notice the vertical line running through the middle and the two horizontal strokes.","explain_si":"くるま (කාර් රථය) ලියන්නේ 車 කියලායි. මැදින් යන සිරස් ඉරත්, තිරස් ඉරි දෙකත් සැලකිල්ලට ගන්න.","why_wrong":["事 means 'thing / matter' (こと) and has an extra hook at the top.","重 means 'heavy' (おもい); it looks similar to 車 but has extra strokes above and below.","東 means 'east' (ひがし); it is 木 plus 日, not 車."],"words":[{"ja":"車{くるま}","en":"car","si":"කාර් රථය"}],"why_wrong_si":["事 හි තේරුම 'දෙය / කාරණය' (こと) වන අතර, එහි උඩ කොටසේ අමතර හුක් ආකාර ඉරක් ඇත.","重 හි තේරුම 'බර' (おもい). එය 車 ට සමාන පෙනුමක් ඇතත්, උඩත් යටත් අමතර ඉරි ඇත.","東 හි තේරුම 'නැගෙනහිර' (ひがし). එය 木 සහ 日 එකතුවකි, 車 නොවේ."]},{"id":"MV-A1-008","level":"A1","section":"moji","type":"ひらがな→漢字","scene":"しごと","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"あしたは <u>やすみ<\/u>です。工場{こうじょう}へ 行{い}きません。","choices":["体み","木み","休み","林み"],"answer":3,"explain_ja":"「やすみ」は 「休{やす}み」と 書{か}きます。人{ひと}べんと 木{き}で できて います。","explain_en":"やすみ (day off) is written 休み: the person radical 亻 on the left plus 木 on the right.","explain_si":"やすみ (නිවාඩුව) ලියන්නේ 休み කියලායි: වම් පැත්තේ මිනිසා දක්වන 亻 කොටසත්, දකුණු පැත්තේ 木 කොටසත් එකතුවෙන්.","why_wrong":["体 means 'body' (からだ); the right side is 本, not 木.","木 alone means 'tree' (き) and cannot take the okurigana み.","林 means 'woods' (はやし) — two 木 side by side, not 亻 plus 木."],"words":[{"ja":"休{やす}み","en":"day off, holiday","si":"නිවාඩුව"},{"ja":"工場{こうじょう}","en":"factory","si":"කර්මාන්තශාලාව"}],"why_wrong_si":["体 හි තේරුම 'ශරීරය' (からだ). එහි දකුණු පැත්ත 本 මිස 木 නොවේ.","木 තනිව 'ගස' (き) යන්නයි; එයට おくりがな 「み」 එකතු කළ නොහැක.","林 හි තේරුම 'ගස් වදුල' (はやし) — එය 木 දෙකක් යාබදව ඇති රූපයයි, 亻 සහ 木 නොවේ."]},{"id":"MV-A1-009","level":"A1","section":"moji","type":"ひらがな→漢字","scene":"すまい","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"コップに <u>みず<\/u>を 入{い}れます。","choices":["水","氷","永","木"],"answer":1,"explain_ja":"「みず」は 「水{みず}」と 書{か}きます。よこの 点{てん}は ありません。","explain_en":"みず (water) is written 水 — four strokes with nothing added.","explain_si":"みず (වතුර) ලියන්නේ 水 කියලායි — ඉරි හතරක් පමණයි, අමතර කිසිවක් නැත.","why_wrong":["氷 means 'ice' (こおり); it is 水 with one extra dot on the left.","永 means 'eternal' (えい); it is 水 with an extra stroke on top.","木 means 'tree' (き); the shape is similar but it is a different kanji."],"words":[{"ja":"水{みず}","en":"water","si":"වතුර"}],"why_wrong_si":["氷 හි තේරුම 'අයිස්' (こおり); එය 水 ට වම් පසින් තිතක් එකතු කළ රූපයයි.","永 හි තේරුම 'සදාකාලික' (えい); එය 水 ට උඩින් අමතර ඉරක් එකතු කළ රූපයයි.","木 හි තේරුම 'ගස' (き); රූපය සමාන වුවත් එය වෙනස් කන්ජියකි."]},{"id":"MV-A1-010","level":"A1","section":"moji","type":"ひらがな→漢字","scene":"しごと","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"この へやに <u>はい<\/u>らないで ください。","choices":["人らないで","八らないで","込らないで","入らないで"],"answer":4,"explain_ja":"「はいらないで」は 「入{はい}らないで」と 書{か}きます。","explain_en":"はいる (to enter) is written 入る. The long stroke starts on the left and the short stroke touches it from the upper right.","explain_si":"はいる (ඇතුළු වෙනවා) ලියන්නේ 入る කියලායි. දිගු ඉර වම් පැත්තෙන් පටන් ගන්නා අතර, කෙටි ඉර උඩ දකුණු පැත්තෙන් ඇවිත් එයට ස්පර්ශ වේ.","why_wrong":["人 means 'person' (ひと); the two strokes cross at the top, unlike 入.","八 means 'eight' (はち); its two strokes never touch each other.","込 (こむ) is used in 申し込む and always carries the しんにょう radical; it is not read はいる."],"words":[{"ja":"入{はい}ります","en":"to enter","si":"ඇතුල් වෙනවා"},{"ja":"部屋{へや}","en":"room","si":"කාමරය"}],"why_wrong_si":["人 හි තේරුම 'මිනිසා' (ひと); එහි ඉරි දෙක උඩින් හරස් වේ — 入 මෙන් නොවේ.","八 හි තේරුම 'අට' (はち); එහි ඉරි දෙක කිසිසේත් එකිනෙකට ස්පර්ශ නොවේ.","込 (こむ) යෙදෙන්නේ 申し込む වැනි වචනවලයි; එහි සැමවිටම しんにょう කොටස ඇත. එය はいる ලෙස කියවෙන්නේ නැත."]},{"id":"MV-A1-011","level":"A1","section":"moji","type":"カタカナ語","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"おもい にもつは ＿＿＿で 三階{さんがい}へ はこびます。","choices":["カレンダー","テーブル","エレベーター","シャワー"],"answer":3,"explain_ja":"上{うえ}の かいへ にもつを はこぶ ときは 「エレベーター」を つかいます。","explain_en":"エレベーター (elevator) is the machine that carries people and heavy loads to another floor, so it fits 三階へ運びます.","explain_si":"エレベーター (ලිෆ්ට් එක) යනු මිනිසුන් සහ බර භාණ්ඩ වෙනත් තට්ටුවකට ගෙන යන යන්ත්‍රයයි. එනිසා 三階へ運びます සමඟ ගැළපෙන්නේ එයයි.","why_wrong":["カレンダー is a calendar on the wall; it cannot carry anything.","テーブル is a table; you can put luggage on it but not move it to another floor.","シャワー is a shower in a bathroom and has nothing to do with carrying luggage."],"words":[{"ja":"エレベーター","en":"elevator","si":"ලිෆ්ට් එක"},{"ja":"荷物{にもつ}","en":"luggage, goods","si":"බඩු"}],"why_wrong_si":["カレンダー යනු බිත්තියේ එල්ලෙන දින දර්ශනයයි; එයට කිසිවක් ගෙන යා නොහැක.","テーブル යනු මේසයයි; ඒ මත බඩු තැබිය හැකි නමුත් වෙනත් තට්ටුවකට ගෙන යා නොහැක.","シャワー යනු නාන කාමරයේ ෂවර් එකයි; බඩු ගෙන යාම සමඟ කිසිදු සම්බන්ධයක් නැත."]},{"id":"MV-A1-012","level":"A1","section":"moji","type":"カタカナ語","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"しごとを はじめる まえに ＿＿＿を おします。じかんが きろくされます。","choices":["タイムカード","レシート","メニュー","ポスター"],"answer":1,"explain_ja":"しごとの じかんを きろくする カードは 「タイムカード」です。","explain_en":"タイムカード (time card) is the card you punch at the start and end of a shift so your working hours are recorded.","explain_si":"タイムカード (ටයිම් කාඩ්) යනු වැඩ මුරය ආරම්භයේදීත් අවසානයේදීත් යන්ත්‍රයට දමා සලකුණු කරන කාඩ්පතයි. එමගින් ඔබේ වැඩ පැය ගණන සටහන් වේ.","why_wrong":["レシート is the receipt you get in a shop after paying, not a work-time record.","メニュー is the list of food in a restaurant.","ポスター is a poster put on a wall to show information."],"words":[{"ja":"タイムカード","en":"time card","si":"ටයිම් කාඩ්"},{"ja":"押{お}します","en":"to push, to punch (a card)","si":"තද කරනවා"}],"why_wrong_si":["レシート යනු සාප්පුවක මුදල් ගෙවූ පසු ලැබෙන රිසිට්පතයි; වැඩ වේලාවේ වාර්තාවක් නොවේ.","メニュー යනු අවන්හලක ආහාර ලැයිස්තුවයි.","ポスター යනු තොරතුරු පෙන්වීමට බිත්තියේ අලවන පෝස්ටරයයි."]},{"id":"MV-A1-013","level":"A1","section":"moji","type":"カタカナ語","scene":"かいもの","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"コンビニで おかねを はらって、＿＿＿を もらいました。","choices":["ノート","テキスト","チケット","レシート"],"answer":4,"explain_ja":"みせで おかねを はらった あとに もらう かみは 「レシート」です。","explain_en":"レシート (receipt) is the small paper the shop gives you after you pay.","explain_si":"レシート (රිසිට්පත) යනු මුදල් ගෙවූ පසු සාප්පුවෙන් දෙන කුඩා කඩදාසියයි.","why_wrong":["ノート is a notebook you write in; the shop does not hand you one.","テキスト is a textbook used for studying.","チケット is a ticket for a train, a bus or a concert, not proof of payment in a convenience store."],"words":[{"ja":"レシート","en":"receipt","si":"රිසිට්පත"},{"ja":"払{はら}います","en":"to pay","si":"ගෙවනවා"}],"why_wrong_si":["ノート යනු ලිවීමට යොදන සටහන් පොතයි; සාප්පුවෙන් එවැන්නක් අතට දෙන්නේ නැත.","テキスト යනු ඉගෙනීමට යොදන පෙළ පොතයි.","チケット යනු දුම්රිය, බස් හෝ ප්‍රසංගයක ටිකට් පතයි; සාප්පුවක මුදල් ගෙවූ බවට සාක්ෂියක් නොවේ."]},{"id":"MV-A1-014","level":"A1","section":"moji","type":"語彙の意味","scene":"びょういん","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"あたまが ＿＿＿ですから、びょういんへ 行{い}きます。","choices":["たかい","いたい","ながい","あかるい"],"answer":2,"explain_ja":"からだが わるい ときは 「いたい」を つかいます。","explain_en":"いたい means 'painful / it hurts'. 頭がいたい is the normal way to say 'I have a headache', which is why you go to hospital.","explain_si":"いたい යනු 'රිදෙනවා' යන්නයි. 頭がいたい යනු 'මට හිසරදයක් තියෙනවා' කීමට යොදන සාමාන්‍ය ක්‍රමයයි — ඒ නිසයි රෝහලට යන්නේ.","why_wrong":["たかい means 'expensive / tall' and does not describe pain.","ながい means 'long' and is used for length, not for the body hurting.","あかるい means 'bright' and is used for rooms or lights."],"words":[{"ja":"痛{いた}い","en":"painful, sore","si":"රිදෙනවා"},{"ja":"病院{びょういん}","en":"hospital","si":"රෝහල"}],"why_wrong_si":["たかい යනු 'මිල අධිකයි / උසයි' යන්නයි; එය වේදනාව විස්තර නොකරයි.","ながい යනු 'දිගයි' යන්නයි; එය දිග ගැන යෙදෙන වචනයක් මිස ශරීරය රිදීම ගැන නොවේ.","あかるい යනු 'ආලෝකමත්' යන්නයි; එය කාමර හෝ ලාම්පු ගැන යෙදේ."]},{"id":"MV-A1-015","level":"A1","section":"moji","type":"語彙の意味","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"しごとが おわってから、ほうきで へやを ＿＿＿します。","choices":["せんたく","りょうり","そうじ","かいもの"],"answer":3,"explain_ja":"へやを きれいに する ことは 「そうじ」です。ほうきや そうじきを つかいます。","explain_en":"そうじ means cleaning a room or a building. A broom (ほうき) is a cleaning tool, so そうじ is the only word that fits.","explain_si":"そうじ යනු කාමරයක් හෝ ගොඩනැගිල්ලක් පිරිසිදු කිරීමයි. ほうき (කොස්ස) යනු පිරිසිදු කිරීමේ උපකරණයක් නිසා, ගැළපෙන එකම වචනය そうじ වේ.","why_wrong":["せんたく means washing clothes, which is done with a washing machine, not a broom.","りょうり means cooking food, done in a kitchen.","かいもの means shopping, done at a shop."],"words":[{"ja":"掃除{そうじ}","en":"cleaning","si":"පිරිසිදු කිරීම"},{"ja":"部屋{へや}","en":"room","si":"කාමරය"}],"why_wrong_si":["せんたく යනු රෙදි සේදීමයි; එය කරන්නේ රෙදි සෝදන යන්ත්‍රයෙන් මිස කොස්සකින් නොවේ.","りょうり යනු ආහාර පිසීමයි; එය කරන්නේ මුළුතැන්ගෙයෙහිය.","かいもの යනු සාප්පු සවාරි යාමයි; එය කරන්නේ සාප්පුවේය."]},{"id":"MV-A1-016","level":"A1","section":"moji","type":"語彙の意味","scene":"すまい","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"げんかんで くつを ＿＿＿から、へやに 入{はい}ります。","choices":["ぬいで","きて","かけて","あけて"],"answer":1,"explain_ja":"くつを とる ことは 「ぬぐ」です。日本{にほん}の いえでは げんかんで くつを ぬぎます。","explain_en":"ぬぐ means to take off clothes or shoes. In a Japanese home you take your shoes off at the entrance (げんかん).","explain_si":"ぬぐ යනු ඇඳුම් හෝ සපත්තු ගැලවීමයි. ජපන් නිවසක ඇතුළු වන දොරටුවේදී (げんかん) සපත්තු ගලවනවා.","why_wrong":["きて (着て) means putting clothes on, the opposite action.","かけて is used for hanging something up or wearing glasses, not for removing shoes.","あけて (開けて) means opening a door or a window."],"words":[{"ja":"脱{ぬ}ぎます","en":"to take off (shoes, clothes)","si":"ගලවනවා"},{"ja":"玄関{げんかん}","en":"entrance hall","si":"දොරටුව"}],"why_wrong_si":["きて (着て) යනු ඇඳුම් ඇඳ ගැනීමයි — ප්‍රතිවිරුද්ධ ක්‍රියාවයි.","かけて යෙදෙන්නේ යමක් එල්ලීමට හෝ කණ්ණාඩි පැළඳීමටයි; සපත්තු ගැලවීමට නොවේ.","あけて (開けて) යනු දොරක් හෝ ජනේලයක් ඇරීමයි."]},{"id":"MV-A1-017","level":"A1","section":"moji","type":"語彙の意味","scene":"こうつう","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"まいあさ 七時{しちじ}に えきの まえで バスに ＿＿＿。","choices":["あがります","つきます","はいります","のります"],"answer":4,"explain_ja":"バスや でんしゃを つかう ときは 「のります」と 言{い}います。","explain_en":"For getting on a bus, train or bicycle Japanese uses 〜に乗ります. This is the fixed pattern for vehicles.","explain_si":"බස්, දුම්රිය හෝ බයිසිකලයකට නැගීමට ජපන් භාෂාවේ යොදන්නේ 〜に乗ります යන රටාවයි. වාහන සඳහා මෙය ස්ථිර රටාවකි.","why_wrong":["あがります means to go up (stairs, a floor) and is not used for boarding a vehicle.","つきます means to arrive at a place; you would say バスがつきます, not バスにつきます for boarding.","はいります means entering a room or a building, not boarding a bus."],"words":[{"ja":"乗{の}ります","en":"to get on, to board","si":"නගිනවා"},{"ja":"駅{えき}","en":"station","si":"දුම්රිය ස්ථානය"}],"why_wrong_si":["あがります යනු උඩට යාමයි (පඩි, තට්ටු); වාහනයකට නැගීමට එය නොයෙදේ.","つきます යනු තැනකට පැමිණීමයි; නැගීම කියන්නට バスにつきます නොව, バスがつきます (බස් එක එනවා) වැනි ලෙස පමණක් යෙදේ.","はいります යනු කාමරයකට හෝ ගොඩනැගිල්ලකට ඇතුළු වීමයි; බස් රථයකට නැගීම නොවේ."]},{"id":"MV-A1-018","level":"A1","section":"moji","type":"語彙の意味","scene":"びょういん","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"きのうから ねつが あります。きょうは ＿＿＿が わるいですから、しごとを 休{やす}みます。","choices":["てんき","ぐあい","ばしょ","じかん"],"answer":2,"explain_ja":"からだの ちょうしの ことを 「ぐあい」と 言{い}います。「ぐあいが わるい」は びょうきの ときの ことばです。","explain_en":"ぐあい means physical condition. ぐあいがわるい is the standard way to tell your workplace that you feel ill.","explain_si":"ぐあい යනු ශරීරයේ තත්ත්වයයි. ぐあいがわるい යනු තමන් අසනීප බව රැකියා ස්ථානයට දැනුම් දීමට යොදන සම්මත ක්‍රමයයි.","why_wrong":["てんき means the weather; bad weather is not a reason connected to having a fever.","ばしょ means place or location, which does not go with ねつがあります.","じかん means time; じかんがわるい is not natural Japanese."],"words":[{"ja":"具合{ぐあい}","en":"physical condition","si":"සිරුරේ තත්ත්වය"},{"ja":"熱{ねつ}","en":"fever","si":"උණ"}],"why_wrong_si":["てんき යනු කාලගුණයයි; උණ තිබීම සමඟ නරක කාලගුණයට සම්බන්ධයක් නැත.","ばしょ යනු ස්ථානය හෝ තැනයි; එය ねつがあります සමඟ නොගැළපේ.","じかん යනු වේලාවයි; じかんがわるい යනු ස්වාභාවික ජපන් ප්‍රකාශයක් නොවේ."]},{"id":"MV-A1-019","level":"A1","section":"moji","type":"語彙の意味","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"この にもつは ＿＿＿ですから、二人{ふたり}で もちます。","choices":["かるい","はやい","おもい","ちいさい"],"answer":3,"explain_ja":"一人{ひとり}で もてない にもつは 「おもい」です。","explain_en":"おもい means heavy. Two people are needed precisely because the load is heavy.","explain_si":"おもい යනු 'බර' යන්නයි. භාණ්ඩය බර නිසාම තමයි දෙදෙනෙක් අවශ්‍ය වන්නේ.","why_wrong":["かるい means light; if it were light one person could carry it alone.","はやい means fast or early and does not describe a load.","ちいさい means small; a small box would not need two people."],"words":[{"ja":"重{おも}い","en":"heavy","si":"බරයි"},{"ja":"荷物{にもつ}","en":"luggage, load","si":"බඩු"}],"why_wrong_si":["かるい යනු 'සැහැල්ලු' යන්නයි; සැහැල්ලු නම් එක් අයෙකුට තනිවම ගෙන යා හැක.","はやい යනු 'වේගවත් / කලින්' යන්නයි; භාණ්ඩයක් විස්තර කිරීමට එය නොයෙදේ.","ちいさい යනු 'කුඩා' යන්නයි; කුඩා පෙට්ටියකට දෙදෙනෙක් අවශ්‍ය නොවේ."]},{"id":"MV-A1-020","level":"A1","section":"moji","type":"表示・標識の語","scene":"しごと","stem":"この 表示{ひょうじ}の いみは どれですか。","context":null,"prompt":"工場{こうじょう}の きかいの 前{まえ}に 「立入禁止{たちいりきんし}」と 書{か}いて あります。","choices":["ここに 入{はい}っては いけません。","ここで 写真{しゃしん}を とっては いけません。","ここで たばこを すっては いけません。","ここに 車{くるま}を とめては いけません。"],"answer":1,"explain_ja":"「立入禁止{たちいりきんし}」は 「入{はい}っては いけません」と いう いみです。","explain_en":"立入 means entering and 禁止 means prohibited, so 立入禁止 tells you that you must not go into that area.","explain_si":"立入 යනු ඇතුළු වීම, 禁止 යනු තහනම් යන්නයි. එනිසා 立入禁止 කියන්නේ ඒ ප්‍රදේශයට ඇතුළු නොවිය යුතු බවයි.","why_wrong":["Taking photos is forbidden by a different sign, 撮影禁止.","Smoking is forbidden by 禁煙, not by 立入禁止.","Parking is forbidden by 駐車禁止; 立入禁止 is about people, not cars."],"words":[{"ja":"立入禁止{たちいりきんし}","en":"no entry, keep out","si":"ඇතුල් වීම තහනම්"},{"ja":"機械{きかい}","en":"machine","si":"යන්ත්‍රය"}],"why_wrong_si":["ඡායාරූප ගැනීම තහනම් කරන්නේ 撮影禁止 කියන වෙනස් සලකුණෙනි.","දුම්පානය තහනම් කරන්නේ 禁煙 මගිනි, 立入禁止 මගින් නොවේ.","වාහන නැවැත්වීම තහනම් කරන්නේ 駐車禁止 මගිනි; 立入禁止 සම්බන්ධ වන්නේ මිනිසුන්ට මිස වාහනවලට නොවේ."]},{"id":"MV-A1-021","level":"A1","section":"moji","type":"言いかえ","scene":"しごと","stem":"つぎの ぶんと だいたい 同{おな}じ いみの ぶんは どれですか。","context":null,"prompt":"この しごとは かんたんです。","choices":["この しごとは むずかしいです。","この しごとは たいへんです。","この しごとは やさしいです。","この しごとは いそがしいです。"],"answer":3,"explain_ja":"「かんたん」と 「やさしい」は だいたい 同{おな}じ いみです。","explain_en":"かんたん (simple) and やさしい (easy) have almost the same meaning when describing a task.","explain_si":"කාර්යයක් විස්තර කරන විට かんたん (සරලයි) සහ やさしい (පහසුයි) යන දෙකෙහිම තේරුම පාහේ එකයි.","why_wrong":["むずかしい (difficult) is the opposite of かんたん.","たいへん means 'tough / hard going', also the opposite meaning.","いそがしい means 'busy', which is about the amount of work, not about how easy it is."],"words":[{"ja":"簡単{かんたん}","en":"simple, easy","si":"පහසුයි"},{"ja":"易{やさ}しい","en":"easy","si":"පහසුයි"}],"why_wrong_si":["むずかしい (අමාරුයි) යනු かんたん හි ප්‍රතිවිරුද්ධ අර්ථයයි.","たいへん යනු 'දුෂ්කරයි / කරදරයි' යන්නයි — එයත් ප්‍රතිවිරුද්ධ අර්ථයයි.","いそがしい යනු 'කාර්යබහුලයි' යන්නයි; එය වැඩ ප්‍රමාණය ගැන මිස පහසුද අමාරුද යන්න ගැන නොවේ."]},{"id":"MV-A1-022","level":"A1","section":"moji","type":"言いかえ","scene":"すまい","stem":"つぎの ぶんと だいたい 同{おな}じ いみの ぶんは どれですか。","context":null,"prompt":"この へやは 禁煙{きんえん}です。","choices":["この へやで たばこを すっても いいです。","この へやで ごはんを 食{た}べては いけません。","この へやに 入{はい}っては いけません。","この へやで たばこを すっては いけません。"],"answer":4,"explain_ja":"「禁煙{きんえん}」は たばこを すっては いけないと いう いみです。","explain_en":"禁煙 is made of 禁 (prohibit) and 煙 (smoke), so it means 'no smoking' in this room.","explain_si":"禁煙 යනු 禁 (තහනම්) සහ 煙 (දුම) එකතුවකි. එනිසා එහි තේරුම මේ කාමරයේ දුම්පානය තහනම් යන්නයි.","why_wrong":["This says smoking is allowed, the opposite of 禁煙.","禁煙 says nothing about eating; only smoking is forbidden.","禁煙 does not stop you entering the room; you may enter but not smoke."],"words":[{"ja":"禁煙{きんえん}","en":"no smoking","si":"දුම්පානය තහනම්"},{"ja":"吸{す}います","en":"to smoke, to inhale","si":"බොනවා (දුම්)"}],"why_wrong_si":["මෙයින් කියවෙන්නේ දුම්පානය කළ හැකි බවයි — 禁煙 හි ප්‍රතිවිරුද්ධ අර්ථයයි.","禁煙 කෑම ගැන කිසිවක් නොකියයි; තහනම් වන්නේ දුම්පානය පමණයි.","禁煙 කාමරයට ඇතුළු වීම වළක්වන්නේ නැත; ඇතුළු විය හැක, නමුත් දුම් බොන්නට බැහැ."]},{"id":"MV-A1-023","level":"A1","section":"moji","type":"表示・標識の語","scene":"きんきゅう","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"火事{かじ}の とき、この ドアから 外{そと}に 出{で}ます。ドアの しるしは 「＿＿＿」です。","choices":["受付{うけつけ}","非常口{ひじょうぐち}","入口{いりぐち}","駐車場{ちゅうしゃじょう}"],"answer":2,"explain_ja":"火事{かじ}や じしんの とき、にげる ドアは 「非常口{ひじょうぐち}」です。みどりの しるしが あります。","explain_en":"非常口 means 'emergency exit'. In Japan it is shown by a green sign with a running person, used in a fire or earthquake.","explain_si":"非常口 යනු 'හදිසි පිටවීමේ දොර' යන්නයි. ජපානයේ එය දුවන මිනිසෙකුගේ රූපය සහිත කොළ පාට සලකුණකින් පෙන්වයි; ගිනි ගැනීමකදී හෝ භූමිකම්පාවකදී එය භාවිතා කරයි.","why_wrong":["受付 is the reception desk where you check in, not a way to escape.","入口 is the normal entrance for coming in, not the emergency door.","駐車場 is a car park, which has nothing to do with escaping from a fire."],"words":[{"ja":"非常口{ひじょうぐち}","en":"emergency exit","si":"හදිසි පිටවීමේ දොර"},{"ja":"火事{かじ}","en":"fire (disaster)","si":"ගින්න"}],"why_wrong_si":["受付 යනු ලියාපදිංචි වන පිළිගැනීමේ කවුන්ටරයයි; පලා යාමේ මාර්ගයක් නොවේ.","入口 යනු ඇතුළු වීමට යොදන සාමාන්‍ය දොරයි; හදිසි දොර නොවේ.","駐車場 යනු වාහන නැවැත්වීමේ ස්ථානයයි; ගින්නකින් පලා යාම සමඟ කිසිදු සම්බන්ධයක් නැත."]},{"id":"MV-A1-024","level":"A1","section":"moji","type":"表示・標識の語","scene":"かいもの","stem":"この 店{みせ}は いま どうですか。","context":null,"prompt":"店{みせ}の ドアに 「準備中{じゅんびちゅう}」と 書{か}いて あります。","choices":["いま 買{か}い物{もの}が できます。","いま まだ 店{みせ}は あいて いません。","この 店{みせ}は なくなりました。","この 店{みせ}は 一日{いちにち}じゅう 休{やす}みです。"],"answer":2,"explain_ja":"「準備中{じゅんびちゅう}」は 店{みせ}を あける じゅんびを して いる ことです。まだ 入{はい}れません。","explain_en":"準備中 means 'getting ready'. The shop is not open yet, so customers cannot go in for now.","explain_si":"準備中 යනු 'සූදානම් වෙමින් පවතී' යන්නයි. සාප්පුව තවම විවෘත කර නැති නිසා, දැනට ගනුදෙනුකරුවන්ට ඇතුළු විය නොහැක.","why_wrong":["Shopping is possible only when the sign says 営業中 (open for business).","準備中 does not mean the shop has closed down for good.","準備中 is a temporary state; later the same day the shop will change the sign to 営業中."],"words":[{"ja":"準備中{じゅんびちゅう}","en":"preparing, not open yet","si":"සූදානම් වෙමින්"},{"ja":"営業中{えいぎょうちゅう}","en":"open for business","si":"විවෘතයි"}],"why_wrong_si":["සාප්පු යාම කළ හැක්කේ 営業中 (විවෘතයි) කියා සලකුණ තිබෙන විට පමණයි.","準備中 කියන්නේ සාප්පුව සදහටම වසා දමා ඇති බව නොවේ.","準備中 යනු තාවකාලික තත්ත්වයකි; එදිනම පසුව සාප්පුව එම සලකුණ 営業中 ලෙස වෙනස් කරයි."]},{"id":"MV-A2-001","level":"A2","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう 読{よ}みますか。","context":null,"prompt":"工事{こうじ}の げんばでは <u>安全{あんぜん}<\/u>が いちばん 大切{たいせつ}です。","choices":["あんしん","あんぜん","やすぜん","あんせん"],"answer":2,"explain_ja":"「安全{あんぜん}」は 「あんぜん」と 読{よ}みます。けがを しないように する ことです。","explain_en":"安全 is read あんぜん (anzen), 'safety'. 安 is あん and 全 is ぜん with a voiced z sound.","explain_si":"安全 කියවෙන්නේ 「あんぜん」 (anzen) ලෙසයි — තේරුම 'ආරක්ෂාව'. 安 = あん, සහ 全 = ぜん (හඬ සහිත 'z' ශබ්දයෙන්).","why_wrong":["あんしん is 安心 (peace of mind); the second kanji there is 心, not 全.","やす is the kun-reading of 安 (安い, cheap); it is not mixed with the on-reading ぜん.","あんせん leaves 全 unvoiced; in this compound it must be ぜん."],"words":[{"ja":"安全{あんぜん}","en":"safety","si":"ආරක්ෂාව"},{"ja":"現場{げんば}","en":"work site","si":"වැඩ බිම"}],"why_wrong_si":["あんしん යනු 安心 (සිතේ සැනසීම); එහි දෙවන කන්ජිය 心 මිස 全 නොවේ.","やす යනු 安 හි 訓読み (kun කියවීම — 安い, මිල අඩුයි); එය 音読み වන 「ぜん」 සමඟ මිශ්‍ර නොකෙරේ.","あんせん හි 全 හඬ රහිතව තබා ඇත; මේ සංයුක්ත වචනයේ එය 「ぜん」 විය යුතුයි."]},{"id":"MV-A2-002","level":"A2","section":"moji","type":"漢字の読み","scene":"こうつう","stem":"＿＿の ことばは どう 読{よ}みますか。","context":null,"prompt":"トラックに 乗{の}る 前{まえ}に、タイヤを <u>点検{てんけん}<\/u>します。","choices":["てんけん","てんげん","ちゅうけん","てんこう"],"answer":1,"explain_ja":"「点検{てんけん}」は 「てんけん」と 読{よ}みます。こわれて いないか しらべる ことです。","explain_en":"点検 is read てんけん (tenken), 'inspection / check'. Drivers do a 点検 of tyres and lights before driving.","explain_si":"点検 කියවෙන්නේ 「てんけん」 (tenken) ලෙසයි — තේරුම 'පරීක්ෂා කිරීම'. රියදුරන් රිය පැදවීමට පෙර ටයර් සහ ලයිට් 点検 කරයි.","why_wrong":["てんげん voices 検 wrongly; 検 stays けん in this word.","ちゅう is the reading of 中 or 注, not of 点.","てんこう is 天候 (weather) or 転校 (changing school); the second kanji is different."],"words":[{"ja":"点検{てんけん}","en":"inspection, check","si":"පරීක්ෂා කිරීම"},{"ja":"前{まえ}に","en":"before","si":"පෙර"}],"why_wrong_si":["てんげん හි 検 වැරදියට හඬ සහිත කර ඇත; මේ වචනයේ 検 「けん」 ලෙසම පවතී.","ちゅう යනු 中 හෝ 注 හි කියවීමයි, 点 හි නොවේ.","てんこう යනු 天候 (කාලගුණය) හෝ 転校 (පාසල මාරු වීම); දෙවන කන්ජිය වෙනස්."]},{"id":"MV-A2-003","level":"A2","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう 読{よ}みますか。","context":null,"prompt":"今月{こんげつ}の <u>給料{きゅうりょう}<\/u>は 25日{にち}に ぎんこうに 入{はい}ります。","choices":["きゅうりょ","こうりょう","きゅりょう","きゅうりょう"],"answer":4,"explain_ja":"「給料{きゅうりょう}」は 「きゅうりょう」と 読{よ}みます。はたらいて もらう おかねです。","explain_en":"給料 is read きゅうりょう (kyūryō), 'salary / wages'. Both syllables are long: きゅう and りょう.","explain_si":"給料 කියවෙන්නේ 「きゅうりょう」 (kyūryō) ලෙසයි — තේරුම 'වැටුප'. කොටස් දෙකෙහිම දිගු ස්වර (long vowel) ඇත: きゅう සහ りょう.","why_wrong":["きゅうりょ drops the long vowel of 料; it must be りょう.","こうりょう uses the wrong reading for 給; 給 is きゅう.","きゅりょう shortens 給; the first syllable must be きゅう."],"words":[{"ja":"給料{きゅうりょう}","en":"salary, wages","si":"වැටුප"},{"ja":"今月{こんげつ}","en":"this month","si":"මේ මාසය"}],"why_wrong_si":["きゅうりょ හි 料 හි දිගු ස්වරය අත්හැර ඇත; එය 「りょう」 විය යුතුයි.","こうりょう හි 給 සඳහා වැරදි කියවීමක් යොදා ඇත; 給 යනු 「きゅう」 වේ.","きゅりょう හි 給 කෙටි කර ඇත; පළමු කොටස 「きゅう」 විය යුතුයි."]},{"id":"MV-A2-004","level":"A2","section":"moji","type":"漢字の読み","scene":"すまい","stem":"＿＿の ことばは どう 読{よ}みますか。","context":null,"prompt":"寮{りょう}の <u>洗濯{せんたく}<\/u>きは 一階{いっかい}に あります。","choices":["せんぱく","せんだく","せんたく","あらたく"],"answer":3,"explain_ja":"「洗濯{せんたく}」は 「せんたく」と 読{よ}みます。ふくを あらう ことです。","explain_en":"洗濯 is read せんたく (sentaku), 'laundry'. 洗濯き (washing machine) is the machine in the dormitory.","explain_si":"洗濯 කියවෙන්නේ 「せんたく」 (sentaku) ලෙසයි — තේරුම 'රෙදි සේදීම'. 洗濯き (රෙදි සෝදන යන්ත්‍රය) යනු නේවාසිකාගාරයේ ඇති යන්ත්‍රයයි.","why_wrong":["せんぱく is 船舶 (ships); the second kanji is completely different.","せんだく wrongly voices 濯; the reading stays たく.","あらう is the kun-reading of 洗 used alone (洗います); it is not used inside the compound 洗濯."],"words":[{"ja":"洗濯{せんたく}","en":"laundry, washing","si":"රෙදි සේදීම"},{"ja":"寮{りょう}","en":"dormitory","si":"නේවාසිකාගාරය"}],"why_wrong_si":["せんぱく යනු 船舶 (නැව්); දෙවන කන්ජිය සම්පූර්ණයෙන්ම වෙනස්.","せんだく හි 濯 වැරදියට හඬ සහිත කර ඇත; කියවීම 「たく」 ලෙසම පවතී.","あらう යනු 洗 තනිව යෙදෙන විට එන 訓読み (kun කියවීම — 洗います); සංයුක්ත වචනය වන 洗濯 ඇතුළත එය නොයෙදේ."]},{"id":"MV-A2-005","level":"A2","section":"moji","type":"漢字の読み","scene":"しごと","stem":"＿＿の ことばは どう 読{よ}みますか。","context":null,"prompt":"ゆかが ぬれて います。すべらないように <u>注意{ちゅうい}<\/u>して ください。","choices":["ちゅい","じゅうい","ちゅうき","ちゅうい"],"answer":4,"explain_ja":"「注意{ちゅうい}」は 「ちゅうい」と 読{よ}みます。気{き}を つける ことです。","explain_en":"注意 is read ちゅうい (chūi), 'caution / be careful'. It appears on many workplace warning signs.","explain_si":"注意 කියවෙන්නේ 「ちゅうい」 (chūi) ලෙසයි — තේරුම 'පරෙස්සම් වන්න'. එය රැකියා ස්ථානවල අනතුරු ඇඟවීමේ පුවරු බොහොමයක දක්නට ලැබේ.","why_wrong":["ちゅい is missing the long vowel; 注 is ちゅう.","じゅうい is 獣医 (vet); 注 is not read じゅう.","ちゅうき changes 意 to き; 意 is read い."],"words":[{"ja":"注意{ちゅうい}","en":"caution, care","si":"පරෙස්සම"},{"ja":"滑{すべ}ります","en":"to slip","si":"ලිස්සනවා"}],"why_wrong_si":["ちゅい හි දිගු ස්වරය නැත; 注 යනු 「ちゅう」 වේ.","じゅうい යනු 獣医 (සත්ත්ව වෛද්‍යවරයා); 注 「じゅう」 ලෙස කියවෙන්නේ නැත.","ちゅうき හි 意 「き」 ලෙස වෙනස් කර ඇත; 意 කියවෙන්නේ 「い」 ලෙසයි."]},{"id":"MV-A2-006","level":"A2","section":"moji","type":"漢字の読み","scene":"びょういん","stem":"＿＿の ことばは どう 読{よ}みますか。","context":null,"prompt":"びょういんの <u>予約{よやく}<\/u>を 3時{じ}に 取{と}りました。","choices":["ようやく","よやく","ゆやく","よあく"],"answer":2,"explain_ja":"「予約{よやく}」は 「よやく」と 読{よ}みます。まえに 時間{じかん}を きめて おく ことです。","explain_en":"予約 is read よやく (yoyaku), 'reservation / appointment'. 予 is よ (short) and 約 is やく.","explain_si":"予約 කියවෙන්නේ 「よやく」 (yoyaku) ලෙසයි — තේරුම 'කලින් වෙන් කර ගැනීම'. 予 යනු කෙටි 「よ」 වන අතර 約 යනු 「やく」 වේ.","why_wrong":["ようやく makes 予 long; 予 is a short よ. ようやく is also a different word meaning 'at last'.","ゆやく uses ゆ, which is not a reading of 予.","よあく splits 約 wrongly; 約 is read やく."],"words":[{"ja":"予約{よやく}","en":"reservation, appointment","si":"වෙන් කිරීම"},{"ja":"取{と}ります","en":"to take, to make (an appointment)","si":"ගන්නවා"}],"why_wrong_si":["ようやく හි 予 දිගු කර ඇත; 予 යනු කෙටි 「よ」 වේ. තව ද ようやく යනු 'අන්තිමේදී' යන අර්ථය ඇති වෙනස් වචනයකි.","ゆやく හි 「ゆ」 යොදා ඇත; එය 予 හි කියවීමක් නොවේ.","よあく හි 約 වැරදියට කඩා ඇත; 約 කියවෙන්නේ 「やく」 ලෙසයි."]},{"id":"MV-A2-007","level":"A2","section":"moji","type":"ひらがな→漢字","scene":"しごと","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"来週{らいしゅう}の シフトを <u>かくにん<\/u>して ください。","choices":["角認","確忍","確認","覚認"],"answer":3,"explain_ja":"「かくにん」は 「確認{かくにん}」と 書{か}きます。まちがいが ないか しらべる ことです。","explain_en":"かくにん is written 確認 — 確 (certain) plus 認 (recognise). It means to check or confirm something.","explain_si":"かくにん ලියන්නේ 確認 කියලායි — 確 (නිශ්චිත) සහ 認 (හඳුනා ගැනීම). තේරුම යමක් පරීක්ෂා කර තහවුරු කර ගැනීමයි.","why_wrong":["角 means 'corner / angle' (かど) and is read かく too, but it is not the kanji used in 確認.","忍 (にん, to endure) is a different kanji from 認, even though both are read にん.","覚 is read かく in 覚悟 but means 'to remember'; the correct first kanji here is 確."],"words":[{"ja":"確認{かくにん}","en":"confirmation, checking","si":"තහවුරු කිරීම"},{"ja":"来週{らいしゅう}","en":"next week","si":"ලබන සතිය"}],"why_wrong_si":["角 හි තේරුම 'කොන / කෝණය' (かど) වන අතර එයත් 「かく」 ලෙස කියවේ; නමුත් 確認 හි යෙදෙන කන්ජිය එය නොවේ.","忍 (にん — ඉවසීම) යනු 認 ට වඩා වෙනස් කන්ජියකි, දෙකම 「にん」 ලෙස කියවුණත්.","覚 යනු 覚悟 වැනි වචනවල 「かく」 ලෙස කියවුණත් එහි තේරුම 'මතක තබා ගැනීම' යන්නයි; මෙහි නිවැරදි පළමු කන්ජිය 確 වේ."]},{"id":"MV-A2-008","level":"A2","section":"moji","type":"ひらがな→漢字","scene":"こうつう","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"毎日{まいにち} 4時間{じかん} トラックを <u>うんてん<\/u>します。","choices":["運転","運伝","連転","運動"],"answer":1,"explain_ja":"「うんてん」は 「運転{うんてん}」と 書{か}きます。車{くるま}を 動{うご}かす ことです。","explain_en":"うんてん is written 運転 — 運 (carry) plus 転 (turn). It means driving a vehicle.","explain_si":"うんてん ලියන්නේ 運転 කියලායි — 運 (ගෙන යාම) සහ 転 (කරකැවීම). තේරුම වාහනයක් පැදවීමයි.","why_wrong":["伝 (でん, to convey) is a different kanji from 転, although the shapes are close.","連 (れん, to link) is not read うん; the first kanji must be 運.","運動 is read うんどう and means exercise, not driving."],"words":[{"ja":"運転{うんてん}","en":"driving","si":"රිය පැදවීම"},{"ja":"毎日{まいにち}","en":"every day","si":"හැම දිනකම"}],"why_wrong_si":["伝 (でん — දැනුම් දීම) යනු 転 ට වඩා වෙනස් කන්ජියකි, රූප දෙක සමීප වුවත්.","連 (れん — සම්බන්ධ කිරීම) 「うん」 ලෙස කියවෙන්නේ නැත; පළමු කන්ජිය 運 විය යුතුයි.","運動 කියවෙන්නේ 「うんどう」 ලෙසයි; තේරුම ව්‍යායාමයයි, රිය පැදවීම නොවේ."]},{"id":"MV-A2-009","level":"A2","section":"moji","type":"ひらがな→漢字","scene":"しごと","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"<u>にもつ<\/u>を トラックに つみます。","choices":["何物","苛物","荷持","荷物"],"answer":4,"explain_ja":"「にもつ」は 「荷物{にもつ}」と 書{か}きます。運{はこ}ぶ ものの ことです。","explain_en":"にもつ is written 荷物 — 荷 (load) plus 物 (thing). It means luggage or cargo.","explain_si":"にもつ ලියන්නේ 荷物 කියලායි — 荷 (බඩු/බර) සහ 物 (දෙය). තේරුම ගමන් මලු හෝ බඩු බාහිරාදියයි.","why_wrong":["何 means 'what' (なに) and is not read に.","苛 is a rare kanji meaning 'harsh'; it is not used for cargo.","持 (も, to hold) is a different kanji from 物, so 荷持 is not a word."],"words":[{"ja":"荷物{にもつ}","en":"luggage, cargo","si":"බඩු"},{"ja":"積{つ}みます","en":"to load, to stack","si":"පටවනවා"}],"why_wrong_si":["何 හි තේරුම 'මොකක්ද' (なに) වන අතර එය 「に」 ලෙස කියවෙන්නේ නැත.","苛 යනු 'දරුණු' යන අර්ථය ඇති දුර්ලභ කන්ජියකි; බඩු සඳහා යොදන්නේ නැත.","持 (も — අල්ලා ගැනීම) යනු 物 ට වඩා වෙනස් කන්ජියකි, එනිසා 荷持 කියා වචනයක් නැත."]},{"id":"MV-A2-010","level":"A2","section":"moji","type":"ひらがな→漢字","scene":"しごと","stem":"＿＿の ことばは どう 書{か}きますか。","context":null,"prompt":"毎朝{まいあさ} 8時{じ}に ビルの トイレを <u>そうじ<\/u>します。","choices":["操除","掃徐","掃除","婦除"],"answer":3,"explain_ja":"「そうじ」は 「掃除{そうじ}」と 書{か}きます。ビルクリーニングの 仕事{しごと}で よく 使{つか}う ことばです。","explain_en":"そうじ is written 掃除 — 掃 (sweep) plus 除 (remove). Building-cleaning job adverts always use this word.","explain_si":"そうじ ලියන්නේ 掃除 කියලායි — 掃 (අතුගෑම) සහ 除 (ඉවත් කිරීම). ගොඩනැගිලි පිරිසිදු කිරීමේ රැකියා දැන්වීම්වල සැමවිටම මේ වචනය යෙදේ.","why_wrong":["操 (そう, to handle) is used in 操作, not in 掃除.","徐 (じょ, slowly) looks like 除 but has the person radical on the left, so it is a different kanji.","婦 (ふ, woman) shares part of its shape with 掃 but is never read そう."],"words":[{"ja":"掃除{そうじ}","en":"cleaning","si":"පිරිසිදු කිරීම"},{"ja":"毎朝{まいあさ}","en":"every morning","si":"හැම උදෑසනකම"}],"why_wrong_si":["操 (そう — මෙහෙයවීම) යෙදෙන්නේ 操作 වැනි වචනවලයි, 掃除 හි නොවේ.","徐 (じょ — සෙමින්) 除 ට සමාන පෙනුමක් ඇතත්, එහි වම් පැත්තේ මිනිසා දක්වන කොටස ඇති නිසා එය වෙනස් කන්ජියකි.","婦 (ふ — කාන්තාව) හි රූපයේ කොටසක් 掃 ට සමාන වුවත්, එය කිසිදා 「そう」 ලෙස කියවෙන්නේ නැත."]},{"id":"MV-A2-011","level":"A2","section":"moji","type":"カタカナ語","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"来週{らいしゅう} だれが 何時{なんじ}から はたらくか、＿＿＿ひょうで 確認{かくにん}します。","choices":["マナー","シフト","レジ","サイン"],"answer":2,"explain_ja":"だれが いつ はたらくかを 書{か}いた ひょうは 「シフトひょう」です。","explain_en":"シフト means a work shift, so シフト表 is the roster showing who works at which hours.","explain_si":"シフト යනු වැඩ මුරයයි. එනිසා シフト表 යනු කවුරු කුමන වේලාවන්හි වැඩ කරනවාද යන්න පෙන්වන ලැයිස්තුවයි.","why_wrong":["マナー means manners or etiquette, not a work timetable.","レジ is the cash register at a shop counter.","サイン means a signature or a sign, not a roster."],"words":[{"ja":"シフト","en":"work shift","si":"වැඩ මුරය"},{"ja":"表{ひょう}","en":"table, chart","si":"වගුව"}],"why_wrong_si":["マナー යනු හැසිරීම හෝ ආචාර ධර්මයි; වැඩ කාලසටහනක් නොවේ.","レジ යනු සාප්පු කවුන්ටරයේ ඇති මුදල් යන්ත්‍රයයි.","サイン යනු අත්සනක් හෝ සලකුණක්; වැඩ මුර ලැයිස්තුවක් නොවේ."]},{"id":"MV-A2-012","level":"A2","section":"moji","type":"カタカナ語","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"そうじの やり方{かた}は ＿＿＿に 書{か}いて ありますから、先{さき}に 読{よ}んで ください。","choices":["アンケート","カタログ","スケジュール","マニュアル"],"answer":4,"explain_ja":"しごとの やり方{かた}が 書{か}いて ある 本{ほん}は 「マニュアル」です。","explain_en":"マニュアル is the manual that explains how to do the work step by step, which matches やり方が書いてあります.","explain_si":"マニュアル යනු වැඩ කරන ආකාරය පියවරෙන් පියවර විස්තර කරන අත්පොතයි. එය やり方が書いてあります යන්නට හරියටම ගැළපේ.","why_wrong":["アンケート is a questionnaire that asks for your opinion.","カタログ is a catalogue showing products for sale.","スケジュール is a schedule of times and dates, not a set of instructions."],"words":[{"ja":"マニュアル","en":"manual, instruction book","si":"අත්පොත"},{"ja":"やり方{かた}","en":"how to do it, method","si":"කරන ක්‍රමය"}],"why_wrong_si":["アンケート යනු ඔබේ අදහස විමසන ප්‍රශ්නාවලියයි.","カタログ යනු විකිණීමට ඇති භාණ්ඩ පෙන්වන නාමාවලියයි.","スケジュール යනු වේලාවන් සහ දින දක්වන කාලසටහනකි; උපදෙස් මාලාවක් නොවේ."]},{"id":"MV-A2-013","level":"A2","section":"moji","type":"カタカナ語","scene":"びょういん","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"きゅうに 仕事{しごと}が 入{はい}ったので、びょういんの 予約{よやく}を ＿＿＿しました。","choices":["キャンセル","チェック","コピー","サービス"],"answer":1,"explain_ja":"予約{よやく}を やめる ことは 「キャンセルする」と 言{い}います。","explain_en":"キャンセル means to cancel. Because work came up suddenly, the hospital appointment was cancelled.","explain_si":"キャンセル යනු අවලංගු කිරීමයි. හදිසියේ වැඩක් ආ නිසා රෝහලේ වෙන් කිරීම අවලංගු කරන ලදී.","why_wrong":["チェック means to check something, not to cancel it.","コピー means to make a copy of a document.","サービス means service or something given free of charge."],"words":[{"ja":"キャンセル","en":"cancellation","si":"අවලංගු කිරීම"},{"ja":"急{きゅう}に","en":"suddenly","si":"හදිසියේ"}],"why_wrong_si":["チェック යනු යමක් පරීක්ෂා කිරීමයි; අවලංගු කිරීම නොවේ.","コピー යනු ලේඛනයක පිටපතක් ගැනීමයි.","サービス යනු සේවාව හෝ නොමිලේ දෙන දෙයකි."]},{"id":"MV-A2-014","level":"A2","section":"moji","type":"語彙の意味","scene":"しごと","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"あぶないですから、動{うご}いて いる きかいに ＿＿＿ないで ください。","choices":["すわら","さわら","つくら","おくら"],"answer":2,"explain_ja":"手{て}で ふれる ことは 「さわる」です。「さわらないで ください」は 工場{こうじょう}で よく 聞{き}きます。","explain_en":"さわる means to touch. 機械にさわらないでください ('do not touch the machine') is a standard factory safety instruction.","explain_si":"さわる යනු අතින් ස්පර්ශ කිරීමයි. 機械にさわらないでください ('යන්ත්‍රයට අත නොතබන්න') යනු කර්මාන්තශාලාවල සම්මත ආරක්ෂක උපදෙසකි.","why_wrong":["すわる means to sit down, which does not fit a warning about a moving machine.","つくる means to make or produce something.","おくる means to send something to someone."],"words":[{"ja":"触{さわ}ります","en":"to touch","si":"අත ගානවා"},{"ja":"機械{きかい}","en":"machine","si":"යන්ත්‍රය"}],"why_wrong_si":["すわる යනු වාඩි වීමයි; ක්‍රියාත්මක වන යන්ත්‍රයක් ගැන අනතුරු ඇඟවීමකට එය නොගැළපේ.","つくる යනු යමක් සෑදීම හෝ නිෂ්පාදනය කිරීමයි.","おくる යනු යමක් කෙනෙකුට යැවීමයි."]},{"id":"MV-A2-015","level":"A2","section":"moji","type":"語彙の意味","scene":"びょういん","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"かぜを ひきましたから、ごはんの あとで ＿＿＿を 飲{の}みます。","choices":["ちゅうしゃ","たいおん","くすり","びょうき"],"answer":3,"explain_ja":"「くすりを 飲{の}む」と 言{い}います。びょうきの ときに 飲{の}む ものです。","explain_en":"In Japanese you 'drink' medicine: 薬を飲みます. Only くすり goes with 飲みます here.","explain_si":"ජපන් භාෂාවෙන් බෙහෙත් 'බොනවා' කියා කියයි: 薬を飲みます. මෙහි 飲みます සමඟ ගැළපෙන්නේ くすり පමණයි.","why_wrong":["ちゅうしゃ (injection) uses the verb します or 打ちます, never 飲みます.","たいおん means body temperature; you measure it (はかります), you do not drink it.","びょうき means illness itself, which cannot be drunk."],"words":[{"ja":"薬{くすり}","en":"medicine","si":"බෙහෙත"},{"ja":"風邪{かぜ}を ひきます","en":"to catch a cold","si":"සෙම්ප්‍රතිශ්‍යාව හැදෙනවා"}],"why_wrong_si":["ちゅうしゃ (එන්නත) සමඟ යොදන්නේ します හෝ 打ちます මිස කිසිදා 飲みます නොවේ.","たいおん යනු ශරීර උෂ්ණත්වයයි; එය මනිනවා (はかります) මිස බොන්නේ නැත.","びょうき යනු අසනීපයම වන අතර, එය බොන්නට බැහැ."]},{"id":"MV-A2-016","level":"A2","section":"moji","type":"語彙の意味","scene":"すまい","stem":"＿＿＿に 入{はい}る ことばは どれですか。","context":null,"prompt":"ゴミは もえる ゴミと もえない ゴミに ＿＿＿ください。","choices":["分{わ}けて","集{あつ}めて","捨{す}てて","入{い}れて"],"answer":1,"explain_ja":"ゴミを しゅるいごとに べつべつに する こと
