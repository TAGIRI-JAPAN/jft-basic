<script>

    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  if (s == null) return "";

  s = String(s).replace(/<u>/g, "\u0001").replace(/<\/u>/g, "\u0002");
  s = esc(s).replace(RUBY, function (m, k, r) {
    return "<ruby>" + k + "<rt>" + r + "</rt></ruby>";

var CIRC = ["", "①", "②", "③", "④"];

/* ---------------------------------------------------------------- 設定 */
var cfg = { ruby: true, lang: "en", size: "md", rate: 1 };
function applyCfg() {
  document.body.classList.toggle("rb-off", !cfg.ruby);
  document.body.classList.remove("f-lg", "f-sm");
  if (cfg.size === "lg") document.body.classList.add("f-lg");

var VOICES = {}, jaOK = false;
function pickVoices() {
  var all = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
  var ja = all.filter(function (v) { return /^ja/i.test(v.lang || ""); });
  jaOK = ja.length > 0;

  var m = ja.filter(function (v) { return /otoya|male|男|hattori|ichiro|keita|daichi/i.test(v.name); });

    if (ww && ww.length) {

           (L === "en" ? "Why the others are wrong" : "අනෙක් ඒවා වැරදි වන්නේ ඇයි") + "</div>";
      wrongs.forEach(function (wi, i) {
        h += '<div class="it"><b>' + CIRC[wi] + "</b><div>" + rb(ww[i] || "") + "</div></div>";
      });
      h += "</div>";
    }
    h += "</div>";
  });

  if (q.words && q.words.length) {
    h += '<div class="words"><span class="wl">ことば</span>';
    q.words.forEach(function (w) {
      h += '<span class="w"><b>' + rb(w.ja) + '</b><i>' + rb(w.en) + '</i><span class="s">' + rb(w.si) + "</span></span>";
    });
    h += "</div>";
  }
  return h + "</div>";
}
function wireTabs(root) {
  var tabs = $$(".tabs button", root), panes = $$(".tp", root);
  function sel(t) {
    tabs.forEach(function (b) { b.classList.toggle("on", b.dataset.t === t); });
    panes.forEach(function (p) { p.classList.toggle("on", p.dataset.t === t); });
    cfg.lang = t;
  }
  tabs.forEach(function (b) { b.onclick = function () { sel(b.dataset.t); }; });
  sel(cfg.lang === "si" ? "si" : "en");
}

/* ---------------------------------------------------------------- 進捗 */
var picks = {};                       /* 練習：問題id → 選んだ番号 */
function secStat(key) {
  var items = D.practice[key], d = 0, r = 0;
  items.forEach(function (q) {
    if (picks[q.id]) { d++; if (picks[q.id] === q.answer) r++; }
  });
  return { total: items.length, done: d, right: r };
}

/* ---------------------------------------------------------------- runner */
var run = null;

function openRunner(o) {
  run = o; run.i = 0;
  if (!run.picks) run.picks = (run.mode === "practice") ? picks : {};
  document.body.classList.add("runner");
  $$(".view").forEach(function (v) { v.classList.remove("on"); });
  $("#v-run").classList.add("on");
  if (run.mode === "mock") startClock();
  drawQ();
  window.scrollTo(0, 0);
}
function closeRunner() {
  stopAudio(); stopClock();
  document.body.classList.remove("runner");
  var back = run && run.back || "home";
  run = null;
  go(back);
}

function drawQ() {
  var q = run.items[run.i], n = run.i + 1, tot = run.items.length;
  var mock = run.mode === "mock";
  var picked = run.picks[q.id];

  $("#v-run").innerHTML =
    '<div class="rtop">' +
      '<div class="rbar"><button class="back">‹</button>' +
        '<div class="ttl">' + run.title + '<i>' + esc(run.sub || "") + "</i></div>" +
        '<div class="cnt">' + n + " / " + tot + "</div>" +
        '<button class="gridbtn">☰</button></div>' +
      '<div class="pbar"><i style="width:' + (n / tot * 100) + '%"></i></div>' +
      (mock ? '<div class="rclock"><span>のこり</span><span class="clk">--:--</span>' +
              '<span class="rest">こたえた ' + Object.keys(run.picks).length + " / " + tot + "</span></div>" : "") +
    "</div>" +
    '<div class="stage"><div class="qcard">' + bodyHTML(q, !mock) + "</div>" +
      (!mock && picked ? expHTML(q, picked) : "") + "</div>" +
    '<div class="actbar"></div>';

  if (q.section === "choukai") mountPlayer(q, $(".audio", $("#v-run")));
  if (!mock && picked) { markChoices(picked, q); wireTabs($("#v-run")); }

  $(".back").onclick = function () {
    if (mock && !confirm("模試を やめますか？ / Quit the mock test?")) return;
    closeRunner();
  };
  $(".gridbtn").onclick = openGrid;

  $$(".ch li").forEach(function (li) {
    li.onclick = function () {
      var ul = $(".ch");
      if (!mock && ul.classList.contains("done")) return;
      var v = +li.dataset.i;
      run.picks[q.id] = v;
      if (mock) {
        $$(".ch li").forEach(function (x) { x.classList.toggle("sel", x === li); });
        $(".rest").textContent = "こたえた " + Object.keys(run.picks).length + " / " + tot;
        drawAct();
      } else {
        markChoices(v, q);
        $(".stage").insertAdjacentHTML("beforeend", expHTML(q, v));
        wireTabs($("#v-run"));
        drawAct();
        setTimeout(function () {
          var e = $(".exp");
          if (e) e.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 60);
      }
    };
  });
  drawAct();
}

function markChoices(picked, q) {
  var ul = $(".ch");
  ul.classList.add("done");
  var lis = $$(".ch li");
  lis[picked - 1].classList.add(picked === q.answer ? "ok" : "ng");
  if (picked !== q.answer) lis[q.answer - 1].classList.add("ok");
}

function drawAct() {
  var bar = $(".actbar"); if (!bar) return;
  var last = run.i === run.items.length - 1;
  var q = run.items[run.i], answered = !!run.picks[q.id];
  var h = "";
  if (run.i > 0) h += '<button class="btn ghost half" data-a="prev">‹ まえ</button>';
  if (run.mode === "mock") {
    h += last
      ? '<button class="btn" data-a="submit">提出して 採点する</button>'
      : '<button class="btn' + (answered ? "" : " ghost") + '" data-a="next">つぎへ ›</button>';
  } else {
    h += last
      ? '<button class="btn" data-a="finish">' + (answered ? "けっかを 見る" : "おわる") + "</button>"
      : '<button class="btn' + (answered ? "" : " ghost") + '" data-a="next">つぎへ ›</button>';
  }
  bar.innerHTML = h;
  $$("[data-a]", bar).forEach(function (b) {
    b.onclick = function () {
      var a = b.dataset.a;
      stopAudio();
      if (a === "prev")   { run.i--; drawQ(); window.scrollTo(0, 0); }
      if (a === "next")   { run.i++; drawQ(); window.scrollTo(0, 0); }
      if (a === "finish") finishPractice();
      if (a === "submit") {
        var left = run.items.length - Object.keys(run.picks).length;
        if (left && !confirm(left + "問 こたえて いません。提出しますか？")) return;
        gradeMock();
      }
    };
  });
}

/* 番号グリッド */
function openGrid() {
  var mock = run.mode === "mock";
  var g = run.items.map(function (q, i) {
    var p = run.picks[q.id], cls = "";
    if (p) cls = mock ? "sel" : (p === q.answer ? "ok" : "ng");
    if (i === run.i) cls += " cur";
    return '<button class="' + cls + '" data-i="' + i + '">' + (i + 1) + "</button>";
  }).join("");
  var sh = $("#sheet");
  $(".box", sh).innerHTML = '<h3>問題を えらぶ / Jump to a question</h3>' +
    '<div class="ngrid">' + g + "</div>" +
    '<button class="btn sec" data-x="1">とじる</button>';
  sh.classList.add("on");
  $$(".ngrid button", sh).forEach(function (b) {
    b.onclick = function () { sh.classList.remove("on"); stopAudio(); run.i = +b.dataset.i; drawQ(); window.scrollTo(0, 0); };
  });
  $("[data-x]", sh).onclick = function () { sh.classList.remove("on"); };
}

/* ---------------------------------------------------------------- 練習の結果 */
function finishPractice() {
  stopAudio();
  var items = run.items, d = 0, r = 0, wrong = [];
  items.forEach(function (q) {
    if (run.picks[q.id]) { d++; if (run.picks[q.id] === q.answer) r++; else wrong.push(q); }
  });
  var pct = d ? Math.round(r / d * 100) : 0;
  var h = '<div class="rtop"><div class="rbar"><button class="back">‹</button>' +
          '<div class="ttl">けっか<i>' + esc(run.sub || "") + "</i></div></div></div>" +
          '<div class="stage"><div class="result">' +
          '<div class="big">' + r + '<small> / ' + d + "</small></div>" +
          '<div style="color:var(--mute);font-size:13px">正解率 ' + pct + "%</div>" +
          (wrong.length
            ? '<div class="msg">まちがえた ' + wrong.length + "問を もう一度 やりましょう。<br>" +
              "Redo the " + wrong.length + " you missed — that is where the points are.</div>"
            : '<div class="msg">全問正解です。つぎの セクションへ 進みましょう。</div>') +
          "</div>";
  if (wrong.length) h += '<button class="btn" id="redo">まちがえた ' + wrong.length + "問だけ もう一度</button>";
  h += '<button class="btn ghost" id="done" style="margin-top:9px">おわる</button></div>';
  $("#v-run").innerHTML = h;
  $(".back").onclick = closeRunner;
  $("#done").onclick = closeRunner;
  if (wrong.length) $("#redo").onclick = function () {
    wrong.forEach(function (q) { delete run.picks[q.id]; });
    openRunner({ mode: "practice", items: wrong, title: run.title,
                 sub: "まちがえた問題", back: run.back, picks: run.picks });
  };
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------- 模試 */
var clock = { left: 3600, tid: null };
function startClock() {
  clock.left = 3600;
  stopClock();
  clock.tid = setInterval(function () {
    clock.left--;
    var el = $(".clk");
    if (el) {
      var m = Math.floor(clock.left / 60), s = clock.left % 60;
      el.textContent = m + ":" + (s < 10 ? "0" : "") + s;
      $(".rclock").classList.toggle("low", clock.left < 300);
    }
    if (clock.left <= 0) { stopClock(); gradeMock(); }
  }, 1000);
}
function stopClock() { if (clock.tid) { clearInterval(clock.tid); clock.tid = null; } }

function gradeMock() {
  stopAudio(); stopClock();
  var items = run.items, right = 0;
  items.forEach(function (q) { if (run.picks[q.id] === q.answer) right++; });
  var score = right * 5;
  var lvl = score >= 200 ? "A2.2 (A2)" : score >= 175 ? "A2.1" : score >= 145 ? "A1" : "判定なし";
  var msg = score >= 200 ? "本番を 予約しましょう。毎日 聴解を 続けて レベルを 落とさないこと。"
          : score >= 175 ? "あと 1〜5問です。まちがえた問題と 聴解を もう一度。"
          : score >= 145 ? "育成就労の ラインは 越えました。A2を ねらうなら 練習の A2問題を もう一度。"
          : "『いろどり 入門』と A1の問題に もどりましょう。まだ 予約しないこと。";

  var h = '<div class="rtop"><div class="rbar"><button class="back">‹</button>' +
          '<div class="ttl">模擬試験の けっか<i>Mock test result</i></div></div></div>' +
          '<div class="stage"><div class="result">' +
          '<div class="big">' + score + '<small> / 250</small></div>' +
          '<div style="color:var(--mute);font-size:13px">' + right + " / " + items.length + " 問 正解</div>" +
          '<div class="lvl">' + lvl + "</div>" +
          '<div class="msg">' + msg + "</div>" +
          '<div class="msg" style="font-size:11.5px">これは 目安です。本番は 問題の むずかしさで 点が 変わります。' +
          "<br>An estimate — the real test weights items by difficulty.</div></div>" +
          '<button class="btn ghost" id="again" style="margin-bottom:14px">もう一度 やる</button>' +
          '<h3 class="sub">見直し / Review</h3>';

  var cur = null;
  items.forEach(function (q, i) {
    if (q.section !== cur) {
      cur = q.section;
      h += '<h3 class="sub">' + rb(D.labels[cur].ja) + "</h3>";
    }
    var p = run.picks[q.id] || 0, ok = p === q.answer;
    h += '<div class="rev"><div class="rh"><span class="num">' + (i + 1) + "</span>" +
         '<span>' + rb(q.type || "") + "</span>" +
         '<span class="mk ' + (ok ? "ok" : "ng") + '">' +
           (p ? (ok ? "✓ 正解" : "✕ " + CIRC[p]) : "未回答") + "</span></div>" +
         (q.section === "choukai" ? "" : matHTML(q.context)) +
         (q.prompt && q.section !== "choukai" ? '<div class="prompt">' + rb(q.prompt) + "</div>" : "") +
         ((q.audio || {}).question_ja ? '<div class="prompt">' + rb(q.audio.question_ja) + "</div>" : "") +
         expHTML(q, p) + "</div>";
  });
  h += "</div>";
  $("#v-run").innerHTML = h;
  $$(".rev").forEach(wireTabs);
  $(".back").onclick = closeRunner;
  $("#again").onclick = function () {
    openRunner({ mode: "mock", items: D.mock, title: "模擬試験", sub: "50問 / 60分",
                 back: "mock", picks: {} });
  };
  window.scrollTo(0, 0);
}

function scriptsHTML() {
  var h = '<div class="callout"><div class="lab">音声を つくる 人へ / For the audio producer</div>' +
    '<div class="en">Speaker codes: M1/M2 male, F1/F2 female, N narrator. Use the same voice for the same code ' +
    "throughout. 1.5s between turns, 2s before the question, 8s after it. Record so each item can be played twice.</div></div>";
  [["練習問題 第3部", D.practice.choukai],
   ["模擬試験", D.mock.filter(function (q) { return q.section === "choukai"; })]
  ].forEach(function (pair) {
    h += '<h2 class="sec">' + pair[0] + "</h2>";
    pair[1].forEach(function (q, i) {
      var a = q.audio || {};
      h += '<div class="card"><div class="qh"><span class="qt">' + (i + 1) + "　" + esc(q.track || "") + "</span>" +
           '<span class="lv a2">' + esc(a.speed || "") + "</span></div>";
      if (a.instruction_ja) h += '<div class="stem">' + rb(a.instruction_ja) + "</div>";
      (a.lines || []).forEach(function (l) {
        h += '<div style="display:flex;gap:9px;margin-bottom:4px"><b style="color:var(--gold-d);flex:0 0 28px">' +
             esc(l.speaker) + "</b><span>" + rb(l.text) + "</span></div>";
      });
      if (a.question_ja) h += '<div style="font-weight:700;color:var(--navy);margin-top:6px">Q: ' + rb(a.question_ja) + "</div>";
      if (a.note) h += '<div class="stem" style="margin-top:6px">▸ ' + rb(a.note) + "</div>";
      h += '<div style="font-weight:800;color:var(--navy);margin-top:6px">答え：' + CIRC[q.answer] + "</div></div>";
    });
  });
  return h;
}

/* ---------------------------------------------------------------- 練習の入口 */
function renderPractice() {
  var h = '<h1 class="pt"><small>PART 2 — PRACTICE</small>練習問題を えらぶ</h1><div class="tiles wide">';
  SECS.forEach(function (k) {
    var s = secStat(k), lab = D.labels[k];
    h += '<button class="tile" data-k="' + k + '"><b>' + rb(lab.ja) + "</b>" +
         "<span>" + esc(lab.en) + " ・ " +
         (s.done ? s.done + " / " + s.total + " 問 ・正解 " + s.right : s.total + " 問") + "</span>" +
         '<div class="bar"><i style="width:' + (s.done / s.total * 100) + '%"></i></div></button>';
  });
  h += "</div>";
  var any = SECS.some(function (k) { return secStat(k).done; });
  if (any) h += '<button class="btn ghost" id="reset">進捗を リセットする</button>';
  $("#v-practice").innerHTML = h;
  $$(".tile", $("#v-practice")).forEach(function (t) {
    t.onclick = function () { startPractice(t.dataset.k); };
  });
  if (any) $("#reset").onclick = function () {
    if (!confirm("こたえた 記録を すべて 消しますか？")) return;
    picks = {}; renderPractice();
  };
}

function renderMock() {
  var h = '<h1 class="pt"><small>PART 3 — MOCK TEST</small>模擬試験</h1>' +
    '<div class="spec"><div class="hd">50問 / 60分<em>250点満点</em></div><div class="bd">' +
    '<div class="kpi"><div><b>13</b><span>文字と語彙</span></div><div><b>12</b><span>会話と表現</span></div>' +
    '<div><b>12</b><span>聴解</span></div><div><b>13</b><span>読解</span></div></div>' +
    '<div class="note">本番と 同じ構成・同じ順番です。むずかしさは やさしい順に 並べて あります。</div>' +
    "</div></div>" +
    '<div class="callout"><div class="lab">やる前に / Before you start</div>' +
    '<div class="en">One sitting, 60 minutes, no dictionary. Play each listening item at most twice. ' +
    "Answer every question — there is no penalty for a wrong answer. Explanations stay hidden until you finish.</div>" +
    '<div class="si">එක් වාරයක්, විනාඩි 60ක්, ශබ්දකෝෂයක් නොමැතිව. සෑම ප්‍රශ්නයකටම පිළිතුරු දෙන්න.</div></div>' +
    '<button class="btn" id="mstart">はじめる / Start</button>';
  $("#v-mock").innerHTML = h;
  $("#mstart").onclick = function () {
    openRunner({ mode: "mock", items: D.mock, title: "模擬試験", sub: "50問 / 60分",
                 back: "mock", picks: {} });
  };
}

function renderVocab() {
  $("#v-vocab").innerHTML = '<h1 class="pt"><small>APPENDIX</small>ことばリスト</h1>' +
    '<input class="search" id="vq" placeholder="日本語 / English / සිංහල で さがす"><div id="vlist"></div>';
  function draw(f) {
    f = (f || "").toLowerCase();
    var rows = D.vocab.filter(function (w) {
      return !f || (raw(w.ja) + " " + w.en + " " + w.si).toLowerCase().indexOf(f) >= 0;
    });
    $("#vlist").innerHTML = '<div style="font-size:12px;color:var(--mute);margin-bottom:8px">' +
      rows.length + " words</div>" +
      rows.map(function (w) {
        return '<div class="vrow"><div class="ja">' + rb(w.ja) + '</div><div class="rest">' +
               esc(w.en) + '<i class="s">' + esc(w.si) + "</i></div></div>";
      }).join("");
  }
  draw("");
  $("#vq").oninput = function () { draw(this.value); };
}

/* ---------------------------------------------------------------- routing */
function go(v) {
  stopAudio(); stopClock();
  document.body.classList.remove("runner");
  $$(".view").forEach(function (x) { x.classList.toggle("on", x.id === "v-" + v); });
  $$("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.v === v); });
  if (v === "home")     renderHome();
  if (v === "guide")    renderGuide();
  if (v === "practice") renderPractice();
  if (v === "mock")     renderMock();
  if (v === "vocab" && !$("#v-vocab").innerHTML) renderVocab();
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------- 設定シート */
function openSettings() {
  var sh = $("#sheet");
  $(".box", sh).innerHTML =
    "<h3>設定 / Settings</h3>" +
    '<div class="srow"><div class="lb">ふりがな / Furigana</div><div class="seg" data-k="ruby">' +
      '<button data-v="true"' + (cfg.ruby ? ' class="on"' : "") + ">表示する</button>" +
      '<button data-v="false"' + (!cfg.ruby ? ' class="on"' : "") + ">かくす</button></div></div>" +
    '<div class="srow"><div class="lb">解説の言語 / Explanation language</div><div class="seg" data-k="lang">' +
      '<button data-v="en"' + (cfg.lang !== "si" ? ' class="on"' : "") + ">English</button>" +
      '<button data-v="si"' + (cfg.lang === "si" ? ' class="on"' : "") + ">සිංහල</button></div></div>" +
    '<div class="srow"><div class="lb">文字の大きさ / Text size</div><div class="seg" data-k="size">' +
      ["sm", "md", "lg"].map(function (v, i) {
        return '<button data-v="' + v + '"' + (cfg.size === v ? ' class="on"' : "") + ">" +
               ["小", "中", "大"][i] + "</button>";
      }).join("") + "</div></div>" +
    '<div class="note">音声は <code>audio/</code> の mp3 を先に探します。無いときは この端末の読み上げ機能に ' +
    "切り替わります。<br>Audio uses the recorded mp3 when present, otherwise this device's Japanese voice.</div>" +
    '<button class="btn sec" id="sclose" style="margin-top:14px">とじる / Close</button>';
  sh.classList.add("on");
  $$(".seg button", sh).forEach(function (b) {
    b.onclick = function () {
      var g = b.parentNode;
      $$("button", g).forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      var v = b.dataset.v;
      cfg[g.dataset.k] = v === "true" ? true : v === "false" ? false : v;
      applyCfg();
      if (g.dataset.k === "lang" && $(".tabs")) $$(".exp").forEach(wireTabs);
    };
  });
  $("#sclose").onclick = function () { sh.classList.remove("on"); };
}

/* ---------------------------------------------------------------- 共有 */
function shareURL() {
  /* ?audio= などの一時的なパラメータは外して、素のURLを配る */
  var u = location.origin + location.pathname;
  return u.replace(/index\.html$/, "");
}
function openShare() {
  var sh = $("#sheet"), local = location.protocol === "file:";
  var url = shareURL();
  var h = "<h3>友だちに 送る / Share</h3>";
  if (local) {
    h += '<div class="warn2">このファイルを 直接 開いています。友だちに 送るには、' +
         'まず インターネットに 公開して URL を つくってください。<br>' +
         "<span class='en2'>This file was opened directly from your device, so there is no link to share yet. " +
         "Publish the folder first (see README) and open the published address.</span></div>";
  } else {
    var svg = (window.QR && window.QR.svg) ? window.QR.svg(url, 7) : null;
    h += '<div class="qrbox">' + (svg || "") +
         '<div class="qrurl">' + esc(url) + "</div></div>" +
         '<div class="note" style="text-align:center">スマホの カメラで よみとって ください / Scan with a phone camera</div>' +
         '<button class="btn" id="shbtn">リンクを 送る / Send link</button>' +
         '<button class="btn ghost" id="cpbtn" style="margin-top:9px">リンクを コピー / Copy link</button>';
  }
  h += '<div class="note">スマホでは ブラウザのメニューから「ホーム画面に追加」を えらぶと、' +
       'アプリのように 全画面で ひらけます。一度 ひらけば つぎからは 電波が なくても 使えます。<br>' +
       "<span class='en2'>On a phone, choose “Add to Home Screen” in the browser menu. " +
       "After the first visit it also works offline.</span></div>" +
       '<button class="btn sec" id="sclose2" style="margin-top:12px">とじる / Close</button>';
  $(".box", sh).innerHTML = h;
  sh.classList.add("on");
  $("#sclose2").onclick = function () { sh.classList.remove("on"); };
  var sb = $("#shbtn");
  if (sb) sb.onclick = function () {
    var payload = { title: "JFT-Basic 対策", text: "JFT-Basic の れんしゅう / JFT-Basic practice", url: url };
    if (navigator.share) navigator.share(payload).catch(function () {});
    else copy(url);
  };
  var cb = $("#cpbtn");
  if (cb) cb.onclick = function () { copy(url); cb.textContent = "コピーしました / Copied"; };
  function copy(t) {
    if (navigator.clipboard) navigator.clipboard.writeText(t).catch(function () {});
    else {
      var a = document.createElement("textarea");
      a.value = t; document.body.appendChild(a); a.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(a);
    }
  }
}

/* ---------------------------------------------------------------- init */
document.addEventListener("DOMContentLoaded", function () {
  applyCfg();
  $$("nav button").forEach(function (b) { b.onclick = function () { go(b.dataset.v); }; });
  $("#btn-set").onclick = openSettings;
  $("#btn-share").onclick = openShare;
  $("#btn-ruby").onclick = function () { cfg.ruby = !cfg.ruby; applyCfg(); };
  var sh = $("#sheet");
  sh.onclick = function (e) { if (e.target === sh) sh.classList.remove("on"); };
  go("home");

  /* オフラインで使えるようにする（https で公開したときだけ動く） */
  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }
});
})();

</script>
</body>
</html>
