:"JFT1_P3_Q04"},{"id":"CK-A1-005","level":"A1","section":"choukai","type":"課題理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"介護{かいご}の しごとで、りようしゃの 人{ひと}と スタッフが 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["冷{つめ}たい お茶{ちゃ}","あたたかい お茶{ちゃ}","冷{つめ}たい 水{みず}","あたたかい コーヒー"],"answer":2,"explain_ja":"女{おんな}の 人{ひと}は 「あたたかい ほうが いいです」と 言{い}いました。だから あたたかい お茶{ちゃ}です。","explain_en":"The drink is お茶 and the temperature is decided by the second line: あたたかい ほうが いいです. Both parts must match.","explain_si":"බීම වර්ගය お茶 බව මුල් වාක්‍යයෙන් තහවුරු වෙනවා. උණුසුම තීරණය වන්නේ දෙවන පිළිතුරෙන්: 「いいえ、あたたかい ほうが いいです」. වර්ගය සහ උණුසුම යන කොටස් දෙකම ගැළපිය යුතුයි — ඒ නිසා あたたかい お茶.","why_wrong":["冷たい お茶 is what the staff first offers, and she answers いいえ.","水 is never mentioned — the drink is お茶.","コーヒー is never mentioned; only the temperature word matches."],"words":[{"ja":"冷{つめ}たい","en":"cold (to the touch)","si":"සීතල"},{"ja":"お茶{ちゃ}","en":"tea","si":"තේ"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"すみません、お茶{ちゃ}を お願{ねが}いします。"},{"speaker":"M1","text":"はい。冷{つめ}たい お茶{ちゃ}ですか。"},{"speaker":"F1","text":"いいえ、あたたかい ほうが いいです。"},{"speaker":"M1","text":"わかりました。すぐ お持{も}ちします。"}],"question_ja":"男{おとこ}の 人{ひと}は 何{なに}を 持{も}って きますか。","speed":"ゆっくり","note":"F1は高齢の利用者、ゆっくり小さめの声。M1は介護スタッフでていねいに応対する。"},"why_wrong_si":["冷たい お茶 කියන්නේ සේවකයා මුලින්ම යෝජනා කරන දේ; ඊට ඇය 「いいえ」 කියනවා.","水 ගැන කිසිම තැනක කියැවෙන්නේ නැහැ — ඉල්ලන බීම お茶.","コーヒー කිසිසේත් සඳහන් වන්නේ නැහැ; ගැළපෙන්නේ 'උණුසුම්' කියන කොටස පමණයි."],"track":"JFT1_P3_Q05"},{"id":"CK-A1-006","level":"A1","section":"choukai","type":"課題理解","scene":"こうつう","stem":"アナウンスを 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"駅{えき}で アナウンスが あります。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["3番線{ばんせん}の 電車{でんしゃ}に 乗{の}る","5番線{ばんせん}の 電車{でんしゃ}に 乗{の}る","駅{えき}の 中{なか}で 待{ま}つ","駅{えき}の 前{まえ}の バスに 乗{の}る"],"answer":4,"explain_ja":"電車{でんしゃ}は 止{と}まって います。「駅{えき}の 前{まえ}の バスに 乗{の}って ください」と 言{い}って います。","explain_en":"The train on platform 3 has stopped, so the announcement tells passengers in a hurry to take the bus in front of the station.","explain_si":"「3番線の 電車は 今 止まって います」 — 3番線 එකේ දුම්රිය නතර වෙලා. ඒ නිසා ඉක්මන් අයට දෙන උපදෙස 「急ぐ 方は、駅の 前の バスに 乗って ください」. 「急ぐ 方は」 ට පස්සේ එන උපදෙසයි පිළිතුර.","why_wrong":["3番線 is the platform of the train that has stopped (止まって います).","5番線 is never mentioned in the announcement.","Waiting inside the station is not what the announcement asks passengers to do."],"words":[{"ja":"電車{でんしゃ}","en":"train","si":"දුම්රිය"},{"ja":"止{と}まる","en":"to stop","si":"නතර වෙනවා"}],"audio":{"instruction_ja":"アナウンスを 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"N","text":"駅{えき}で アナウンスが あります。"},{"speaker":"M1","text":"お知{し}らせします。3番線{ばんせん}の 電車{でんしゃ}は 今{いま} 止{と}まって います。"},{"speaker":"M1","text":"急{いそ}ぐ 方{かた}は、駅{えき}の 前{まえ}の バスに 乗{の}って ください。"}],"question_ja":"急{いそ}ぐ 人{ひと}は どう しますか。","speed":"ゆっくり","note":"M1は駅員のアナウンス。少し高めの声で、はっきりゆっくり読む。"},"why_wrong_si":["3番線 කියන්නේ නතර වී ඇති දුම්රියේ වේදිකාවයි (止まって います) — එයට නැඟීමට බැහැ.","5番線 දැනුම්දීමේ කිසිම විටෙක සඳහන් වන්නේ නැහැ.","දුම්රිය ස්ථානය ඇතුළේ රැඳී සිටින්න කියා දැනුම්දීමේ ඉල්ලන්නේ නැහැ."],"track":"JFT1_P3_Q06"},{"id":"CK-A1-007","level":"A1","section":"choukai","type":"ポイント理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"会社{かいしゃ}で、あしたの 仕事{しごと}の 時間{じかん}の 話{はなし}を して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["8時{じ}","9時{じ}","10時{じ}","7時{じ}"],"answer":1,"explain_ja":"いつもは 9時{じ}ですが、あしたは 8時{じ}です。「8時{じ}に 来{き}て ください」と 言{い}いました。","explain_en":"9時 is the usual time that the man expects, but the woman corrects him twice: あしたは 8時. Listen for the time that comes with 来て ください.","explain_si":"9時 කියන්නේ පිරිමි තැනැත්තා හිතාගෙන සිටින සාමාන්‍ය වේලාවයි. ගැහැණු තැනැත්තිය එය දෙවතාවක්ම නිවැරදි කරනවා: 「あしたの 仕事は 8時からです」, ඊට පස්සේ 「8時に 来て ください」. 「来て ください」 සමඟ එන වේලාවට කන් දෙන්න.","why_wrong":["9時 is the man's wrong assumption, which the woman corrects.","10時 is never mentioned in the conversation.","7時 is never mentioned; it is only a plausible 'early' time."],"words":[{"ja":"早{はや}い","en":"early","si":"කලින්"},{"ja":"仕事{しごと}","en":"work, job","si":"රැකියාව"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"田中{たなか}さん、あしたの 仕事{しごと}は 8時{じ}からです。"},{"speaker":"M1","text":"え、9時{じ}からじゃ ないですか。"},{"speaker":"F1","text":"あしたは 早{はや}いです。8時{じ}に 来{き}て ください。"},{"speaker":"M1","text":"はい、わかりました。"}],"question_ja":"男{おとこ}の 人{ひと}は あした 何時{なんじ}に 来{き}ますか。","speed":"ゆっくり","note":"M1の「え、」は軽い驚きで。数字の8と9をはっきり区別して発音する。"},"why_wrong_si":["9時 කියන්නේ පිරිමි තැනැත්තාගේ වැරදි උපකල්පනයයි; ගැහැණු තැනැත්තිය එය නිවැරදි කරනවා.","10時 සංවාදයේ කිසිසේත් සඳහන් වන්නේ නැහැ.","7時 කියැවෙන්නේ නැහැ; 'උදේට කලින්' කියන අදහසට ගැළපෙන බව පෙනුනත් එය ශබ්ද පටයේ නැහැ."],"track":"JFT1_P3_Q07"},{"id":"CK-A1-008","level":"A1","section":"choukai","type":"ポイント理解","scene":"かいもの","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"コンビニの レジで、店員{てんいん}と お客{きゃく}さんが 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["380円{えん}","1000円{えん}","620円{えん}","260円{えん}"],"answer":3,"explain_ja":"店員{てんいん}は 「全部{ぜんぶ}で 620円{えん}です」と 言{い}いました。1000円{えん}は お客{きゃく}さんが 出{だ}した お金{かね}です。","explain_en":"全部で 620円です is the price of the goods. 1000円 is the money handed over and 380円 is the change, so neither is the price.","explain_si":"「全部で 620円です」 කියන්නේ භාණ්ඩවල මිලයි. 1000円 කියන්නේ ගෙවීමට දුන් මුදල, 380円 කියන්නේ ආපසු දුන් සිල්ලරයි (おつり). 620 + 380 = 1000 කියා බැලුවම ගැළපීම තහවුරු වෙනවා. ප්‍රශ්නය අහන්නේ මිල නිසා පිළිතුර 620円.","why_wrong":["380円 is the change (おつり), not the price.","1000円 is the note the customer hands over, not the price.","260円 is not said anywhere; it is only a mishearing of the other numbers."],"words":[{"ja":"全部{ぜんぶ}で","en":"in total, altogether","si":"සම්පූර්ණයෙන්"},{"ja":"おつり","en":"change (money)","si":"ඉතිරි මුදල"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"お待{ま}たせしました。全部{ぜんぶ}で 620円{えん}です。"},{"speaker":"M1","text":"はい、1000円{えん}。"},{"speaker":"F1","text":"380円{えん}の おつりです。ありがとうございました。"}],"question_ja":"男{おとこ}の 人{ひと}が 買{か}った ものは いくらでしたか。","speed":"ゆっくり","note":"F1はコンビニ店員らしい明るい接客の声。金額はゆっくり区切って言う。"},"why_wrong_si":["380円 කියන්නේ ආපසු දුන් සිල්ලර (おつり) මිස මිල නොවේ.","1000円 කියන්නේ ගනුදෙනුකරු දුන් නෝට්ටුවේ අගය මිස මිල නොවේ.","260円 කිසිම තැනක කියැවෙන්නේ නැහැ; එය අනෙක් අංක වැරදියට ඇසීමෙන් හැදෙන අගයක් පමණයි."],"track":"JFT1_P3_Q08"},{"id":"CK-A1-009","level":"A1","section":"choukai","type":"ポイント理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"工場{こうじょう}で、はこに くだものを 入{い}れる 仕事{しごと}を して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["1個{こ}","8個{こ}","6個{こ}","16個{こ}"],"answer":3,"explain_ja":"男{おとこ}の 人{ひと}は 「1つの 箱{はこ}に 6個{こ}です」と 言{い}いました。8個{こ}では ありません。","explain_en":"The number attached to 1つの 箱に is 6個. 8個 appears only in the negative sentence 8個じゃ ありませんよ.","explain_si":"「1つの 箱に 6個です」 — පෙට්ටියකට දමන ගණන 6個. 8個 එන්නේ 「8個じゃ ありませんよ」 කියන නිෂේධන වාක්‍යයේ පමණයි. අවසානයේ ගැහැණු තැනැත්තිය 「6個ですね」 කියා නැවත තහවුරු කරනවා.","why_wrong":["1個 comes from mishearing 1つの 箱, which counts boxes, not apples.","8個 is said in the negative: 8個じゃ ありませんよ.","16個 is a mix of the numbers 1 and 6 that are heard in the audio."],"words":[{"ja":"箱{はこ}","en":"box","si":"පෙට්ටිය"},{"ja":"何個{なんこ}","en":"how many (small items)","si":"කීයක්ද"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"M1","text":"この 箱{はこ}に りんごを 入{い}れて ください。"},{"speaker":"F1","text":"何個{なんこ} 入{い}れますか。"},{"speaker":"M1","text":"1つの 箱{はこ}に 6個{こ}です。8個{こ}じゃ ありませんよ。"},{"speaker":"F1","text":"はい、6個{こ}ですね。"}],"question_ja":"1つの 箱{はこ}に りんごを 何個{なんこ} 入{い}れますか。","speed":"ゆっくり","note":"M1は指示を出す立場。「6個」と「8個」の対比をはっきり読み分ける。"},"why_wrong_si":["1個 කියන්නේ 「1つの 箱」 වැරදියට ඇසීමෙන් එන අගයක්; ඒ '1' කියන්නේ පෙට්ටි ගණන මිස ඇපල් ගණන නොවේ.","8個 කියැවෙන්නේ නිෂේධනයෙන්: 「8個じゃ ありませんよ」.","16個 කියන්නේ ශබ්ද පටයේ ඇහෙන 1 සහ 6 යන අංක දෙක එකට යාකිරීමෙන් හැදෙන වැරදි අගයක්."],"track":"JFT1_P3_Q09"},{"id":"CK-A1-010","level":"A1","section":"choukai","type":"ポイント理解","scene":"びょういん","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"病院{びょういん}で、薬{くすり}を もらう 場所{ばしょ}を 聞{き}いて います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["1階{かい}の 3番{ばん}の まど","3階{かい}の 1番{ばん}の まど","1階{かい}の 1番{ばん}の まど","3階{かい}の 3番{ばん}の まど"],"answer":1,"explain_ja":"男{おとこ}の 人{ひと}は 「1階{かい}の 3番{ばん}の まどです」と 言{い}いました。","explain_en":"The floor comes first (1階) and the window number second (3番). Keep the order: floor, then window.","explain_si":"「1階の 3番の まどです」 — මුලින් තට්ටුව (1階), ඊට පස්සේ ජනේල අංකය (3番). ගැහැණු තැනැත්තිය 「1階の 3番ですね」 කියා නැවත තහවුරු කරනවා. අනුපිළිවෙළ මතක තබාගන්න: තට්ටුව මුලින්, ජනේලය ඊට පස්සේ.","why_wrong":["3階の 1番 reverses the two numbers you hear.","1階の 1番 has the right floor but the wrong window number.","3階の 3番 has the right window number but the wrong floor."],"words":[{"ja":"薬{くすり}","en":"medicine","si":"බෙහෙත"},{"ja":"階{かい}","en":"floor (of a building)","si":"තට්ටුව"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"すみません、薬{くすり}は どこで もらいますか。"},{"speaker":"M1","text":"1階{かい}の 3番{ばん}の まどです。"},{"speaker":"F1","text":"1階{かい}の 3番{ばん}ですね。ありがとうございます。"}],"question_ja":"薬{くすり}は どこで もらいますか。","speed":"ゆっくり","note":"M1は病院の職員。「1階」と「3番」の間で軽く息を入れて区切る。"},"why_wrong_si":["3階の 1番 කියන්නේ ඇහෙන අංක දෙක මාරු කර ගැනීමයි.","1階の 1番 — තට්ටුව හරි, නමුත් ජනේල අංකය වැරදියි.","3階の 3番 — ජනේල අංකය හරි, නමුත් තට්ටුව වැරදියි."],"track":"JFT1_P3_Q10"},{"id":"CK-A1-011","level":"A1","section":"choukai","type":"ポイント理解","scene":"こうつう","stem":"アナウンスを 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"駅{えき}で アナウンスを 聞{き}いて います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["1番線{ばんせん}","10番線{ばんせん}","15番線{ばんせん}","4番線{ばんせん}"],"answer":4,"explain_ja":"アナウンスは 「10時{じ}15分{ふん}の 電車{でんしゃ}は 4番線{ばんせん}から 出{で}ます」と 言{い}いました。","explain_en":"10時15分 is the time and 4番線 is the platform. Do not turn the time numbers into a platform number.","explain_si":"「10時15分の 電車は 4番線から 出ます」 — 10時15分 කියන්නේ වේලාව, 4番線 කියන්නේ වේදිකාව. වේලාවේ තියෙන අංක වේදිකා අංකයක් බවට පත් නොකරන්න.","why_wrong":["1番線 is the platform for a different train, the 10時40分 one.","10番線 comes from mishearing 10時 (the time) as a platform number.","15番線 comes from mishearing 15分 (the minutes) as a platform number."],"words":[{"ja":"番線{ばんせん}","en":"platform number","si":"වේදිකා අංකය"},{"ja":"出{で}る","en":"to depart, to leave","si":"පිටත් වෙනවා"}],"audio":{"instruction_ja":"アナウンスを 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"N","text":"駅{えき}で アナウンスが あります。"},{"speaker":"F1","text":"ご案内{あんない}します。10時{じ}15分{ふん}の 電車{でんしゃ}は 4番線{ばんせん}から 出{で}ます。"},{"speaker":"F1","text":"10時{じ}40分{ぷん}の 電車{でんしゃ}は 1番線{ばんせん}です。"}],"question_ja":"10時{じ}15分{ふん}の 電車{でんしゃ}は 何番線{なんばんせん}から 出{で}ますか。","speed":"ゆっくり","note":"F1は駅のアナウンス音声。時刻と番線の間で必ず短い間をあける。"},"why_wrong_si":["1番線 කියන්නේ වෙනත් දුම්රියක වේදිකාවයි — 「10時40分の 電車は 1番線です」.","10番線 ලැබෙන්නේ 10時 (වේලාව) වේදිකා අංකයක් ලෙස වැරදියට ඇසීමෙන්.","15番線 ලැබෙන්නේ 15分 (මිනිත්තු) වේදිකා අංකයක් ලෙස වැරදියට ඇසීමෙන්."],"track":"JFT1_P3_Q11"},{"id":"CK-A1-012","level":"A1","section":"choukai","type":"発話表現","scene":"しごと","stem":"場面{ばめん}の 説明{せつめい}を 聞{き}いて、何{なん}と 言{い}うか えらんで ください。","context":"仕事{しごと}が 終{お}わって、ほかの 人{ひと}より 先{さき}に 帰{かえ}ります。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["いただきます。","お先{さき}に 失礼{しつれい}します。","はじめまして。","いってらっしゃい。"],"answer":2,"explain_ja":"自分{じぶん}が 先{さき}に 帰{かえ}る ときは 「お先{さき}に 失礼{しつれい}します」と 言{い}います。","explain_en":"お先に 失礼します is the fixed phrase for leaving the workplace before your colleagues. It is one of the most-used office phrases in Japan.","explain_si":"「お先に 失礼します」 කියන්නේ සගයන්ට කලින් වැඩපොළෙන් පිටව යන විට කියන ස්ථිර ප්‍රකාශයයි. ජපානයේ කාර්යාලවල වැඩිපුරම භාවිත වන වාක්‍ය අතරින් එකක්.","why_wrong":["いただきます is said before eating, not before leaving.","はじめまして is used when you meet someone for the first time.","いってらっしゃい is what you say to the person who is going out, not what th ther you are a first-time patient, so 今日が はじめてです is the useful thing to say.","explain_si":"පිළිගැනීමේ කවුන්ටරයේ අයට දැනගන්න ඕන ඔබ පළමු වතාවට එන රෝගියෙක්ද කියලා. ඒ නිසා 「すみません、今日が はじめてです」 කියන එකයි ප්‍රයෝජනවත් වන්නේ.","why_wrong":["また 来ます is said when you are leaving, not arriving.","お大事に is what staff say to a patient, not what the patient says.","おかげさまで 元気です means you are fine, which does not fit coming to a hospital for treatment."],"words":[{"ja":"初{はじ}めて","en":"for the first time","si":"පළමු වතාවට"},{"ja":"お大事{だいじ}に","en":"take care (to a sick person)","si":"සුවෙන් සිටින්න"}],"audio":{"instruction_ja":"場面{ばめん}の 説明{せつめい}を 聞{き}いて、何{なん}と 言{い}うか えらんで ください。","lines":[{"speaker":"N","text":"はじめて 病院{びょういん}に 来{き}ました。受付{うけつけ}で 何{なん}と 言{い}いますか。"}],"question_ja":"何{なん}と 言{い}いますか。","speed":"ゆっくり","note":"Nは中立的な語り。「はじめて」をやや強めに読んで場面を明確にする。"},"why_wrong_si":["「また 来ます」 කියන්නේ පිටව යන විට මිස පැමිණෙන විට නොවේ.","「お大事に」 කියන්නේ සේවකයන් රෝගියාට කියන දෙයක්; රෝගියා කියන දෙයක් නොවේ.","「おかげさまで 元気です」 කියන්නේ 'මම හොඳින්' කියන අදහසයි; ප්‍රතිකාර සඳහා රෝහලට එන අවස්ථාවට එය නොගැළපේ."],"track":"JFT1_P3_Q15"},{"id":"CK-A1-016","level":"A1","section":"choukai","type":"即時応答","scene":"しごと","stem":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","context":"工場{こうじょう}で、先輩{せんぱい}が 仕事{しごと}の ことを 聞{き}きます。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["はい、あした 休{やす}みます。","いいえ、8時{じ}に 来{き}ます。","はい、どうぞ。","いいえ、まだです。"],"answer":4,"explain_ja":"「もう 終{お}わりましたか」に 「いいえ」で 答{こた}える ときは 「まだです」と 言{い}います。","explain_en":"もう …ましたか is answered with はい、終わりました or いいえ、まだです. まだ is the fixed partner of もう.","explain_si":"「もう …ましたか」 කියන ප්‍රශ්නයට දෙන පිළිතුර 「はい、終わりました」 හෝ 「いいえ、まだです」. もう සමඟ නිතරම යුගල වන වචනය まだ බව මතක තබාගන්න.","why_wrong":["はい、あした 休みます answers a question about days off, not about finishing the task.","いいえ、8時に 来ます answers a question about a time, not about completion.","はい、どうぞ is used when handing something over or giving permission."],"words":[{"ja":"終{お}わる","en":"to finish, to be done","si":"අවසන් වෙනවා"},{"ja":"まだ","en":"not yet","si":"තවම නැහැ"}],"audio":{"instruction_ja":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","lines":[{"speaker":"M1","text":"この 仕事{しごと}、もう 終{お}わりましたか。"}],"question_ja":"何{なん}と 答{こた}えますか。","speed":"ゆっくり","note":"M1は先輩。責める調子ではなく、軽く確認する言い方にする。"},"why_wrong_si":["「はい、あした 休みます」 කියන්නේ නිවාඩු ගැන ප්‍රශ්නයකට දෙන පිළිතුරක්; වැඩේ ඉවරද කියන ප්‍රශ්නයට නොවේ.","「いいえ、8時に 来ます」 කියන්නේ වේලාවක් ගැන ප්‍රශ්නයකට දෙන පිළිතුරක්; වැඩේ අවසන්ද කියන එකට නොවේ.","「はい、どうぞ」 කියන්නේ යමක් අතට දෙන විට හෝ අවසර දෙන විටයි."],"track":"JFT1_P3_Q16"},{"id":"CK-A1-017","level":"A1","section":"choukai","type":"即時応答","scene":"しごと","stem":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","context":"仕事{しごと}が 終{お}わって、同{おな}じ 職場{しょくば}の 人{ひと}が 声{こえ}を かけます。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["おつかれさまでした。","いただきます。","はじめまして。","ごめんください。"],"answer":1,"explain_ja":"「おつかれさまでした」と 言{い}われたら、同{おな}じ ことばで 返{かえ}します。","explain_en":"おつかれさまでした is answered with the same phrase. It works like a mutual greeting between coworkers at the end of work.","explain_si":"「おつかれさまでした」 ට දෙන පිළිතුරත් එම වාක්‍යයමයි. වැඩ අවසානයේ සගයන් අතර හුවමාරු වන අන්‍යෝන්‍ය ආචාරයක් ලෙස එය ක්‍රියා කරනවා.","why_wrong":["いただきます is said before a meal.","はじめまして is for a first meeting, but these two already work together.","ごめんください is said when entering someone's house or shop, not at the end of a shift."],"words":[{"ja":"職場{しょくば}","en":"workplace","si":"සේවා ස්ථානය"},{"ja":"おつかれさまでした","en":"thank you for your hard work","si":"වෙහෙස මහන්සි වී වැඩ කළාට ස්තූතියි"}],"audio":{"instruction_ja":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","lines":[{"speaker":"F1","text":"おつかれさまでした。"}],"question_ja":"何{なん}と 答{こた}えますか。","speed":"ゆっくり","note":"F1は同僚。仕事終わりの少し明るく軽い調子で言う。"},"why_wrong_si":["「いただきます」 කියන්නේ කෑමට කලින්.","「はじめまして」 කියන්නේ මුල් වතාවට හමුවන විටයි; නමුත් මේ දෙදෙනා දැනටමත් එකට වැඩ කරනවා.","「ごめんください」 කියන්නේ කෙනෙකුගේ ගෙදරකට හෝ සාප්පුවකට ඇතුළු වන විට මිස වැඩ මුරය අවසානයේ නොවේ."],"track":"JFT1_P3_Q17"},{"id":"CK-A1-018","level":"A1","section":"choukai","type":"即時応答","scene":"すまい","stem":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","context":"寮{りょう}で、新{あたら}しく 来{き}た 人{ひと}が 質問{しつもん}を します。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["ゴミ置{お}き場{ば}です。","5個{こ}です。","水曜日{すいようび}です。","300円{えん}です。"],"answer":3,"explain_ja":"「いつですか」は 時{とき}を 聞{き}く ことばです。だから 曜日{ようび}で 答{こた}えます。","explain_en":"いつですか asks for a time or day, so the answer must be a day of the week. Match the question word to the type of answer.","explain_si":"「いつですか」 කියලා අහන්නේ වේලාවක් හෝ දවසක්. ඒ නිසා පිළිතුර සතියේ දවසක් විය යුතුයි — 「水曜日です」. ප්‍රශ්න වචනයයි පිළිතුරේ වර්ගයයි ගැළපෙනවාද කියා හැම විටම බලන්න.","why_wrong":["ゴミ置き場です answers どこですか (where), not いつ.","5個です answers いくつですか (how many), not いつ.","300円です answers いくらですか (how much), not いつ."],"words":[{"ja":"曜日{ようび}","en":"day of the week","si":"සතියේ දිනය"},{"ja":"水曜日{すいようび}","en":"Wednesday","si":"බදාදා"}],"audio":{"instruction_ja":"はじめの ことばを 聞{き}いて、いちばん いい 返事{へんじ}を えらんで ください。","lines":[{"speaker":"F1","text":"すみません、ゴミの 日{ひ}は いつですか。"}],"question_ja":"何{なん}と 答{こた}えますか。","speed":"ゆっくり","note":"F1は寮に来たばかりの人。少し遠慮がちに尋ねる調子で。"},"why_wrong_si":["「ゴミ置き場です」 කියන්නේ 「どこですか」 ට දෙන පිළිතුරක් මිස いつ ට නොවේ.","「5個です」 කියන්නේ 「いくつですか」 ට දෙන පිළිතුරක් මිස いつ ට නොවේ.","「300円です」 කියන්නේ 「いくらですか」 ට දෙන පිළිතුරක් මිස いつ ට නොවේ."],"track":"JFT1_P3_Q18"},{"id":"CK-A2-001","level":"A2","section":"choukai","type":"課題理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"造船{ぞうせん}の 会社{かいしゃ}で、班長{はんちょう}と 女{おんな}の 人{ひと}が 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["船{ふね}の 掃除{そうじ}","部品{ぶひん}の 注文{ちゅうもん}","部品{ぶひん}の 確認{かくにん}","工場{こうじょう}の 掃除{そうじ}"],"answer":3,"explain_ja":"雨{あめ}なので 予定{よてい}が 変{か}わりました。午前中{ごぜんちゅう}は 工場{こうじょう}の 中{なか}で 部品{ぶひん}の 確認{かくにん}を します。","explain_en":"The plan changed because of rain. The new morning task is 部品の 確認 inside the factory; the ship cleaning moved to the afternoon.","explain_si":"වැස්ස නිසා සැලසුම වෙනස් වෙලා: 「雨が ふって いるので 変わりました」. උදෑසන කරන අලුත් වැඩේ ලෙස කියන්නේ 「工場の 中で 部品の 確認を お願いします」 කියලයි. නැව පිරිසිදු කිරීම 「掃除は 午後です」 කියා දහවලට මාරු වෙලා.","why_wrong":["船の 掃除 was the original plan but was moved to 午後 because of the rain.","部品の 注文 (ordering parts) is not mentioned; the task is checking, not ordering.","工場の 掃除 mixes up the place (工場) with the wrong action (掃除)."],"words":[{"ja":"部品{ぶひん}","en":"parts, components","si":"අමතර කොටස්"},{"ja":"確認{かくにん}","en":"checking, confirmation","si":"පරීක්ෂා කිරීම"},{"ja":"予定{よてい}","en":"plan, schedule","si":"සැලසුම"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"M1","text":"今日{きょう}の 午前中{ごぜんちゅう}は 船{ふね}の 掃除{そうじ}の 予定{よてい}でしたが、雨{あめ}が ふって いるので 変{か}わりました。"},{"speaker":"F1","text":"そうですか。じゃ、何{なに}を すれば いいですか。"},{"speaker":"M1","text":"工場{こうじょう}の 中{なか}で 部品{ぶひん}の 確認{かくにん}を お願{ねが}いします。掃除{そうじ}は 午後{ごご}です。"},{"speaker":"F1","text":"わかりました。"}],"question_ja":"女{おんな}の 人{ひと}は 午前中{ごぜんちゅう} 何{なに}を しますか。","speed":"ふつう","note":"M1は現場の班長で、短くてきぱきと指示する話し方にする。"},"why_wrong_si":["船の 掃除 කියන්නේ මුල් සැලසුමයි; වැස්ස නිසා එය 午後 ට මාරු වුණා.","部品の 注文 (කොටස් ඇණවුම් කිරීම) සඳහන් වන්නේ නැහැ; වැඩේ තියෙන්නේ 確認 — එනම් පරීක්ෂා කිරීමයි.","工場の 掃除 කියන්නේ ස්ථානය (工場) නිවැරදිව අරගෙන ක්‍රියාව (掃除) වැරදියට යාකිරීමයි."],"track":"JFT1_P3_Q19"},{"id":"CK-A2-002","level":"A2","section":"choukai","type":"課題理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"介護{かいご}の 施設{しせつ}で、先輩{せんぱい}が 新{あたら}しい スタッフに 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["体温{たいおん}を はかる","血圧{けつあつ}を はかる","おふろに 案内{あんない}する","先輩{せんぱい}を 呼{よ}ぶ"],"answer":1,"explain_ja":"「おふろに ご案内{あんない}する 前{まえ}に、体温{たいおん}を はかって ください」と 言{い}いました。だから はじめに 体温{たいおん}です。","explain_en":"The key phrase is 案内する 前に (before guiding), which puts 体温を はかる first. The 血圧 will be done later by the senior staff member.","explain_si":"යතුරු වචනය 「案内する 前に」 — නාන කාමරයට ගෙන යාමට කලින් කියන අර්ථයයි. ඒ නිසා මුලින්ම කරන්නේ 体温を はかる. 血圧 ගැන 「わたしが あとで はかりますから、体温だけで いいです」 කියන නිසා එය ජ්‍යෙෂ්ඨ සේවිකාව පසුව කරනවා.","why_wrong":["血圧 is measured later by the senior staff member (わたしが あとで).","おふろに 案内する comes after taking the temperature, because of 前に.","呼ぶ (calling the senior) is never mentioned in the conversation."],"words":[{"ja":"体温{たいおん}","en":"body temperature","si":"ශරීර උෂ්ණත්වය"},{"ja":"血圧{けつあつ}","en":"blood pressure","si":"රුධිර පීඩනය"},{"ja":"案内{あんない}する","en":"to guide, to show the way","si":"මඟ පෙන්වනවා"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"3号室{ごうしつ}の 方{かた}を おふろに ご案内{あんない}する 前{まえ}に、体温{たいおん}を はかって ください。"},{"speaker":"M1","text":"はい。血圧{けつあつ}も はかりますか。"},{"speaker":"F1","text":"血圧{けつあつ}は わたしが あとで はかりますから、体温{たいおん}だけで いいです。"},{"speaker":"M1","text":"わかりました。"}],"question_ja":"男{おとこ}の 人{ひと}は はじめに 何{なに}を しますか。","speed":"ふつう","note":"F1は経験のある先輩職員。「前に」「あとで」の順序語をはっきり読む。"},"why_wrong_si":["血圧 පසුව මනින්නේ ජ්‍යෙෂ්ඨ සේවිකාවයි: 「わたしが あとで はかりますから」.","おふろに 案内する කරන්නේ උෂ්ණත්වය මැනීමෙන් පසුවයි — 「前に」 කියන වචනය ඒ අනුපිළිවෙළ පෙන්නනවා.","呼ぶ (ජ්‍යෙෂ්ඨයාට කතා කිරීම) සංවාදයේ කිසිසේත් සඳහන් වන්නේ නැහැ."],"track":"JFT1_P3_Q20"},{"id":"CK-A2-003","level":"A2","section":"choukai","type":"課題理解","scene":"こうつう","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"配達{はいたつ}の 会社{かいしゃ}で、事務所{じむしょ}の 人{ひと}と 運転手{うんてんしゅ}が 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["事務所{じむしょ}","ガソリンスタンド","A社{しゃ}","B社{しゃ}"],"answer":4,"explain_ja":"B社{しゃ}が 「午前中{ごぜんちゅう}に 来{き}て ほしい」と 言{い}ったので、順番{じゅんばん}が 変{か}わりました。はじめは B社{しゃ}です。","explain_en":"The original order was A社 then B社, but B社 asked to be visited in the morning, so 順番を 変えて ください means B社 comes first.","explain_si":"මුල් අනුපිළිවෙළ වුණේ 「A社が 先で、そのあと B社」 කියලයි. නමුත් B社 එකෙන් කතා කර 「午前中に 来て ほしい」 කියා ඉල්ලා තියෙනවා, ඒ නිසා 「順番を 変えて ください」. අනුපිළිවෙළ මාරු වූ නිසා මුලින්ම යන්නේ B社 ට.","why_wrong":["事務所 is where the driver is now; the question asks where he goes next.","ガソリンスタンド is never mentioned in the conversation.","A社 was first in the original plan, but the order was changed."],"words":[{"ja":"配達{はいたつ}","en":"delivery","si":"බෙදාහැරීම"},{"ja":"順番{じゅんばん}","en":"order, sequence","si":"පිළිවෙළ"},{"ja":"運転手{うんてんしゅ}","en":"driver","si":"රියදුරු"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"今日{きょう}の 配達{はいたつ}ですが、A社{しゃ}が 先{さき}で、そのあと B社{しゃ}の 予定{よてい}でしたね。"},{"speaker":"M1","text":"はい、そうです。"},{"speaker":"F1","text":"B社{しゃ}から 電話{でんわ}が あって、午前中{ごぜんちゅう}に 来{き}て ほしいそうです。順番{じゅんばん}を 変{か}えて ください。"},{"speaker":"M1","text":"わかりました。じゃ、すぐ 出{で}ます。"}],"question_ja":"男{おとこ}の 人{ひと}は はじめに どこへ 行{い}きますか。","speed":"ふつう","note":"F1は事務所の担当者。電話の内容を伝える部分をやや早口で自然に。"},"why_wrong_si":["事務所 කියන්නේ රියදුරු දැන් සිටින තැන; ප්‍රශ්නය අහන්නේ ඊළඟට යන තැන ගැනයි.","ガソリンスタンド සංවාදයේ කිසිසේත් සඳහන් වන්නේ නැහැ.","A社 මුල් සැලසුමේ පළමුවැන්න වුණත්, අනුපිළිවෙළ වෙනස් වුණා."],"track":"JFT1_P3_Q21"},{"id":"CK-A2-004","level":"A2","section":"choukai","type":"課題理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"ビルの 清掃{せいそう}の 仕事{しごと}で、男{おとこ}の 人{ひと}が 女{おんな}の 人{ひと}に 聞{き}いて います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["道具{どうぐ}を 倉庫{そうこ}に 返{かえ}す","モップを 洗{あら}う","つぎの 階{かい}に 行{い}く","報告書{ほうこくしょ}を 書{か}く"],"answer":2,"explain_ja":"「モップは 洗{あら}ってから 倉庫{そうこ}に 返{かえ}して ください」と 言{い}いました。だから はじめに モップを 洗{あら}います。","explain_en":"洗ってから 返して ください tells you the order: wash first, return second. The question asks for the first action.","explain_si":"「モップは 洗ってから 返して くださいね」 — 〜てから කියන්නේ අනුපිළිවෙළ පෙන්නන ආකෘතියයි. මුලින් සෝදනවා, ඊට පස්සේ ආපසු දෙනවා. ප්‍රශ්නය අහන්නේ 「はじめに」 කරන දේ නිසා පිළිතුර モップを 洗う.","why_wrong":["返す is the second step — 洗ってから comes before it.","つぎの 階に 行く is not mentioned in the conversation.","報告書 is never mentioned in this conversation."],"words":[{"ja":"道具{どうぐ}","en":"tools, equipment","si":"උපකරණ"},{"ja":"倉庫{そうこ}","en":"storeroom, warehouse","si":"ගබඩාව"},{"ja":"返{かえ}す","en":"to return (something)","si":"ආපසු දෙනවා"}],"audio":{"instruction_ja":"会話{かいわ}を  නොවේ.","ජල සමාගමට කතා කිරීම ගැන කියැවෙන්නේ නැහැ; පාලකයා දැනටමත් ඒ ගැන දන්නවා.","洗濯 දැනුම්දීමේ කිසිම තැනක සඳහන් වන්නේ නැහැ."],"track":"JFT1_P3_Q24"},{"id":"CK-A2-007","level":"A2","section":"choukai","type":"ポイント理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"会社{かいしゃ}で、あしたの 会議{かいぎ}の 時間{じかん}の 話{はなし}を して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["9時{じ}半{はん}","10時{じ}","9時{じ}15分{ふん}","9時{じ}45分{ふん}"],"answer":3,"explain_ja":"会議{かいぎ}は 9時{じ}半{はん}からです。男{おとこ}の 人{ひと}は 「15分{ふん}前{まえ}に 来{き}ます」と 言{い}いましたから、9時{じ}15分{ふん}です。","explain_en":"Two steps: the meeting moved 30 minutes earlier to 9:30, and he arrives 15分前, so 9:30 minus 15 minutes = 9:15.","explain_si":"මෙතැන පියවර දෙකක් තියෙනවා. පළමුව, රැස්වීම 「30分 早く なりました。9時半からです」 — 10時 සිට 9時半 දක්වා මිනිත්තු 30ක් කලින් වෙලා. දෙවනුව, පිරිමි තැනැත්තා 「15分前には 来ます」 කියනවා. 9時半 කියන්නේ 9:30, ඉන් මිනිත්තු 15ක් අඩු කළාම 9:15 — එනම් 9時15分.","why_wrong":["9時半 is when the meeting starts, not when he arrives.","10時 is the old time before the change.","9時45分 adds 15 minutes instead of subtracting them."],"words":[{"ja":"会議{かいぎ}","en":"meeting","si":"රැස්වීම"},{"ja":"早{はや}く なる","en":"to be moved earlier","si":"කලින් වෙනවා"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"M1","text":"あしたの 会議{かいぎ}、10時{じ}からでしたよね。"},{"speaker":"F1","text":"いいえ、30分{ぷん} 早{はや}く なりました。9時{じ}半{はん}からです。"},{"speaker":"M1","text":"そうですか。じゃ、15分{ふん}前{まえ}には 来{き}ます。"}],"question_ja":"男{おとこ}の 人{ひと}は 何時{なんじ}に 来{き}ますか。","speed":"ふつう","note":"F1の「いいえ」で訂正が入ることが分かるように、そこだけ少し強めに。"},"why_wrong_si":["9時半 කියන්නේ රැස්වීම පටන් ගන්නා වේලාව මිස ඔහු එන වේලාව නොවේ.","10時 කියන්නේ වෙනස් වීමට කලින් තිබූ පැරණි වේලාවයි.","9時45分 ලැබෙන්නේ මිනිත්තු 15 අඩු කරනවා වෙනුවට එකතු කිරීමෙන්; 「15分前」 කියන්නේ 'මිනිත්තු 15කට කලින්' කියන අර්ථයයි."],"track":"JFT1_P3_Q25"},{"id":"CK-A2-008","level":"A2","section":"choukai","type":"ポイント理解","scene":"かいもの","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"コンビニの レジで、店員{てんいん}と お客{きゃく}さんが 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["600円{えん}","650円{えん}","550円{えん}","500円{えん}"],"answer":1,"explain_ja":"お弁当{べんとう}は 500円{えん}ですが、カードで 50円{えん} 安{やす}く なります。450円{えん}＋お茶{ちゃ} 150円{えん}＝600円{えん}です。","explain_en":"500 yen (bento) minus the 50 yen card discount is 450, plus 150 yen for the tea = 600 yen. Apply the discount only to the bento.","explain_si":"මිල ගණන් හොඳින් අහන්න: お弁当 500円, お茶 150円. කාඩ්පතෙන් ගෙවන අයට 「お弁当が 50円 引きです」 — වට්ටම 弁当 ට පමණයි. 500 − 50 = 450, ඊට තේ එකතු කළාම 450 + 150 = 600. ඒ නිසා ගෙවන මුදල 600円.","why_wrong":["650円 adds 500 and 150 but forgets the 50 yen discount.","550円 subtracts the discount twice or drops part of the tea price.","500円 is the price of the bento alone, ignoring the tea."],"words":[{"ja":"弁当{べんとう}","en":"boxed lunch","si":"දිවා ආහාර පෙට්ටිය"},{"ja":"引{ひ}き","en":"discount, off","si":"වට්ටම"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"いらっしゃいませ。お弁当{べんとう}が 500円{えん}、お茶{ちゃ}が 150円{えん}です。"},{"speaker":"F1","text":"今日{きょう}は カードで お買{か}い物{もの}の 方{かた}は、お弁当{べんとう}が 50円{えん} 引{ひ}きです。"},{"speaker":"M1","text":"じゃ、お弁当{べんとう}と お茶{ちゃ}を お願{ねが}いします。カードで はらいます。"}],"question_ja":"男{おとこ}の 人{ひと}は いくら はらいますか。","speed":"ふつう","note":"F1は店員らしい明るい接客。金額の3つの数字をそれぞれ独立させて読む。"},"why_wrong_si":["650円 කියන්නේ 500 + 150 පමණක් කර 50円 වට්ටම අමතක කිරීමයි.","550円 ලැබෙන්නේ වට්ටම දෙවතාවක් අඩු කිරීමෙන් හෝ තේ මිලේ කොටසක් අත්හැරීමෙන්.","500円 කියන්නේ 弁当 එකේ මිල පමණයි; තේ මිල ගණන් නොගැනීමයි."],"track":"JFT1_P3_Q26"},{"id":"CK-A2-009","level":"A2","section":"choukai","type":"ポイント理解","scene":"しごと","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"工場{こうじょう}で、部品{ぶひん}の 数{かず}を かぞえて います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["36個{こ}","35個{こ}","33個{こ}","12個{こ}"],"answer":2,"explain_ja":"1箱{はこ}に 12個{こ}、3箱{はこ}で 36個{こ}です。こわれた 1個{こ}は 数{かぞ}えないので 35個{こ}です。","explain_en":"12 per box times 3 boxes is 36, then one broken piece is excluded (数えないで ください), leaving 35.","explain_si":"「1箱に 12個 入って います。3箱 お願いします」 → 12 × 3 = 36. ඊට පස්සේ 「1つ こわれて いますね」 කියන එකට 「それは 数えないで ください」 කියනවා. ඒ නිසා 36 − 1 = 35個.","why_wrong":["36個 forgets to remove the one broken piece.","33個 subtracts 3 instead of 1.","12個 is the count for one box only, not for three."],"words":[{"ja":"数{かぞ}える","en":"to count","si":"ගණන් කරනවා"},{"ja":"こわれる","en":"to break, to be broken","si":"කැඩෙනවා"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"M1","text":"この 部品{ぶひん}、1箱{はこ}に 12個{こ} 入{はい}って います。3箱{はこ} お願{ねが}いします。"},{"speaker":"F1","text":"はい。あ、1つ こわれて いますね。"},{"speaker":"M1","text":"じゃ、それは 数{かぞ}えないで ください。"}],"question_ja":"部品{ぶひん}は 全部{ぜんぶ}で いくつ ありますか。","speed":"ふつう","note":"F1の「あ、」で問題を見つけた感じを出し、そのあとやや小さめの声にする。"},"why_wrong_si":["36個 කියන්නේ කැඩුණු එක අඩු කිරීම අමතක වූ අගයයි.","33個 ලැබෙන්නේ 1 වෙනුවට 3ක් අඩු කිරීමෙන්; කැඩිලා තියෙන්නේ එකයි (1つ).","12個 කියන්නේ පෙට්ටියක ගණන පමණයි; පෙට්ටි තුනේ මුළු ගණන නොවේ."],"track":"JFT1_P3_Q27"},{"id":"CK-A2-010","level":"A2","section":"choukai","type":"ポイント理解","scene":"こうつう","stem":"アナウンスを 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"駅{えき}で アナウンスが あります。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["5番線{ばんせん}","9番線{ばんせん}","20番線{ばんせん}","7番線{ばんせん}"],"answer":4,"explain_ja":"9時{じ}20分{ぷん}の 快速{かいそく}は 5番線{ばんせん}から 7番線{ばんせん}に 変{か}わりました。","explain_en":"AからBに 変わりました means the change is from A to B, so the new platform is the second number: 7番線. 5番線 is now used by the 9:35 local train.","explain_si":"「5番線から 7番線に 変わりました」 — 「AからBに 変わりました」 කියන්නේ A සිට B දක්වා වෙනස් වුණා කියන එකයි. ඒ නිසා අලුත් වේදිකාව දෙවන අංකයයි: 7番線. 5番線 දැන් පාවිච්චි වන්නේ 9時35分 各駅停車 ට.","why_wrong":["5番線 is the old platform, now used by the 9時35分 local train.","9番線 comes from mishearing 9時 (the hour) as a platform number.","20番線 comes from mishearing 20分 (the minutes) as a platform number."],"words":[{"ja":"快速{かいそく}","en":"rapid train","si":"වේගවත් දුම්රිය"},{"ja":"各駅停車{かくえきていしゃ}","en":"local train (stops at every station)","si":"සෑම ස්ථානයකම නවතින දුම්රිය"}],"audio":{"instruction_ja":"アナウンスを 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"N","text":"駅{えき}で アナウンスが あります。"},{"speaker":"F1","text":"ご案内{あんない}します。9時{じ}20分{ぷん}発{はつ}の 快速{かいそく}は、5番線{ばんせん}から 7番線{ばんせん}に 変{か}わりました。"},{"speaker":"F1","text":"9時{じ}35分{ふん}発{はつ}の 各駅停車{かくえきていしゃ}は 5番線{ばんせん}です。"}],"question_ja":"9時{じ}20分{ぷん}の 快速{かいそく}は 何番線{なんばんせん}から 出{で}ますか。","speed":"ふつう","note":"F1は駅のアナウンス。「5番線から7番線に」の「から」「に」を明瞭に発音する。"},"why_wrong_si":["5番線 කියන්නේ පැරණි වේදිකාවයි; දැන් එය 9時35分 各駅停車 ට වෙන් වෙලා.","9番線 ලැබෙන්නේ 9時 (පැය) වේදිකා අංකයක් ලෙස වැරදියට ඇසීමෙන්.","20番線 ලැබෙන්නේ 20分 (මිනිත්තු) වේදිකා අංකයක් ලෙස වැරදියට ඇසීමෙන්."],"track":"JFT1_P3_Q28"},{"id":"CK-A2-011","level":"A2","section":"choukai","type":"ポイント理解","scene":"びょういん","stem":"会話{かいわ}を 聞{き}いて、いちばん いい こたえを えらんで ください。","context":"病院{びょういん}の 受付{うけつけ}で、はじめて 来{き}た 人{ひと}が 話{はな}して います。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["2階{かい}の 内科{ないか}","3階{かい}の レントゲン","1階{かい}の 受付{うけつけ}","2階{かい}の レントゲン"],"answer":1,"explain_ja":"おなかが 痛{いた}い ときは 内科{ないか}です。内科{ないか}は 2階{かい}に あります。","explain_en":"He says おなかが 痛い, so he needs 内科, and 内科 was said to be on 2階. The receptionist confirms with 2階に 上がって ください.","explain_si":"පිරිමි තැනැත්තා 「おなかが 痛いんですが」 කියනවා — ඒ නිසා ඔහුට අවශ්‍ය 内科. පිළිගැනීමේ නිලධාරිනිය මුලින්ම 「内科は 2階、レントゲンは 3階です」 කියලා, පස්සේ 「2階に 上がって ください」 කියා තහවුරු කරනවා.","why_wrong":["3階の レントゲン is mentioned but is for X-rays, not for a stomach ache.","受付 is where he is standing now, not where he goes next.","レントゲン is on 3階, not on 2階 — the floor and department are mismatched."],"words":[{"ja":"内科{ないか}","en":"internal medicine department","si":"අභ්‍යන්තර රෝග අංශය"},{"ja":"記入{きにゅう}","en":"filling in (a form)","si":"පුරවා ලිවීම"},{"ja":"痛{いた}い","en":"painful, sore","si":"රිදෙනවා"}],"audio":{"instruction_ja":"会話{かいわ}を 聞{き}いて、こたえを えらんで ください。","lines":[{"speaker":"F1","text":"初{はじ}めての 方{かた}は、まず この 用紙{ようし}に ご記入{きにゅう}ください。内科{ないか}は 2階{かい}、レントゲンは 3階{かい}です。"},{"speaker":"M1","text":"あの、おなかが 痛{いた}いんですが。"},{"speaker":"F1","text":"では、書{か}き終{お}わったら 2階{かい}に 上{あ}がって ください。"}],"question_ja":"男{おとこ}の 人{ひと}は これから どこへ 行{い}きますか。","speed":"ふつう","note":"M1は少しつらそうな声で「おなかが 痛いんですが」と言う。"},"why_wrong_si":["3階の レントゲン ගැන කියැවෙනවා තමයි, නමුත් එය එක්ස්-රේ සඳහා; බඩේ අමාරුවකට නොවේ.","受付 කියන්නේ ඔහු දැන් සිටින තැන මිස ඊළඟට යන තැන නොවේ.","レントゲン තියෙන්නේ 3階 එකේ මිස 2階 එකේ නොවේ — තට්ටුවයි අංශයයි මාරු වෙලා."],"track":"JFT1_P3_Q29"},{"id":"CK-A2-012","level":"A2","section":"choukai","type":"発話表現","scene":"しごと","stem":"場面{ばめん}の 説明{せつめい}を 聞{き}いて、何{なん}と 言{い}うか えらんで ください。","context":"工場{こうじょう}で 機械{きかい}の 使{つか}い方{かた}が わかりません。先輩{せんぱい}に 教{おし}えて ほしいです。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["この 機械{きかい}、使{つか}っても いいですか。","この 機械{きかい}、直{なお}して あげましょうか。","すみません、この 機械{きかい}の 使{つか}い方{かた}を 教{おし}えて いただけませんか。","この 機械{きかい}は こわれて いますね。"],"answer":3,"explain_ja":"先輩{せんぱい}に お願{ねが}いする ときは 「教{おし}えて いただけませんか」を 使{つか}います。ていねいな 言{い}い方{かた}です。","explain_en":"教えて いただけませんか is the polite request form used to a senior colleague. It matches both the need (learn how to use it) and the relationship.","explain_si":"「教えて いただけませんか」 කියන්නේ ජ්‍යෙෂ්ඨ සගයෙකුට කරන ආචාරශීලී ඉල්ලීමයි. එය අවශ්‍යතාවටත් (භාවිත ක්‍රමය ඉගෙන ගැනීම) සම්බන්ධතාවටත් (先輩 ට කතා කිරීම) ගැළපෙනවා.","why_wrong":["使っても いいですか asks for permission, but he needs an explanation, not permission.","直して あげましょうか offers to fix it for the senior, which reverses who is helping whom.","こわれて いますね reports a breakdown, but the machine is not broken — he just does not know how to use it."],"words":[{"ja":"使{つか}い方{かた}","en":"how to use something","si":"භාවිතා කරන ආකාරය"},{"ja":"先輩{せんぱい}","en":"senior colleague","si":"ජ්‍යෙෂ්ඨ සගයා"}],"audio":{"instruction_ja":"場面{ばめん}の 説明{せつめい}を 聞{き}いて、何{なん}と 言{い}うか えらんで ください。","lines":[{"speaker":"N","text":"工場{こうじょう}で 機械{きかい}の 使{つか}い方{かた}が わかりません。先輩{せんぱい}に 教{おし}えて ほしいです。何{なん}と 言{い}いますか。"}],"question_ja":"何{なん}と 言{い}いますか。","speed":"ふつう","note":"Nは説明のナレーター。「先輩に」の部分で関係がわかるよう軽く強調する。"},"why_wrong_si":["「使っても いいですか」 කියලා අහන්නේ අවසරයි; නමුත් ඔහුට අවශ්‍ය පැහැදිලි කිරීමක් මිස අවසරයක් නොවේ.","「直して あげましょうか」 කියන්නේ ජ්‍යෙෂ්ඨයාට උදව් කරන්නම් කියන අදහසයි — කවුද කාට උදව් කරන්නේ කියන දිශාව මාරු වෙනවා.","「こわれて いますね」 කියන්නේ යන්ත්‍රය කැඩිලා කියන වාර්තාවක්; නමුත් යන්ත්‍රය කැඩිලා නැහැ, ඔහු එය පාවිච්චි කරන හැටි දන්නේ නැහැ පමණයි."],"track":"JFT1_P3_Q30"},{"id":"CK-A2-013","level":"A2","section":"choukai","type":"発話表現","scene":"しごと","stem":"場面{ばめん}の 説明{せつめい}を 聞{き}いて、何{なん}と 言{い}うか えらんで ください。","context":"熱{ねつ}が あって、今日{きょう}の 仕事{しごと}を 休{やす}みたいです。朝{あさ}、店長{てんちょう}に 電話{でんわ}を します。","prompt":"（音声{おんせい}を 聞{き}いて 答{こた}える 問題{もんだい}です）","choices":["きのう 熱{ねつ}が ありましたから、休{やす}みました。","熱{ねつ}が あるので、休{やす}んでも いいですよ。","熱{ねつ}が あったら、休{やす}みますか。","すみません、熱{ねつ}が あるので、今日{きょう} 休{やす}ませて いただけませんか。"],"answer":4,"explain_ja":"休{やす}みたい ことを お願{ねが}いする ときは 「休{やす}ませて いただけませんか」と 言{い}います。理由{りゆう}も いっしょに 言{い}います。","explain_en":"休ませて いただけませんか is the polite way to request permission to be absent, and 熱が あるので gives the reason. Both parts are expected in a real call to a manager.","explain_si":"「休ませて いただけませんか」 කියන්නේ නිවාඩුවක් සඳහා අවසර ඉල්ලීමට තියෙන වඩාත්ම ආචාරශීලී ක්‍රමයයි. 「熱が あるので」 කියලා හේතුවත් දෙනවා. කළමනාකරුට කරන සැබෑ දුරකථන ඇමතුමක හේතුවයි ඉල්ලීමයි යන දෙකම තිබිය යුතුයි.","why_wrong":["It is in the past tense about yesterday, but he wants to take today off.","休んでも いいですよ gives permission to the other person, which an employee cannot do to the manager.","It is a hypothetical question rather than a request for himself."],"words":[{"ja":"熱{ねつ}","en":"fever","si":"උණ"},{"ja":"休{やす}む","en":"to take a day off, to rest","si":"නිවාඩු ගන්නවා"}],"audio":{"instruction_ja":"場面{ばめん}の 説明{せつめい}を 聞{き}いて、何{なん}と 言{い}うか えらんで ください。","lines":[{"speaker":"N","text":"熱{ねつ}が あって、今日{きょう}の 仕事{しごと}を 休{やす}みたいです。朝{あさ}、店長{てんちょう}に 電話{でんわ}を します。何{なん}と 言{い}いますか。"}],"question_ja":"何{なん}と 言{い}いますか。","speed":"ふつう","note":"Nは平坦なナレーション。病気の演技はせず、状況説明として読む。"},"why_wrong_si":["එය ඊයේ ගැන අතීත කාලයෙන් කියැවෙනවා; නමුත් ඔහුට නිවාඩු අවශ්‍ය අදයි.","「休んでも いいですよ」 කියන්නේ අනෙක් අයට අවසර දීමයි; සේවකයෙකුට ක
